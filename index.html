n black\n5. Congenital factors (nulliparous prolapse): Ehlers-Danlos $, split pelvis, spina bifida, RVF","g3",11,"P"],[126,"Mention precipitating factors of pelvic organ prolapse","1. Obesity (BMI >25) have a 2-fold higher risk of having POP\n2.↑ intra-abdominal pressure: cough, constipation, abdominal mass or ascites\n3. Factors ↑uterine size: subinvolution, fibroid","g3",11,"P"],[126,"Enumerate types and degrees of prolapse","Ant compartment prolapse post compartmen prolapse\nApical compartment\n-Upper 3/4 Cystocele\n(between bladder sulcus & transverse vaginal sulcus)\n-Lower 1/4:\nUrethrocele (between transverse vaginal & submeatal sulci)\n-Combination:cysto- urethrocele\n-Rectocele: rectal descent through middle 1/3 of posterior vaginal wall\n-Enterocele: intestine descents through upper 1/3 of posterior vaginal wall\n-Utero-vaginal prolapse: uterine descent with inversion of vaginal apex\n1st degree: cervix below level of ischial spine.\n2nd degree: ext os outside vestibule (introitus)\n3rd degree:whole uterus outside introitus(complet procidenti","g3",11,"PI"],[126,"Vault prolapse: definition and management","Post-hysterectomy descent & inversion of vaginal apex\nCommoner in total than subtotal hysterectomy as cervical ligaments are removed (avoided by suturing vault to Mackenrodt's or uterosacral lig)","g3",11,"P"],[126,"Discuss combined prolapse","1. Utero-vaginal: Uterine prolapse starts then vaginal , occur in young due to congenital causes, Vagina is inverted with no cystocele.\n2. Vagino-uterine Prolapse: Vaginal prolapse then uterine , in old age due to acquired causes, vagina is inverted with large cystocele.","g3",11,""],[126,"Pelvic organ support: mention vaginal and genital support against prolapse","-Level 1:Uterosacral/cardinal lig complex. Loss of support→prolapse uterus&/or vaginal apex.\n-Level 2: Paravaginal attach along length of vagina to pelvic fascia. Loss of support→ cystocele\n-Level 3: Perineal body & perineal muscles.loss: ant →urethral hypermobility, Post→rectocele","g3",12,"P"],[126,"Mention secondary changes / complications in long-standing prolapse","On genital organs Extra-genital organs\n1.Vagina: Congestion, keratinization of mucosa& Trophic (decubitus)ulcer (due to vascular changes& E)\n2. Cervix: Infection, congestion & elongation of supravaginal part (due to stretch of Mackenrodt's lig)\n3. Uterus & ovaries: Dyspareunia & congestion\n(menorrhagia / dysmenorrhea)\n1. Urethra: Stress incontinence & In large urethrocele→ kinking & dysuria\n2. Bladder: incomplete urination with residual urine & infection\n3. Rectum: sense of incomplete or difficult defecation","g3",12,"P"],[126,"Mention clinical picture of pelvic organ prolapse","Symptoms (Asymptomatic in mild cases)\n•Swelling: Sense of lack of support →heaviness →feeling of a mass protruding from vulva\n(↑by strain or squat & on lying down), can Interfere with sitting & walking +/- trophic ulcers\n•Pain: -Dragging sensation in lower abdomen (stretch of pubocervical lig)\n-Dorsal (sacral) pain due to stretch of uterosacral ligaments\n-Dyspareunia & lack of sexual satisfaction (due to patulous vagina)\n•Congestion: Leucorrhea, ↑menstrual flow\n•Urinary symptoms:-Bladder & ureter: lower & upper UTI\n-Urethra:Stress urinary incontinence (early), dysuria&May need reposit swelling to urinate (late\n•Defecatory problems: dyschezia & may need to reposit vagina to defecate\nSigns & examination: •General: any risk factor (bronchitis, obesity), complication (anemia)\n•Abdominal: any cause of ↑pressure (ascites, masses)\n•Local: 1. Inspection: type & degree of prolapse, ulcers + coughing for SUI\n2. Palpation: -2 fingers can be approximated above uterus in complete procidentia (3rd degree). , In 2nd degree: part of uterus is still inside.\n-Bonney test(bladder neck elevation):Grasp Cx by volsellum with gentle traction to see max descent\n-Tone of levator ani (press by 2 fingers on posterior vaginal wall)\n3. PV: diagnose 1st degree uterine prolapse (just below ischial spines), gurgling sensation\n(enterocele). +/- Cusco for cervical infections/ ulcers\n4. Bimanual: for Any possible pathology in uterus or adnexa\n5. Sounding to assess length of cervix (to detect supravaginal elongation)\n6. PR & combined recto. vaginal (Malpus test): differentiate rectocele from enterocele. In enterocele, rectum is pushed backwards by swelling & not part of it.","g3",12,"I"],[126,"Mention staging of pelvic organ prolapse","The POPQ (pelvic organ prolapse quantification)\nStage 0 No descent of Pelvic Organs\nStage I Leading edge of Prolapse remaing >=1cm above hymenal ring\nStage II Leading edge of Prolapse extends from 1cm above or 1cm below hymenal ring\nStage III From 1cm beyond hymenal ring but without complete eversion of vagina\nStage IV Essentially complete eversion of vagina","g3",13,"I"],[126,"Mention investigations of pelvic organ prolapse","•condition is mainly clinically diagnosed •Preoperative: CBC, chest X-ray, ECG\n•If associated UTI: urine analysis ± Culture •If associated SUI: urodynamic confirmation\n•Renal function tests + IVP if suspecting ureteric kink","g3",13,""],[126,"Mention differential diagnosis of prolapse and types of genital tract displacement","Types of genital tract displacement\nVertical Antero-posterior Sidewards\n1-Downwards: •Genital prolapse\n•Uterine inversion\n2-Upwards\n•Fundal adhesions pulling uterus\n•Cervical tumors pushing uterus\n1-Anterior: Acute AVF uterus (=Cochleate uterus)\n2-Posterior:\nRVF uterus\n1-Dextro-flexion: Uterus pushed to right by tumors/adhesion\n2-Levo-flexion: Uterus pushed to left by tumors/adhesions\nAnt vaginal wall\nCystocele Ant vaginal wall cyst(Gartner cyst) Urethral or bladder diverticula reducible, compressible, catheter can pass through it\nIrreducible, catheter doesn't pass into it, multiple & lateral by compression urine or pus will exude. confirmed by cystoscopy\nPost vaginal wall\nRectocele Enterocele Posterior vaginal wall cyst\n(Implantation dermoid): reducible, compressible, finger can pass through it\n(P/R) high in posterior fornix with gurgling sensation & impulse on cough. PR can differentiate it from rectocele\nIrreducible, a finger can't pass into it by P/R\nUterine prolapse\nDifferentiate 2nd from\n3rd degree prolapse\nCongenital elongation of cervix\nUterine polypi & inversion try to approximate fingers above prolapsed swelling in young & vaginal vault lies above ischial spine (deep fornices)\nIn polyp,uterine sound can be passed around while in Inversion, whole uterus is turned inside out with protrusion of uterine fundus through cervical ring.","g3",13,"P"],[126,"Mention treatment of prolapse","1-Prophylaxis: •childbirth trauma: avoid difficult labor, episiotomy, Adeq space bet pregnancies\n•Avoid ↑ IAP: obesity, cough & constipation. •Prophylactic episiotomy & HRT\n2-Palliative: •Behavioral changes: stop smoking& weight loss •Estrogen cream (↑ ms tone)\n•Physiotherapy (kegel's exercises) to strengthen pelvic floor muscles.\n•Vaginal ring pessary: Place pessary & ask patient to strain to see if prolapse occurs, Pessary is fitted on ischial spines stretching vaginal wall→no uterine descent & ↓ symptoms\n3-Surgical: A) Preoperative: •General: correct anemia, any chest condition, reduce obesity\n•Local: Treat UTI, treat decubitus ulcer by vaginal pack, antiseptics ± local premarin B)Operations: •Vaginal wall prolapse (idea is plication of intervening fascia) mention operation of choice in each\n-Cystocele→ anterior colporrhaphy (anterior repair) - Urethrocele→ Kelly's sutures\n- Rectocele→posterior colpo-perineorrhaphy (posterior repair)\n-Enterocele:Culdoplasty (abdominalvaginal)→Obliterating DP by plication of uterosacral lig\nClassical repair is combined anterior & posterior repair in cysto-rectocele\n•Apical prolapse (uterus & vaginal vault) :\n-sacral-colpopexy: most effective. Nylon tape fixes cervix to ant longitudinal lig of sacrum.\nCan be done Laparoscopic (effective, less blood loss & shorter hospital stays)\n-sacrospinous fixation\n• prolapse + stress urinary incontinence: -If vaginal route→ midurethral sling operations\n-If abdominal route→ Burch colposuspension (can be done laparoscopic)\n•Concomitant hysterectomy in old age: Vaginal hysterectomy sacrospinous suspension +/- classical repair\n•Obliterative surgery in very old→ Le Fort (partial colpocliesis)\nC) Postoperative care: •Early: Antibiotic, Vaginal pack + catheter (to prevent reactionary hge)\n•Later: Avoid intercourse for 2-3 months & delay pregnancy for 2-3 years","g3",14,"P"],[126,"Mention indications of palliative treatment / contraindications of surgery in prolapse","•Pregnancy •After labor (waiting uterine involution) •young •old (unfit)\n•Till healing of trophic / decubitus ulcers","g3",14,""],[126,"Enumerate indications and complications of vaginal ring pessary","Indications: pelvic organ prolapse if pregnant, unfit for surgery, stress incontinence, complications : Infection, ulceration, failure / Discomfort if too large","g3",14,""],[126,"Enumerate complications of sacrospinous fixation","intestinal injury, postoperative pain in gluteal region, pudendal nerve injury","g3",15,""],[126,"Enumerate complications of surgery of prolapse","•General: Hemorrhage (1ry/ reactionary/2ry) , Infection.\n•Complications specific to surgery:-Ant repair: retention ,UTI, injury, detrusor overactivity\n-Posterior repair: hematoma, dyspareunia,rectal injury, fistula\n-Abdominal sacro-colpopexy: Ureteric or vascular injury (iliac & median sacral) , Psoas spasm & pain in upper part of left thigh\n-Le Fort (partial colpocleisis):no intercourse, difficult endometrial sampling if bleeding occur\n-Mesh exposure: asymptomatic or may become infected\n-Mesh contraction: severe pain + vaginal mucosa stricture\n•Recurrence 5-10% (usually in 1st\n2 years)","g3",15,"I"],[126,"Enumerate causes of recurrence of prolapse","•Preop: Bad preparation (cough) , bad timing (best is post-menstrual or 3-6 months after labor)\n•Op: Bad operation , Missing a part of operation (correction of enterocele)\n•Postop: infections , recurrence of causes , rapid pregnancy","g3",15,"P"],[127,"Define retroverted flexed uterus (RVF)","Posterior uterine displacement in which angles of version & flexion are directed backwards.","g3",15,""],[127,"Mention etiology of RVF","1-present normally in 20%\n2-Pelvic causes: - Uterus pulled backwards by adhesions (as endometriosis, PID)\n- Uterus pushed backwards by ovarian cyst in uterovesical pouch\n3-Puerperal RVF (by prolonged lying on back, delaying emptying bladder, subinvolution)","g3",15,"I"],[127,"Mention types of RVF","1. Mobile RVF → can be corrected bi-manually→ no symptoms\n2.Fixed RVF→ due to adhesions to sacrum →complications","g3",15,""],[127,"Mention degrees of RVF","Degrees 1st\n2nd\n3rd\nUterus In line with vagina Horizontal Upside down\nFundus point to Promontory Sacral body Tip of coccyx\nCervix direction Downwards Forwards Up &forwards","g3",15,"P"],[126,"General approach to choice of procedure in prolapse surgery","General approach to choice of procedure:\nObliterative surg. (colpocieisis) for high surgical risk only , surgical mesh-Use of mainly in abdominal repair, but questionable in vaginal , key of all operations is repair of fascial defects & proper hemostasis","g3",15,""],[127,"Define anteversion and anteflexion","-Anteversion: Angulation between long axis of cervix & vagina. It is 90°\n-Anteflexion: Angulation between long axis of cervix & body of uterus.\nIt is 120°-170","g3",15,""],[127,"Mention diagnosis of RVF","•Asymptomatic→ most cases are discovered accidentally\n•Pain: backache (stretch of uterosacral lig) / dysmenorrhea / dyspareunia\n•Congestion→ menorrhagia / congestive dysmenorrhea / leucorrhea\n•Reproductive complications rare (RPL, incarcerated RVF gravid uterus)\n•PV: ext os is directed forwards, while body of uterus is felt through posterior fornix\n•Uterine sound: confirm the direction (but pass it gently)\n•Pessary test: a Smith-Hodge pessary is used to correct RVF (if mobile). If symptoms disappear, then cause was due to RVF & operation is beneficial.","g3",16,""],[127,"Mention treatment of RVF","1. Prophylaxis: plication of round ligament to pull uterus forwards in operations where adhesions between back of uterus & sacrum are expected\n2. Palliative: Smith-Hodge pessary\n3. Surgical: -Ventrosuspension (modified Gilliam operation)\n-Ventrofixation is fixing uterine body to the back of rectus sheath; never done","g3",16,"P"],[129,"Urinary bladder: layers and parts","•Layers:\n-Musculosa (Detrusor) 3 layers: (outer & inner longitudinal / middle circular)\n-Mucosa (urothelium): 2-3 layers of transitional epithelium\n•Parts: -Base (trigone): triangular area between ureters & bladder neck. It lies in front of middle 1/3 of vagina. 2 layers\n(sup & deep trigone)\n-Dome: upper part of bladder","g3",16,""],[129,"Urethra: muscles, lining and supports","•Muscle layers: -Inner smooth muscle\n-Outer striated muscle”\n1. External rhabdosphincter (involuntary) → continence at rest\n2.Levator ani (voluntary):voluntary interruption (continence at stress)\n•Urethral lining: -Mucosa pseudo-transitional epithelium\n-Urethral submucosa venous plexus (E dep) → well coapted seal\n-2 paraurethral glands (Skene's glands): lubrication / anti-infective\n•Urethral supports: -Anterior: pubo-urethral ligaments\n-Posterior & lateral: endopelvic fascia attached to levator ani fascia\n-Pubocervical fascia act like a hammock","g3",16,""],[129,"Nerve supply of the bladder and urethra","Nerve supply: •Sympathetic T10-L2 →urine storage\n--Adrenergic→ contraction of bladder neck & urethra -B-Adrenergic→ relaxation of bladder wall\n•Parasympathetic S2,3,4 (pelvic nerve)→micturition •Somatic S2,3,4 (pudendal nerve) →voluntary interruption of urine","g3",16,""],[129,"Physiology of micturition","•Pathway:stretch of bladder→ afferent stimuli→ pudendal sacral nucleus → upward relay→ pontine micturition center→ efferent stimuli\n•Micturition is achieved by: 1.Inhibiting sympathetic pathway &pudendal control 2.Stimulating parasympathetic pathway\n•Voluntary control is achieved by: -Pyramidal detrusor area controls: pontine micturition center\n-Cerebral cortex controls: pudendal sacral nucleus","g3",16,""],[130,"Define urinary incontinence","Continence is ability to hold urine at all times except during micturition. Incontinence is involuntary leakage of urine that is objectively demonstrable","g3",17,"P"],[130,"Enumerate types / classification of urinary incontinence","1-Extra-urethral incontinence (fistula)\n•True: Always wet as in vesico-vaginal or bilateral ureteric fistula\n•Paradoxical: In unilateral ureteric or vesico-vaginal (if small, high or valvular)\n2-Trans-urethral incontinence\n•Stress incontinence:most common cause (60%) in 5% females <45 y & in > 30% women >65\n•Urgency incontinence (Detrusor instability): 2nd cause (20-30%)\nNB: Mixed incontinence = both types may be present in 20-30%\n•False incontinence: Nerve lesions→ loss of bladder sensation (unconscious incontinence) → retention overflow with residual urine left\n•Nocturnal (enuresis) incontinence: Psychiatric, neurologic, urologic or parasitic problem","g3",17,"PI"],[130,"Mention causes of temporary incontinence","•Following vaginal delivery (if difficult / prolonged) •In association with severe UTI\n• During long periods of immobilization(as in fractures) •As side effects of some medication","g3",17,""],[130,"Define stress urinary incontinence (SUI)","Involuntary loss of urine due ↑IAP (as straining) when intra-vesical pressure> intra-urethral pressure in absence of any detrusor activity. It is a social & hygienic problem diagnosed by symptom of loss of urine upon stress & objectively demonstrated (sign), & confirmed by urodynamics (gold standard investigation)","g3",17,"P"],[130,"Mention factors that prevent SUI","(keep pressure in urethra > bladder)\n1. Factors maintaining low intravesical pressure (5 cmH2O):\n• Passive (allows distensibility ( compliance)) & Active (by neurological control): bladder doesn't contract in response to stretch of baroreceptors\n2. Factors↑intraurethral pressure (50 cmH2O):•sphincter: Int (involuntary) & ext (voluntary)\n•Mucosal (Hermetic) seal & Vascular CT cushion (E dependent)\n•Hammock theory: urethra supported by posterior pubo-urethral lig that attached laterally to levator ani fascia =ATLA (Arcus Tendineus Levator Ani)\n•Intra-abdominal site of upper part of urethra→ equally transmitted pressure on both bladder & urethra upon cough ( no leak)\n3. Posterior urethro-vesical angle of 90-100-","g3",17,""],[130,"Mention etiology of SUI","1-Intrinsic sphincteric deficiency (genuine SUI) → funneling of urethra\n•Acquired: childbirth, post-menopausal atrophy & obesity.\n•2ry to surgery for genital prolapse or bladder neck •Congenital weakness of sphincter (rare)\n2-Anatomic (urethral hypermobility) → rotational descent of urethra\n•Loss of sub-urethral hammock & usually associated with prolapse","g3",18,"P"],[130,"Mention grades of SUI","•Grade I→incontinence occurs only in severe stress (coughing)\n•Grade II→incontinence occurs with moderate stress (walking)\n•Grade III→incontinence occurs with mild stress (standing)","g3",18,"I"],[130,"Mention diagnosis of SUI","1) History of: •Escape of small amounts immediately following cough.\n•Symptoms worsens during Pregnancy, Postmenopausal; Penetration during sexual intercourse\n2) Examination: •General: menopausal changes, bronchitis, obesity\n•Vaginal: associated prolapse, tone of levator ani\n3) Special tests: •cough stress test: Ask patient to strain or cough to observe any escape of urine, Done in lithotomy position while bladder is partially full\n•Bonney Marshall elevation test (if +ve cough test + prolapse): Bladder neck is elevated by 2 fingers in vagina then cough , → if no SUI → bladder descent & no sphincteric weakness\n•Yousef test (if-ve cough test + prolapse): Elevate cystocele by a volsellum then cough, If SUI appears; then it was masked by kinked urethra due to the cystocele\n•Q-tip test: lubricated cotton-tipped applicator is inserted in urethra, Ask patient to strain →\nMovement > 30° → urethral hypermobility","g3",18,""],[130,"Mention investigations of SUI","1) Midstream urine C&S to exclude cystitis (which can cause DI)\n2) Urodynamics: -Cystometry: measurement of compliance (pressure/ volume changes)\n-Leak point pressure: bladder pressure when leakage occurs due to ↑IAP (Valsalva) to assess urethral resistance.\n-Urethral pressure profilometry: Closing Pressure = difference between urethral pressure (50 cm H2O) & intravesical pressure (5 cm H2O)\n-Uroflowmetry (Normal flow is > 15 ml / sec): Measuring rate of urine flow (used in hesitancy, difficulty in voiding → more in female)\nNB: After confirmation with urodynamic studies , term urodynamic stress incontinence (USI) will be used instead of clinical term SUI.\nResting pressure (5cm H2O) 1st desire to void (150 ml) Max capacity(400 ml Mict Pressure <70 cm H2O\nDetrusor contraction\n:Not present during filling\nCoughing: No leakage Stream interruption\n:voiding can be stopped upon request\nResidual urine: < 50 ml","g3",18,"I"],[130,"Mention treatment of SUI","1-Conservative in :Mild cases , Mixed incontinence (await till medicating DI), Young\n(planning to get pregnant soon) , old patients (unfit)\n•Life-style change: weight, stop smoking, scheduled voiding\n•Physiotherapy:↑pelvic floor support to urethra/bladder neck: Kegel exercise,Faradic current\n•Pessary: support pessary (ring)/space-filling (Gellhorn)\n•Medications: -Local estrogen: improve mucosal atrophy & vascularity\n- Duloxetine: serotonin & norepinephrine reuptake inhibitor\n2-Surgical: A) Sub-urethral sling: Mid-urethral sling (1ry choice):\n•Retropubic midurethral sling: inserted from vagina, through retropubic space, & exits through abdominal wall, Tension is adjusted by pulling needles up while straining; thus called Tension free Vaginal Tape (TVT)\n•Transobturator midurethral sling (TOT): through vaginal incision to bilateral obturato foramen\n•Single incision midurethral sling: Shorter in length with only a vaginal incision\nB]Retro-pubic colposuspension/urethropexy:Modified Burch (Tanagho) operation (gold standard)\n: It is suspension of paraurethral tissue at level of bladder neck & midurethra to iliopectineal ligament at both sides, highest success(95% after 1 y)&longest successful follow up(75% after 15 y)\nC) Periurethral injection of Collagen takes about 15-20 min","g3",19,"P"],[130,"Define detrusor instability (overactive bladder)","Uninhibited detrusor contractions making sudden desire to pass urine→ involuntary urine loss","g3",19,""],[130,"Mention etiology of detrusor instability","1. Idiopathic, Psychologic 2. Local irritation (cystitis/stones / tumors) , Neuropathic (DS)","g3",19,""],[130,"Mention diagnosis of detrusor instability","•Urge incontinence: large gush of urine before reaching a convenient place\n•Frequency: micturition > 6 times by day & > 2 by night","g3",19,""],[130,"Mention investigations of detrusor instability","1. Urine analysis , Blood sugar , US & cystoscopy → free\n2. Cystometry: filling bladder >15 cm H2O stimulates bladder contraction (a provocation test) → uninhibited contractions\nNB → also provocation may occur at orgasm, In contrary → incontinence at penetration suggests SUI","g3",20,""],[130,"Mention treatment of detrusor instability","•Dietary changes : diminish fluid & caffeine / beverage intake\n•Bladder self-training: Frequent voluntary,Training of CNS&pelvic mech to inhibit urgency\n•Drugs:1. Anti-muscarinics: Tolterodine, Solifenacin\n2. Beta3-adrenoceptor agonist: Mirabegron\n3. Tri-cyclic antidepressants (Steprine) , Muscle relaxants (Oxybutinin)","g3",20,"I"],[130,"Enumerate causes of frequency of micturition and urine retention","frequency of micturition urine retention\n•Urologic: cystitis, Stones, Tumors\n•General: DM & insipidus , Cold environment\n•Gynecologic: Infections (UTI), Painful lesions\n(acute vulvitis), Tumors pressing on bladder\n(fibroid, ovarian cyst)\n•Obstetric: 1. In pregnancy: pressure by gravid uterus (early) & fetal head (late)\n2. In puerperium: To get rid of extra fluid accumulated in pregnancy\n•Urologic: stone, stricture, swelling (tumor)\n•Gynecologic:\n1. Vagina: hematocolpos , tight vaginal pack\n2. Cervix: large fibroid\n3. Uterus: posterior wall fibroid incarcerated in DP\n4. Ovary: any ovarian swelling incarcerated in DP\n5.Douglas pouch:pelvic hematocele ,abscess\n•Obstetric: Incarcerated RVF , Postoperative retention of urine (episiotomy)","g3",20,"I"],[130,"Mention management of urine retention","•Treatment of cause •Simple maneuvers: sitting on bath tub + sound of running water\n•If failed→ cholinergic drugs •If failed→ catheterization","g3",20,""],[131,"Mention classification of genitourinary fistula","Ureter Bladder Urethra\nVagina Uretro-vaginal Vesico-vaginal Urethra-vaginal\nCervix Uretro-cervical Vesico-cervical Urethra-cervical\nUterus Uretro-uretric Uretero-vesical Uretro-urethral","g3",20,""],[131,"Vesicovaginal fistula: etiology, clinical picture, investigations and treatment","Etiology: •Persistent urogenital sinus •Obstetric trauma(more in developing countries):how labor induce fistula\n-Direct (forceps): incont appear immediately -Necrotic fistula (obstructed labor): incontinence appear after 1-2 w\n•Surgical (more in developed countries): Hysterectomy, myomectomy, anterior repair, repeat CS\n•Inflammatory •malignant tumor opening in both sides(cancer cx) •Irradiation fistula→end arteritis obliterans (large&resistant)\n•C/P: Symptoms: -True incontinence: continuous leakage + no desire\n-Paradoxical incontinence: High, Small & Valvular fistulas\n-Infections: vaginitis , vulvitis , UTI -Amenorrhea: social isolation & depression\nSigns: 1-Inspection: -Constant stream of urine\n-Red, excoriated vulva with phosphate encrustations\n2-Palpation & PV: -Large fistulas could be digitally felt → site, size, number\n-Assess degree mobility of vaginal wall & surrounding induration\n3-Sims speculum examination: In Sim's position: patient lies on left side with extended lt thigh & knee; while rt thigh & knee are flexed. Lt arm is behind her back\n•inv: 1) Preop: CBC,Urine analysis, C&S , RFT ± IVP\n2)Diagnostic: -Retrograde installation of bladder by Methylene blue\nPut 3 pieces of gauze into vagina (Three swab test)\n* Upper 1 or 2 stained blue → vesico-vaginal fistula\n* Upper 1 or 2 soaked but unstained → ureteric fistula\n* stain of lower but upper 2 remain dry→ Urethrovaginal fistula\n* Unstained gauze→ no fistula (search for other cause)\n-Cystoscopy±indigo carmine dye(to see efflux through ureteric orifice)\n•ttt: a)Time of operation wait 3-6 m after injury till Resolution of infection & edema or spontaneous closure occurs if small b)Preope prep:Treat anemia, UTI, apply zinc oxide or Vaseline →  skin irritation c)Operative :1-Vaginal: -Dedoublement (Flap splitting):most common performed\n- Saucerization (Sim’s): in fibrotic fistula\n-Latzko operation: Partial colpocliesis to obliterate vault fistula\n2-Abdominal: -Indications → ureteric, inaccessible, recurrent fistula\n-Approach → transvesical, transperitoneal or retroperitoneal","g3",21,"P"],[131,"Rectovaginal fistula: clinical picture, investigations and treatment","•C/P: Symptoms\n-Incontinence of flatus (feces pass only if diarrhea)\n- Vulvovaginitis + offensive vaginal discharge\nSigns\n1-Inspection: excoriation & inflammation of vulva +/- perineal laceration\n2- PV:feel fistula, surrounding fibrosis, induration\n3-Speculum: rectal mucosa may be seen bulging into vagina\n4-PR: feel large defects\n•inv: Proctoscopy , Oral charcoal & then inspect vagina,\n•ttt: a)Prophylaxis: good management of obstetric, surgical practice b)Curative: 1-Preope prep (for 3-5 days): Daily enema + antiseptics as neomycin / Flagyl +/- Low residue diet\n2-Operative (3-6 m after delivery)\n-Low fistula →Lawson Tait operation\n- Middle fistula →Flap splitting operation\n- High fistula →colostomy to divert feces then repair abdominally\n3-Postoperative\n- NPO for 48 h (IV fluids),then low residue diet","g3",21,""],[131,"Vesicovaginal fistula: postoperative care and causes of failure","d)Postoperative care\n1-Catheter left for 2 w + ↑fluids, acidification of urine antiseptics\n-Check color/volume of urine every 2 h, If blocked→inject saline to wash out, If failed/ repeated block→ replace by triple way catheter\n2-Removal of catheter:-Before removal→ intermittent clamping for 24 h\n-After removal→ encourage voiding every 2 hours\n3-Avoid coitus for 2-3 m & pregnancy 2-3 y (delivery is by USCS)\n•Causes of failure: -Preoperative: Bad preparation e.g. anemia , infections\n-Operative (main factor for success is mobility of tissues)\n-Bad choice of operation , Bad technique\n-Postoperative: Hemorrhage , infection , Improper care of catheter","g3",22,""],[131,"Rectovaginal fistula: postoperative care","for 3 days\n- Oral antibiotics (to sterilize intestine) + systemic antibiotics\n- No sexual intercourse for 2 months, No pregnancy for 2 yrs","g3",22,""],[131,"Ureterovaginal fistula","•Etiology: mainly gynecologic Surgery (difficult hysterectomy)\n•Incontinence: paradoxical (true incontinence only in bilateral injury)\n•inv:-Methylene blue test →-ve with urine soaking of gauze\n-Cystoscopy: no efflux of urine from affected side\n-Chromocystoscopy (+ indigo carmine): efflux only from healthy side\n•ttt (abdominally):-Ureteric reimplantation into bladder\n-Uretrocolic implantation or through an Ileal conduit","g3",22,""],[131,"Utero-vesical fistula","•Symptoms\n-Menouria (Yousef syndrome)→cyclic hematuria\n-No urinary incontinence (not a vesico-uterine fistula)\n•DD: endometriosis of bladder\n•ttt: surgical repair or hormone induced amenorrhea→ spontaneous closure","g3",22,""],[132,"Define old complete perineal tear","Complete perineal tear (3rd &4th degrees) that was missed /improperly sutured after labor & left to heal by granulation tissue →ugly scar","g3",22,""],[132,"Mention etiology of old complete perineal tear","1.Passage→contracted pelvis/soft tissue obst 2.Power→obstructed/precipitate labor 3.Passenger→macrosomic/multiple fetus","g3",22,"I"],[132,"Mention clinical picture of old complete perineal tear","•Symptoms:Incontinence to flatus & liquid stool (Hard stool is prevented by levator ani) + vaginal offensive discharge(vaginitis)\n•Signs: -Tear extending from vagina to anus+Absent anal corrugations -P/R→absent sphincteric tone &voluntary control\n-External anal sphincter is torn (known by dimple on each side = retracted ends of sphincter)","g3",22,"I"],[132,"Mention treatment of perineal tear","1. Time → 3-6 months after delivery\n2. Preop (for 3 days) & Postop: as in rectovaginal fistula\n3. Operation → repair in layers (formerly known as Lawson Tait)","g3",23,""],[106,"Definitions: amenorrhea, hypomenorrhea, oligomenorrhea","•Amenorrhea is absence of spontaneous menstruation\n•Hypomenorrhea: scanty menses: amount (< 30 ml) or duration (<2 days)\n•Oligomenorrhea: Infrequent menstruation (length of cycle > 35 days)\n•hypo/oligo: cause:constitutional or endocrine→investigated&ttt as amenorrhea,but better prognosis","g4",2,""],[106,"Mention etiology of amenorrhea","•Physiological: Before puberty , After menopause, During pregnancy & lactation (prolactin inhibits GnRH)\n•Pathological: 1ry or 2ry","g4",2,""],[106,"Define primary amenorrhea","Absent menses in female who never menstruated before,\n14 years with absent 2ry sexual characters or at 16 years with 2ry sexual characters.","g4",2,"P"],[106,"Mention etiology of primary amenorrhea","1-False amenorrhea (Cryptomenorrhea): Etiology (outflow tract obstruction):\n•Imperforate hymen (commonest cause)\n•Transverse vaginal septum / Congenital cervical atresia\n2-True amenorrhea syndromes:\n•Hypothalamic: Frohlich , Laurance Moon Beidel & Kallmann syndrome\n•Pituitary:Levi-Lorain $ •Ovarian:Turner $,testicular feminization (Androgen insensitiv $)\n•Uterine: Mullerian agenesis (meyer Rokitansky kuster hauser syndrome)","g4",2,"PI"],[106,"Define secondary amenorrhea","cessation of menstruation for a period equal to 3 cycles; if previous menses were regular, or 6 months; if they were irregular or infrequent","g4",2,"P"],[106,"Mention assessment of primary and secondary amenorrhea by examination","1-1ry amenorrhea→1st of all exclude imperforate hymen\n•General: - Phenotypic character:Turner stigmata - Pubertal development: Tanner staging\n•Local: -Hymen inspection→cryptomenorrhea -Clitromegaly→ambiguous genitalia\n-Rectal examination (in virgins)→ absent uterus\n2-2ry amenorrhea→1st of all exclude pregnancy\n•Amenorrhea + galactorrhea→hyperprolactinemia (as adenoma)\n•Amenorrhea + virilization→ -PCO, cong adrenal hyperplasia, androgen secreting tumor\n-Ferriman Gallwey scoring system for hirsutism\n•in 1ry amenorrhea→ 1st exclude false (cryptomenorrhea)\n•in 2ry amenorrhea→ 1st exclude pregnancy (commonest cause of 2ry amenorrhea)","g4",2,""],[106,"Mention etiology of secondary amenorrhea","Hypothalamic causes (35%) →\nCompartment\nIV\n1-Traumatic: fracture base of skull 2-Inflammatory: after meningitis or encephalitis\n3-Tumors: destroying the hypothalamus\n4-Miscellaneous:\n•Functional hypothalamic GnRH def: GnRH pulses → Diagnosed by exclusion.\n•Hypothalamic hyperprolactinemia: dopamine by drugs/ lesions\n•Postpill amenorrhea (Shearman $):\n-persistence of hypothalamic suppression after stopping COC\n- If amenorrhea persists > 6 months, search for other cause\n•Psychological conditions: a- Severe stress: ↑prolactin & ẞ-endorphins →GnRH b- Anorexia nervosa: severe psychological disturbance→marked anorexia, emaciation, hypoglycemia, low basal metabolic rate ,min of 20% body fat needed for menstruation c-Bulimia: binge purge eating (episodes of overeating) followed by self- induced vomiting, fasting, use of laxatives & diuretics d- Pseudocyesis→ extreme desire to get pregnant (infertile patients) or marked fear from it (near menopause) → -amenorrhea (GnRH pulse generator)\n-abdomin distension (fat, gas, ↑lordosis) -false perception of fetal kicks (intest movement\nPituitary causes (19%) →\nCompartment\nIII\n1- Post-traumatic/inflammatory\n2- Pituitary tumors: •Destructive e.g. craniopharyngioma\n•Secretory: -Prolactinoma (chromophobe adenoma) → prolactin\n-Acidophil adenoma → GH (acromegaly or gigantism)\n-Basophil adenoma → ACTH (bilateral adrenal hyperplasia)\n3- Miscellaneous: •Empty Sella syndrome\n•Simmond's disease: Pan-hypopituitarism (pituitary cachexia) •Sheehan's disease\nOvarian causes (40%) →\nCompartment\nII\n1-Traumatic: oophrectomy (surgical,medical,irradiation) 2-Inflammatory:mumps,TB\n3- Neoplastic: •Destructive tumors •Estrogen producing tumors (granulosa-theca)\n•Androgen secreting tumor (Sertoli-Leydig)\n4- Miscellaneous\n•Polycystic ovary (commonest cause of 2ry amenorrhea) •Hyperandrogenism\n•Premature ovarian insufficiency •Hyperprolactinemia •Resistant ovary syndrome\nUterine causes\n(5%) →\nCompartmen I\n1. Inflammatory\n2- Traumatic Asherman syndrome (amenorrhea traumatica, intrauterine synechiae)\nGeneral causes\n(1%)\n1. Endocrine: Thyroid (hypo or hyper), Adrenal (hypo or hyper) & Acromegaly\n2- Debilitating disease: anemia, malnutrition,TB\n3- Drugs: •Drugs causing hyperprolactinemia as anti-emetics\n•Hormones: anabolic steroids, androgens/danazol, COC","g4",3,"PI"],[106,"Define and mention causes of functional hypothalamic amenorrhea","final 63\n•Def:reversible suppression of HPO axis→Anovulation& amenorrhea due toGnRH pulses without organic pathology\n•causes: -stress (emotional or physical), excess exercise, weight loss, eating disorders","g4",3,""],[106,"Clinical picture and treatment of imperforate hymen (false amenorrhea)","•Symptoms (at puberty): cryptomenonhea , cyclic lower abdominal pain, lower abdominal swelling\n(hematocolpos) , pressure manifestations (dysuria & urine retention)\n•Signs\n-Abdominal: tense cystic pelviabdominal swelling\n-Vaginal: bluish bulging hymen\n-Rectally: distended vagina\n(continuous with abd swelling)\n•Complications:\nHematocolpos, hematometra, hematosalpinx,then spillage of blood into peritoneum →adhesions & infertility\n•ttt:\n-General anesthesia + catheterization\n-Surgical drainage (cruciate incisio)after written consent &documented certificate","g4",4,"P"],[106,"Turner syndrome","(10% of abortions:1/2500 live births)\n•C/P:\n-Genotype: 45XO (no Barr body).\nOR mosaic (45xo-46хх) ог (45хо\n46xy). If mosaic she may be tall / get menses , get pregnant / she will have premature ovarian failure\n-Phenotype: Short, webbed neck, cubitus vulgus(wide carrying angle), shield chest, coarctation of aorta, hearing loss & hypothyroidism.\n-Suspected in neonate: lymphedema of dorsum of limbs & short 4th metacarpal\n-Genitalia: External (infantile) , Internal (streaked ovaries (fibrous bands)]\n•inv: -estrogen + ↑ FSH\n(hypergonadotrophic hypogonadism)\n•ttt:\n1- Cyclic E& P: Stimulate breast & prevents osteoporosis. Given after 13 yrs (bone age) to avoid premature closure of epiphysis\n2-Recombinant GH:↑height (± 8cm)\n3- Gonadectomy: in mosaic with Y- chromosome, risk of gonadoblastoma is 25% by 25 y","g4",4,"I"],[106,"Testicular feminization (androgen insensitivity syndrome)","•Androgen Insensitivity Syndrome\n•Pathogenesis: X-linked recessive→ no receptors in breasts, hair follicles, vulva→ no response to androgens from testis→ feminine development\n•C/P -Karyotype: 46 XY (male like)\n- Phenotype\n1. Complete form: well-developed breasts\n(fat only glands) with small nipples , absent pubic & axillary hair.\n2. Incomplete form: variable degree of masculinized female\n- Internal genitalia: Testis (intra- abdominally, groin or labia). No uterus, tubes (inhibited by Sertoli cells AMH)\n- External genitalia: vaginal pouch\n•inv:- Normal male level testosterone (>\n300 ng/dl), FSH & LH.\n- Normal male E2 (30 pg/ml) from adrenals, testis, peripheral conversion\nThis estrogen is unopposed by testosterone → breast development\n•ttt: 1. Leave patient till 16-18 y: to allow breast development followed by gonadectomy (must as malignancy is 25%)\n2. HRT: maintain feminine character & avoid osteoporosis.\n3. For vaginal pouch: gradual dilatation or plastic surgery","g4",4,""],[106,"Müllerian agenesis (Mayer-Rokitansky-Küster-Hauser syndrome)","•Mever Rokitansky\nKuster Hauser syndrome\n•C/P:\n-Genotype: 46xx\n- Phenotype: normal female\nGenitalia: External\n(vaginal pouch) , Internal (normal ovaries)\n•Inv: normal E2 but absent uterus on US\n•ttt:\n1. Frank method: use of progressive dilators\n2. Vaginoplasty:\nMcIndoe's / William operation\n3. Abdominal: colon vaginoplasty ± amnion graft\n4. Laparoscopic:\nVachetti operation\n(gradual traction of ball)","g4",4,""],[106,"Frohlich syndrome","•short (↓ GHRH)\n•central obesity\n•amenorrhea (No GnRH)","g4",5,""],[106,"Laurence-Moon-Biedl syndrome","as Frohlich syndrome +\n•Limb deformity(polydactly/ syndactly)\n•Mental Retardation\n•Blindness (Retinitis pigmentosa)\n•Obesity, hypogenitalism as patients with Babinsky-Frelych's disease.","g4",5,""],[106,"Kallmann syndrome","Amenorrhea & anosmia (due to common embryological pathway with nasal olfactory bulbs)\n","g4",5,""],[106,"Levi-Lorain syndrome","GH & gonadotrophins → dwarfism + amenorrhea","g4",5,""],[106,"Cushing syndrome","•C/P:\n-↑cortisol→ amenorrhea, obesity, moon face, hypertension, hyperglycemia, osteoporosis\n-↑ androgen → hirsutism\n• Etiology\n-Pituitary (Cushing disease) → basophil adenoma\n-Adrenal (Cushing $) → adenoma/adenocarcinom\n-Hypothalamic→\n↑ACTH production\n-Ectopic ACTH production → e.g. oat carcinoma of lung\n-Congenital adrenal hyperplasia","g4",5,"I"],[106,"Empty sella syndrome","•1ry herniation of subarachnoid space into sella turcica\n•2ry to surgery, infarction, tumors, irradiation\n-↑ CSF→ compression on pituitary gland\n(amenorrhea) & compression on pituitary stalk\n(hyperprolactinemia)\n•Diagnosed by CT scan or MRI","g4",5,""],[106,"Sheehan syndrome","•Etiology: panhypopituitarism due to necrosis of ant pituitary after severe APH or PPH\n•C/P: -FSH & LH → amenorrhea, infertility, genital atrophy\n-TSH →2ry hypothyroidism\n-ACTH →adrenal insufficiency\n-GH →hypotension & hypoglycemia\n-Prolactin →failure of lactation (1st manifestation)\n-MSH → pale waxy skin\n(appears years later)\n•ttt: replacement of def hormones","g4",5,"I"],[106,"Asherman syndrome","•Etiology:\n1-Uterine manipulations: Over-curettage (90%) esp if done post-partum (due to injury of basal layer, also in myomectomy ,metroplasty (removal of septum)\n2. Manual removal of placenta, intracavitary radiation\n3. Uterine infection: septic abortion, puerperal sepsis, TB.\nTypes evaluated by hysteroscopy\nCavity involvement\nTubal ostia Type of adhesions\nMinimal < 1/3 involved\nBoth seen Filmy\nModerate 1/3-2/3 involved\nOne is seen Filmy/dense\nSevere > 2/3 involved\nNo one is seen\nExtensive\n•C/P: -Infertility\n-Amenorrhea, hypomenorrhea, cyclic dysmenorrhea\n-If got pregnant →recurrent miscarriage/preterm labor\n-Placenta previa / Placenta accreta\n•Diagnosis: 1-History of cause.\n2-Examination: limited mobility of uterine sound\n3-Investigation:\n- -ve estrogen & progesterone challenge test\n- Adhesions seen by HSG, saline sonography, hysteroscope\n•ttt (sometimes inoperable)\n-Hysteroscopic resection / adhesiolysis ± prophylactic antibiotic\n-Avoid new adhesions by intra-uterine balloon for 10 days (or previously amnion graft)\n-High estrogen doses to promote regrowth of endometrium CU\n-Re-evaluation by office hysteroscopy after 3months","g4",5,""],[106,"Enumerate causes of postpartum amenorrhea","•Lactational •Another pregnancy •Asherman $ (esp after D&C or sepsis) •Sheehan $ (esp after severe PPH)","g4",6,"I"],[106,"Assessment of amenorrhea by body configuration","Short Tall Slim Obese\n-Frohlich -LMB\n-Levi-Lorain -Turner\n-gigantism -acromegaly\n-TFS\n-anorexia nervosa -hyperthyroid\n-DM type I\n-PCO -hypothyroid -Cushing\n-Frohlich -LMB","g4",6,""],[106,"Enumerate causes of amenorrhea according to presence of breast and uterus","Absent breast (with present uterus) Absent uterus (with present breast) Both uterus & breast present\n1. Gonadal failure (Turner) = hypergonadotrophic hypogonadism\n2. Pituitary & hypothalamic causes = hypogonadism hypogonadotropic\n3. General constitutional cause\n1. Testicular feminization syndrome\n2. Mullerian agenesis both differentiated by Testosterone level & absence of hair\n1. Acquired causes for 2ry amenorrhea:\nHypothalamo-Pituitary-Ovarian - Uterine causes\n2. Cryptomenorrhea","g4",6,""],[106,"Mention management of amenorrhea","1) 1ry Amenorrhea with present uterus & absent 2ry sexu characters.\n2) 1ry Amenorrhea with present uterus & present 2ry sexual ccc & \"2ry amenorrhea \"\n3)1ry Amenorrhea with absent uterus&present sexual characte\n•Causes: a- Hypothalamic- pituitary- ovarian failure:\nCTINM b- Congenital adrenal hyperplasia c- General\n•inv: FSH measurement\n- >40 ng/ml→ ovarian cause→ karyotyping.\n-<5 ng/ml → Hypothalamus or pituitary, do\nGnRH stimulatory test (↑FSH→ hypothalamic causes, FSH → pituitary)\n•ttt:\n*If ovarian causes: Cyclic E + P (HRT)\n*Hypothalamic- pituitary causes:\n1)If not in need of pregnancy: Cyclic E+P\n2)If need of pregnancy:\n-FSH \"1-2 amp IM/d from 3rd day or GnRH\n(in hypothalamic causes) in a pulsatile manner every 90 min using a computerized pump with folliculometry \"17-20 mm\" & E\n\"200-300 pg/ml\" then add HCG \"5000-\n10000 IV /IM”\n•Causes a-Hypothalamic- pituitary- ovarian causes b-Uterine causes: Asherman's syndrome\n•inv:\n1-Exclude: pregnancy by B-HCG, hypothyroidism\n\"by TSH\", hyper-prolactinemia \"PRL >20 ng/ml\" & congenital adrenal Hyperplasia\n\"by 17 OH P &DHEA\"\n2-Progesterone challenge test:\n- +ve (bleeding): Anovulation\n- -ve (no bleeding): P + E challenge test\n3- Progestin + Estrogen challenge test\n- +ve (bleeding): hypothalamic - pituitary ovarian abnormality, do FSH.\n- -ve (no bleeding): uterine cause (US, HSG)\n•ttt:*Ovarian causes:\n-HRT, thyroxin, bromocriptin\n-PCO: induction of ovulation\n* Hypothalamic - Pituitary causes:\n-If need for pregnancy: induction by FSH &LH\n-If no need → HRT\n* Uterine Causes: Treat Asherman syndrome\n•Causes a-Male: Testicular Feminization\n(Androgen insensitivity) b-Female: Müllerian Dysgenesis\n•inv:1-Karyotyping\n2-Androgen level\n3-IVP & spines X-ray in Müllerian\nDysgenesis\n•ttt:\n*Testicular feminization: artificial vagina + remove testis with HRT\n*Mullerian Dysgenesis: artificial vagina\n4)1ry Amenorrhea with absent uterus & absent 2ry sexual characters: •46 XY & Testosterone synthesis\n•Management as Testicular feminization syndrome.\n•Hyperprolactinemia is 20% of causes of 2ry amenorrhea •All causes of 2ry amenorrhea can cause 1ry amenorrhea\n•true amenorrhea → most common causes are constitutional\nAnovulation","g4",7,"P"],[107,"Define / WHO classification of anovulation","(WHO classification → differentiated by FSH)\n1. Hypogonadotrophic hypogonadism (hypothalamic pituitary failure)\n2. Polycystic ovarian syndrome (commonest) 3. Ovarian insufficiency","g4",8,"P"],[107,"Mention etiology of anovulation","•Physiological: Pre/ peripubertal, peri & postmenopausal ,Pregnancy & lactation , Occasional anovulation (very common).\n•Idiopathic(most frequent) •General: malnutrition,TB,exercise, stress,Drug (COC, androgens)\n•Pathological:","g4",8,"P"],[107,"Mention hypothalamic and pituitary causes of hypogonadotropic hypogonadism","1- Hypothalamus 2- Pituitary 3- Ovary\n-Congenital: Frohlich , Laurence Moon Biedl , Kallmann\n-Trauma: (fracture skull) , Inflammatory (encephalitis)\n-Neoplastic: tumors destroying the hypothalamus\n-Others: stress, anorexia or bulimia , pseudocyesis\n-Congenital syndromes:\nLevi, Lorain syndrome\n-Trauma (fracture skull) , Inflammatory (encephalitis\n-Neoplastic: destructing or secretory (e.g. prolactinoma)\n-Others: empty Sella $ , Sheehan's disease\n-Congenital: dysgenesis , testicular feminization syndrome\n-Traumatic (oophorectomy)\n- Inflammatory (TB)\n-Neoplastic: destructive or secretory (estrogen / androgen)\n-Others: PCO, premature menopause, hyperprolactinemia, hyperandrogenism\n4- Thyroid & Adrenal disorders - Obesity: ↑ Fat→↑E→↓FSH","g4",8,"P"],[107,"Mention clinical picture of anovulation","•Menstrual irregularity: amenorrhea, oligomenorrhea, irregular spotting •Infertility\n•Clinical picture of cause e.g. PCO obesity, hirsutism","g4",8,""],[107,"Mention investigations of anovulation","1-Tests to detect ovulation:•Biphasic basal body temperature (BBT)\n•Hormone assay: mid-luteal progesterone level:\n->10 ng/ml → ovulation (good corpus luteum function) -< 5 ng/ml → anovulation\n-FSH >40mIU/ml → ovarian failure/insuffi -FSH <5mIU/ml→hypothalamic/pituitary failure\n•US (serial transvaginal folliculometry)\n2-Tests to detect cause: •PCOS: US (necklace), ↑ LH/FSH ≥ 2.5\n•Hyperprolactinemia (normal 0.2-29 ng/dl): MRI ± visual field.\n•Hyperandrogenism→testosterone or DHEA-S level •TSH, free T3, T4","g4",8,"PI"],[107,"Define ovulation","Release of mature ovum from mature graffian follicle after LH surge","g4",8,"P"],[107,"Mention treatment of anovulation","1-General: correction of malnutrition, anemia, DM, life style changes\n2-Medical: •Inducing artificial cycles by COC\n•If desires fertility: induction of ovulation: -PCO→ clomid ± oral hypoglycemic\n-Hyperprolactinemia→ bromocryptine, dostinex\n3-If failed medical ttt: •Clomid ± HCG, Letrozole. •HMG ± HCG\n4-Surgical: ovarian drilling for PCO, surgery for virilizing ovarian tumor\n5-If all failed→ IVF","g4",9,"P"],[107,"Define polycystic ovarian syndrome (PCOS)","•Characterized by persistent anovulation & loss of hormonal cyclicity\n•Commonest cause of amenorrhea, anovulation, hirsutism, infertility\n•Etiology is unclear with familial tendency","g4",9,""],[107,"Discuss pathophysiology of PCOS","(A vicious cycle)\n• high LH pulse / frequency→ ↑ androgen (by theca cells & ovarian stroma) & inhibits aromatase enzyme (responsible for conversion androgen into E2)→hyperandrogenism→ ↑ E1\n(conversion in fat/muscle/liver) → endometrial carcinoma→ +ve feedback on LH & -ve feedback on FSH → vicious cycle.\n•Associated insulin resistance (in 40%) →↑ ovarian ILGF stimulation of androgen synthesis → ↑ insulin resistance, SHBG (↑ free E & androgens) & obesity (↓ SHBG)","g4",9,"P"],[107,"Discuss pathology of PCOS","1-Uterus: Symmetrically enlarged ± endometrial hyperplasia\n2-Ovaries: •Size: enlarged 2-4 times\n•Tunica albuginea: thick, ivory white, smooth (no ovulation)\n•Cysts: multiple, small, subcapsular filled with clear fluid\n•Stroma: hyperplasia of theca & stroma cells (hyperthecosis)","g4",9,""],[107,"Mention diagnosis of PCOS","1-Suggestive C/P: •Symptoms:\n-Anovulation (periods of amenorrhea followed by prolonged painless irregular bleeding)\n-Infertility ± habitual abortion (high LH), acanthosis nigricans\n-Hirsutism (70%), Obesity (50%) (obesity = BMI>30 kg/m2)\n•Signs: enlarged uterus & ovaries\n2-US criteria suggestive of PCO (Adams criteria):\n•Necklace appearance(≥12 subcapsular follicle),each cyst 2-9mm in diameter,ovarian vol>10 cm³\n•By laparoscopy: large ovary with smooth white capsule\n3-Specific hormonal changes: •↑LH, FSH with LH/FSH ratio ≥ 2.5\n•↑Androgen,↑E(E1 mainly), AMH > 8-9 ng/ml,↑ Prolactin (<30 ng/ml),Progesterone, SHBG\n•↑Insulin (fasting glucose / insulin ratio > 4.5)","g4",9,"PI"],[107,"Mention Rotterdam diagnostic criteria of PCOS","According to ESHRE (European Society for Human reproduction & embryology) & ASRM\n(American society for reproductive medicine); presence of >=2 of:-\n1- Clinical & biochemical hyperandrogenism.\n2- Oligo or anovulation & menstrual dysfunction. 3- Ovarian size & morphology on US","g4",10,"P"],[107,"Enumerate long-term risks (complications) of PCOS","•Endometrial hyperplasia + carcinoma •Type II DM & hypertension •Weight gain\n•Dyslipidemia (HDL, ↑LDL, ↑triglycerides) •coronary heart disease •Breast cancer","g4",10,"PI"],[107,"Mention treatment of PCOS","1) General :•Weight reduction ( hyperinsulinemia) , Stop smoking.\n•Oral hypoglycemics (metformin, inositol): insulin resistance,\n2) If pregnancy is desired: ttt of infertility in PCO\n•Induction of ovulation→ Letrozole, Clomid & Gonadotrophin therapy\n•Surgical: laparoscopic ovarian drilling if failed induction or risk of OHSS:\n-4 punctures in each ovary for 4 sec each (role of 4) -Pregnancy rate up to 70%\n-Mechanism of action unknown but may be due:a)Removal of part of theca cells →androgens b)Change in certain intraovarian paracrine factors\n-Historically; bilateral wedge resection → adhesions\n•ART: if failed all other measures\n3) If pregnancy is not desired: a)If main complaint is irregular uterine bleeding:\n•Medical: -COC: 21 days→ stop 7 days → repeat\n- Progesterone: MPA 10 mg either for last 10 days every month or 21 days.\n•D & C: -Therapeutic: if medical therapy failed to control bleeding.\n-Diagnostic: for endometrial hyperplasia & malignancy\n•Hysterectomy: if hyperplasia or failed all other lines b)If main complaint is hirsutism: •COC: containing 3rd generation 'P' (Yasmin).\n•Diane: 35µg EE + 2mg cyproterone acetate","g4",10,"P"],[107,"Hyperprolactinemia: etiology, clinical picture and investigations","•Etiology\n1- Physiological causes: Normal pregnancy (200 ng/ml), suckling\n(150ng/ml) , stress, sexual intercourse ,sleep ,Hypoglycemia\n2-Pathological: Most common pathological cause is adenoma\n•Pituitary disease\n-Prolactinomas (chromophobe):Microadenoma <1cm, Macro>1cm\n- Growth hormone secreting tumor: 30% of acromegaly.\n-Cushing's disease & Empty sella syndrome.\n•Hypothalamic causes (dopamine): trauma, infections, tumors\n•PCOS\n•Other causes: -1ry hypothyroidism: due to ↑TRH\n-Renal failure ( excretion) & liver failure (↓ catabolism).\n-Ectopic sources of prolactin e.g., lung & renal tumors.\n•Neurogenic causes: Local chest wall lesions as burns.\n•anti-dopamine drugs: COC, Anti-depressants, Anti-emetics\n(metoclopramide) & Anti-hypertensives (reserpine, methyl dopa)\n•C/P:\n1. Anovulation (20%)→ amenorrhea & oligomenorrhea.\n2. Infertility & recurrent pregnancy loss\n3.Galactorrhea (30-60%) → squeeze each quadrant of breast from periphery towards nipple, as some lobes might not be affected.\n4. Hirsutism (prolactin →↑adrenal androgens)\n5. Manifestation of pituitary tumors (headache, visual field defects)\n•Inv:\n1-1st exclude: pregnancy, lactation, drugs & hypothyroidism\n2-Prolactin level: >30ng/ml (PCO), >100 (highly susp of adenoma)\nIndications to assess prolactin : Galactorrhea , Amenorrhea , Anovulation , Luteal phase defect , Abortions , Infertility.\n3-For etiology: dynamic MRI better ± Visual field examination","g4",11,"PI"],[107,"Hyperandrogenism and hirsutism: definition, etiology, clinical picture and investigations","•Def: presence of excessive levels of serum androgen.\nNB. Hypertrichosis: ↑vellus hair (not terminal) by drug,metabolic ,tumor\n•Etiology: enumerate causes hirsuitism\n1-↑androgen production: a)Endogenous source: - obesity\n-Ovary:PCO (2nd common) or tumor or pregnancy luteoma\n-Adrenal:Cushing or tumors or Congenital adrenal hyperplasia b)iatrogenic: anabolic steroids, some progestogens, danazol\n2-Extra-glandular pathology\n-Hypothyroidism(SHBG),hyperprolactinemia (↑adrenal androgen)\n-Liver diseases (SHBG), Acromegaly, insulin resistance\n3-Idiopathic:↑sensitivity of hair follicles or ↑ 5-reductase activity\n(converts testosterone to DHT). Commonest cause of hirsutism not hyperandrogenism → normal ovulation & androgen level\n•C/P:\n1. Hirsutism (assessed by Ferriman Gallwey scoring system):\nExcessive growth of midline hair with transformation of vellus\n(soft, unpigmented) to terminal (coarse, pigmented, longer) hair in androgen-dependent area (upper lip, chin, chest, back, pubis, thigh)\n2.Virilization: -Non virilizing characters: oily skin, acne, diffuse alopecia, menstrual irregularities & infertility\n-Virilization(Masculinization):acquire male characters as hirsutism, temporal balding, breast atrophy, deep voice & clitoromegally\n3. Etiology: +ve Family history, drug intake, galactorrhea, hypothyroidism, Rapid progression is suggestive of tumors\n•inv:1- 1st exclude: +ve family history, drug use&abnormal thyroid\n2-Testosterone:-If normal(0.2-0.8ng/ml)→no further inv (idiopathic\n-If > 1.5-2 ng/ml→ovarian tumor (US indicated)\n-If DHEA-S > 7 µg/ml→ adrenal tumor (CT indicated)\n3-Etiology:US (PCO),prolactin, 17-OH progest(adrenal hyperplasia)","g4",11,""],[107,"Treatment of hyperprolactinemia","•ttt:\n1)Treat causes (hypothyroidism) , non tumor cases → dopamine agonists\n2) Pituitary adenoma: Cabergoline for 2 y (microadenoma) or 5 y\n(macroadenoma). If recuurent →treatment forever\n-Surgery if: Tumor doesn't, affected vision , drug side effects\n3)If pregnant: Adenoma enlarges so continue dopamine agonists\n(not teratogenic) & Follow up visual field / trimester\nBromocriptine (Parlodel) Lisuride (dopergine)\n•ergot alkaloid(2.5mg twice daily)\n•Given with meals/vaginally to nausea\n•Given at night (to postural hypotension)\n•0.2 mg tablet\n•More potent with less nausea& vomiting\nCabergoline (dostinex) Quinagolide\n(norprolac)\n•0.5mg tab (less side effects, expensive)\n•Long acting (1/2 tablet given twice weekly)\nGradually increasing\nPreparation","g4",12,"P"],[107,"Treatment of hyperandrogenism","•ttt:\n1. An antiandrogen:\n-Finasteride inhibits 5-alpha-reductase, (Proscar 5mg/day)\n-Spironolactone, androgen receptor antagonist.\n-Cyproterone acetate 2mg + estrogen (Diane) or alone (androcur)\nNB: Anti-androgens are teratogenic\nCosmetic methods: shaving, plucking, waxing, bleaching, photo- epilation are effective as a supplement to drugs\n2. 3rd & 4th generation COC (e.g. Gynera, Yasmine)\n-Estrogen→↑SHBG -Progesterone→LH\n3. Others\n-Eflornithine:hair growth by inhibit anagen phase of hair growth\n-GnRH agonists causes inhibition of LH & FSH\n-Insulin-lowering agents: e.g. metformin.\n-Dexamethasone: used when there is adrenal enzyme deficiency.\n-Thyroid hormone replacement therapy in hypothyroidism.","g4",12,"I"],[107,"Prolactin and galactorrhea: short notes","-Source:polypeptide from ant pituitary lactotrope(acidophils) -Function: stimulate lactation\n-Normal Level: 0.2-29 ng/ml -Control: prolactin inhibiting factor (dopamine) from hypothalamus\n•Galactorrhea\n-Def: any discharge from breasts except blood or pus in absence of lactation. It is more commonly bilateral\n-Diagnosed by mic examination (fat droplets) + Sudan III stain -Hyperprolactinemia in male→ galactorrhea& impotence","g4",12,"P"],[106,"Enumerate causes of intrauterine adhesions","1)endometritis (post-abortive, puerperal, IUD induced, TB) 2)iatrogenic(vigorous curettage during D&C esp with surgical evacuation)","g4",12,"P"],[107,"Notes on PCOS diagnosis","NB: • US findings are present in 25% of normal females (polycystic like ovaries)\n• In diagnosis of PCOS, exclude other causes of hyperandrogen\n• PCOS is diagnosis of exclusion after excluding other causes of anovulation (e.g thyroid diseases& hyperprolactinemia)","g4",12,""],[107,"Luteal phase defect (corpus luteum insufficiency)","•Def: Inadequate progesterone in luteal phase → 4% of infertility cases, 35% of repeated abortions\n•Etiology\n1.Defect in CL(normally in postpuberta,postpartum, premenopaus\n2. Reduced follicular maturation (FSH & LH)\n3. Early degeneration of CL: endometriosis (↑PG-F2), Hyperprolactinemia, Hyperandrogenism & Hypothyroidism\n4. Endometrial insensitivity to progesterone\n•Diagnosis\n-Premenstrual spotting due to irregular ripening of endometrium\n-Biphasic body temperature (short lasting for < 10 days)\n-Midluteal serum progesterone (between 5-10 ng/ml)\n-Premenstrual endometrial biopsy (lag ≥ 2 days→ out of phase)\n•ttt:\n-Progesterone in 2nd\n½ of cycle & for 10 w if pregnant\n-Induction of ovulation (Clomid or gonadotrophins ± HCG)\n-No need for endometrial biopsy: invasive & ineffective for diagnosing ovarian receptivity","g4",13,""],[107,"Premature ovarian insufficiency (POI)","•Def: menopause before 40 y. It affects about 1% of females.\n•Etiology: 1. Idiopathic: commonest cause (+ve family history)\n2.Chromosoma:Turner,fragileX permutations (carriers), galactosemia.\n3. Autoimmune: anti-ovarian antibodies (isolated or part of poly- glandular autoimmune syndromes)\n4. Destruction by chemotherapy / radiotherapy\n5. Infections: mumps, CMV, tuberculosis\n6. More common in smoking, alcohol, undernourishment, debilitating diseases (as pernicious anemia)\n•Diagnosis: 1-History: amenorrhea < 40 y /family history.\n2-Clinically: estrogen deficiency manifestations (as hot flushes)\n3-inv: -FSH > 25-40 mIU/ml (hypergonadotrophic-hypogonadism)\n-karyotyping → Turner syndrome (45X0)\n-Ovarian biopsy:a)Premature ovarian insufficienc (no follicles found) b) If autoimmune (lymphocytes & plasma cells are present) c) Resistant ovary syndrome (normal number of follicles)\n•ttt: - HRT to risk of coronary heart disease & osteoporosis\n(estraderm patches → less liability to thrombo-embolism)\n-Transient resumption of ovarian activity may occur spontaneously\n-Stem cells: under trial","g4",13,"I"],[107,"Luteinized unruptured follicle syndrome (LUFS)","•Pathogenesis: -Failure of rupture of mature follicle (probably due to PG imbalance)→luteinization of cells & progest secretion\n-No ovulation in the presence of adequate luteal phase\n•Diagnosis: Follow up of Graffian Follicle by U/S: no collapse\n•ttt: Proper induction of ovulation, high dose HCG at ovulation time (not effective) & avoid anti-PGs at time of ovulation","g4",13,""],[107,"Resistant ovary syndrome","•Pathogenesis: Failure of ovary to respond to pituitary gonadotrophins\n( receptors in ovary or presence of antibodies)\n•inv: -↓E+↑ FSH (hyper-gonadotrophic hypo-gonadism)\n- Ovarian biopsy normal follicles (to differentiate it from POI)\n•ttt: -Spontaneous recovery may occur\n-Induction of ovulation is very difficult (needs large doses of Gn)\n-Oocyte donation (strongly condemned socially and religiously","g4",13,""],[108,"Define cyclic and acyclic bleeding","1) Cyclic bleeding 2) Acyclic bleeding\n•heavy menstrual bleeding (↑amount and/or duration)\nKnown previously as Menorrhagia\n•Polymenorrhea (too frequent menstruation due to too short cycles)\n•Intermenstrual bleeding (irregular\nMetrorrhagia bleeding unrelated to menstrual cycles). Known previously as\nMenorrhagia\nNormal uterine bleeding in mid-reproductive years\nMenstrual Parameter Terminology Limits\nFrequency Frequent < 21 days\nNormal 21-35 days\nInfrequent > 35 days\nRegularity Absent /Amenorrhea No bleeding\nRegular <20 days variation in 12 mon\nIrregular > 20 days variation in 12 mon\nDuration Prolonged > 8 days\nNormal 4.5-8 days\nShortened < 4.5 days\nVolume Heavy > 80 ml\nNormal 5-80 ml\nLight < 5ml","g4",14,""],[108,"Mention causes / FIGO classification of uterine bleeding (PALM-COEIN)","1-Structural causes: •Polyps •Adenomyosis •Leiomyoma •Malignancy & hyperplasia\n2-unstructural causes :•Coagulopathy •Ovulatory dysfunction\n•Endometrial dysfunction •iatrogenic •Not yet classified (e.g. chronic endometritis)","g4",14,"I"],[108,"Mention diagnosis of abnormal genital bleeding","1-History -Endometriosis (dyspareunia, infertility) -Tumors (pelvic swelling, cachexia)\n-PID (fever, lower abd pain, offensive discharge) -Prolapse (swelling protruding vaginally)\n2-Examination: •General: Anemia, general disease (hypertension), metastasis.\n•Abdominal: swelling (fibroid, ovarian tumor) , Pregnancy\n•Vaginal → try to detect a local cause (endometriosis / cervical lesion)\n•+/-PR examination may be helpful\n3-inv: •Blood:B-HCG,CBC&Coagulation profile •US,CT, MRI\n•Endoscopy →hysteroscopy, colposcopy •Endometrial biopsy (if persistent or age > 45 years)\n•fractional curettage •vaginal & cervical smears","g4",14,""],[108,"Mention management of abnormal uterine bleeding and examples of each category in COEIN",",examples of each category in COEIN\nAbnormal uterine bleeding due to coagulopathy (AUB-C)\nAbnormal uterine bleeding due to ovulatory dysfunction (AUB-O) Abnormal uterine bleeding due to endometri defect (AUB-E)\n•Etiology: Von\nWillebrand disease\n(VWD), ITP, leukemia, platelet dysfunction, liver disorder (steroid catabolism & SHBG)\n•inv: PT, APTT & factor assay\n•ttt:\n-Treatment of coagulation disorder\n-Menstrual suppression\n(continuous COC or hormonal IUCD)\n•Etiology: 1-Normal(after puberty& before menopause) 2-PCOS\n•ttt: 1- General:iron (for anemia), Anti-PGs (Mefenamic acid), Anti-fibrinolytics\n(tranexamic acid), Hemostatics [diosmin (daflon), ethamsylate (dicynone)].\n2- Hormonal: -COC: Given once daily for 21 days→ stop 1 wk → repeat\n-Progestins: a)Medroxy progesterone acetate 10-20 mg/d from day 16-25 b)Norethindrone 5-10 mg/day c)LNG-IUD (Mirena): 1st choice (esp if wanting contraception).\n-Induction of ovulation by clomid if fertility is desired\n3- Surgical: -Endometrial curettage: Diagnostic & Therapeutic\n-Hysteroscopic endometrial ablation\n1st generation: endometrial loop resection/diathermy/laser\n2nd generation: microwave/radiofrequency ablation (novasure)\n-Hysterectomy: vaginal, abdominal, laparoscopic a) If failed all above measures to stop bleeding (definitive TTT) b) Especially if a co-existent pathology or in older age groups\n•Etiology: endometrial defect due to imbalance of prostaglandins.\n•C/P: heavy menstrual bleeding\n•inv: no pathology& cycles are ovular.\n•Diagnosis: by exclusion of all other causes\n•TTT: COX inhibitors, tranexemic acid or artificial cycles (COC or P)\nAbnormal uterine bleeding due to medications (AUB-I) Abnormal uterine bleeding due to not yet classified causes (AUB-N)\nComplication of contraceptive pills or IUCD •Chronic endometritis •AV malformation •Chronic enlarged uterus","g4",15,"P"],[108,"Mention management of acute bleeding episodes","•Hospitalization & resuscitation: if Hb < 7gm% •Emergency D&C: ttt of choice for hemodynamically unstable\n• If persistent bleeding after curettage: High doses of IV estrogen [CEE 25 mg IV / 4 hrs], COC [2 x 2 x 5]\n•Other emerging procedures: Intrauterine balloon tamponade / Uterine artery embolization","g4",15,""],[108,"Enumerate types of bleeding according to hormonal action","1-Withdrawal bleeding (due to withdrawal of both estrogen/progesterone): Normal menstruation , After stopping COC\n2-Breakthrough bleeding: -Metropathia haemorrhagica (temporary in estrogen levels)\n- Injectables or Norplant (temporary in progesterone levels)","g4",16,""],[108,"Enumerate types of bleeding according to pattern","1) Menorrhagia (heavy menstrual bleeding)\nDef,Cause&ttt\n2) Polymenorrhea 3) Metrorrhagia\n(intermenstrual bleeding)\n4) Contact bleeding\n(exclude CIN by Pap smear)\n1-Local:\n•Organic: Inflammatory (PID), Tumors, prolapse.\n•Functional: corpus luteum insufficiency\n2-General: bleeding tendency\n(VWD) , Thyroid, hepatic,renal\n3-latrogenic: IUCD, Drugs(anticoagulants)\n1-Local: endometriosis, PID\n(ovarian congestion)\n2-AUB-O: functional polymenorrhea (due to early ovulation)\n1-Organic: Tumors, Infections\n(cervicitis / PID), IUCD\n2-Functional:\nMetropathia hemorrhagica\n(anovular bleeding)\n•Cervicitis, ectopy\n(erosion), CIN , cervical cancer\n•Vaginitis, Vaginal tumors\n•Uterine tumors bulging into vagina (e.g. fibroid polyp)","g4",16,"PI"],[108,"Mention abnormal genital bleeding according to age","1)Neonatal period: in 1st w (birth crisis) due to withdrawal of maternal transplacental estrogen\n2) Pre-menarcheal: •Trauma: FB,sexual abuse •Inflammatory:Pre-pubertal vulvovaginitis\n•Neoplastic: Sarcoma botryoids (cervix or vagina) , Germ cell tumor\n•Miscellaneous: Precocious puberty\n3) Early postmenarcheal: AUB-O, coagulopathies (VWD), stress, Pregnancy & Infection\n4) Reproductive age: Ovulatory dysfunction, pregnancy & contraception\n5)Menopausal transition(Perimenopausal bleeding):•General:HTN, DM,Coagulation defect\n•Local: fibroid,endometrial hyperplasia, CIN, Endometriosis\n•Dysfunctional uterine bleeding (a diagnosis of exclusion)\n6) Postmenopausal bleeding: •Prolapse: Trophic ulcers, neglected pessary\n•Tumors (most serious), endometrial carcinoma (10%), cx cancer (<1%) & other (ovary, fibroids & polyps)\n•Benign conditions of genital tract: -Atrophic endometrium 60% (commonest cause)\n-Complications of HRT\n•Non-gynecologic: General (hypertension), Bleeding / urethra or rectum","g4",16,"I"],[108,"Dysfunctional metrorrhagia (metropathia haemorrhagica)","•C/P: Short amenorrhea (6-8 w) then excessive prolonged painless bleeding (+ Inv finding)\n•Inv: - TVS: symmetrically enlarged thick uterus & endometrial lining, no local lesions\n-Fractional Curettage: Cystic glandular hyperplasia (Swiss cheese appear), no secretion\n•ttt: Control bleeding, Regulate cycles, induction of ovulation if infertile :\n1- General: Iron, Vitamins\n2- Hormonal: COCs (3w/months), Minera IUD (endom. atrophy) GnRHa, Induce ovulation\nProgestagens (Medical curettage: hyperplastic endometrium → secretory → shedding)\n3-Surgical: - Fractional curettage: diagnostic & therapeutic; if severe/perimenpausal bleeding\n- Hysterectomy (in endometrial hyperplasia \"Pan-hysterectomy\")\n- Endometrial ablation (induced Asherman $): patient becomes amenorrheic","g4",17,"PI"],[108,"Definition, causes and treatment of menorrhagia","•dysfuctional menorrhagia Occurs in 1st cycles after puberty & before menopause (as these are anovulatory & menstruation is dt estrogen withdrawal bleeding only which is prolonged)\n•Treatment: Anti-PG (Mefenamic acid), Antifibrinolytics, COCs or gestagens\n• General causes (HTN, CHF, Coagulation defect) , Dysfunctional menorrhagia\n•Local causes (most common) with pelvic congestion: Fibroid (submucous, large interstitial), Diffuse adenomyosis, Chronic PID, with IUD","g4",17,"P"],[108,"Etiology, investigations and treatment of postmenopausal bleeding","•etiology: iatrogenic, benign (atrophic vaginitis , polyps, vulvular dystrophy), premalignant lesions, gyna cancers, HTN\n•inv: US, smear, fractional curettage, hysteroscpy, MRI, CT , CBC, urine analysis\n•ttt:of cause, iron& vit, blood transfusion in severe, antifibrinolytic","g4",17,"P"],[108,"Investigations of a case of abnormal uterine bleeding","•Full history (Personal, present, menstrual, obstetric,…) & Examination (General, local)\n•Lab: CBC, urine analysis, urea & creatinine, liver functions, ECG, Blood sugar\n•U/S (TV or TA) •Fractional curettage (malignancy in endocervix or uterine body)\n•Vaginal & cervical smears, Colposcope for malignancy •Hysteroscopy (guide biopsy)","g4",17,"P"],[108,"Treatment of abnormal uterine bleeding","1-during attack: antifibrinolytics, NSAIDs, D&C operation\n2-hormonal: cycloc COC for 21 days with 7 free days for 8 cycles, cyclic gestagens for 3 cycles, progesterone impregnated IUD\n3-surgical: fractional curettage, endometrial ablation, hysterectomy, ttt of cause","g4",17,"P"],[109,"Primary dysmenorrhea (spasmodic)","•Def: Uterine colicky pain in 1st days of menses with no pathology\n(idiopathic)\n•C/P:1-Type of patient:in ovulatory cycles (starts 2-3 y after menarche) improved after childbirth, more in virgins, nulliparous & sedentary life\n2-Type of pain: -Site: lower abdominal radiate to lower limbs\n-Time: 1st day of menses & after 24 hrs\n-Associated with nausea, diarrhea, sweating & facial pallor\n•Etiology: unknown (theories)\n-Excess prostaglandins (PGF2) by progesterone\n-Retention of menstrual flow: obstructive(acute AVF or cx stenosis) , hypoplastic uterus , disturbed polarity (isthmic contraction)\n-Vasopressors is higher in female with dysmenorrhea.\n•ttt:1) Medical: Anti-PG (Mefenamic acid), COC & Recently (glyceryl trinitrite, sildenafil)\n2) Adjuvant therapy: Topical heat; exercise, Acupuncture.\n3) Surgical (Rarely done)\n-D&C: dilate pathway & lacerates paracervical sympathetic nerves\n-Laparoscopic Presacral neurectomy (LUNA): better avoided","g4",18,""],[109,"Secondary dysmenorrhea (congestive)","•Def: Dull aching pain in lower abdomen & back, 2ry to pelvic Pathology\n•C/P: criteria of 2ry dysmenorrhea\n1-Age: usually occurs later in life (more in multipara)\n2-Pain: Starts few days (3-5) before menses & with flow.\n3-Associated symptoms: Menorrhagia,polymenorrhea, leuchorhea\n•Etiology\n-Congenital: uterine anomalies\n-Inflammatory: cervicitis, PID, endometritis\n-Neoplastic: fibroids, polyps, ovarian tumors\n-Displacement: RVF & prolapse\n-Functional or simple (anxiety, coitus interruptus)\n-Endometriosis has a special character of pain (crescendo)\n-Post-tubal ligation syndrome\n•ttt (laparoscopy may be done for diagnosis)\n1) ttt of cause (Anti-PGs or COC are ineffective)\n2) Hysterectomy is definitive therapy","g4",18,"P"],[109,"Membranous dysmenorrhea","•Painful passage of large endometrial casts during menses\n•Character: Severe pain in 1st few days with scanty flow →passage of complete membranous casts →relief of pain & ↑flow\n•ttt→ suppress ovulation (COC)","g4",18,""],[109,"Ovarian dysmenorrhea","•Dull aching pain felt in one or both iliac fossa\n•Character: lasts only for few hours associated with N&V\n•ttt: reassurance & analgesics (inhibition of ovulation if severe)","g4",18,""],[110,"Define premenstrual syndrome (PMS) and its incidence","Cyclic recurrence of many physical / psychological symptoms Occurring in few days before menses & relieved after menses, Incidence: 50-80% of females will report uncomfortable / distressing symptoms, Up to 60% with severe PMS have an underlying psychiatric disorder","g4",18,""],[110,"Mention degrees of PMS","•Mild symptoms: inconvenient. •Moderate: annoying but don’t interfere with activity.\n•Severe symptoms (in 5%):interruption of social life (PMDD= PreMenstrual Dysphoric Disorder)","g4",19,""],[110,"Mention etiology of PMS","in ovulatory cycles (changes in E & central neurotransmitters)","g4",19,""],[110,"Mention diagnosis of PMS","1-Criteria for diagnosis: •Symptoms at luteal phase & absent in follicular phase\n•Diagnosed for at least 3 cycles •Physical & lab examination excludes organic pathology\n2-Symptoms: •Organic: Mastalgia, Joint pain, bloating, edema of face\n•Psychological: Depression, sleepy, ↓ interest, nervous.\nNB: Strict diagnostic criteria must be used together with patient recording of a self-rating scale","g4",19,""],[110,"Mention treatment of PMS","1. General: Reassurance , Anti-prostaglandins (pain)\n2. Diet: ↑sugar, salt, Avoid smoking, linolenic acid (primrose)\n3. Hormones: •COC (suppression of ovulation) •Depo-Provera (MPA) 150mg IM/3m\n•GnRH analogues→osteoporosis on long term","g4",19,""],[110,"Define premenstrual dysphoric disorder (PMDD)","Severe case of PMS→ major mood changes & affecting life & function","g4",19,""],[110,"Mention treatment of PMDD","As PMS + antidepressants: •Selective serotonin reuptake inhibitors: -Fluoxetine: 1st line therapy for severe PMS , Can be given daily in the luteal phase only\n•Selective norepinephrine reuptake inhibitors","g4",19,""],[111,"Definitions and incidence of infertility","Define 1ry infertility: inability to conceive after 1 y of continuous marital life without use of any contraceptive method\nDefine 2ry infertility previous conception occurred(whatever outcome)without using contraception (including lactation)\nDefine sterility irreversible infertility\nMention incidence of infertility •10-15% (incidence ↑with ↑age, pollution & PID) , earlier consultation is advised if :\n1. Apparent pathology e.g. PCO 2. Elder age (> 35 years)","g5",2,""],[111,"Female factors of infertility","Female Factor (40-50%) Male Factor (30-40%)\n1-Ovarian (30%): commonest cause of 1ry Infertility\n2-Pelvic (peritoneal/tubal) (20%): commonest cause of 2ry infertility\n•Congenital: hypoplasia, diverticula, accessory ostia\n•Trauma: surgery (pelvic adhesions) •Ectopic Pregnancy\n•Inflammatory (PID): (chlamydia/gonorrhea/TB)\n•Neoplasm: broad ligamentary fibroid or ovarian cysts\n•Endometriosis (10-25% of infertility) •Continuous abortions\n3-Uterine (5%)\n•Congenital malformations (cause abortions > infertility)\n•Asherman's Syndrome •Endometritis: TB.\n•Fibroids: submucus > intramural, or if blocking tubes.\n•Miscellaneous: Refractory Endometrium , Prolapse & RVF\n4-Cervical (5%)\n•Hostile cervical mucus: cervicitis, antibodies & thick (as with clomiphene citrate).\n•Anatomical abnormalities: atresia, polyps, prolapse, surgical (cautery, cone biopsy)\n5-Vaginal: •Congenital: atresia, septum\n•Traumatic: previous surgery, stenosis\n•Inflammatory: vulvo-vaginitis (hostile to sperms)\n•Neoplasm: cysts interfering with intercourse\n6-Immunological: •Antibodies against sperms in:\n-Male →autoantibodies (after surgery on male genital tract)\n-Female→ Antibodies against blastocyst (IgM): in serum only, Antibodies against sperms (IgG): in cervical mucous\n•Antibodies are either:\n-Agglutinating: head to head, head to tail, tail to tail\n-Immobilizing: head shakers, rotatory, lost forward motility","g5",2,"I"],[111,"Male factors of infertility","1-Imperfect spermatogenesis a)1ry testicular failure (high FSH)\n•Congenital: Sertoli cell only, undescended testis, Klinefelter\n•Traumatic: direct (immune), thermal (varicocele)\n•Inflammatory: mumps, syphilis, any acute viral infections\n•Neoplastic: tumors destroying testis b) 2ry testicular failure (pituitary): Low FSH\n2-Obstruction to transport\n•Congenital: absence of vas, cystic fibrosis, Kartagener$\n•Traumatic: surgery (for hernia or prostate)\n•Inflammatory: funiculitis, prostatitis (chlamydia)\n•Neoplastic: tumors of epididymis or prostate\n3-Failure of deposition of sperms\n•Anatomical: hypospadius & epispadius\n•Neurogenic: retrograde ejaculation (diabetic neuropathy & spinal injuries) → (known by urine analysis)\n•Psychological: impotence & premature ejaculation\n4-Agents toxic to spermatogenesis\n•Occupational hazards: heavy metals, high temperature\n•Unhealthy habits: heavy smoking, alcoholism\n•Therapeutic agents: chemotherapy","g5",2,""],[111,"Coital factors and unexplained infertility","Coital (5%) Unexplained (10-15%) criteria\n•Interference of coitus: impotence, dyspareunia, vaginismus, anorgasmia\n•Frequency & timing: -Too infrequent: chance of conception\n-Too frequent:  number & immature sperms\n•Use of lubricants & postcoital douching; kill sperms\n•Effluvium seminis (escape of semen from vagina after coitus → normal)\n•Diagnosis: inability to identify a cause→ Normal ovulation\n(by folliculometry); Normal tubes (by HSG ± laparoscopy);\nNormal uterine cavity (by hysteroscopy); Normal semen (at least done twice);\n•Causes: endometriosis (most common), sperm dysfunction, immunological, subclinical infection, psychological (cause uterotubal spasm)","g5",3,"PI"],[111,"WHO classification of ovulatory insufficiency infertility","infertility\nHypothalamo-pituitary Failure Hypothalamo-pituitary dysfunction Ovarian Failure\nHypogonadotropic hypogonadism Eugonadotrophic eugonadism Hypergonadotropic hypogonadism\n-FSH & E. - -ve progesterone challenge -Anovulation -Oligomenorrhea -Normal FSH&E -↑FSH -estrogen levels.\nSpecific Categories Of Ovulatory Dysfunction: Hyperandrogenism, Hyperprolactinemia (20% of female with ovarian dysfunction), Luteal Phase Defect (3-4% of infertile female have LPD), Luteinized unruptured follicle syndrome (LUFS)","g5",3,""],[111,"Characters and causes of hostile cervical mucus","Characters: 1-scanty amount, ↑viscousity 2-presence of antisperm antibodies 3-infection & presence of pus cells\nCauses: 1-acute & chronic endocervicitis 2-conization or excess cauterization 3-cervical fibroid","g5",3,"P"],[112,"Mention investigations of male infertility","•Semen analysis: collected in sterile container after 3 days of abstinence\n•DNA fragmentation test: if > 25% → skip IUI & go straight to ICSI\n•Hormonal assay: FSH, LH, prolactin, Testosterone\n•Doppler US: on testicles to detect varicocele •Chromosomal studies: for genetic disorders\n•Testicular biopsy: differentiate productive & obstructive disorders","g5",4,"I"],[112,"WHO normal semen and abnormalities in semen","WHO Normal semen Abnormal semen parameters\n•Volume: > 1.5 ml •ph: 7.1-8\n•Concentration /ml: > 15 million\n•Vitality: > 58% live sperms\n•Progression: > 40% Gr. a + b\n•Morphology: > 4% normal forms (oval head & single tail)\n•WBCs: < 1 million/ml\n•Liquefaction time: 20-30 min\n•Low volume: < 1.5 ml\n•Oligospermia:< 15 million/ml\n•Azospermia: absent sperms\n•Asthenospermia:\n- Poor motility <40% motile sperms\n- Poor progression < 32% (Gr. a+b)\n•Teratospermia: normal forms < 4%\n•Necrospermia: dead sperms >40%","g5",4,"PI"],[112,"Mention grades of sperm motility","•Grade a→progressive forward motility •Grade b→ sluggish motility\n•Grade c→abnormal motility •Grade d→immotile sperms","g5",4,""],[112,"Mention symptoms suggesting ovulation","•Regular cycles, spasmodic dysmenorrhea, premenstrual syndrome\n•Midcyclic (ovulatory) symptoms: -Discharge: due to ↑cervical secretion (estrogen effect)\n-Pain (Mittleschmertz) due to ovulation -Spotting due to relative drop of estrogen level","g5",4,"I"],[112,"Enumerate tests for ovulation","1-Hormonal assay •Mid-luteal progesterone (21-23) 7 days before expected menses:\n- >10 ng/ml means ovulation + good corpus luteum (CL) function\n- 5-9 ng/ml means ovulation + CL insufficiency - <5 ng/ml mostly she is anovulatory\n•Urinary LH kits: ovulation within 36 hrs (for early detection)\n2-Folliculometry: -Serial trans vaginal (TV-U/S): mature follicle is 17-23 mm\n- Tri-laminar endometrial lining\n- Ovarian reserve is known by day 3 FSH level, antral follicle count , clomiphene challenge test, inhibin B & antimullerian hormone\n•spermatogenesis cycle takes about 74 days\n3-Morning BBT (basal body temperature):\n-Normal rise is 0.2-0.3°c in 2nd half of cycle (progesterone effect)\n- Disadvantage: not so accurate, affected by infections & fevers\n-Biphasic chart: ovulatory -Monophasic chart (no rise) → anovular\n-Short rise (<10 days) means Luteal phase defect\n4-Tests for other ovulatory dysfunction\n•If amenorrhea: Prolactin, TSH, Gonadotrophins (assessed in day 3)\n•If hyperprolactinemia: Prolactin, CT brain •If hyperandrogenism: DHEA-S, testosterone","g5",4,"PI"],[112,"Enumerate tests for tubal patency","1-Hysterosalpingography (HSG): radio-opaque dye is injected through cervix & x-ray is taken\n•Substance used: Lipidol (50% iodide in Poppy seed oil) or Urograffin (50% iodide in water)\n•Advantages: -Diagnostic: uterus, tubes, peritoneal pathology\n-Therapeutic: Pressure during injection →break thin adhesions, iodine has antibacterial effect\n•Indications: infertility, after tubal surgery or myomectomy\n•Contraindications: pregnancy, bleeding, infections (spread)\n•Timing: best is 2-3 days postmenstrual: -To avoid disturbing possible pregnancy\n- Thin endometrium ( intravasation, endometriosis & false -ve results)\n2-Laparoscopy mention indications of laparoscopy in infertility\nDiagnostic Therapeutic\nTubes Tubal block salpingolysis, salpingostomy\nOvary PCO & ovarian swellings cautery for PCO, ovarian cystectomy\nEndometriosis Endometriotic spots cauterization of implants\nOthers To evaluate unexplained infertility\n3-Hystero-salpingo contrast sonography (HyCoSy): Inject of Echovist (galactose suspension) via cervix followed by TVS, Some inject saline instead (saline infusion sonohysterography)\n•Advantage: no radiation, no anesthesia, office procedure\n4-Tubal cannulation:Transcervical guided by hysteroscop,pass guide-wire throug tubal ostium\n•Advantage: bypasses / dilating a cornual block","g5",5,"PI"],[112,"Enumerate tests for uterine factor","1-US 2-Hysteroscopy 3- Premenstrual endometrial biopsy 4-Hysterosalpingography","g5",5,"P"],[112,"Clinica
