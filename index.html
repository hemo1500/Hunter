Contracted pelvis (50% most common).\n    b. Fibroids & ovarian & other soft tissue tumors.\n    c. Placenta previa centralis.\n    d. Contraction ring opposite fetal neck.\n• Fetal:\n    a. Macrosomia.\n    b. Malpresentations.\n    c. Multiple pregnancies.\n    d. Shoulder dystocia & neglected breech.","abl",42],[29,"Discuss CP of obstructed labor.","• History of prolonged labor.\n• Strong painful uterine contractions & persistent pain\n   between contractions.\n• ROM from long time & drained liquor.\n• Excessive maternal distress: tachycardia, tachypnea,\n   fever, dehydration, ketoacidosis.\n• Abdominal: hard tender uterus, molded over fetus /\n   Pathological Bandl's band is felt.\n• Fetal heart sounds & movements may not be felt.\n• Vaginal: hot dry edematous, high impacted presenting part.","abl",42],[29,"Enumerate complications of obstructed labor.","• Maternal:\n    a. PP Hge (ruptured uterus - atonic).\n    b. Puerperal sepsis.\n    c. PROM & Prolonged labor.\n    d. Necrotic vesicovaginal fistula.\n• Fetal:\n    a. Distress & asphyxia.\n    b. Trauma & Death.\n    c. Infections & ICH.","abl",43],[29,"Mention DD of obstructed labor.","• Contraction ring.\n• Full bladder.\n• Fundal fibroid.","abl",43],[29,"Discuss management of obstructed labor.","   • Prophylaxis (most important): proper ANC, partogram,\n     ecbolics, fluids, analgesia, antibiotics.\n   • Active:\n        a. Resuscitation.\n        b. CS: best.\n        c. Exploration of birth canal is mandatory.\n        d. Proper neonatal resuscitation.\n►Hypotonic uterine inertia:","abl",43],[28,"Define & mention types of hypotonic uterine inertia.","• Weak infrequent ineffective uterine contractions & of\n  short duration, leading to prolonged labor.\n• Primary: weak from start.\n• Secondary: dt uterine exhaustion after prolonged,\n  obstructed labor.","abl",44],[28,"Enumerate causes of hypotonic uterine inertia.","• Previous PP Hge – AP Hge.\n• Multipara (grand).\n• Malnutrition & anemia.\n• Multiple fibroids.\n• Malformed uterus.\n• Malpositions & Malpresentations.\n• Uterine overdistension.\n• Excessive anxiety & sedation.\n• Full bladder & rectum.","abl",44],[28,"Enumerate complications of hypotonic uterine inertia.","• Maternal:\n    a. Prolonged labor & exhaustion.\n    b. Traumatic injuries & lacerations.\n    c. PP Hge (atonic – retained placenta).\n    d. Puerperal sepsis.\n• Fetal: asphyxia, death, injuries, infections.","abl",44],[28,"Mention TTT of hypotonic uterine inertia.","   • Prophylaxis: reassurance, empty bladder & rectum, IV\n     glucose, antibiotics.\n   • Amniotomy if membranes are intact.\n   • Oxytocin: 10 units in 500 ml 5% glucose (dripping).\n   • CS: distress or failed dilation over 24 hrs.\n\n►Hypertonic uterine inertia:","abl",45],[28,"Enumerate types of hypertonic uterine inertia.","• Primary: both UUS & LUS ↑ tone.\n• Hypertonic LUS: reversed polarity, with OP position.\n• Uterine fibrillation (colicky).\n• Uterine tetany: generalized tonic retractions.","abl",45],[28,"Mention clinical features of hypertonic uterine inertia.","• Prolonged labor.\n• Irregular more painful uterine contractions.\n• High resting intrauterine pressure by tocography.\n• PROM & slow cervical dilatation.\n• Fetal & maternal distress.","abl",45],[28,"Mention TTT of hypertonic uterine inertia.","  • Avoid abuse of oxytocin.\n  • Sedatives & epidural anesthesia.\n  • Exclude malpositions.\n  • CS if distressed.\n► Constriction ring:","abl",45],[28,"Define constriction ring of Schroeder.","• Persistent, localized spasm of circular uterine muscles.\n• Around groove in body of fetus (neck).\n• Usually between upper & lower uterine segments.","abl",46],[28,"Mention predisposing factors of constriction ring.","• Malpositions & Malpresentations.\n• Misuse of ecbolics & repeated uterine manipulations.\n• Prolonged & obstructed labor.","abl",46],[28,"Compare constriction ring VS retraction ring.","               Constriction (Schroeder)        Pathological (Bandl's)\n                                            - During 2nd stage & always\n            - At any stage of labor & at\n                                            at junction between UUS &\nTime & Site any level of uterus\n                                            LUS\n            - Doesn't change its position\n                                            - Rising up\n\nExamination        Felt only vaginally        Felt & seen abdominally\n\n                                           - Hard & tender & tonically\n              - Relaxed & non-tender above\n                                           contracted above\n              - Neither thin nor distended\n  Uterus                                   - Thin & overdistended\n              below\n                                           below\n              - No risk of rupture\n                                           - Impending rupture\n                   Antispasmodics &\n   TTT                                           Only delivery\n                      anesthetics","abl",46],[28,"Mention TTT of constriction ring.","   • Sedatives, antispasmodics, anesthesia.\n   • 2nd stage (deep general anesthesia):\n         Relaxed ring → forceps delivery.\n         Not relaxed, failed forceps → CS vertical incision.\n\n  • 3rd stage: manual removal of placenta.\n\n►Cervical dystocia:","abl",47],[28,"Define cervical dystocia.","• Difficulty of labor dt failure of effective cervical dilation,\n  despite strong uterine contractions.","abl",47],[28,"Enumerate causes of cervical dystocia.","• Functional primary: affects external os only.\n• Secondary organic: scars, cerclage, fibroids, stenosis.","abl",47],[28,"Enumerate complications of cervical dystocia.","• Prolonged obstructed labor.\n• Distress mother & fetus.\n• Annular detachment of cervix.","abl",47],[28,"Mention TTT of cervical dystocia.","• Conservative: epidural analgesia.\n• CS:\n     Cervical stenosis dt fibrosis.\n     Organic obstruction of myoma.\n     Fetal distress.","abl",47],[34,"Definition of antepartum hemorrhage","• Bleeding from or in the genital tract, occurring from 24\n  weeks (Age of fetal viability) of pregnancy and prior to\n  delivery of the fetus.","aph",2],[34,"Mention causes of Antepartum hemorrhage","          Obstetric Causes                    Non-Obstetric Causes\n• Placental Hemorrhage: placenta     • Local causes in the genital\n  previa, placental abruption          tract: trauma, vaginitis,\n• Extra Placental Hemorrhage: genital cervical erosion, polyps or\n  trauma especially Uterine rupture    carcinoma.\n• Fetal Causes: vasa previa          • General causes of bleeding:\n• Unexplained APH                      liver failure, hypertension\n\n  ❖ Placenta Previa","aph",2],[36,"Definition of placenta previa","• Placenta that encroaches partially or totally on the lower\n  uterine segment (LUS).","aph",2],[36,"Mention Etiology of placenta previa","   Personal Character                  Obstetric Complications\n• Advanced maternal age • Recurrence\n• Multiparity              • Multifetal pregnancy: doubles in twins,\n• Cesarean section           triples in higher order.\n                           • Large placenta: bipartite or multipartite.","aph",3],[36,"What are the 2 most common risk factors of placenta previa","• Previous Cesarian section.\n• Multiparity.","aph",3],[36,"Mention pathogenesis of placenta previa","• Bleeding is by shearing forces on formation of LUS with\n  inelastic placenta → detachment .\n• Vaginal examination can cause bleeding .\n• Bleeding is maternal.","aph",3],[36,"Mention classification of placenta previa","         Minor Placenta Previa                Major Placenta Previa\n (within LUS, not covering internal os) (covering internal cervical os)\n• Low lying placenta: lower placental • Partially placenta previa:\n  edge encroaches on LUS but not           Placenta partially covers\n  reaching internal os, vaginal delivery internal os.\n  is allowed.                            • Total placenta previa:\n• Marginal placenta previa:                Placenta completely covers\n  Lower edge reaches but doesn’t           internal os.\n  cover margin of internal os.","aph",3],[36,"Mention classification of placenta previa according to AIUM","• Normal: placental edge >20 mm from internal os .\n• Low lying placenta: placental edge <20 mm from internal\n  os.\n• Placenta previa: placental edge cover internal os.","aph",4],[36,"Enumerate complications of placenta previa","            Maternal                             Fetal\n• Anemia, shock                     • Vasa previa\n• Recurrence                        • Velamentous insertion of\n• Amniotic fluid embolism             umbilical cord\n• Placenta accreta especially if on • Preterm labor\n  CS                                • IUGR, IUFD\n• Malpresentation and non           • Neonatal anemia and asphyxia.\n  engagement\n• PROMs\n• Post partum hemorrhage\n  (Atony, retained placenta)\n• Puerperal sepsis","aph",4],[36,"Mention 6 cardinal manifestation to placenta previa","• Painless, Causeless and Recurrent vaginal bleeding.\n• Symptoms of complications → anemia , shock.\n• Funda level = date of LMP except IUGR fundal level\n  becomes below LMP.\n• Fundal, umbilical grip: uterus is soft , not tender , fetal\n  parts are easily felt .\n• Pelvic grip: malpresentation and non engagement.\n• Fetal heart sounds: normal, distressed , absent according\n  to severity.\n• PV is contraindicated.","aph",5],[36,"Mention investigation of placenta previa","                   • TAS : initial placental localization\n                   • TVS: confirm diagnosis improve accuracy of\n  Ultrasound\n                     placental localization\n(Gold standard)\n                   • US can detect fetal weight ,IUGR .\n                   • Follow up for placental migration.\n                   • CBC, blood Grouping ,Rh, urine analysis,\n  Laboratory\n                     screening of DM\n                     • NST\n Tests of fetal\n                     • BPP\n  wellbeing\n                     • Doppler US","aph",5],[36,"Mention management of placenta previa","                  Conservative Management\n                 • Premature fetus, no fetal distress, no labor stable\n  Perquisites\n                   condition\n                 • Major previa admitted at 34 weeks .\n     Place\n                 • Minor previa: outpatient care.\n                • Maternal: bleeding, vital data ,labs\n   Follow Up\n                • Fetus: fetal wellbeing, fetal kicks\n                • Rest in left lateral position\n                • Hydration and nutrition\n Instructions , • Correction of anemia\n Interventions • Single course of antenatal corticosteroids between\n                  24 to 34 weeks\n                • Anti-D Ige if bleeding continues.\n                        Pregnancy Termination\n                              Mode of                Postpartum\n      Indications\n                            Termination              Management\n• Uncomplicated at 40\n  w ,accreta at 37 w.\n                        • Vaginal delivery in      Avoid PPH, Treat\n• Severe APH\n                          low lying placenta    anemia, Antibiotics, Anti\n• Fetal distress\n                        • CS                             D Ig\n• Severe PE, patient in\n  labor.","aph",6],[36,"Mention precautions before and during CS","• Cross-matched blood and blood products readily\n  available.\n• Consent for hysterectomy and possibility of bladder\n  injury.\n• Cell salvage where available.\n• Interventional radiology can be lifesaving.\n• Open the uterus at a site distant from the placenta (going\n  through the placenta → more bleeding, high chance of\n  hysterectomy).","aph",7],[36,"What's meant by placental migration and its explanation","• Definition: in early placenta previa, the placenta lies in the\n  LUS at the internal os; as the uterus grows, the LUS\n  stretches and the placenta moves away from the\n  internal os.\n• Explanation: during uterine growth the LUS stretches\n  from 0.5 cm to 10 cm.\n• Outcome: about 90% of early placenta previa cases\n  resolve by the third trimester.\n• Follow-up with US:\n  o Minor placenta previa → can be left until 36 wks.\n  o Major placenta previa → follow-up US at 32 wks.","aph",7],[36,"Mention Etiology of placenta accreta","   • Defective decidualization.\n                   • Placenta previa especially after CS (most\n Anatomical          common)\n factors           • Abnormal site of implementation (Uterine\n                     septum).\n                   • CS.\n Previous Uterine • Myomectomy.\n surgery           • D & C.\n                   • Asherman syndrome.\n                    • Maternal age > 35 years.\nOthers\n                    • IVF.","aph",9],[36,"Mention classification of placenta accreta","• Placenta accreta: villi are invading < 50 % of myometrium\n• Placenta increta: villi are invading > 50 % of myometrium\n• Placenta percreta: villi are perforating the Uterine wall.","aph",9],[36,"Describe clinical picture of placenta accreta","• During pregnancy: Asymptomatic (US funding).\n• Profuse Life threatening bleeding during manual placental\n  separation.\n• Placenta percreta with bladder invasion cause hematuria.","aph",9],[36,"Mention investigations for placenta accreta","• US and Doppler: no retroplacental hypoechoic zone,\n  prominent vessels or lakes in the placenta or myometrium.\n• MRI.","aph",10],[36,"Management of placenta accreta","• The same precautions before CS as placenta previa.\n• Then proceed for CS hysterectomy or\n  Conservative in the form of placenta is left Insitu +\n  antibiotics , supracervical incision with placental resection\n  followef by cervico- isthmic suturing and Uterine\n  devascularization.","aph",10],[35,"Define placental abruption","• Bleeding after 24 wks due to premature separation of a\n  normally situated placenta.","aph",11],[35,"Mention risk factors of placental abruption.","                  • age > 2.5 times > 40 years),\n    Personal\n                  • multiparity,\n   Character\n                  • smoking ( 2-folds) & cocaine\n                • PE (commonest conditions)\n    Medical\n                • Thrombophilias & folic acid deficiency\n   Disorders\n                • Preactamsia\n                • Preterm ROM & preterm labor\n                • Recurrence: recurrence rate is 5-17%)\n  Obstetric\n                  altar one episode, 25% after 2 episodes\nComplications\n                • Weak Implantation: Uterine anomaly or\n                  fibroid\n                • External trauma (hit)\n                • Obstetric (External cephalic version),\n   Trauma       • Rapid uterine decompression (ROM in\n                  polyhydramnios) & cord traction (short\n                  cord or precipitate labor)\n • The primary cause is idiopathic","aph",11],[35,"Mention pathogenesis of placental abruption","• Rupture of maternal vessels in decidua basalis\n• Bleeding which may be:\n  a) Small and self-limited\n  b) continue to dissect placental-decidual interface placental\n    separation.\n• The accumulating blood splits the decidua, separating a\n  thin layer of decidua with its placental attachment from the\n  uterus.","aph",12],[35,"Classification of placental abruption based on severity?","• Class 0: asymptomatic; diagnosed retrospectively by an\n  organized blood clot or depressed area on the delivered\n  placenta.","aph",12],[35,"Classification of placental abruption based on clinical types of bleeding","• Revealed: all bleeding appears vaginally from the start.\n• Concealed: all bleeding retained inside uterus →\n  retroplacental hematoma, no external bleeding. Due to\n  a) Blood accumulates behind placenta while its margins\n     remain adherent.\n  b) Adhesion between fetal membranes and uterus.\n  c) Deeply engaged presenting part (usually head).\n  d) High rupture of membranes with bleeding inside amniotic\n     sac.\n• Mixed: partially concealed and partially revealed (most\n  common).","aph",13],[35,"Mention investigation for abruptio placenta","• Imaging (US):\n  o Placental site to exclude previa (most important).\n  o Diagnosis of a retro-placental haematoma (Hypoechoic\n    area between the placenta & uterus) is not easy except if\n    haematoma is large (only in 20%)\n  o Other values of US: fetal weight - IUGR.\n• Laboratory:\n  o CBC, blood grouping, Rh type, coagulation profile (PT,\n    PTT, Fibrinogen & OPs), Kidney and liver functions, Urine\n    analysis & routine (screening of DM).\n• Tests of fetal wellbeing: NST, BPP, Doppler US.","aph",13],[35,"Mention complications of placental abruption","         • Anemia or shock\n         • Amniotic fluid embolism\n         • PPPH: Aloni (ischemic, Couvelaire & FDPS), DIC, rupture\n           uterus\n         • Couvelaire uterus (Uteroplacental Apoplexy)\n         • Extravasation of blood into uterine musculature and\n           beneath the uterine serosa may lead to pathological\n           ruptured uterus\nMaternal\n         • DIC release of thromboplastin, consumption of clotaing\n(↑ MMR)\n           factors in this hematoma, PE.\n         • Recurrence\n         • Renal fallure (acute cortical or tubular necrosis) due to\n           renal perfusion, emboli (from DiC), underlying disease\n           (PE) & renal glomerular injury by myoglobin released from\n           myometrium (Couvelaire utserus)\n         • Shock due to renal fallure, ARDS & multiorgan fallure\n         • Sheehan syndrome\n         • Preterm labor,\n Fetal & • IUGR (with chronic abruption),\nNeonatal • IUFD(when placental separation > 50%) and Neonate\n           (anemia & asphyxia)","aph",14],[37,"Mention Etiology of vasa previa","• Velamentous insertion of cord.\n• Bipartite or multipartite placenta.\n• Placenta succenturiate.\n• Low lying placenta.","aph",17],[37,"Discuss diagnosis of vasa previa","• Triad of mild vaginal bleeding associated with membrane\n  rupture and severe fetal distress (bradycardia – sinusoid\n  rhythm on CTG).\n• Antenatial: can be suspected if the abnormalities of the\n  placenta or the cord is diagnosed by US and the vessels\n  are seen by color Doppler US.","aph",17],[37,"Mention management of vasa previa","• Emergency CS If diagnosed before ROM → admission for\n  observation & Steroids then delivery by CS once mature.","aph",17],[38,"Define postpartum hemorrhage.","• Bleeding from genital tract after delivery till end of\n  puerperium that affecting maternal general condition\n  (>500 ml).","pph",2],[38,"Mention types of PP Hge.","• Primary: within 24 hrs of delivery\n    a. Tone: atony (90%).\n    b. Thrombosis (DIC).\n    c. Tissue (retained placenta).\n    d. Traumatic (lacerations).\n    e. Acute inversion of uterus.\n\n• Secondary: after 1st day till end of puerperium\n    a. Choriocarcinoma (most serious).\n    b. Retained fragments + infections.\n    c. Sepsis.\n    d. Subinvolution of uterus.","pph",2],[39,"Define atonic PP Hge.","• PP Hge because of weak contractility and retractility.\n• The most common cause of PP Hge.","pph",3],[39,"Enumerate causes of atonic PP Hge.","• During pregnancy:\n   o Anemia & previous AP Hge.\n   o Hypertension & PE.\n\n• Local causes of Uterus:\n  o Uterine overdistension.\n  o Grand multipara.\n  o Multiple fibroids.\n\n• Labor:\n  o Prolonged 1st & 2nd stages of\n  o Precipitate labor & retained placenta.\n  o Use of tocolytics.\n  o Excessive use of sedatives & deep anesthesia.","pph",3],[39,"Enumerate complications of atonic PP Hge","• Hemorrhagic shock.\n• Maternal mortality.\n• Sheehan's syndrome.\n• Acute renal failure.\n• Puerperal sepsis & DIC.","pph",3],[39,"Discuss treatment of atonic PP Hge."," • Prophylaxis: Proper ANC & control of predisposing factors.\n • Proper management of labor (3rd stage management is the\n    most important preventive measure).\n • Resuscitation:\n      a. ABC, oxygen, and IV lines.\n      b. Fluids & blood transfusion.\n      c. Vitals & CBC & other baseline labs.\n• 1st line: massage with ecbolics\n     a. Slow firm rotatory movements with abdominal compression.\n     b. 20 units oxytocin by dripping.\n     c. Ergometrine or PGs.\n• 2nd line: exploration of birth canal under GA\n     a. Remove any                           b. Repair of any tears.\n        fragments.\n• 3rd line: bimanual compression of uterus\n     a. Right fist in ant. fornix & left hand abdominally.\n     b. Continued for 15 min & repeated.\n• 4th line: balloon tamponade\n     a. Bakry balloon or Foley catheter filled with 200-500 ml\n        saline & inflated.\n• 5th line: laparotomy\n     a. Supravaginal hysterectomy.\n     b. Bilateral uterine / internal iliac artery ligation.\n     c. B-Lynch sutures.","pph",4],[40,"Mention causes of perineal lacerations.","• Overstretch of perineum: macrosomia, malpresentation,\n  extension before crowning.\n• Rapid stretch of perineum: breech, precipitate labor.\n• Rigid perineum in elderly primigravida.\n• Instrumental injury.","pph",5],[40,"Enumerate degrees of perineal lacerations.","• First: vaginal wall & perineal skin.\n• Second: + perineal muscle ± levator ani.\n• Third: + external anal sphincter.\n• Fourth: + rectal mucosa or anal canal.","pph",5],[40,"Enumerate complications of perineal lacerations.","• PP Hge & puerperal sepsis.\n• Prolapse & stress incontinence.\n• Fecal incontinence.\n• Improper healing & residual rectovaginal fistula.\n• Tender scar & dyspareunia.\n• Recurrent genital infections & leucorrhea.","pph",5],[40,"Discuss TTT of perineal lacerations.","   • First degree: suture repair if severe bleeding.\n   • Second: necessary suture repair.\n   • Third & Fourth: mandatory layered suture repair.\n   • Prophylactic antibiotics & use antiseptic washings.\n\n             • Rectal wall: 2 layers interrupted sutures.\n             • External anal sphincter: figure of 8 suture.\n             • Levator ani: interrupted sutures.\n             • Vagina: from above downward, interrupted or\n               continuous.\n             • Superficial muscles & Skin: interrupted\n               sutures.\n►Vaginal lacerations:","pph",6],[40,"Mention complications of vaginal lacerations.","• Severe bleeding & colporrhexis.\n• Vesicovaginal fistula or incontinence.\n• Rectovaginal fistula or incontinence.\n• Broad ligament hematoma & prolapse.\n• Vaginal stenosis & dyspareunia.\n• Repeated infections & abscess formation.","pph",6],[40,"Mention TTT of vaginal lacerations.","   • Immediate repair from above downward.\n   • Vaginal packs & catheter & antibiotics.\n   • If failed: bilateral internal iliac ligation.\n► Cervical lacerations:","pph",6],[40,"Enumerate causes of cervical lacerations.","• Macrosomia.\n• Precipitate labor.\n• Cervical fibrosis & rigidity.\n• Instrumental delivery.","pph",7],[40,"Enumerate types of cervical lacerations.","• Minor unnoticed (common).\n• Unilateral more in left.\n• Bilateral.\n• Stellate.\n• Annular detachment in obstructed labor.","pph",7],[40,"Mention complications of cervical lacerations.","   • Extension up: rupture uterus.\n   • Extension anterior: bladder involvement.\n   • Extension lateral: uterine vessels, ureters.\n   • Cervical incompetence → recurrent abortion.\n   • Ectropion & chronic cervicitis.\n►Rupture Uterus:","pph",7],[40,"Mention types of uterine rupture.","• Scar dehiscence.\n• Complete: all layers + peritoneum (80%).\n• Incomplete: doesn't involve visceral peritoneum (20%).","pph",8],[40,"Enumerate causes of uterine rupture.","• During pregnancy:\n   a. Rupture of previous CS scar (commonest).\n   b. Other scars as myomectomy and hysterotomy.\n   c. Severe concealed accidental hge.\n   d. Placenta increta & percreta.\n   e. Sacculation of uterus.\n   f. Perforating vesicular mole.\n\n• During labor:\n   a. Obstructed labor (commonest).\n   b. Ruptured scar.\n   c. Vigorous manipulation & instruments.\n   d. Manual removal of placenta.\n   e. Improper use of oxytocin and PGs.","pph",8],[40,"Mention factors affecting integrity of uterine scar.","• Site: LUS scar is safer.\n• Type: myomectomy multiple scars more prone to rupture.\n• Improper closure of edges & single layer sutures.\n• Postoperative infections (endometritis).","pph",8],[40,"Mention factors causing weakness of uterine scar.","• Imperfect sutures & hemostasis, infection.\n• Erosion of scar dt placenta implanted over it.\n• Repeated scar ≥ 2.\n• Uterine overdistension ↑ intrauterine pressure.","pph",9],[40,"Discuss clinical picture of uterine rupture.","• Impending rupture of scar during pregnancy:\n     a. Lower abdominal pain & tender scar & vaginal\n        spotting.\n     b. Gapping of scar edges by US.\n\n• Actual rupture during pregnancy:\n    a. Sudden severe abdominal pain & collapse.\n    b. Vaginal bleeding & intraperitoneal hge.\n    c. Fetal parts are easily felt separated from uterus.\n    d. Fetal distress or death.\n\n• Rupture during obstructed labor:\n    a. Cessation of labor pain & fetal movements.\n    b. Sudden severe abdominal pain & collapse.\n    c. Vaginal bleeding & edema.\n\n• Traumatic rupture during labor: after instruments used or\n  obstetric operation.","pph",9],[40,"Enumerate complications of uterine rupture.","• Hge & all its complications.\n• Hysterectomy.\n• Sepsis, DIC & amniotic fluid embolism.\n• Broad ligament & retroperitoneal hematoma.\n• Bladder, ureteric, intestinal injuries.\n• 10-40% maternal mortality rate.\n• 50-60% perinatal mortality rate with incomplete, 100%\n  with complete rupture.","pph",10],[40,"Mention management of uterine rupture.","• Resuscitation.\n• Midline laparotomy & Supravaginal hysterectomy.\n• Bilateral internal iliac arteries ligation.\n• Exploration & repair of associated injuries.\n• Conservative uterus repair may be done in limited cases.","pph",10],[41,"Define retained placenta","• Placenta fails to be expelled within 30 minutes after fetal\n  delivery.","pph",12],[41,"Mention causes of retained placenta","  Separated but retained            Adherent placenta\n• Uterine Atony.             • Uterine atony.\n• Contraction ring.          • Placenta accreta / increta /\n• Complete rupture uterus.     percreta.\n                             • Placenta previa.\n                             • Previous CS.","pph",12],[41,"Discuss C/P of retained placenta","• No placental expulsion for 30 min.\n• Vaginal bleeding:\n      o Not separated → no bleeding.\n      o Completely separated → minimal bleeding.\n      o Partially separated → massive bleeding.\n• General: Shock.\n• Picture of the cause:\n     a. Atony: lax uterus.\n     b. Contraction ring: Good uterine tone + Hour- glass\n        contraction.\n     c. Rupture uterus: feel the tear.\n     d. Absence of plane of cleavage: placenta accreta.","pph",12],[41,"Mention complications of retained placenta","• Shock: hemorrhagic or idiopathic obstetric shock\n   (neurogenic).\n• Postpartum hemorrhage.\n• Puerperal sepsis.\n• Subinvolution of the uterus.\n• Placental polyp and choriocarcinoma.\n• Complications of the management: anesthesia.","pph",13],[41,"Discuss the management of retained placenta case","• 3rd stage:\n     o Modified Brandt's Andrews method under GA +\n        Uterine massage + Ecbolics.\n\n• If failed → Manual removal of placenta under GA:\n      o Separate the placenta by a sawing movement while\n         the fundus is steadied by the left hand on the\n         abdomen, Inspect placenta for any missing fragment.\n\n• If failed → management of the cause:\n      o Uterine atony - ruptured uterus- Placenta accrete -\n         constriction ring.","pph",13],[41,"Mention complications of manual removal of placenta","• Uterine atony: give ergometrin and massage the uterus.\n• Puerperal sepsis: Strict asepsis and prophylactic\n   antibiotics\n• Perforation of the uterus.","pph",13],[42,"Definition of DIC","• Paradoxical situation: thrombotic + fibrinolytic mechanisms\n  activated simultaneously → intravascular coagulation +\n  hemorrhage at the same time.","pph",14],[42,"Discuss etiology of DIC","• Common Causes:\n  o Placental abruption (hematoma → Consumption of fibrin).\n  o Massive blood loss with inadequate replacement\n  o Severe pre-eclampsia, eclampsia or HELLP syndrome\n\n• Rare Causes: Sepsis, retained dead fetus (>3-4 weeks),\n  Amniotic fluid embolism, Acute fatty liver of pregnancy, Adult\n  Respiratory Distress syndrome, Acute hemolytic transfusion\n  reactions & Autoimmune disease","pph",15],[42,"Mention C/P of DIC","• Postpartum or antepartum hemorrhage.\n• Persistent bleeding from venipuncture sites or after catheter\n  insertion.\n• Spontaneous bleeding from gums and nose.\n• Generalized oozing in surgical fields.\n• Purpuric areas (thrombocytopenia & incoagulable blood).","pph",15],[42,"Investigations of DIC","                                         Normal clot: 3-8 min\n       Weiner Test\n                                Clot forms later + dissolves within 1 hr →\n   (Clot Observation)\n                                         hypofibrinogenaemia\n5-10 cc of blood in a tube at\n           37 °C                      No clot → afibrinogenemia\n\n    Plasma Fibrinogen                          < 150 mg%\n\n           FDPs                      > 40 µg% → suggestive of DIC\n\n         D-Dimer                               > 0.5 mg%\n\n                                Increased\n      Bleeding Time                           (N = 2-4 min)\n       Clotting Time                         (N = 6-12 min)\n             PT                               (N = 12 sec)\n\n            PTT                             (N = 35-45 sec)\n\n                                Decreased\n      Platelet Count                   (N = 150,000-400,000/µL)","pph",16],[42,"Treatment of DIC","• Correction of the cause is the most important issue.\n• Correction of coagulation profile:\n  1. Transfuse fresh frozen plasma: If Prothrombin time is > 1.5\n     times the control. The goal is to keep PT within 2-3\n     seconds of the control.\n  2. Cryoprecipitate OR Fibrinogen: If fibrinogen level is < 100\n     mg/dl.\n  3. Platelets: if <20000/cmm or bleeding with a platelets\n     between 20000 - 50000/cmm.\n  4. Antifibrinolytics: as Epsilon Amino Caproic Acid OR\n     trasylol 2-4 ampoules IV (5 ml ampoule contains 25000\n     U), is not given unless all measures fail to control bleeding.\n  5. Heparin infusion is condemned when the vascular system\n     integrity is compromised.","pph",17],[43,"Discuss etiology of Acute inversion of uterus","     Spontaneous                   Induced (Commonest)\n• Precipitate labor.      • Crede's method.\n• Very short cord.        • Traction on cord (if placenta is\n• Vigorous straining /      adherent).\n  coughing.               • 3. During manual removal of placenta\n                            (can also occur during CS).","pph",18],[43,"Discuss degrees of uterine inversion","1) 1st degree: the fundus uteri is depressed but does not pass\n   through the cervix\n2) 2nd degree: the fundus protrudes through the cervix\n3) 3rd degree: total uterine inversion, protruding outside the\n   vulva.","pph",18],[43,"Discuss C/P of uterine inversion","❖ Symptoms: Pain - bleeding (usually massive) - shock -\n   Mass protruding from the vulva in 3rd degree\n❖ Signs:\n     1. Generally: shock (hemorrhagic or neurogenic)\n     2. Abdominally:\n        - Cupping of the fundus (in 1st and 2nd degree)\n        - Absent uterus (in 3rd degree)\n     3. Vaginally: a soft purple mass is\n        - Felt in the vagina (in 2nd degree)\n        - Seen at the vulva (in 3rd degree)","pph",18],[43,"Mention management of uterine inversion","• Prophylaxis.\n• Resuscitation.\n• Active:\n    ▪ Manual reposition with the palm of the hand or by\n       hydrostatic pressure under GA (preferably halothane\n       to relax the uterus).\n    ▪ Tocolytics as ritodrine is given to help reposition\n       then ecbolics after reposition.\n    ▪ If the placenta is still attached, it is removed to\n       facilitate reposition of the uterus.\n    ▪ In a minority of patients, the above procedures fail→\n       Laparotomy for surgical correction is needed.","pph",19],[45,"Mention types and causes of shock in Obs","     Type                           Causes\n                 • Anemia & malnutrition.\n                 • Bleeding in early pregnancy / antepartum He /\nHypovolemic        PPhge.\n                 • Prolonged labor with dehydration and acidosis.\n                 • Hypertensive state with pregnancy.\n                 • Ectopic pregnancy\n                 • Concealed accidental He\n                 • Acute inversion of uterus.\nNeurogenic\n                 • Rupture of uterus.\n                 • Retained placenta.\n                 • Violent and using Crede’s method.\n                 • Rapid evacuation of uterine content as in\nSplanchnic\n                   polyhydramnios & precipitate labor.\n                 • Pressure overload / volume overload / heat\nCardiogenic\n                   disease.\n                 • Septic abortion.\n                 • Chorioamnionitis.\nSeptic\n                 • Puerperal sepsis.\n                 • Pyelonephritis.\nTrue obstetric   • Acute adrenocortical failure\nshock            • AFE","pph",20],[45,"Mention clinical features of shock","• Hypotension (BP 50-60mmHg or < 100mmHg).\n• Tachypnea & tachycardia.\n• Oliguria.\n• Subnormal temperature.\n• Pallor & cyanosis.\n• Dimness of vision and maternal confusion.","pph",21],[45,"Mention complications of shock","• Fetal asphyxia.\n• Complications of blood transfusion.\n• DIC.\n• Maternal mortality.\n• Acute renal failure.","pph",21],[45,"Difference between neurogenic & hemorrhagic shock Neurogenic shock                    Hemorrhagic shock","                                      Patient is restless and anxious\n   Patient quiet and apathetic\n                                               with air hunger\nNo external or internal bleeding       External or internal bleeding\nSuperficial veins are full of blood   Superficial veins are collapsed\n      Hemoconcentration                       Hemodilution\n           Slow pulse                     Weak and rapid pulse\n Slow and shallow respiration         Rapid and shallow respiration","pph",21],[45,"Mention prevention and treatment of shock","❖ Prevention: proper ANC, intranatal care & postpartum care.\n\n❖ 1st aid measurement & resuscitation:\n     • Establishment of IV lines: Insert 2 large wide pore\n        cannulas & CVP catheter.\n     • Patent airway with good oxygenation.\n     • Elevation of legs: ↑ VR from limbs to central\n        circulation.\n     • Warming of patient.\n\n❖ Antishock measures:\n  ➢ Relief of pain & fear: By pethidine or morphine.\n  ➢ Restoration of blood volume:\n    • Cross matched fresh blood transfusion.\n    • IV fluids (crystalloid solutions as lactated Ringer &\n       saline).\n    • Drugs: Corticosteroids & isotropic drugs.\n    • Blood components commonly transfused in obstetrics\n       (whole blood, packed RBCs, FFP, cryoprecipitate,\n       platelets).\n    • Insertion of urinary catheter & monitoring of urine\n       output.\n    • Lab investigations: CBC, coagulation profile, blood\n       gases & serum creatinine.\n    • Detect & treat the cause.","pph",22],[46,"Mention types of obstetric trauma","  • Maternal:\n Genital tract       • Tissue lacerations: Perineal – vaginal\n trauma                – cervical – uterine.\n                     • Hematoma: Vulval – vaginal – broad\n                       ligament.\n                     • Tissue necrosis.\n                     • Bucket handle tear of cervicx, necrotic\n                       fistula.\n Non genital tract • Injuries of pelvic joints & bones.\n (due to forceps)    • Rupture Symphysis pubis, coccyx,\n                       sacro-iliac ligament.\n                     • Hematoma of rectus abdominus\n                       muscle\n  • Fetal:\nHead injury         Intracranial Hge, fractures of the skull.\nPeripheral nerve    Brachial plexus, facial, phrenic nerve palsy.\nMusculo-skeletal    Fracture clavicle.\n                    Sternomastoid, head, abdominal organs\nSoft tissue\n                    lacerations.","pph",23],[46,"Give short note about hematoma of rectus abdominus muscle","• Etiology: rupture of deep epigastric vessels.\n• More common in multi-Para.\n• May occur after cesarean section.\n• C/P → sudden severe pain with or without shock.","pph",24],[46,"Enumerate the long-term complications of obstetric trauma","• Vagina: dyspareunia, fistula.\n• Cervix: chronic infection, infertility.\n• Uterus: hysterectomy, rupture uterus, ureteric\n  compression.\n• Levator ani: prolapse, incontinence.","pph",24]],"m":[[0,"Normal baseline fetal heart rate at term is:",["90–110 bpm","110–160 bpm","160–180 bpm","180–200 bpm"],1,"Normal baseline FHR is 110–160 bpm. Below 110 is bradycardia, above 160 is tachycardia."],[0,"A reactive NST requires within 20 minutes:",["1 acceleration of 10 bpm for 10 s","2 accelerations of ≥15 bpm lasting ≥15 s","2 late decelerations","Absent variability"],1,"Reactive NST = at least 2 accelerations of ≥15 bpm for ≥15 seconds in 20 minutes (term fetus)."],[0,"Which is NOT a component of Manning's biophysical profile?",["Fetal breathing movements","Fetal tone","Amniotic fluid volume","Maternal blood pressure"],3,"BPP = NST, fetal breathing, fetal movements, fetal tone and amniotic fluid volume."],[1,"Polyhydramnios on US is diagnosed when the deepest vertical pocket is:",["≥ 2 cm","≥ 5 cm","≥ 8 cm","≥ 15 cm"],2,"DVP ≥ 8 cm (or AFI ≥ 24–25 cm) means polyhydramnios."],[1,"Which fetal anomaly is classically associated with polyhydramnios?",["Renal agenesis","Esophageal atresia","Posterior urethral valve","Potter syndrome"],1,"Fetal swallowing is impaired in esophageal atresia, so fluid accumulates. Renal anomalies cause oligohydramnios."],[1,"A sudden pleted weeks of gestation."],[4,"Antenatal corticosteroid regimen for fetal lung maturity:",["Betamethasone 12 mg IM, 2 doses 24 h apart","Hydrocortisone 100 mg IV once","Prednisolone 5 mg daily orally","Dexamethasone 1 mg once"],0,"Betamethasone 12 mg × 2 doses 24 h apart (or dexamethasone 6 mg × 4 doses 12 h apart)."],[4,"Magnesium sulfate before preterm delivery under 32 weeks is mainly given for:",["Tocolysis only","Fetal neuroprotection","Maternal sedation","Lung maturity"],1,"MgSO4 reduces the risk of cerebral palsy in very preterm babies."],[4,"A negative fetal fibronectin test is useful because:",["It confirms labor","It has high negative predictive value for delivery within 1–2 weeks","It indicates infection","It measures cervical length"],1,"A negative fFN makes delivery in the next 7–14 days unlikely."],[5,"Post-term pregnancy is pregnancy that reaches:",["40 weeks","41 weeks","42 completed weeks or more","38 weeks"],2,"Post-term = 42 completed weeks (294 days) or more."],[5,"A fetal cause of prolonged pregnancy is:",["Anencephaly","Polyhydramnios","Twins","Preeclampsia"],0,"Anencephaly with fetal adrenal hypoplasia lowers the signals that start labor."],[5,"Which complication is typical of post-term pregnancy?",["Respiratory distress syndrome","Meconium aspiration and oligohydramnios","Polyhydramnios","Neonatal jaundice from immaturity"],1,"Placental aging leads to oligohydramnios, meconium passage and fetal distress."],[6,"SGA / IUGR fetus is defined by estimated fetal weight below the:",["50th centile","25th centile","10th centile","90th centile"],2,"EFW below the 10th centile for gestational age."],[6,"Asymmetrical IUGR is usually caused by:",["Chromosomal anomalies","Early congenital infection","Uteroplacental insufficiency","Genetic small stature"],2,"Late placental insufficiency causes head sparing with a small abdominal circumference."],[6,"Which umbilical artery Doppler finding is most ominous?",["Normal end-diastolic flow","Reduced S/D ratio","Absent or reversed end-diastolic flow","High diastolic flow"],2,"AEDF/REDF indicates severe placental resistance and fetal compromise."],[7,"Fetal macrosomia is usually defined as birth weight above:",["3000 g","3500 g","4000 g","2500 g"],2,"Commonly > 4000 g (some use > 4500 g)."],[7,"The most important maternal risk factor for macrosomia is:",["Preeclampsia","Diabetes mellitus","Anemia","Smoking"],1,"Maternal hyperglycemia leads to fetal hyperinsulinemia and overgrowth."],[7,"The first maneuver in shoulder dystocia is usually:",["Zavanelli maneuver","McRoberts maneuver with suprapubic pressure","Fundal pressure","Cleidotomy"],1,"McRoberts (hyperflexion of maternal thighs) plus suprapubic pressure. Fundal pressure is avoided."],[8,"In twins, the lambda (twin peak) sign on US indicates:",["Monochorionic","Dichorionic","Monoamniotic","Conjoined twins"],1,"Lambda sign = dichorionic. T sign = monochorionic diamniotic."],[8,"Twin-to-twin transfusion syndrome occurs in:",["Dichorionic diamniotic twins","Monochorionic diamniotic twins","Dizygotic twins only","Triplets only"],1,"Shared placenta with vascular anastomoses in monochorionic twins."],[8,"The most common presentation of twins in labor is:",["Vertex – vertex","Breech – breech","Transverse – transverse","Vertex – transverse"],0,"Both vertex is the most common combination."],[8,"Monoamniotic twins result when the embryo divides at:",["Day 0–3","Day 4–8","Day 8–12","After day 13"],2,"8–12 days = monochorionic monoamniotic. After 13 days = conjoined."],[9,"After delivery of an Rh-positive baby to an Rh-negative non-sensitized mother, anti-D should be given within:",["24 hours","72 hours","2 weeks","6 weeks"],1,"Anti-D immunoglobulin within 72 hours of delivery."],[9,"The test that measures the volume of fetomaternal hemorrhage is:",["Coombs test","Kleihauer–Betke test","Apt test","Nitrazine test"],1,"Kleihauer–Betke counts fetal red cells in maternal blood to adjust the anti-D dose."],[9,"Non-invasive detection of fetal anemia uses:",["Umbilical artery S/D ratio","Middle cerebral artery peak systolic velocity","Uterine artery notch","Ductus venosus a-wave"],1,"Raised MCA-PSV (>1.5 MoM) suggests moderate–severe fetal anemia."],[9,"Why is the first Rh-positive pregnancy usually unaffected?",["IgM antibodies do not cross the placenta","IgG crosses only in the first pregnancy","The fetus has no D antigen","Anti-D is given routinely"],0,"Primary response is IgM, which does not cross. Later IgG does cross."],[10,"Spalding sign of fetal death is:",["Gas in the fetal aorta","Overlapping of fetal skull bones","Exaggerated flexion of the spine","Halo sign around the head"],1,"Overlapping skull bones from loss of brain tissue tone, seen after several days."],[10,"A serious maternal complication when a dead fetus is retained for weeks is:",["Polyhydramnios","DIC (hypofibrinogenemia)","Hypertension","Placenta previa"],1,"Thromboplastin release may cause DIC, especially after ~4 weeks."],[10,"The definitive diagnosis of IUFD is by:",["Absent fetal movements","Negative pregnancy test","Ultrasound showing absent fetal cardiac activity","Decrease in fundal height"],2,"Real-time US confirms absent heart activity."],[11,"Late decelerations on CTG indicate:",["Head compression","Cord compression","Uteroplacental insufficiency","Normal fetal sleep"],2,"Late decelerations reflect fetal hypoxia from uteroplacental insufficiency."],[11,"A fetal scalp blood pH indicating need for delivery is:",["7.35","7.30","< 7.20","7.25–7.30"],2,"pH < 7.20 = acidosis, deliver. 7.20–7.25 borderline, repeat."],[11,"Which is NOT part of intrauterine resuscitation?",["Left lateral position","Stop oxytocin","Oxygen and IV fluids","Increase oxytocin rate"],3,"Oxytocin must be stopped. Increasing it worsens hypoxia."],[12,"Raised maternal serum AFP is mostly associated with:",["Down syndrome","Open neural tube defects","Trisomy 18","Turner syndrome"],1,"Open NTDs leak AFP. Low AFP suggests Down syndrome."],[12,"Genetic amni ate, respiration, muscle tone, reflex irritability, color."],[18,"Brandt–Andrews method is:",["Fundal pressure to deliver the placenta","Controlled cord traction with suprapubic counter-pressure","Manual removal of placenta","Bimanual compression"],1,"Traction on the cord while the other hand pushes the uterus upward to prevent inversion."],[19,"The 3 main factors of labor (3 Ps) are:",["Power, passage, passenger","Pain, pulse, pressure","Placenta, pelvis, position","Parity, progress, presentation"],0,"Abnormality in any of power, passage or passenger can cause abnormal labor."],[19,"The most common malpresentation at term is:",["Face","Brow","Breech","Shoulder"],2,"Breech occurs in about 3–4% of term pregnancies."],[19,"Occipito-posterior position is considered a:",["Malpresentation","Malposition","Normal position","Malattitude only"],1,"Vertex is a normal presentation. OP is an abnormal position (malposition)."],[19,"The normal presentation and position at term is:",["Vertex, occipito-anterior","Vertex, occipito-posterior","Face, mento-anterior","Breech, sacro-anterior"],0,"Longitudinal lie, flexed vertex, occiput anterior."],[20,"The most common occipito-posterior position is:",["LOP","ROP","Direct OP","LOT"],1,"ROP is more common, because the sigmoid colon occupies the left posterior pelvis."],[20,"In persistent OP with vaginal delivery, the head delivers:",["Face to pubis","Face to sacrum","By extension only","As a brow"],0,"The occiput stays posterior and the head delivers face to pubis."],[20,"On abdominal exam in OP, a typical finding is:",["Fetal back easily felt anteriorly","Flattening below the umbilicus with fetal limbs felt anteriorly","Head felt in the fundus","Empty lower uterus"],1,"Back is posterior, so the lower abdomen looks flat and limbs are felt."],[21,"The denominator in face presentation is the:",["Occiput","Sacrum","Mentum (chin)","Frontal bone"],2,"Mentum (chin)."],[21,"Persistent mento-posterior face at term with a living fetus is managed function totals(){

/* Folds old, low-value entries into S.base so the saved document stays small. Units, bosses and skills are kept. */
function compact(){
  if(S.entries.length<=700)return;
  const cut=dayKey(daysAgo(45)),keep=[];
  S.entries.forEach(e=>{
    if(e.day<cut&&e.kind!=='unit'&&e.kind!=='boss'&&e.kind!=='skill'){

function countsByDay(){const c={};for(const e of S.entries)if(e.kind==='quest'||e.kind==='dungeon')c[e.day]=(c[e.day]||0)+1;return c;}
function streakBefore(){

function streakNow(){const c=countsByDay();return streakBefore()+((c[dayKey()]||0)>=3?1:0);}

async function connect(){
  try{
    if(!window.claude||!window.claude.use){setSync('local','محفوظ على الجهاز');return;}
    const db=await window.claude.use('db');
    const user=await window.claude.use('user');
    const id=user?await user.id():null;
    if(!db||!id){setSync('local','محفوظ على الجهاز');return;}
    ctx.db=db;ctx.uid=id;onlineInit();hubInit();
    if(user)user.isOwner().then(o=>{live.isOwner=!!o;rerenderOnline();if(o)schedHub();}).catch(()=>{});
    const ref=db.doc('data/users/'+id+'/state');
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('t')),7000));
    const snapd=await Promise.race([ref.get(),timeout]);
    if(snapd.exists){
      const remote=snapd.data();
      if((remote.rev||0)>(S.rev||0)){
        S=remote;migrate();
        try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
        ctx.ref=ref;render();
      }else{ctx.ref=ref;if(S.rev>0)dirty=true;}
    }else{ctx.ref=ref;if(S.rev>0)dirty=true;}

}
function tick(){
  liveTick();
  if(ui.day!==dayKey()){ui.day=dayKey();render();return;}
  const t=S.timer;if(!t)return;
  const left=t.end-Date.now();
  if(left<=0){finishGate();return;}
  const ar=$('#ringArc'),tm=$('#ringTime');
  if(ar){const circ=2*Math.PI*104;ar.style.strokeDashoffset=(circ*(1-(1-left/(t.end-t.start)))).toFixed(1);}
  if(tm){const s=Math.ceil(left/1000);tm.textContent=z2(Math.floor(s/60))+':'+z2(s%60);}
}

/* ---------- views ---------- */
function bar(cur,need,c){return '<div class="bar" style="--c:'+(c||'var(--glow)')+'"><b style="width:'+Math.max(2,Math.min(100,cur/need*100)).toFixed(1)+'%"></b></div>';}

function radar(T){
  const cx=150,cy=125,R=86;
  const lv=STATS.map(s=>lvl(T.s[s.id],needStat).l);
  const cap=Math.max(5,Math.max.apply(null,lv)+1);
  const ang=i=>-Math.PI/2+i*2*Math.PI/5;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  const poly=f=>STATS.map((s,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  let g='';
  [1/3,2/3,1].forEach(f=>{g+='<polygon points="'+poly(f)+'" fill="none" stroke="rgba(94,194,255,.22)" stroke-width="1"/>';});
  STATS.forEach((s,i)=>{const p=pt(i,R);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(94,194,255,.18)"/>';});
  const dp=STATS.map((s,i)=>pt(i,R*lv[i]/cap).map(v=>v.toFixed(1)).join(',')).join(' ');
  g+='<polygon points="'+dp+'" fill="rgba(94,194,255,.24)" stroke="#5ec2ff" stroke-width="2" filter="url(#gl)"/>';
  STATS.forEach((s,i)=>{const p=pt(i,R*lv[i]/cap);g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+s.c+'"/>';});
  STATS.forEach((s,i)=>{
    const p=pt(i,R+24);
    g+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:3)).toFixed(1)+'" text-anchor="middle">'+s.name+'</text>';
    g+='<text class="nn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:3)+15).toFixed(1)+'" text-anchor="middle">'+lv[i]+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 300 262" role="img" aria-label="مخطط القدرات"><defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+g+'</svg>';
}

const SKN={};
SKT.forEach(b=>b.nodes.forEach(n=>{SKN[n.id]=n;n.b=b.id;}));
const skDone=id=>!!(S.sk[id]&&S.sk[id].done);
function skStatus(n){return skDone(n.id)?'done':n.req.every(skDone)?'open':'locked';}
function toggleStep(id,i){
  const n=SKN[id];if(!n||skStatus(n)!=='open')return;
  const k=S.sk[id]||(S.sk[id]={st:[],note:'',done:0});
  k.st[i]=!k.st[i];save();render();
}
function masterSkill(id){
  const n=SKN[id];if(!n||skStatus(n)!=='open')return;
  const k=S.sk[id]||{st:[]};
  if(!n.steps.every((_,i)=>k.st&&k.st[i])){toast('خلّص كل الخطوات الأول');return;}
  const before=snap(),b=SKT.find(x=>x.id===n.b);
  S.sk[id]={st:n.steps.map(()=>true),note:ui.skNote.trim().slice(0,300),done:Date.now()};
  S.entries.push({id:uid(),day:dayKey(),ts:Date.now(),kind:'skill',sid:id,stat:b.stat,xp:n.xp,gold:Math.round(n.xp/2),label:'اتقنت: '+n.t});
  ui.skNote='';
  queue.push({k:'[ إشعار النظام ]',t:'مهارة جديدة اتقنتها',b:'+'+n.xp,s:n.t});
  save();render();celebrate(before);
}
function undoSkill(id){
  const i=S.entries.findIndex(e=>e.kind==='skill'&&e.sid===id);if(i>=0)S.entries.splice(i,1);
  if(S.sk[id])S.sk[id].done=0;
  save();render();toast('اتلغى إتقان المهارة');
}

/* ---------- money ledger ---------- */
const LT={out:'مصروف',in:'دخل',save:'توفير',inv:'استثمار'};
const LSUB={out:['أكل','مواصلات','سكن','دراسة','اشتراكات','ترفيه','المشروع','أخرى'],in:['راتب','شغل جانبي','أخرى'],save:['طوارئ','عام'],inv:['أسهم','ذهب','شهادات','أخرى']};
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const monthOf=k=>k.slice(0,7);
function ledgerSum(mk){
  const o={in:0,out:0,save:0,inv:0,nonSalary:0,cats:{}};
  S.ledger.forEach(t=>{
    if(monthOf(t.day)!==mk)return;
    o[t.type]+=t.amt;
    if(t.type==='in'&&t.sub!=='راتب')o.nonSalary+=t.amt;
    if(t.type==='out')o.cats[t.sub]=(o.cats[t.sub]||0)+t.amt;
  });
  return o;
}
function efInfo(){
  const saved=S.ledger.filter(t=>t.type==='save'&&t.sub==='طوارئ').reduce((a,t)=>a+t.amt,0);
  const mons={};
  S.ledger.forEach(t=>{if(t.type==='out'){const m=monthOf(t.day);mons[m]=(mons[m]||0)+t.amt;}});
  const keys=Object.keys(mons).sort().slice(-3);
  const avg=keys.length?keys.reduce((a,k)=>a+mons[k],0)/keys.length:0;
  return {saved,avg,target:avg*3};
}
function addTx(){
  const amt=parseFloat(ui.lAmt);
  if(!(amt>0)){toast('اكتب مبلغ صحيح');return;}
  const before=snap(),today=dayKey();
  const tx={id:uid(),day:ui.lDay?dayKey(daysAgo(1)):today,ts:Date.now(),type:ui.lType,sub:ui.lSub,amt:Math.round(amt*100)/100,note:ui.lNote.trim().slice(0,40)};
  S.ledger.push(tx);
  if(S.ledger.length>700)S.ledger=S.ledger.slice(-700);
  if(S.entries.filter(e=>e.kind==='ledger'&&e.day===today).length<3){
    const xp=(tx.type==='save'||tx.type==='inv')?10+Math.min(40,Math.floor(tx.amt/100)):5;
    S.entries.push({id:uid(),day:today,ts:Date.now(),kind:'ledger',lid:tx.id,stat:'money',xp,gold:Math.round(xp/2),label:'سجّلت '+LT[tx.type]+': '+tx.sub});
    gainToast(xp,Math.round(xp/2));
  }
  ui.lAmt='';ui.lNote='';ui.lForm=false;
  save();render();celebrate(before);
}
function delTx(id){
  const i=S.ledger.findIndex(t=>t.id===id);if(i<0)return;
  S.ledger.splice(i,1);
  const j=S.entries.findIndex(e=>e.kind==='ledger'&&e.lid===id);if(j>=0)S.entries.splice(j,1);
  ui.delL=null;save();render();toast('اتحذفت العملية');
}

  return Math.max(best,S.army.bestStreak||0);

/* ---------- PvP: friends exchange "hunter cards" (codes). Duels compare this week's real effort per stat. ---------- */
const CARD_SALT='hunter-pvp-1';
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return decodeURIComponent(escape(atob(str)));}
function weekXp(){
  const since=dayKey(daysAgo(6)),w=STATS.map(()=>0);let W=0;
  S.entries.forEach(e=>{if(e.day>=since&&e.xp>0){W+=e.xp;const i=STATS.findIndex(x=>x.id===e.stat);if(i>=0)w[i]+=e.xp;}});
  return {w,W};
}
function myCard(){
  const T=totals(),A=lvl(T.xp,needAll),pw=power(),wk=weekXp();
  return {v:1,id:S.pvp.me,n:S.name,t:Date.now(),L:A.l,R:rankOf(A.l),P:pw.total,s:STATS.map(x=>lvl(T.s[x.id],needStat).l),w:wk.w,W:wk.W,k:streakNow(),a:pw.n,f:S.army.best||0,elo:S.pvp.elo};
}
function encodeCard(c){const j=JSON.stringify(c);return 'HNT1.'+b64e(j)+'.'+fnv(CARD_SALT+j);}
function decodeCard(txt){
  const m=/HNT1\.([A-Za-z0-9_-]+)\.([0-9a-f]+)/.exec(txt||'');
  if(!m)return {err:'مش لاقي كود كارت في النص ده. انسخ الرسالة كلها من صاحبك.'};
  let j,c;
  try{j=b64d(m[1]);c=JSON.parse(j);}catch(e){return {err:'الكود ناقص أو متلخبط. اطلب من صاحبك يبعته تاني.'};}
  if(fnv(CARD_SALT+j)!==m[2])return {err:'الكود اتعدّل بعد ما اتعمل، فمش هينفع يتضاف.'};
  const v=validCard(c);if(!v)return {err:'الكود مش بتاع نظام الصياد.'};
  if(v.t>Date.now()+864e5)return {err:'تاريخ الكارت في المستقبل، فمش هينفع يتضاف.'};
  return {card:v};
}
function validCard(c){
  const num=(x,max)=>typeof x==='number'&&isFinite(x)&&x>=0&&x<=max;
  const arr=(a,max)=>Array.isArray(a)&&a.length===5&&a.every(x=>num(x,max));
  if(!c||typeof c!=='object'||c.v!==1||typeof c.id!=='string'||c.id.length>20||typeof c.n!=='string'||!num(c.t,4e12)||!num(c.L,999)||!num(c.P,1e7)||!arr(c.s,999)||!arr(c.w,1e5)||!num(c.W,1e6)||!num(c.k,9999)||!num(c.a,999)||!num(c.f,9999))
    return null;
  return {v:1,id:c.id,n:c.n.slice(0,20)||'صياد',t:c.t,L:c.L,R:['E','D','C','B','A','S'].includes(c.R)?c.R:rankOf(c.L),P:c.P,s:c.s.slice(),w:c.w.slice(),W:c.W,k:c.k,a:c.a,f:c.f,elo:num(c.elo,4000)&&c.elo>=100?c.elo:1000};
}
function cardAge(c){return Math.floor((Date.now()-c.t)/864e5);}
function ageText(c){const d=cardAge(c);return d<=0?'الكارت من النهارده':d===1?'الكارت من امبارح':'الكارت من '+d+' أيام';}
function addFriend(){
  const r=decodeCard(ui.pvpPaste);
  if(r.err){toast(r.err);return;}
  const c=r.card;
  if(c.id===S.pvp.me){toast('ده كارتك انت. ابعته لصاحبك وخد منه كارته.');return;}
  const ex=S.pvp.friends[c.id];
  if(ex&&ex.card.t>=c.t){toast('عندك كارت أحدث من ده لنفس الصاحب');return;}
  if(!ex&&Object.keys(S.pvp.friends).length>=30){toast('وصلت للحد الأقصى: 30 صاحب');return;}
  S.pvp.friends[c.id]={card:c,added:ex?ex.added:Date.now()};
  if(Array.isArray(S.pvp.hubDel))S.pvp.hubDel=S.pvp.hubDel.filter(x=>x!==c.id);
  ui.pvpPaste='';save();render();
  toast(ex?'اتحدّث كارت '+esc(c.n):'اتضاف '+esc(c.n));
}
async function copyCard(){
  const c=myCard(),code=encodeCard(c);
  const msg='تحدّاني في نظام الصياد! خبرتي الأسبوع ده '+c.W+' وقوتي '+c.P+'.\nانسخ الرسالة دي كلها وحطها في تبويب الظلال، الأصدقاء:\n'+code;
  ui.showCode=msg;

  catch(e){toast('النسخ التلقائي ما اشتغلش. انسخ الكود من المربع');}
  render();

function duelResult(me,fr){
  const rounds=STATS.map((st,i)=>{
    let a=me.w[i],b=fr.w[i],by='w';
    if(a===0&&b===0){a=me.s[i];b=fr.s[i];by='s';}
    return {st,a,b,by,win:a>b?1:a<b?-1:0};
  });
  const my=rounds.filter(r=>r.win>0).length,th=rounds.filter(r=>r.win<0).length;
  let res=my>th?1:my<th?-1:0,tb='';
  if(!res){res=me.W>fr.W?1:me.W<fr.W?-1:0;tb='w';}
  if(!res){res=me.P>fr.P?1:me.P<fr.P?-1:0;tb='p';}
  return {rounds,my,th,res,tb};
}

  setTimeout(step,rm?0:500);
}
function record(fid){const ds=S.pvp.duels.filter(x=>x.fid===fid);return {w:ds.filter(x=>x.res>0).length,l:ds.filter(x=>x.res<0).length};}

function rng(seed){let a=parseInt(fnv(seed),16)>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}

  const fd=[];rows.forEach(x=>x.ev.forEach(e=>{if(e&&typeof e.l==='string')fd.push({n:x.n,l:e.l.slice(0,60),ts:nz(e.ts,4e12)});}));

}

   The owner relays cards into hub/cards (owner-write). Any signed-in viewer who can open the page can read it. */
live.hub={};live.isOwner=false;live.hubState='none';
let hubT=null,hubLast='';
function hubInit(){
  try{
    live.hubState='loading';
    ctx.db.doc('hub/cards').onSnapshot(sn=>{
      const d=sn.exists?sn.data():null;
      live.hub=d&&d.cards&&typeof d.cards==='object'?d.cards:{};live.hubState='ok';rerenderOnline();
    },()=>{live.hubState='err';rerenderOnline();});
  }catch(e){live.hubState='err';}
}
function schedHub(){if(!live.isOwner||!ctx.db)return;clearTimeout(hubT);hubT=setTimeout(pushHub,1500);}
async function pushHub(){
  if(!live.isOwner||!ctx.db)return;
  const cards={};
  Object.keys(live.hub).forEach(k=>{const v=validCard(live.hub[k]);if(v)cards[k]=v;});
  Object.keys(S.pvp.friends).forEach(k=>{const c=S.pvp.friends[k].card;if(!cards[k]||cards[k].t<c.t)cards[k]=c;});
  (S.pvp.hubDel||[]).forEach(k=>{if(!S.pvp.friends[k])delete cards[k];});
  const me=myCard();cards[me.id]=me;
  const out={};Object.keys(cards).sort((a,b)=>cards[b].t-cards[a].t).slice(0,100).forEach(k=>out[k]=cards[k]);
  const cmp=JSON.stringify(Object.assign({},out,{[me.id]:Object.assign({},me,{t:0})}));
  if(cmp===hubLast)return;
  try{await ctx.db.doc('hub/cards').set({cards:out});hubLast=cmp;}catch(e){}
}
function cardFromLeague(x){
  if(!x||typeof x!=='object')return null;
  return validCard({v:1,id:x.pid,n:x.n,t:x.t,L:x.L,R:x.R,P:x.P,s:x.s,w:x.w,W:x.W,k:x.k,a:x.a,f:x.f,elo:x.elo});
}
function network(){
  const M={};
  const put=(c,src,extra)=>{
    if(!c||!c.id||c.id===S.pvp.me)return;
    const x=M[c.id];
    if(!x)M[c.id]={card:c,src:[src]};
    else{if(c.t>x.card.t)x.card=c;if(!x.src.includes(src))x.src.push(src);}
    if(extra)Object.assign(M[c.id],extra);
  };
  Object.keys(live.hub).forEach(k=>put(validCard(live.hub[k]),'hub'));
  Object.keys(S.pvp.friends).forEach(k=>put(S.pvp.friends[k].card,'code'));
  Object.keys(live.league).forEach(k=>{if(k!==ctx.uid)put(cardFromLeague(live.league[k]),'online',{lid:k,ev:Array.isArray(live.league[k].ev)?live.league[k].ev.slice(0,5):[],dw:nz(live.league[k].dw,1e5),dl:nz(live.league[k].dl,1e5)});});
  others().forEach(p=>{const pid=p.presence.pid;if(typeof pid==='string'&&M[pid])M[pid].peer=p.peer;});
  return M;
}

/* ---------- guilds ---------- */
function members(gid){const m=F.gm[gid];return m&&typeof m==='object'?Object.keys(m):[];}

function wOf(u){const x=live.league[u];return x?nz(x.W,1e6):(u===uid()?weekXp().W:0);}
function nameOf(u,g){const x=live.league[u];if(x&&x.n)return nm(x.n);if(u===uid())return S.name;const m=g&&F.gm[g]&&F.gm[g][u];return nm(m&&m.n);}
function raid(g){const ms=members(g),hp=RAID_HP*Math.max(3,ms.length),dmg=ms.reduce((a,u)=>a+wOf(u),0);return {hp,dmg,ms,down:dmg>=hp};}
async function foundGuild(){
  const name=ui.gName.trim().slice(0,24),tag=ui.gTag.trim().toUpperCase().slice(0,4);

  try{

      +'<div class="barcap" style="margin:12px 0 5px"><span>الضرر</span><span>'+N(Math.min(r.dmg,r.hp)+' / '+r.hp)+'</span></div>'+bar(Math.min(r.dmg,r.hp),r.hp,'var(--bad)')
      +(r.down?'<p class="vlab ok" style="margin-top:12px">الزعيم اتهزم</p>':'<p class="hint" style="margin-top:12px">فاضل '+N(r.hp-r.dmg)+' خبرة علشان تهزموه.</p>')

        +(owner&&u!==me?'<div class="acts"><button class="btn sm'+(F.kick===u?' bad':'')+'" data-act="gkick" data-id="'+esc(u)+'">'+(F.kick===u?'تأكيد الطرد':'طرد')+'</button></div>':'')+'</div>';});
    h+='</section>';
    h+='<button class="btn bad block" data-act="gleave" style="margin-bottom:14px">'+(F.leaveG===g?(owner?'تأكيد حل النقابة نهائيًا':'تأكيد الخروج'):(owner?'حل النقابة':'اخرج من النقابة'))+'</button>';
  }else{

      +(ok?'':'<p class="hint">محتاج '+N(GUILD_COST-gold)+' ذهب كمان. الذهب بييجي من المهام والبوابات والأسئلة.</p>')
      +'<label class="lbl" for="gn" style="margin-top:0">اسم النقابة</label><input class="in" id="gn" maxlength="24" value="'+esc(ui.gName||'')+'">'

  gs.forEach((x,i)=>{h+='<div class="lb'+(x.k===g?' me':'')+'"><span class="pos'+(i===0?' g':'')+'">'+(i+1)+'</span><div><div class="nmx">'+esc(String(x.d.name||''))+'<span class="gtag">'+esc(String(x.d.tag||''))+'</span></div><div class="w">'+N(x.n+'/'+GUILD_MAX)+' عضو · المؤسس '+esc(nameOf(x.d.owner,x.k))+'</div></div><span class="num" style="font-weight:700;color:var(--glow)">'+x.W+'</span>'
    +(!g&&x.n<GUILD_MAX?'<div class="acts"><button class="btn sm fill" data-act="gjoin" data-id="'+esc(x.k)+'">انضم</button></div>':'')+'</div>';});
  h+='</section>';

/* ---------- player profile ---------- */
function openProfile(lid,pid){
  const me=uid();let x=null,c=null;

  const name=nm(src.n),W=nz(src.W,1e6),s=Array.isArray(src.s)?src.s:[1,1,1,1,1],w=Array.isArray(src.w)?src.w:[0,0,0,0,0];
  const sk=x&&Array.isArray(x.sk)?x.sk.filter(k=>SKN[k]):[],bs=x&&Array.isArray(x.bs)?x.bs.filter(k=>EXAMS0.find(e=>e.id===k)):[];

  const rc=pid&&!isMe?record(pid):null;
  let h='<div class="qzw"><div class="qzt"><div><div class="ptitle" style="margin-bottom:4px">بروفايل الصياد</div><div class="et" style="font-size:22px">'+esc(name)+(g?'<span class="gtag">'+esc(String(F.gd[g].tag||''))+'</span>':'')+'</div><div class="ed">الرتبة '+esc(String(src.R||'E'))+' · المستوى '+N(nz(src.L,999)||1)+' · <span style="color:'+dv[2]+'">'+dv[1]+'</span>'+(g?' · '+esc(String(F.gd[g].name||'')):'')+'</div></div><button class="btn sm" data-act="pfclose">إغلاق</button></div>';
  h+='<div class="tiles"><div class="tile"><div class="v num">'+nz(src.P,1e7)+'</div><div class="k">القوة</div></div><div class="tile"><div class="v num">'+(nz(src.elo,4000)||1000)+'</div><div class="k">تصنيف المبارزات</div></div><div class="tile"><div class="v num">'+nz(src.k,9999)+'</div><div class="k">أيام متتالية</div></div></div>';
  h+='<div class="tiles"><div class="tile"><div class="v num">'+W+'</div><div class="k">خبرة الأسبوع</div></div><div class="tile"><div class="v num">'+nz(src.a,999)+'</div><div class="k">جيش الظلال</div></div><div class="tile"><div class="v num">'+nz(src.f,9999)+'</div><div class="k">أعلى طابق</div></div></div>';
  const mx=Math.max(1,...s.map(v=>nz(v,999)));
  h+='<section class="panel"><div class="ptitle">القدرات</div>'+STATS.map((st,i)=>'<div class="statrow"><span class="n">'+st.name+'</span>'+bar(nz(s[i],999),Math.max(5,mx+1),st.c)+'<span class="lv num" style="color:'+st.c+'">'+nz(s[i],999)+'</span></div><div class="w" style="font-size:12px;color:var(--mute);margin:2px 0 0;padding-inline-start:80px">خبرة الأسبوع: '+nz(w[i],1e5)+'</div>').join('')+'</section>';
  if(bs.length)h+='<section class="panel"><div class="ptitle">زعماء اتهزموا</div><ul class="log">'+bs.map(k=>{const e=EXAMS0.find(z=>z.id===k);return '<li><span>'+esc(e.title)+' · '+esc(e.sub.split(':')[0])+'</span></li>';}).join('')+'</ul></section>';
  h+='<section class="panel"><div class="ptitle">مهارات اتقنها<span class="sp"></span><span class="side">'+N(sk.length+'/'+Object.keys(SKN).length)+'</span></div>'+(sk.length?'<ul class="log">'+sk.map(k=>'<li><span>'+esc(SKN[k].t)+'</span><span class="w">'+esc(SKT.find(b=>b.id===SKN[k].b).name)+'</span></li>').join('')+'</ul>':'<p class="hint" style="margin:0">لسه ما اتقنش مهارات.</p>')+'</section>';
  if(ev.length)h+='<section class="panel"><div class="ptitle">آخر الإنجازات</div><ul class="log">'+ev.slice(0,8).map(e=>'<li><span>'+esc(String(e.l||'').slice(0,60))+'</span><span class="w">'+agoText(nz(e.ts,4e12))+'</span></li>').join('')+'</ul></section>';
  if(rc&&(rc.w||rc.l))h+='<p class="hint">مبارزاتك ضده: '+N(rc.w)+' فوز، '+N(rc.l)+' خسارة</p>';
  if(pid&&!isMe&&network()[pid])h+='<button class="btn fill block" data-act="pfduel" data-id="'+esc(pid)+'">بارزه بالكارت</button>';
  if(!x)h+='<p class="hint">ده كارت متضاف بالكود، فبيانات الإنجازات مش ظاهرة.</p>';
  h+='</div>';
  pf.innerHTML=h;pf.classList.add('on');document.body.style.overflow='hidden';pf.scrollTop=0;
}
function closeProfile(){pf.classList.remove('on');pf.innerHTML='';document.body.style.overflow='';}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'srenter':enterRoom();break;
    case 'srleave':leaveRoom();break;
    case 'gfound':foundGuild();break;
    case 'gjoin':joinGuild(id);break;
    case 'gleave':leaveGuild();break;
    case 'gkick':kick(id);break;
    case 'graid':claimRaid();break;
    case 'prof':openProfile(id||'',b.dataset.v||'');break;
    case 'pfclose':closeProfile();break;
    case 'pfduel':closeProfile();ui.tab='army';ui.armySub='net';startDuel(id);break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='gn')ui.gName=t.value;else if(t.id==='gt'){t.value=t.value.replace(/\s/g,'').toUpperCase();ui.gTag=t.value;}});
render();
})();
</script>
</body>
