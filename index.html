l picture and diagnosis of endometrial causes of infertility","C/P: •infertility & RPL → uterine congenital anomalies •amenorrhea& infertility→ uterine hypoplasia\n•bleeding, pain , infertility, discharge , swelling, pressure symptoms→ fibroids\nDiagnosis : US, hysteroscopy, HSG , premenstrual endometrial biopsy","g5",5,"P"],[112,"Diagnostic and therapeutic uses of ultrasound in gynecology",", uses of US in gyna\nDiagnostic Therapeutic\nTubes Saline sono- hysterography Break thin adhesions\nOvary Folliculometry Ovum pick up in IVF\nUterus Pathology in ovary / uterus Aspiration of ovarian cysts","g5",6,"P"],[112,"Diagnostic and therapeutic effect of hysteroscopy","Diagnostic Therapeutic\nTubes Tubal block (assess the cornu) Tubal cannulation\nUterus Fibroid , Septum,Asherman $ Polypectomy , Adhesiolysis, Septo-metro-plasty","g5",6,""],[113,"Mention treatment of female infertility","1- General: stress, reassurance, improve General health\n2-if ovarian cause: •Anovulation: induction of ovulation / laparoscopic drilling\n•Hyperprolactinemia: cabergoline •LPD (CLI): progesterone in 2nd half of cycle\n•Resistant ovary syndrome: induction by high doses HMG\n3-If Endometriosis: •Induction of ovulation → if tubes are patent (as proved by HSG)\n•laparoscopy → chocolate cyst aspiration ± tuboplasty\n4-If tubal: tuboplasty (microsurgery):•Peritubal adhesiolysis→ best prognosis\n•Neosalpingostomy→ new opening (as in hydrosalpinx)\n•Laparoscopy is better than laparotomy •Assisted reproductive techniques.\n5-If uterine cause: •Polypectomy, myomectomy\n•Hysteroscopic lysis of adhesions in Ascherman syndrome\n•Metroplasty / septoplasty if congenital septum is present\n6-If cervical causes: •cx infection: antibiotic or cx cauterization •Failure/resistant cases: IUI\n7-In all cases: if failed→ IVF OR ICSI","g5",6,"PI"],[112,"Standard guidelines for collection of semen","•Standard guidelines for collection of semen: -There should be 2 to 7 days of sexual abstinence before collection\n-2 separate samples at least 7 days apart should be analyzed, duration of abstinence should be constant\n-Masturbation in a clinical setting is recommended procedure. -Collection: Private room in same centre where semen will be analyzed\n-Pre warmed (21°C), sterile, non-toxic, wide-mouth container.","g5",6,""],[112,"Investigations of cervical factor infertility","•History:previous cx operation(amputation,cauterization),Chronic cerviciti\n•Cervical mucous evaluate: detect volume, viscosity, Thread, Ferning, cellularity\n•Post-coital test (good if > 5 motile sperms/hpf in cervical mucus)\n•Bacteriological exam. for infection, detection of antibodies in cervical mucous (IgA)\n•Vaginal factor: History of Vaginitis (discharge, pruritus vulvae), Vaginal septum (cryptomenorrhea)\nOvulation induction , enumerate drugs used to induce ovulation","g5",6,"P"],[113,"Ovulation induction with clomiphene citrate","•Action: -Synthetic non-steroidal antiestrogen (clomid: 50 mg tab)\n-It blocks-ve feedback of E on FSH → follicular growth and ↑ E2 levels.\n•Dose: -1x2x5 starting from 5th\n(or 2nd ) day of cycle for 4-6 cycles\n-If amenorrhea → give progesterone,withdrawal bleeding,then start\n-If no ovulation → ↑ dose (150 mg/day maximum)\n•Side effect:-Hot flushes, dry vagina, breast tenderness, headache, visual disturbance\n-Multiple pregnancy (5-10%) & OHSS → rare (<1%)\n•Results:-Good response (75%) known by BBT, folliculometry & P>10ng/ml\n-No response (CC failure or resistance) if: a)Another cause of infertility b)Poor cervical mucous (anti-E2 effect): add small dose E2 at ovulation c)LPD → give HCG or progesterone\n-If failed, may add the following a)Metformin only in PCO patients with proven insulin resistance b)Bromocriptine , Thyroxin , Dexamethasone→adrenal androgen c)Nalotrexone (opioid receptor blocker); as opioids↓ GnRH\n•Other ovulation inducing agents: -Letrozole (aromatase Inhibitor)\n-Tamoxifen (Nolvadex) another SERM → 10 mg/12 hrs a)They block conversion of testosterone to estradiol (E2) b)Higher cumulative birth rate than clomid (especially in obese)","g5",7,""],[113,"Ovulation induction with human menopausal gonadotrophin (HMG)","•Preparation (IM/SC) a) Postmenopausal urine\n-Both FSH (150 IU) & LH (75 IU)→ Merional /\nFostimon\n-Purified FSH (150 IU) & LH (< 1 IU) b)Recombinant: FSH (150 IU) & LH (no) →\nPuregon, Gonal F\n•Dose: 1-2 amp on 3rd day of cycle repeated on days 5, 7, 9 (Step up or step down). HCG is given according to folliculometry & serum E2\n•Response: Ovulation in > 90%. ttt is continued for 3-4 cycles\n•Side effects : twins (20%), abortion & PTL\n(15%), EP (5%) & OHSS (2%)\n•Indications : hypothalamic pituitary failure, unexplained infertility & IVF","g5",7,""],[113,"GnRH agonists in ovulation induction","•in small repeated doses (S.C. or nasal spray)→ follicular maturation. Used in hypothalamic amenorrhea with normal pituitary. No OHSS or twins but expensive & difficult (needs pump)\n•in large dose (long acting)→ down regulation of hypothalamic receptors →↓FSH/LH. Used in IVF to prevent premature ovulation by LH suppression","g5",7,""],[113,"HCG in ovulation induction","•Preparation (IM/SC)\n- Pregnant urine →Choriomon, Pregnyl, Profasi\n-Recombinant DNA → Ovidrel\n•Action: acts as LH →5.000-10.000 IU IM when\nGF is mature (20 mm) or E2 is 1000-1500 pg/ml\n(not given if > 2000 to avoid OHSS). Advice intercourse on same & next day of injection","g5",7,""],[113,"Pathogenesis of ovarian hyperstimulation syndrome (OHSS)","•It is ovarian hyperstimulation (by FSH mainly & rarely clomid) & occurs Only after injection of HCG (3-6 days after injection)\n•HCG→ release of PGs, E, histamine & vascular epithelium growth factor→↑ capillary permeability (potentially fatal).\n•Spontaneous regression in 10-14 days (self-limiting), but may take longer if implantation occurs (worser prognosis)","g5",8,""],[113,"Mention grades of OHSS","Mild Moderate Severe\nOvary •5 cm x 5 cm •E2> 1500 pg/ml\n•P > 30 ng/ml\n12 x12 Large cysts\nAbdomen Distension, vomiting, diarrhea\nAscites, pleural / pericardial effusion\nGeneral weight ≥ 3 kg (early sign)  Na, ↑K, oliguria, hemoconcentration, thrombosis or DIC","g5",8,"I"],[113,"Mention treatment of OHSS","1-Prophylaxis (best ttt): -Withhold HCG injection if: • E2 is > 1500 pg/ml\n•2 follicles each ≥ 17 mm.\n-Also, IV albumin, corticosteroids, dopamine agonists are tried.\n2-Mild form: no ttt (rest at home + frequent follow-up)\n3-Moderate & severe: Hospitalization (even in ICU): bed rest (no PV), fluid chart, follow up\n(vital data, hematocrit, BUN, creatinine & US)\n• A: Anti PG, antihistaminics, albumin, anticoagulants\n•P: Paracentesis, no laparotomy (only if complicated cysts) •C: Colloid support, cabergoline\n•D: Dialysis (in renal failure), No diuretics (↑ hemoconcentration)","g5",8,"I"],[113,"Mention management of unexplained infertility","1. Reevaluation of both partners by: •laparoscopy / hysteroscopy •chlamydia antibodies\n•cervical mucous assessment •repeat computerized semen analysis.\n2. Induction protocols with HMG, IUI for at least 3 cycles.\n3. IVF & ICSI (last resort with good prognosis).","g5",8,""],[114,"Assisted reproductive technology (ART): intrauterine insemination (IUI)","Intrauterine insemination (IUI)\nIn Vitro Fertilization & Embryo Transfer (IVF & ET) Intracytoplasmic sperm injection-ICSI-\n•Indications: coital factor (failure of deposition), subfertility, cervical hostility, unexplained infertility & Artificial insemination donor\n(unreligious)\n•Technique\n1.Induction ovulation by FSH (better results)\n2. Injection of 0.3-0.8 ml intrauterine (IUI) by a special catheter\n•Success rate is limited\n(15%); so repeated for further 2 trials","g5",9,"P"],[114,"Assisted reproductive technology (ART): IVF and embryo transfer","•Indications: 1.Tubal & Peritoneum factors : endometriosis\n2. Male infertility , unexplained infertility, hostile cervix after failed IU\n•Technique:1. Superovulation start by Down-regulation by GnRH agonists either: -Long protocol→starts day 21 of previous cycle\n-Short protocol (flare up→starts within same cycle\n-GnRH antagonist can be used as Cetrorelix.\n-Then induce ovulation by hMG & follow up by folliculometry\n-Give hCG trigger (IM) complete ovum maturation within 34-36 hr\n2. Oocyte (pick-up) retrieval by TVS under anesthesia\n3. Fertilization in vitro: ova are incubated in a culture for 4-6 sperms are added → fertilized egg reaches 4-8 cell stage (in 48 h)\n4. Embryo transfer of 2-3 embryos near fundus & remaining embryos are frozen (cryo-preservation) for later use\n5. Luteal phase support: progesterone (oral or vaginal suppository)\n•Results (repeat for 3-4 cycles)\n-Pregnancy rate is 20-30% (25 y) - 10% (40 y) per treatment cycle\n-Multiple pregnancy (35%) & Ectopic pregnancy (3%)","g5",9,"P"],[114,"Assisted reproductive technology (ART): ICSI","•Technique: single sperm is injected into cytoplasm of metaphase II oocyte. In obstructive azoospermia, do\nMESA (microinsemination after epididymal sperm aspiration) or TESA\n(testicular sperm aspiration)\n•Indications:\nFailure of IVF , Refractory unexplained infertility , Marked oligospermia / asthenospermia\n•Success rates 25-40%, depending on age, quality of oocyte, cause ,Obesity technique & doctor experience","g5",9,""],[114,"Preimplantation genetic diagnosis (PGD) and its indications","•Done in IVF cycles by opening of Zona & remove cells for study. Then transfer of selected normal embryos on day 5.\n•Indications: a- Detection of chromosomal abnormalities: 13, 18 & 21 b- Recurrent implantation failure. c- Sex selection.","g5",9,""],[113,"Mention management of male infertility","1-General: stop smoking, use of vitamins & antioxidants, treat impotence. 2-Hormonal: clomiphene citrate (CC) or HMG\n3-Surgical: varicocelectomy (no significant improvement) 4-ART: IUI-IVF/ET-ICSI (in severe oligo-asthenospermia)","g5",9,""],[114,"Complications of assisted reproduction","•OHSS (Ovarian hyperstimulation syndrome)\n•Ovum retrieval complications (anesthesia complications, pelvic vessels injury, infection(\n•Higher incidence of abortion, multiple pregnancy, ectopic pregnancy •Psychological frustration in failed cases","g5",9,"P"],[112,"Etiology of female sexual dysfunction","•Organic: disease (causing dyspareunia) , Local (circumcision) , obesity\n•Psychological & personal: Developmental or Affective factors","g5",10,""],[112,"Clinical entities of female sexual dysfunction","1. Dyspareunia\n2. Vaginismus: (commonest cause of dyspareunia): reflex spasm of vaginal sphincter & levator ani on any attempt of sexual intercourse or PV\n•Types: 1ry (psychological), 2ry (pathology ,a protective response)\n•ttt: Psychotherapy , sexual education gradual dilation of vagina & Fenton operation → midline incision to be sutured transversely\n3. Frigidity: libido → Education & methyl testosterone (5 mg/day) may help\n4. Anorgasmia: failure to achieve orgasm (5-48% in circumcised):\n•1ry those who never experienced orgasm •2ry-transient (as in pregnancy)","g5",10,""],[101,"Causes of abnormal sexual differentiation","Disorders of gonadal development\n1-True hermaphrodite\n•Gonads → both testicular & ovarian tissues are present\n•External genitalia → ambiguous\n2-Gonadal dysgenesis: •Turner syndrome\n•Pure gonadal dysgenesis: 46xy (Swyer $) or rarely 46 xx, streaked gonad & infantile female internal & external genitalia.\n•Noonan $: Autosomal dominant, 46xy or 46 xx, Turner-like (with characterstic pulmonary stenosis)\nDisorders of fetal endocrinology\n1-Female pseudohermaphrodite\n(partial virilized females)\n•Congenital adrenal hyperplasia\n(Adreno-genital syndrome)\n•Aromatase deficiency\n•↑androgen during pregnancy (drug intake, or maternal disease)\n2-Male pseudohermaphrodite (Incomplete virilized males)\n•Androgen insensitivity syndrome\n•5-Reductase deficiency (46xy)\n•Testosterone biosynthesis deficiency\n•Gonadotrophin-resistant testes\n•Anti-Mullerian hormone deficiency","g5",10,""],[101,"Congenital adrenal hyperplasia: cause, types, diagnosis and treatment","•Failure to form cortisol from 17-OH progesterone due to deficient 21-hydroxylase or 11B- hydroxylase → ↑ACTH→ adrenal cortex hyperplasia and ↑androgen\n•Two types: 1. Juvenile onset (salt losing)→ virilization of female fetus + infantile genitalia\n2. Adult onset: normal child, armenorrhea + virilization after puberty\n•Diagnosed by ↑17OH-P > 200 ng/dl\n•ttt: prednisolone for life (to ACTH) + surgical correction of vulva","g5",10,""],[101,"Management of ambiguous genitalia","1-History: Maternal exposure to androgen, Family history (congenital adrenal hyperplasia)\n2-Physical examination: •Measure stretched phallus (Normal clitoris < 1cm & Normal penis 2.8-4.2)\n•Inspection: urethral site, Labioscrotal fold fusion •Palpation, Gonads, PR (palpable cervix)\n3-inv:\n•Karyotype: -Buccal smear (Barr body) in 50% only, Females are Barr (chromatin) +ve while male -ve\n-Examination of neutrophils-in 25% only -Chromosomal culture: Skin, blood or bone marrow\n•Hormonal profile: estrogen, testosterone, DHEA-S, 17-OH P levels, cortisol\n•Endoscopy: laparoscopy, histological examination of gonads\n•Imaging: U/S, CT, MRI of ovary & adrenal gland to diagnose a tumor\n4-Treatment: •Gender determination depends on External genitalia & Sex of rearing\n•External genitalia: plastic surgery → Best age is > 3 y & artificial neo-vagina postponed till marriage\n•Gonadectomy: if there is Y cell line •HRT\n•Emergency situation; correction of salt losing form of CAH","g5",11,""],[112,"Physiology of sexual activity","Physiology of Sexual Activity: 1-Stimulation of sexual excitement:\n•Psychological: Pre-coital petting→ ↑amphetamines → euphoria\n•Physical: senses (visual, auditory) & touch of sensitive organs (nipples, clitons)\n2-Physiological response (autonomic):\n•Excitement phase (longest phase): -vulva: Contraction of Ischio-cavernosus (erection of clitoris) & Bulbo-spongiosus (↑ tone of vaginal introitus) + ↑ secretions (lubrication)\n-Vagina (moist), uterus (pulled up), breasts (erected)\n•Plateau phase: maintenance of excitement, longer time in female>male\n•Orgasm (crescendo or climax→shortest phase & ends by male ejaculation: Rhythmic contractions of the vaginal wall, pelvic floor & sense of pleasure\n•Resolution (postcoital) phase→accompanied by sweating & relaxation\n•Refractory period: minutes to hours, only in males, as females have no ejaculation)","g5",11,""],[100,"Anatomy of the vulva and its lymphatic drainage","Anatomy: •mons pubis •labia majora &minora •clitoris •vestibular bulbs\n•vestibule:area bet 2 minora, receiv opening of ext meatus, skene gland, vaginal orifice, Bartholin duct\n•ext urethral meatus: skene’s gland open in its floor •hymen: annular (commonest)\n•bartholin glands: in post 1/3 of vestib bulb, 2-3cm, open at 5,7 o’clock, alkaline secretion\nLymph: lymphatic crossing →inguinofemoral LN (clitoris send to LN of cloquet)","g5",12,""],[100,"Sources of vaginal secretion","Sources vaginal secretion (no vaginal glands)1-cervix 2-vaginal transudate 3-bartholin glands","g5",12,""],[100,"Blood supply of the vagina","Blood supply of vaginal (rich , all originate from internal iliac artery)\n•vaginal artery (main blood supply) •middle & inferior rectal •internal pudendal\n•uterine artery branches (circular artery of cervix, descending cervical artery)","g5",12,""],[100,"Vaginal support","•attachment to cervix •cervical ligaments •levator ani\n•direction of vaginal axis backwards","g5",12,""],[100,"Anatomy of the uterus","•Structure: Hollow pear shaped muscular organ 3x2x1 inches (50g) (3.5x2.5x1.5& 75 g in multigravi)\n•Parts: 1- Body (corpus uteri) (2 inches) 2- cervix (1 inch): supravaginal & portiovaginalis\n3- Isthmus (4 mm): Between Anatomical internal os (between body & cervix) above & Histological internal os below (bet endometrium & endocervix, .In pregnancy forms lower uterine segment (10cm)\n•intra uterine (corpus: cervix= 1:5) , adult (2:1)\n•Nerve supply: 1- Sympathetic T7→L2 2- Parasympathetic S 2, 3, 4","g5",12,""],[100,"Blood supply of the uterus","•Uterine artery: branch from internal iliac artery (anterior division)\n•Ovarian artery: branch from aorta (at level of L2)","g5",12,""],[100,"Lymphatic drainage of the uterus","[2019]\n•Cervix & lower 1/3 of corpus: 1. Paracervical LN at crossing of ureter to uterine artery.\n2. External & Internal iliac LN. 3. Obturator LN. 4. Sacral LN\n•Middle 1/3: Internal iliac LN •Upper 1/3: Paraortic LN\n•Cornu: With round ligament to the superficial inguinal LN","g5",12,"I"],[100,"Upper versus lower uterine segment","Upper segment Lower segment\nPeritoneum Adherent Loose\nMuscle Thick (3layers) Thin (2layers)\nDecidua Well developed Less developed\nMembranes Firmly adherent Loosely adherent\nAction Active in labor (contract &retract) Passive (dilate &stretch)","g5",13,"I"],[100,"Definition and factors maintaining normal position of the uterus","Mid 64\n•Normal position :-Ante-Version: uterus inclined forward on vaginal axis by 90 due to tension between uterosacral & round ligament\n-Ante-Flexion: body is bent forwards on cervix by 170° due to tone of uterine muscles\n-In 20% of females the uterus is Normally retroverted → RVF\n- Ext os at level of ischial spines -Vagina directed upwards & backwards forming 45-60°.\n•Supports of the uterus: 1. AVF position 2. Uterine Ligaments (true only)\n3. Levator Ani muscle 4. Peritoneal attachment 5. Position of surrounding viscera","g5",13,""],[100,"Enumerate true uterine ligaments and their attachments","& attachement [2020], short account on uterine lig\n1-Corporeal (false) 2- Cervical (true)\nA]Broad ligament: -Fold of peritoneum between lateral uterine border & lateral pelvic wall\n-Laterally, it continues as infundibulopelvic ligament\n-Contents\n1. Parametrium (loose connective tissue) , Fallopian tube , Uterine & ovarian vessels, nerves, lymphatics.\n2.Vestigial remnants (epo/paroophron , Gartner duct)\nB] Round ligament: -Rises from cornu through inguinal canal to insert in labia majora\n-Raises a ridge on anterior (inf) layer of broad lig\n-Important to maintain anteversion\n-Supplied by Sampson artery (from ovarian artery) & a branch from inferior epigastric artery\nC] Ovarian ligament: from cornu to ovary\nA]Anterior: Pubo-cervical lig (pubo-cervico-vesical fascia)\n: -Extends to post surface of pubis surrounding urethra\n-Distension of UB prevents good formation of this lig\nB) Laterally: Mackenrodt's, cardinal, or transverse cervical ligament.\n-Strong, fan shaped from cervix & upper part of vagina to white line\n- ureter passes through it (in ureteric canal)\n-It forms base of broad ligament\nC] Posteriorly: Uterosacral ligament (2 ligaments surrounding rectum):\n-From back of cervix to middle sacral piece (S2,3)\n-only true ligament (others are condensed fascia)","g5",13,"I"],[100,"Anatomy of the uterine tubes","•shape (10cm) •parts: interstitial (1), isthmus (2), ampulla (5), infundibulum (2)\n•Largest fimbria is called fimbria ovarica:- important for ovum pick-up\n•Utero-tubal sphincter prevents retrograde menstruation into pelvis\n•Layers: Peritoneal coat (not on interstitial part & floor) ,Muscle (inner circular & outer long) ,Endosalpinx [columnar partial ciliated, partial secretory + peg cells (immature or reserve cells)]\n•Blood supply: uterine & ovarian vessels","g5",13,""],[100,"Ovary: site, boundaries, blood supply and drainage","•Position: -Lies in fossa ovarica, ureter & internal iliac artery are behind it\n-Connected to back of broad ligament by mesovarium -Connected to uterus by ovarian lig\n-Connected to pelvic side wall by infundibulopelvic ligament\n•Size: almond shaped → 3 x 2 x 1 cm (5 gm)\n•Structure: -Hilum -Medulla: vascular CT stroma\n-Cortex: follicles, corpus luteum & albicans (main compartment)\n•Covered by: -surrounded by tunica albuginea, covered by a single layer of cubical cells\n(germinal epithelium), Ovary is Not covered by peritoneum 'to allow ovulation'\n•Blood supply: ovarian artery •Lymph drainage: paraortic LN","g5",14,""],[100,"Anatomy of the pelvic floor and pelvic fascia","1] Pelvic peritoneum\n•extends from over bladder → Uterovesical pouch then over uterine isthmus with loose attachment (not covering ant surface of cervix) then corpus, post surface of cervix & vagina\n(Douglas pouch) then ant surface of rectum (lower 1/3 of rectum not covered)\n•Laterally: 2 peritoneal folds form broad ligament\n2] pelvic fascia\n•Parietal (covers muscles of pelvis) & Visceral (endopelvic fascia)\n•fascia forms condensations: -Around cervix: 3 cervical ligaments\n-Around uterus: parametrium (within broad ligament) -Around vagina: paracolpos\n-Between vagina & rectum: rectovaginal fascia\n3] Pelvic diaphragm\n•Diamond shape from lower border of symphysis pubis to 2 ischial tuberosities till tip of coccyx & composed of 2 levator ani & coccygeal muscles & their supporting fascia.\n•It is divided into 2 triangles: -Anteriorly: urogenital triangle (diaphragm)\n-Posteriorly: anal triangle\n4]\nPerineum\n(2-5 cm)\n•Area between skin (below) & pelvic diaphragm (above)\n•Divided into 2 pouches (superficial & deep) separated by perineal membrane\n1- Perineal muscles: A- Deep Perineal Muscle: -Deep transverse -Sphincter urethral muscle\nB- Superficial Perineal Muscles (muscles of Vulva): -Superficial transverse perineal muscle\n-Ischio-cavernosus muscle: from ischial tuberosity to clitoris\n-Bulbo-spongiosus ms: from clitoris to perineal body. It diminishes vaginal orifice at coitus.\n2-Perineal body: lying between vagina & anal canal\n3-Ischiorectal fossa: -Wedge shaped space on either side of anal canal filled by fat\n-Boundaries: Superior & medial (levator ani) ,Lateral(obturator muscle & fascia), Inferior (skin)\n4-Pudendal (Alcock's) canal: -It is a tunnel formed by splitting of obturator fossa.\n-runs antero-medially from isch spine to urogenital diaphragm& contain pudendal vessel & nerve","g5",14,""],[100,"Levator ani muscle: parts and function","•it is composed of 3 parts: 1-Pubococcygeus: From back of S. pubis& ant part of white line to Side walls of urethra (Pubourethralis), perineal body [Pubovaginalis (fibers of Lushka)], rectum (Puborectalis) & coccух (Pubococcygeus proper).\n2-Iliococcygeus From white line to perineal body & coccyx\n3-Ischiococcygeus From ischial spine to-coccyx & sacrum\n•Nerve supply: -Pudendal nerve S: 2,3,4→perineal surface -Branches of S:3,4 roots→pelvic\n•Function:-Support -Maintain intrabdominal pressure\n-Sphincter to urethra,vagina&rectum - rotation of fetal head during labor","g5",15,"I"],[100,"Anatomy of the perineal body","Fibromuscular pyramidal condensation of 9 muscles: 2 bulbo-spongiosus, 2 superficial & 2 deep transverse perineal muscles, ext anal sphincter & pubovaginalis parts of levator ani","g5",15,"I"],[100,"Define female genital mutilation (FGM)","It includes all procedures that involve partial or total removal of female external genitalia for cultural nontherapeutic traditional reasons.","g5",15,""],[100,"Mention classification of FGM","•Type 1: Excision of prepuce ± clitoris. •Type II: Excision of prepuce, clitoris & labia minora\n•Type III: Excision of part or all of external genitalia & stitching of vaginal opening\n(infibulation = Sudanese circumcision).\n•Type IV: unclassified procedures: e.g. pricking, piercing, tattoo.","g5",15,"I"],[100,"Mention complications of FGM","Immediate Complications Late Complications\n1. Pain & neurogenic shock.\n2. Bleeding&hemorrhagic shock.\n3. Damage to urethra & vagina.\n4. Infection.\n5. Psychological trauma.\n1. Urinary tract infections 2. Scar & keloid formation.\n3. Bartholin cysts & abscess.\n4. Implantation dermoid cyst & neuroma\n5. Sexual problems: dyspareunia: vaginismus, chronic pelvic congestion","g5",15,"I"],[133,"Mention causes of pelvic ureter injury","•Liable to injury during: 1. Hysterectomy (abdominal or vaginal) 2. Pelvic lymphadenectomy\n3. Bilateral internal iliac artery ligation 4. Adenexectomy (removal of ovarian swellings)\n•Injury ↑in: -Congenital malformations of genital or urinary tract -Distorted course\n-Extensive adhesions -Rapid blind clamping to stop massive bleeding\n•To avoid injury, we must do: - Pre-operative: IVP (intravenous pyelography)\n-Intra-operative: 1. Proper identification of its anatomical course 2. Clamping done under vision\n3. Clamping must be near to uterus 4. Insertion of ureteric catheters","g5",15,""],[116,"Barrier / mechanical contraceptive methods: advantages and disadvantages",", Enumerate male &female barrier methods of contraception &mention advantages & disadvantages of each\n1) Condom (latex) : -No side effects or contraindications\n-Non contraceptive benefits: Protect against STD, CIN,Treat immunological infertility , Collection of semen (spermicide free)\n2) Female condom (vaginal pouch): (polyethylene)\n3) Vaginal diaphragm (Dutch cap) :Inserted in vagina & removed after 8 h (till all sperms die)\nDisadvantages: -Difficult to apply -May lead to cystitis if large size, not suitable in prolapse\n4) Cervical cap :-Applied directly to cervix→ not in multipara (diaphragm is better)\n-Used if there is prolapse (diaphragm can't be applied)\n5) Vaginal sponge : -Synthetic polyurethane sponge containing Nonoxynol-9\n-Very easy to insert & remove (up to 24h) -Disadvantage: Toxic shock $ if left long (staph aureus)\nAdvantages Disadvantages\n•No effect on fertility/ lactation\n•No systemic effects\n•Easy to Initiate & continue\n•Condoms protect against STD\n•Failure rate→3-14/HWY (improved by adding spermicidals)\n•May lead to allergy(latex) •Interrupt natural act ( sensation)\n•Sponge Infection •Diaphragm discomfort","g5",16,""],[116,"Types of local contraception","(unsure)\n1-spermicidals Supplied as foam/jell/cream/effervescent tablets/suppositories 2-vaginal sponge","g5",16,""],[116,"Mode of action of spermicides","•Nonoxynol-9 & Octoxynol→ destroy sperm membrane + O2 uptake\n•Supplied as foam/jell/cream/effervescent tablets/suppositories\n•Use: - Inserted 15 min before coitus - Coitus must occur within 2 hours\n- Delay postcoital douching for 6 hours\n•Disadvantage: high failure rate (30/HWY)","g5",16,""],[120,"Enumerate types of contraception during lactation","•lactational amenorrhea method •barrier methods •IUCD\n•Progestin only methods: POP, injectables ,implants\nPostpartum contraception: -Immed: Breast-feeding, Barriers, sterilization -Lactating at 6 w: Progestagen only, IUCD\n-Lactating women at 6 mon: as above + Methods containing E (COC, Combined monthly injectable, VCR (vaginal contraceptive ring))","g5",16,""],[117,"Types, complications and contraindications of IUCD; mechanism and advantages","[2019], , IUCD mechanism & types\n[2020] & advantages of IUCD\n•Made of:Polyethylene (with barium to be radio-opaque) + 2 nylon threads (mark presence&facilitate removal)\n•Types: 1] Inert: not used, Lippes loop: Double S shaped, indefinite duration\n2] Medicated: Most commonly Used due to: less pain & bleeding& better protection, 5-10y a) With copper: •Cu T 380A (T-shaped with a copper wire around stem & arms)\n•Nova T (Novagard) adding silver prolongs life span (↓ fragmentation)\n•Multiload Cu (with vertical stem & two wings with protrusions & Cu wire on vertical stem) b)With progestins (mirena loop): •Levonorgesterel (LNG-IUS) most recent but expensive\n•Mode of action: -Neither ovulation nor steroidogenesis is affected & not abortifacient\n-IUDs cause aseptic endometritis preventing implantation & causing uterine irritability.\n-Cupper is spermicidal & impairs implantation.\n-Progesterone in LNG-IUD →Atrophic endometrium, thick cervical mucus, prevents sperm capacitation & occasional anovulation.\n•Advantages: - No systemic effects, available, safe, effective, reversible.\n-1 decision method & cheap, Left for long periods,No interference with intercourse or lactation\n-Non-contraceptive benefits of LNG releasing intrauterine system (IUS):\n1-ttt of dysfunctional uterine bleeding 2-Prevent & ttt of endometrial hyperplasia 3-Protect from PID\n•disadvantages: side effects,need health provider to insert&remove, No protection against STD\n•Contraindications:1.History of PID/previous ectopic, immunosuppression(steroid, DM, TB)\n2. Undiagnosed bleeding (detect a cause) or amenorrhea (exclude pregnancy)\n3. Patients with severe anemia, bleeding tendency\n4. Uterine distortion (preventing IUCD application): fibroids or septate uterus\n•Complications: 1-Bleeding: Post-Insertion, Menorrhagia: in 1st few cycles\n2-Pain: Post insertion ,Backache, Acute abdominal pain 3-Discharge: Mucoid ,purulent\n4-PID 5-Pregnancy 6-Perforation\n7-Missed Threads: stuck to cervical mucus (most common), Perforation, Pregnancy (most important) , Expulsion\n8-Expulsion:complete (into vagina) or incomplete (within cervix) , Causes: Young age or nulliparity , malformed uterus, unfit size, inserted immediately postpartum/bad technique.\n9-Difficult removal→ Do curettage or hysteroscopic removal\n•Timing: -Postmenstrual (cervix is open, avoid pregnancy) , Postabortion (by 1 w)\n-During cesarean (Gynifix) , Postpartum (in 1st day or after puerperium)\n-Post-coital (emergency) contraception (within 1 week )","g5",17,"I"],[117,"Management of a missed IUCD in a non-pregnant female","[2019]\n•Work up: Exclude pregnancy (U/S + pregnancy test), Try to find threads in vagina by speculum, TV US, If not found→ hysteroscopy OR Plain X-ray + uterine sound\n•Management: -If intra-uterine→ hysteroscopic removal or D&C\n- If extra-uterine → remove by Laparoscopy","g5",18,"I"],[117,"Indications of removal of IUCD","•pregnancy is desired or occurred •after menopause or expired device","g5",18,""],[118,"Types of hormonal contraceptives","•Combined (E & P): OCP-injectable - vaginal ring - skin patch\n•P only: POP - injectable - implants - hormone releasing IUCD","g5",18,""],[118,"Enumerate long-acting hormonal contraceptives","1- Injectables: •Progesterone only injectables: -Depo-Provera 150 mg (DMPA)...IM/ 3 mon\n-Depo-subQ Provera 104 mg (DMPA)...SC / 3 mon -Norethisterone enanthate IM /2 mon\n•Combined injectables: -Cyclofem (DMPA 25 mg + estradiol cypionate 5 mg)\n-Mesigyna (DMPA 50 mg + estradiol valerate 5 mg)\n2-subdermal implants: etonongestrel (Implanon , nexpalnon)\n3-Levonorgestel (LNG-IUS): mirena loop","g5",18,""],[118,"Oral contraceptive pills: composition, types, mechanism, side effects and contraindications","[2016] , Composition of progestational compounds &its uses, Enumerate contraception of estrogen\n•Composition: 1-Estrogen: Ethinyl estradiol (EE) , Mestranol (less potent) , E2 valerate\n2-Progestagen (gestagen):\n-1st generation: Estrane:Norethisterone (Loestrin), Pregnane :MPA, Etynodiol diacetate (only in POP)\n-2nd generation: Levonorgestrel (Microgynon)\n-3rd generation: more potent + less andrognic side effects: Desogestrel (Marvelon®), Gestodene (Gynera), Norgestimate (Cilest)\n-4th generation: drospirenone → Yasmin (Yaz), Dienogest (Qlaira with E2valerate)\n•Types: 1-Menophasic pills: contain same E/ gestagen content, high dose (50 µg ΕΕ) , moderate\n(30-35 µα ΕΕ), low (15-20 µg ΕΕ)\n2-Biphasic pills: E / gestagen content in 2 phases (1st phase 10 days & 2nd phase 11 days with double progesterone content) +7-day free.\n3-Triphasic pills: E/ gestagen concentration in 3 phases (1st phase 6 days, 2nd phase 5 days, 3rd phase 10 days) then 7-day pill free→ imitating natural cycles→break through bleeding.\n•Mode of action: 1. E: inhibits Gn RH → anovulation (primarily mechanism of action)\n2. Progestogen: endometrial atrophy (no implantation), thick cervical mucus (no sperm penetration), tubal motility & FSH.\n•Disadvantages:1. Difficult: Incorrect use requires daily use & re-supply.\n2. No protection against STI including HIV. 3. Health risks for some women.\n•Side effects: 1-Major side effects: -Chest pain: CVS complications -Breast cancer: no↑ risk\n-Pelvic: cervical cancer (↑ HPV infection).\n2-Menstrual side effects: -Spotting Breakthrough: common with POP & Triphasic OCPs\n-Hypomenorrhea: gestagens (in OCP)→ endometrial atrophy.\n-Amenorrhea: during intake or after stopping (postpill amenorrhea) → exclude pregnancy,\n3-Other side effects: -Vomiting, Migraine, Depression, ↑weight, Acne & chloasma\n-Libido, Leucorrhoea (cervical congestion) & Breast engorgement\n-Eye: corneal edema→ blurring of vision with contact lenses.\n•Contraindications\nAbsolute Relative\n1. Thromboembolic diseases 2. History of DVT.\n3. Coronary heart disease 4. Strokes\n5.E-dependent malignancy: carcinoma of breast & uterus, hepatic adenoma\n6. Liver cell failure.\n7. History of cholestasis during pregnancy\n8. Pregnancy\n1. Superficial thrombophlebitis 2.Varicose vein\n3. Migraine / Epilepsy 4. Hypertension, DM\n5.Age ≥ 35 years+ any of: (hypertension, DM, hyper lipidemia, heavy smoking)\n6. Gall bladder stones\n7. Sickle cell disease\n8. Undiagnosed genital bleeding","g5",18,"I"],[118,"Non-contraceptive benefits of combined oral contraceptive pills","of coc pills ,Non contraceptive causes of COCs\n•Contraceptive advantage:Availabl,Safe,Effective (most effective method),Reversibl& Cheap\n•Non contraceptive benefits: 1-A: anemia\n2-B: Bleeding, PID, benign breast conditions\n3-C: Cancer endometrium, cancer ovary & benign ovarian cysts 4-D: Dysmenorrhea\n5-E: Endometriosis & Ectopic pregnancy","g5",19,""],[118,"Progesterone-only pills: types, mechanism, uses and complications",", Uses & complications of progesterone\n•types: - Levonorgestrel: Microlut (30 µg) -Noresthisterone: Micronor (350 µg)\n- Lynestrenol: Exluton (0.5 mg) - Desogestrel: Cerazette (75 µg)\n•Mode of action: - Thick cervical mucus (main mechanism) - Endometrial atrophy\n- inhibits sperm capacitation - Tubal motility & suppression of ovulation (50%)\n•indications:lactating ,cardiac, hepatic patient,>40, smoker,minimal for diabetics,hypertensive &obese\n•disadvantage& SE: higher failure than combined pills, liability to ectopic pregnancy, menstrual SE\n•contraindication:undiagnosed amenorrhea, undiagnosed genital bleeding, previous ectopic pregnancy","g5",19,""],[118,"Injectable contraceptives","contraceptives\n•Types: 1-Progestin-only injectables: -Depo-Provera 150 mg (DMPA)...IM/ 3 months\n-Depo-subQ Provera 104 mg (DMPA)...SC / 3 months -Norethisterone enanthate IM /2 months\n2-Combined injectables: given monthly: -Cyclofem (DMPA 25 mg+estradiol cypionate 5 mg)\n-Mesigyna (DMPA 50 mg + estradiol valerate 5 mg)\n•Mode of action: thick cervical mucus , suppression of ovulation.\n•Advantages: 1. Available, safe, effective (>99%), long acting & reversible.\n2. Require no action at time of intercourse , no effect on lactation.\n3. It does not affect the overall risk of breast cancer.\n4. Offer non-contraceptive benefits: -Protects from endometriosis, endometrial carcinoma\n-Improves pre-menstrual tension & dysmenorrhea -Treats precocious puberty, hirsutism\n-Protects against PID (but not STD)\n•Side Effects & disadvantages:\n1-Progestin-only injectables: -Menstrual irregularities: ( more common for progesterone)\n-Delayed return to fertility after discontinuation (± 9 months).\n-Bone density , No STI/HIV protection , weight gain.\n2-Combined injectables: as COC (Headache, dizziness, breast tenderness & mood changes) , better control on cycle.","g5",20,""],[118,"Subdermal contraceptive implants","•Method: -Implanon: Single cylinder left for 3 years that contains \"etonogestrel\"\n-Nexpalnon: single rod containing 68 mg of etonogestrel left for 3 years.\n•Action: Thick cervical mucus , suppression of ovulation.\n•Advantage: No systemic side effects, available, safe, effective (99% protection) & rapidly reversible - long acting\n•Disadvantage: -Headache/breast tenderness/weight gain\n-Difficult insertion & removal (needs provider's help)\n-Menstrual irregularities: most common reason for removal.\n-No protection against STI, including HIV","g5",20,""],[119,"Female ing in PCO/cystectomy / Ovarian biopsy/Oophrectomy\n2. Tubes: Infertility (tuboplasty) , sterilization\n3. Peritoneum: lysis of adhesions , Endometriosis , Lymphadenectomy\n4. Uterus: LAVH,Myomectomy , Removal of extra-uterine IUCD\n5. Chronic pelvic pain: LUNA (laparoscopic uterosacral nerve ablation)\n6. Laparoscopic urethral sling (in SUI)","g5",22,""],[112,"Indications, contraindications and complications of laparoscopy","•Complications : 1] Anesthetic complications\n2] Injury (during trial of entry): -Vascular injury (inferior epigastric vessels or pelvic vessels)\n-Visceral injury (intestine, colon, bladder, uterus) -Thermal injury (if diathermy is used)\n3] Pneumo-peritoneum complications: Gas embolism, Emphysema of abdominal wall, Respiratory & cardiac problems due chest compression, Metabolic acidosis due ↑CO2 absorption\n•Contraindications:1)Risk of visceral injury if: Large pelviabdominal mass or pregnancy>16 w , Paralytic ileus, intestinal obstruction, Multiple previous laparotomies (bowel adherent to scar)\n2) Generalized peritonitis\n3) When pneumo-peritoneum hazardous: -Severe heart/chest disease (interfere with proper position)\n-Morbid obesity -Diaphragmatic hernia","g5",23,""],[112,"Indications of operative hysteroscopy","[2021]\n•Diagnostic: 1. Infertility (intrauterine synechiae, submucous myoma, polyps)\n2. Recurrent pregnancy loss (Congenital anomalies) 3. Irregular uterine bleeding.\n4. Searching for a missed IUCD\n•Operative: 1. Polypectomy/Resection of submucous myoma 2. Resection of uterine septum.\n3. Adhesiolysis of intrauterine synechiae 4. Removal of a missed IUD\n5. Resection or coagulation of endometrium. 6. Tubal cannulation for corneal obstruction.\n7. Sterilization by injecting a plug in tubal cornu (Essure or cyanoacrylate)\n•Complications: -Anesthetic - Hemorrhage / infection / Injury (uterine perforation)\n-Comp of distending media (glycine) volume overloa , electrolyte imbalance, CO2 embolization","g5",23,""],[112,"Uses of hyst /* ---------- PvP: friends exchange "hunter cards" (codes). Duels compare this week's real effort per stat. ---------- */
const CARD_SALT='hunter-pvp-1';
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return decodeURIComponent(escape(atob(str)));}
function weekXp(){
  const since=dayKey(daysAgo(6)),w=STATS.map(()=>0);let W=0;
  S.entries.forEach(e=>{if(e.day>=since&&e.xp>0){W+=e.xp;const i=STATS.findIndex(x=>x.id===e.stat);if(i>=0)w[i]+=e.xp;}});
  return {w,W};
}
function myCard(){
  const T=totals(),A=lvl(T.xp,needAll),pw=power(),wk=weekXp();
  return {v:1,id:S.pvp.me,n:S.name,t:Date.now(),L:A.l,R:rankOf(A.l),P:pw.total,s:STATS.map(x=>lvl(T.s[x.id],needStat).l),w:wk.w,W:wk.W,k:streakNow(),a:pw.n,f:S.army.best||0,elo:S.pvp.elo};
}
function encodeCard(c){const j=JSON.stringify(c);return 'HNT1.'+b64e(j)+'.'+fnv(CARD_SALT+j);}
function decodeCard(txt){
  const m=/HNT1\.([A-Za-z0-9_-]+)\.([0-9a-f]+)/.exec(txt||'');
  if(!m)return {err:'مش لاقي كود كارت في النص ده. انسخ الرسالة كلها من صاحبك.'};
  let j,c;
  try{j=b64d(m[1]);c=JSON.parse(j);}catch(e){return {err:'الكود ناقص أو متلخبط. اطلب من صاحبك يبعته تاني.'};}
  if(fnv(CARD_SALT+j)!==m[2])return {err:'الكود اتعدّل بعد ما اتعمل، فمش هينفع يتضاف.'};
  const v=validCard(c);if(!v)return {err:'الكود مش بتاع نظام الصياد.'};
  if(v.t>Date.now()+864e5)return {err:'تاريخ الكارت في المستقبل، فمش هينفع يتضاف.'};
  return {card:v};
}
function validCard(c){
  const num=(x,max)=>typeof x==='number'&&isFinite(x)&&x>=0&&x<=max;
  const arr=(a,max)=>Array.isArray(a)&&a.length===5&&a.every(x=>num(x,max));
  if(!c||typeof c!=='object'||c.v!==1||typeof c.id!=='string'||c.id.length>20||typeof c.n!=='string'||!num(c.t,4e12)||!num(c.L,999)||!num(c.P,1e7)||!arr(c.s,999)||!arr(c.w,1e5)||!num(c.W,1e6)||!num(c.k,9999)||!num(c.a,999)||!num(c.f,9999))
    return null;
  return {v:1,id:c.id,n:c.n.slice(0,20)||'صياد',t:c.t,L:c.L,R:['E','D','C','B','A','S'].includes(c.R)?c.R:rankOf(c.L),P:c.P,s:c.s.slice(),w:c.w.slice(),W:c.W,k:c.k,a:c.a,f:c.f,elo:num(c.elo,4000)&&c.elo>=100?c.elo:1000};
}
function cardAge(c){return Math.floor((Date.now()-c.t)/864e5);}
function ageText(c){const d=cardAge(c);return d<=0?'الكارت من النهارده':d===1?'الكارت من امبارح':'الكارت من '+d+' أيام';}
function addFriend(){
  const r=decodeCard(ui.pvpPaste);
  if(r.err){toast(r.err);return;}
  const c=r.card;
  if(c.id===S.pvp.me){toast('ده كارتك انت. ابعته لصاحبك وخد منه كارته.');return;}
  const ex=S.pvp.friends[c.id];
  if(ex&&ex.card.t>=c.t){toast('عندك كارت أحدث من ده لنفس الصاحب');return;}
  if(!ex&&Object.keys(S.pvp.friends).length>=30){toast('وصلت للحد الأقصى: 30 صاحب');return;}
  S.pvp.friends[c.id]={card:c,added:ex?ex.added:Date.now()};
  if(Array.isArray(S.pvp.hubDel))S.pvp.hubDel=S.pvp.hubDel.filter(x=>x!==c.id);
  ui.pvpPaste='';save();render();
  toast(ex?'اتحدّث كارت '+esc(c.n):'اتضاف '+esc(c.n));
}
async function copyCard(){
  const c=myCard(),code=encodeCard(c);
  const msg='تحدّاني في نظام الصياد! خبرتي الأسبوع ده '+c.W+' وقوتي '+c.P+'.\nانسخ الرسالة دي كلها وحطها في تبويب الظلال، الأصدقاء:\n'+code;
  ui.showCode=msg;
  try{await navigator.clipboard.writeText(msg);toast('اتنسخ الكارت. ابعته لصاحبك');}
  catch(e){toast('النسخ التلقائي ما اشتغلش. انسخ الكود من المربع');}
  render();
}
function duelResult(me,fr){
  const rounds=STATS.map((st,i)=>{
    let a=me.w[i],b=fr.w[i],by='w';
    if(a===0&&b===0){a=me.s[i];b=fr.s[i];by='s';}
    return {st,a,b,by,win:a>b?1:a<b?-1:0};
  });
  const my=rounds.filter(r=>r.win>0).length,th=rounds.filter(r=>r.win<0).length;
  let res=my>th?1:my<th?-1:0,tb='';
  if(!res){res=me.W>fr.W?1:me.W<fr.W?-1:0;tb='w';}
  if(!res){res=me.P>fr.P?1:me.P<fr.P?-1:0;tb='p';}
  return {rounds,my,th,res,tb};
}
function startDuel(fid){
  const f=network()[fid];if(!f)return;

  if(S.pvp.duels.length>60)S.pvp.duels=S.pvp.duels.slice(-60);
  save();
  ui.duel={fid,me,fr:f.card,r,shown:0,done:false};

    else if(d.r.res>0)queue.push({k:'[ إشعار النظام ]',t:'فزت في المبارزة',b:d.r.my+' - '+d.r.th,s:'ضد '+d.fr.n}),showNext();};
  setTimeout(step,rm?0:500);
}
function record(fid){const ds=S.pvp.duels.filter(x=>x.fid===fid);return {w:ds.filter(x=>x.res>0).length,l:ds.filter(x=>x.res<0).length};}

/* ---------- online: league in db, presence-based lobby and live duels ----------

function answerQ(oi){
  const D=live.duel;if(!D||D.kind!=='quiz'||D.phase!=='play'||D.qi>=5)return;

function checkResult(){
  const D=live.duel;if(!D||D.phase==='done'||D.phase==='wait')return;
  let res=null;
  if(D.kind==='quiz'){
    const oa=oppAns(D),og=oppSt(D);
    const meDone=D.ans.length>=5,oDone=oa.length>=5||og==='gone';
    if(!meDone||!oDone)return;
    if(og==='gone'&&oa.length<5)res=1;
    else{const ms=D.ans.filter(a=>a.c).length,os=oa.filter(a=>a.c).length;
      if(ms!==os)res=ms>os?1:-1;
      else{const mt=D.ans.reduce((x,a)=>x+a.ms,0),ot=oa.reduce((x,a)=>x+a.ms,0);res=mt<ot?1:mt>ot?-1:0;}}
  }else{
    const me=D.st,o0=oppSt(D),o=o0==='gone'?'fled':o0;
    const fin=x=>x==='done'||x==='fled';
    if(!fin(me)||!fin(o))return;
    res=me==='done'&&o==='fled'?1:me==='fled'&&o==='done'?-1:0;
  }
  D.phase='done';D.res=res;
  const oe=nz(D.o&&D.o.elo,4000)||1000,exp=1/(1+Math.pow(10,(oe-S.pvp.elo)/400)),sc=res>0?1:res<0?0:0.5;

}

/* ---------- network: one ranking from cards (codes), the owner's hub and online players ----------
   The owner relays cards into hub/cards (owner-write). Any signed-in viewer who can open the page can read it. */
live.hub={};live.isOwner=false;live.hubState='none';
let hubT=null,hubLast='';
function hubInit(){
  try{
    live.hubState='loading';
    ctx.db.doc('hub/cards').onSnapshot(sn=>{
      const d=sn.exists?sn.data():null;
      live.hub=d&&d.cards&&typeof d.cards==='object'?d.cards:{};live.hubState='ok';rerenderOnline();
    },()=>{live.hubState='err';rerenderOnline();});
  }catch(e){live.hubState='err';}
}
function schedHub(){if(!live.isOwner||!ctx.db)return;clearTimeout(hubT);hubT=setTimeout(pushHub,1500);}
async function pushHub(){
  if(!live.isOwner||!ctx.db)return;
  const cards={};
  Object.keys(live.hub).forEach(k=>{const v=validCard(live.hub[k]);if(v)cards[k]=v;});
  Object.keys(S.pvp.friends).forEach(k=>{const c=S.pvp.friends[k].card;if(!cards[k]||cards[k].t<c.t)cards[k]=c;});
  (S.pvp.hubDel||[]).forEach(k=>{if(!S.pvp.friends[k])delete cards[k];});
  const me=myCard();cards[me.id]=me;
  const out={};Object.keys(cards).sort((a,b)=>cards[b].t-cards[a].t).slice(0,100).forEach(k=>out[k]=cards[k]);
  const cmp=JSON.stringify(Object.assign({},out,{[me.id]:Object.assign({},me,{t:0})}));
  if(cmp===hubLast)return;
  try{await ctx.db.doc('hub/cards').set({cards:out});hubLast=cmp;}catch(e){}
}
function cardFromLeague(x){
  if(!x||typeof x!=='object')return null;
  return validCard({v:1,id:x.pid,n:x.n,t:x.t,L:x.L,R:x.R,P:x.P,s:x.s,w:x.w,W:x.W,k:x.k,a:x.a,f:x.f,elo:x.elo});
}
function network(){
  const M={};
  const put=(c,src,extra)=>{
    if(!c||!c.id||c.id===S.pvp.me)return;
    const x=M[c.id];
    if(!x)M[c.id]={card:c,src:[src]};
    else{if(c.t>x.card.t)x.card=c;if(!x.src.includes(src))x.src.push(src);}
    if(extra)Object.assign(M[c.id],extra);
  };
  Object.keys(live.hub).forEach(k=>put(validCard(live.hub[k]),'hub'));
  Object.keys(S.pvp.friends).forEach(k=>put(S.pvp.friends[k].card,'code'));
  Object.keys(live.league).forEach(k=>{if(k!==ctx.uid)put(cardFromLeague(live.league[k]),'online',{lid:k,ev:Array.isArray(live.league[k].ev)?live.league[k].ev.slice(0,5):[],dw:nz(live.league[k].dw,1e5),dl:nz(live.league[k].dl,1e5)});});
  others().forEach(p=>{const pid=p.presence.pid;if(typeof pid==='string'&&M[pid])M[pid].peer=p.peer;});
  return M;
}
function vJoin(st){

/* ---------- gym: animated hunter figure (side view, forward kinematics + 2-bone IK) ---------- */
const GF=168,AY=164,GL={th:38,sh:38,to:44,ua:30,fa:28};
const gD=Math.PI/180,gdir=a=>[Math.sin(a*gD),Math.cos(a*gD)];
const gl=(a,b,t)=>a+(b-a)*t;
function gik(p0,p1,l1,l2,pref){
  const dx=p1[0]-p0[0],dy=p1[1]-p0[1],d=Math.hypot(dx,dy)||1e-3;
  const dd=Math.min(l1+l2-.01,Math.max(Math.abs(l1-l2)+.01,d)),ux=dx/d,uy=dy/d;
  const a=(l1*l1-l2*l2+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  let px=-uy,py=ux;if(px*pref[0]+py*pref[1]<0){px=-px;py=-py;}
  return {j:[p0[0]+ux*a+px*h,p0[1]+uy*a+py*h],e:[p0[0]+ux*dd,p0[1]+uy*dd]};
}
const gv=(A,B,k,t)=>{const a=A[k],b=B[k];if(a==null||b==null)return a==null?b:a;return Array.isArray(a)?[gl(a[0],b[0],t),gl(a[1],b[1],t)]:gl(a,b,t);};
function gJ(d,t){
  const A=d.p[0],B=d.p[1],g=k=>gv(A,B,k,t);
  const hip=g('hip'),ta=g('ta'),sho=[hip[0]+GL.to*Math.sin(ta*gD),hip[1]+GL.to*Math.cos(ta*gD)];
  const lgA=A.lg!=null?g('lg'):null,ankT=lgA!=null?[hip[0]+(GL.th+GL.sh-1)*Math.sin(lgA*gD),hip[1]+(GL.th+GL.sh-1)*Math.cos(lgA*gD)]:g('ank');
  const L1=gik(hip,ankT,GL.th,GL.sh,g('kp')||[1,0]);
  const o={hip,sho,knee:L1.j,ank:L1.e,toe:A.tp?g('tp'):[L1.e[0]+10,L1.e[1]+4]};
  if(A.a2){const L2=gik(hip,g('a2'),GL.th,GL.sh,g('kp2')||[1,0]);o.knee2=L2.j;o.ank2=L2.e;o.toe2=[L2.e[0]+10,L2.e[1]+4];}
  const td=gdir(ta);o.head=[sho[0]+td[0]*17,sho[1]+td[1]*17];
  if(A.elb){const e=g('elb'),fa=g('fa'),fd=gdir(fa);o.elb=[sho[0]+e[0],sho[1]+e[1]];o.hand=[o.elb[0]+GL.fa*fd[0],o.elb[1]+GL.fa*fd[1]];}
  else{const tg=A.habs?g('habs'):(()=>{const h=g('hand');return [sho[0]+h[0],sho[1]+h[1]];})();if(A.arc){tg[0]+=A.arc[0]*Math.sin(Math.PI*t);tg[1]+=A.arc[1]*Math.sin(Math.PI*t);}
    const L3=gik(sho,tg,GL.ua,GL.fa,g('ep')||[0,1]);o.elb=L3.j;o.hand=L3.e;}

const gm=(a,b,k)=>[gl(a[0],b[0],k),gl(a[1],b[1],k)];
function gMu(J,k){
  switch(k){
    case 'sho':return J.sho;case 'hip':return J.hip;case 'knee':return J.knee;case 'elb':return J.elb;
    case 'quad':case 'ham':return gm(J.hip,J.knee,.5);
    case 'calf':return gm(J.knee,J.ank,.5);
    case 'arm':return gm(J.sho,J.elb,.5);
    case 'fore':return gm(J.elb,J.hand,.5);
    case 'back':return gm(J.hip,J.sho,.5);
    case 'chest':{const p=gm(J.hip,J.sho,.85);return [p[0],p[1]-5];}

const gpl=(x,y,r)=>'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="#1b1405" stroke="#f5c451" stroke-width="2.2"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(r*.35)+'" fill="#f5c451"/>';
const gln=(a,b,c,w,o)=>'<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"'+(o?' opacity="'+o+'"':'')+'/>';

function gyRange(x,pe){return N(pe[2]+'–'+pe[3])+(GX[x].k==='t'?' ثانية':' تكرار');}
function gySuggest(x,pe){
  const d=GX[x],g=S.gym,today=dayKey();
  const days=[...new Set(g.sets.filter(s=>s.ex===x&&s.day<today).map(s=>s.day))].sort();
  if(!days.length)return null;
  const last=g.sets.filter(s=>s.ex===x&&s.day===days[days.length-1]),mx=pe?pe[3]:d.r[1],n=pe?pe[1]:3;
  if(d.k==='w'){
    const top=Math.max(...last.map(s=>s.w)),at=last.filter(s=>s.w===top);
    const ok=at.length>=Math.min(n,2)&&at.every(s=>s.r>=mx);
    return ok?{w:top+d.inc,r:pe?pe[2]:d.r[0],t:'وصلت للحد الأعلى بنضافة، زوّد الوزن'}:{w:top,r:Math.min(mx,Math.max(...at.map(s=>s.r))+1),t:'ثبّت الوزن وحاول تزوّد تكرار'};
  }
  const m=Math.max(...last.map(s=>s.r)),step=d.k==='t'?5:1,ok=last.length>=n&&last.every(s=>s.r>=mx);
  return {w:0,r:ok?m+step:m,t:ok?'زوّد الهدف شوية':'حاول تعدي رقمك'};

}

function gyFinish(){

  ses.e.forEach(e=>{plan+=e[1];done+=Math.min(e[1],sets.filter(s=>s.ex===e[0]).length);});
  const need=Math.ceil(plan*.7);
  if(done<need){toast('محتاج '+need+' مجموعات من خطة اليوم على الأقل، عملت '+done);return;}
  const before=snap();g.doneDay=day;g.sess++;

function lnInit(){
  if(!S.ln||typeof S.ln!=='object')S.ln={};
  ['en'].forEach(k=>{
    if(!S.ln[k]||typeof S.ln[k]!=='object')S.ln[k]={};
    const e=S.ln[k];
    if(!e.box||typeof e.box!=='object')e.box={};
    if(!e.due||typeof e.due!=='object')e.due={};
    if(!e.hist||typeof e.hist!=='object')e.hist={};
    if(!Array.isArray(e.mine))e.mine=[];
    if(!Array.isArray(e.cats)||!e.cats.length)e.cats=['a','m','r','p','c'];
    if(!(e.quota>0))e.quota=8;
    if(!e.xd||typeof e.xd!=='object')e.xd={d:'',x:0};
    if(!e.newd||typeof e.newd!=='object')e.newd={d:'',n:0};
  });
}
const lnE=()=>S.ln[ui.ln.lang];
function lnAll(){
  const k=ui.ln.lang;
  if(!LALL[k])LALL[k]=(LBANK[k]||[]).map((r,i)=>({id:'b'+i,c:r[0],w:r[1],ar:r[2],ex:r[3]}));

const lnById=id=>lnAll().find(w=>w.id===id);

function lnSpeak(txt){

const lnShuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const lnSent=w=>w.ex||w.w;
/* ----- question builders ----- */
function lnOpts(w,key){
  const same=lnAll().filter(x=>x.id!==w.id&&(w.c==='u'||x.c===w.c)&&x[key]!==w[key]);
  const all=lnAll().filter(x=>x.id!==w.id&&x[key]!==w[key]);
  const pick=lnShuf(same).slice(0,3);
  if(pick.length<3)lnShuf(all).forEach(x=>{if(pick.length<3&&!pick.some(p=>p[key]===x[key]))pick.push(x);});
  const opts=lnShuf([w].concat(pick)).map(x=>x[key]);
  return {opts,ans:opts.indexOf(w[key])};
}
function lnClozeText(w){
  if(!w.ex||w.c==='r')return null;
  const re=new RegExp('\\b'+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i');
  return re.test(w.ex)?w.ex.replace(re,'_____'):null;
}
function lnPrep(it){
  const w=lnById(it.id);if(!w){it.skip=true;return;}
  const b=lnBox(it.id);let k;
  if(it.t==='dict'||it.t==='ord')k=it.t;
  else if(it.t==='new'||b<=1)k='en2ar';
  else if(b===2)k='ar2en';
  else if(b===3)k=lnClozeText(w)?'cloze':'ar2en';
  else k=(w.c==='c'||w.c==='r')?'ar2en':'type';
  const c={k};
  if(k==='en2ar'){Object.assign(c,lnOpts(w,'ar'));}
  else if(k==='ar2en'){Object.assign(c,lnOpts(w,'w'));}
  else if(k==='cloze'){Object.assign(c,lnOpts(w,'w'));c.txt=lnClozeText(w);}
  else if(k==='ord'){const ref=lnSent(w).split(' ');let s=lnShuf(ref.map((t,i)=>i));if(ref.length>1&&s.every((v,i)=>ref[v]===ref[i]))s=s.reverse();c.ref=ref;c.bag=s;c.ans=[];}
  it.cur=c;
}
/* ----- session ----- */
function lnModeName(m){return m==='srs'?'مراجعة الكلمات':m==='dict'?'اسمع واكتب':'رتّب الجملة';}
function lnStart(mode){
  const e=lnE(),t=dayKey();
  if(e.newd.d!==t)e.newd={d:t,n:0};
  let q=[];
  if(mode==='srs'){
    const due=lnDue().sort((a,b)=>(e.due[a.id]||'')<(e.due[b.id]||'')?-1:1).slice(0,20);
    const left=Math.max(0,e.quota-e.newd.n);
    const nw=lnPool().sort((a,b)=>(b.c==='u')-(a.c==='u')).slice(0,left);
    q=nw.map(w=>({id:w.id,t:'new',stage:'info'})).concat(due.map(w=>({id:w.id,t:'rev',stage:'test'})));
    if(!q.length){toast('مفيش كلمات مستحقة ولا جديدة النهارده. ارجع بكرة أو زوّد الكلمات الجديدة من الإعدادات');return;}
  }else{
    const pool=lnAll().filter(w=>lnSent(w).split(' ').length>=4&&lnSent(w).split(' ').length<=22);
    q=lnShuf(pool).slice(0,5).map(w=>({id:w.id,t:mode,stage:'test'}));
    if(!q.length){toast('مفيش جمل كفاية');return;}
  }
  ui.ln.q={mode,q,i:0,ok:0,bad:0,xp:0,fb:null,paid:false};
  lnPrep(q[0]);render();window.scrollTo(0,0);
}
function lnAward(){
  const Q=ui.ln.q;if(!Q||Q.paid)return;Q.paid=true;
  const e=lnE(),t=dayKey();if(e.xd.d!==t)e.xd={d:t,x:0};
  const xp=Math.max(0,Math.min(Q.xp,LCAP-e.xd.x));
  if(xp>0){
    const before=snap();e.xd.x+=xp;
    S.entries.push({id:uid(),day:t,ts:Date.now(),kind:'lang',stat:'code',xp,gold:Math.round(xp/2),label:'إنجليزي: '+lnModeName(Q.mode)+' · '+Q.ok+' صح'});
    gainToast(xp,Math.round(xp/2));save();celebrate(before);
  }else{save();if(Q.xp>0)toast('وصلت الحد اليومي للخبرة في اللغات. المراجعة لسه بتفيدك');}
  Q.paidXp=xp;
}
function lnNext(){
  const Q=ui.ln.q;if(!Q)return;
  Q.fb=null;Q.i++;
  while(Q.i<Q.q.length){lnPrep(Q.q[Q.i]);if(!Q.q[Q.i].skip)break;Q.i++;}
  if(Q.i>=Q.q.length)lnAward();
  render();window.scrollTo(0,0);
}
function lnEnd(){lnAward();ui.ln.q=null;render();}
function lnGrade(it,ok){
  const e=lnE(),t=dayKey(),isNew=it.t==='new';
  if(it.t==='rev'||isNew){
    const b=lnBox(it.id);let nb;
    if(ok){nb=isNew?1:Math.min(5,b+1);const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+LINT[nb]);e.box[it.id]=nb;e.due[it.id]=dayKey(d);}
    else{nb=isNew?1:Math.max(1,b-2);const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+1);e.box[it.id]=nb;e.due[it.id]=dayKey(d);}
    if(isNew){if(e.newd.d!==t)e.newd={d:t,n:0};e.newd.n++;}
    if(ok)ui.ln.q.xp+=isNew?4:2;
    if(ok&&nb===4&&b<4)toast('<span>كلمة اتثبتت في ذاكرتك</span>');

function lnLCS(a,b){
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=a[i-1]===b[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);

const RCAP=80,RCMAX=3;
const rbH=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h;};
const rbB=id=>S.rd.bk.find(b=>b.id===id);
const rbNeed=c=>Math.max(1,Math.ceil(c.p/3));
const rbDone=b=>b.ch.filter(c=>c.done).length;
const rbWords=t=>String(t).trim().split(/\s+/).filter(Boolean).length;
const rbFmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const rbNorm=s=>String(s).toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]/gu,'');
function rbLev(a,b){const m=a.length,n=b.length,D=[];for(let i=0;i<=m;i++){D[i]=[i];}for(let j=1;j<=n;j++)D[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return D[m][n];}
function rbSame(a,b){const x=rbNorm(a),y=rbNorm(b);return !!x&&(x===y||(y.length>=6&&rbLev(x,y)<=1));}
function rbCloze(text){
  const toks=String(text).split(/\s+/).filter(Boolean);
  const cand=toks.map((t,i)=>({t:t.replace(/[^\p{L}\p{N}]/gu,''),i})).filter(x=>x.t.length>=5);
  if(!cand.length)return null;
  const k=cand[Math.floor(Math.random()*cand.length)],lo=Math.max(0,k.i-6),hi=Math.min(toks.length,k.i+7),w=toks.slice(lo,hi);
  w[k.i-lo]='_____';
  return {mask:(lo?'… ':'')+w.join(' ')+(hi<toks.length?' …':''),ans:k.t};
}
const rbMin=day=>S.rd.bk.reduce((a,b)=>a+(b.log[day]||0),0);
function rbStreak(){let n=0,i=rbMin(dayKey())>=10?0:1;for(;i<400;i++){if(rbMin(dayKey(daysAgo(i)))>=10)n++;else break;}return n;}
function rbStats(){const bk=(S.rd&&S.rd.bk)||[];let m=0;for(let i=0;i<7;i++){const dk=dayKey(daysAgo(i));m+=bk.reduce((a,b)=>a+((b.log&&b.log[dk])||0),0);}return {b:bk.filter(b=>b.boss).length,m};}
function rbPay(xp,label,force){

  const g=force?xp:Math.max(0,Math.min(xp,RCAP-r.rx.x));

  return g;
}
function rbRecall(){const out=[],t=dayKey();S.rd.bk.forEach(b=>b.ch.forEach((c,i)=>{if(c.done&&c.rc&&!c.rc.r&&dayKey(new Date(c.done))!==t)out.push({b:b.id,i});}));return out;}

function rbFinish(){
  const b=rbB(ui.rd.bk),i=b.ch.findIndex(c=>!c.done),c=b.ch[i],f=ui.rd.f,sum=(f.s||'').trim(),t=(f.ct||'').trim();

  if(b.pool<rbNeed(c)){toast('محتاج '+rbNeed(c)+' دقيقة قراءة مسجّلة بالتايمر');return;}

function tcInit(){
  if(!S.tc||typeof S.tc!=='object')S.tc={};
  const t=S.tc;
  if(!(t.cash>=0))t.cash=20;
  if(!(t.tot>=0))t.tot=0;
  if(!(t.t>0))t.t=Date.now();
  if(!t.n||typeof t.n!=='object')t.n={};
  if(!t.up||typeof t.up!=='object')t.up={};
  if(!t.sh||typeof t.sh!=='object')t.sh={};
  if(!t.pr||typeof t.pr!=='object')t.pr={n:0};
  if(!t.pr.sp||typeof t.pr.sp!=='object')t.pr.sp={};
  if(!Array.isArray(t.bd))t.bd=[];
  if(!t.bn||typeof t.bn!=='object')t.bn={d:'',until:0};
  if(!t.mg||typeof t.mg!=='object')t.mg={};
  if(typeof t.mgOn!=='boolean')t.mgOn=true;
  if(!(t.life>=0))t.life=t.tot||0;
  if(!t.cd||typeof t.cd!=='object')t.cd={d:'',earn:0,buy:{},sh:0,cl:{}};
}
function tcF(n){n=Math.floor(n);if(n<1000)return String(n);const u=['K','M','B','T','Qa','Qi'];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++;}return v.toFixed(v<10?2:v<100?1:0)+u[i];}
const tcF2=n=>n<10?n.toFixed(1):tcF(n);
function tcEv(now){const b=Math.floor(now/600000),e=TCE[rbH('e'+b)%TCE.length];return (now-b*600000<300000)?{e,until:b*600000+300000}:null;}
const tcSp=()=>TCP.reduce((a,p)=>a+(S.tc.pr.sp[p.id]?p.c:0),0);
const tcMc=b=>b.c*60*(S.tc.pr.sp.p2?.5:1),tcUc=u=>u.c*(S.tc.pr.sp.p3?.7:1);
function tcMult(id,now){
  const t=S.tc;let m=1+.1*(t.pr.n-tcSp());
  TCU.forEach(u=>{if(t.up[u.id]&&(u.t==='all'||u.t===id))m*=u.m;});
  const nn=t.n[id]||0;TCMS.forEach(x=>{if(nn>=x)m*=2;});m*=1+.05*TCA.filter(x=>t.life>=x).length;
  const ev=tcEv(now);if(ev&&(ev.e[1]==='all'||ev.e[1]===id))m*=ev.e[2];
  if(now<t.bn.until)m*=2;
  return m;
}
function tcInc(now){let s=0;TCB.forEach(b=>{const n=S.tc.n[b.id]||0;if(n)s+=n*b.i*tcMult(b.id,now);});return s;}
const tcCostK=(b,have,k)=>b.c*Math.pow(1.15,have)*(Math.pow(1.15,k)-1)/.15;
function tcMax(b,have,cash){let k=0;while(k<2000&&tcCostK(b,have,k+1)<=cash)k++;return k;}
function tcTick(){
  const t=S.tc,now=Date.now(),dt=Math.max(0,Math.min((now-t.t)/1000,8*3600));
  const g=tcInc(now)*dt;t.t=now;t.cash+=g;t.tot+=g;t.life+=g;tcDay();t.cd.earn+=g;
  if(dt>0){let dv=0;TCS.forEach(x=>{const h=t.sh[x.id]||0;if(h)dv+=h*tcPrice(x,now)*(x.y==null?.0001:x.y)*dt;});if(dv>0){t.cash+=dv;t.life+=dv;t.cd.earn+=dv;}}
  if(t.mgOn)TCB.forEach(b=>{if(t.mg[b.id]){for(let k=0;k<5;k++){const have=t.n[b.id]||0,c=tcCostK(b,have,1);if(t.cash>=c){t.cash-=c;t.n[b.id]=have+1;t.cd.buy[b.id]=(t.cd.buy[b.id]||0)+1;}else break;}}});
  if(dt>120&&g>0&&!ui.tcAwaySeen){ui.tcAway={m:Math.round(dt/60),g};}
  ui.tcAwaySeen=true;return g;
}
function tcDay(){const t=S.tc,dk=dayKey();if(t.cd.d!==dk)t.cd={d:dk,earn:0,buy:{},sh:0,cl:{}};}
function tcCon(){
  tcDay();const t=S.tc,dk=dayKey(),inc=Math.max(1,tcInc(Date.now()));let mx=0;TCB.forEach((b,i)=>{if((t.n[b.id]||0)>0)mx=i;});
  const b=TCB[Math.min(TCB.length-1,rbH(dk+'a')%(mx+2))],nb=3+rbH(dk+'b')%6,te=Math.max(500,Math.round(inc*1800*(1+rbH(dk+'c')%3)));
  return [{i:0,txt:'اشتري '+nb+' من «'+b.n+'»',need:nb,have:t.cd.buy[b.id]||0,rew:Math.max(100,inc*900)*(t.pr.sp.p4?2:1)},{i:1,txt:'اكسب '+tcF(te)+' النهارده',need:te,have:t.cd.earn,rew:Math.max(150,inc*1500)*(t.pr.sp.p4?2:1)},{i:2,txt:'اشتري 3 أسهم في البورصة',need:3,have:t.cd.sh,rew:Math.max(80,inc*600)*(t.pr.sp.p4?2:1)}];
}
function tcPrice(s,now){const m=now/60000,a=s.a||1;return Math.max(s.b*(a>1?.2:.45),s.b*(1+.35*a*Math.sin(m/s.p1+s.f)+.2*a*Math.sin(m/s.p2+s.f*2)));}
function tcNet(now){let v=S.tc.cash;S.tc.bd.forEach(x=>{v+=x.amt;});TCS.forEach(s=>{v+=(S.tc.sh[s.id]||0)*tcPrice(s,now);});return v;}
function tcStats(){if(!S.tc)return {p:0,w:0};return {p:S.tc.pr.n,w:Math.round(Math.log10(tcNet(Date.now())+10)*10)/10};}
function tcBonusReady(){return S.tc.bn.d!==dayKey()&&S.ledger.some(x=>x.day===dayKey());}
function tcClick(a,id,v){

  switch(a){
    case 'tcsub':ui.mn=v;render();break;

    case 'tcbuy':{const b=TCB.find(x=>x.id===id),have=t.n[id]||0;let k=ui.tcm==='max'?tcMax(b,have,t.cash):ui.tcm;if(k<1)k=1;const c=tcCostK(b,have,k);if(t.cash<c)break;t.cash-=c;t.n[id]=have+k;tcDay();t.cd.buy[id]=(t.cd.buy[id]||0)+k;save();render();break;}
    case 'tcup':{const u=TCU.find(x=>x.id===id);if(!u||t.up[id]||t.cash<tcUc(u))break;t.cash-=tcUc(u);t.up[id]=1;save();render();break;}
    case 'tcbonus':if(tcBonusReady()){t.bn={d:dayKey(),until:now+3600000};save();toast('بونص الانضباط: دخلك ×2 لمدة ساعة');render();}break;
    case 'tcsb':{const s=TCS.find(x=>x.id===id),p=tcPrice(s,now);let k=v==='max'?Math.floor(t.cash/p):parseInt(v,10);if(k<1||t.cash<p*k)break;t.cash-=p*k;t.sh[id]=(t.sh[id]||0)+k;tcDay();t.cd.sh+=k;save();render();break;}
    case 'tcss':{const s=TCS.find(x=>x.id===id),p=tcPrice(s,now),h=t.sh[id]||0;let k=v==='all'?h:parseInt(v,10);k=Math.min(k,h);if(k<1)break;t.sh[id]=h-k;t.cash+=p*k;save();render();break;}
    case 'tcmg':{const b=TCB.find(x=>x.id===id),c=tcMc(b);if(t.mg[id]||t.cash<c)break;t.cash-=c;t.mg[id]=1;save();render();break;}
    case 'tcdb':{const d=TCD.find(x=>x.id===id),amt=Math.floor(t.cash*.25);if(!d||amt<100||t.bd.length>=3)break;t.cash-=amt;t.bd.push({k:id,amt,end:now+d.m*60000});save();render();break;}

const MVNS=['ترفيه','أخرى'];
function mvInit(){
  if(!S.mv||typeof S.mv!=='object')S.mv={};

const mvF=n=>fmt(Math.round(n));
function mvWk(d){const s=new Date((d||new Date()).getTime());s.setHours(12,0,0,0);s.setDate(s.getDate()-((s.getDay()+1)%7));return dayKey(s);}
function mvWkShift(k,n){const s=new Date(k+'T12:00:00');s.setDate(s.getDate()+n);return dayKey(s);}
const mvDaysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
function mvPay(xp,label){const before=snap();S.entries.push({id:uid(),day:dayKey(),ts:Date.now(),kind:'money',stat:'money',xp,gold:Math.round(xp/2),label});gainToast(xp,Math.round(xp/2));celebrate(before);}
const mvOut=(a,b)=>S.ledger.filter(t=>t.type==='out'&&t.day>=a&&t.day<=b);
function mvEditable(m){const L=S.mv.lim[m]||{};return m===dayKey().slice(0,7)&&(!Object.keys(L).length||+dayKey().slice(8,10)<=5);}
function mvStreak(){let n=0,i=1;while(S.mv.ns[dayKey(daysAgo(i))]){n++;i++;}return n;}
function mvAvail(){const all=S.ledger.filter(t=>t.type==='save'||t.type==='inv').reduce((a,t)=>a+t.amt,0);return Math.max(0,all-S.mv.goals.reduce((a,g)=>a+g.saved,0));}
function mvHealth(){
  const m=dayKey().slice(0,7),sm=ledgerSum(m),ef=efInfo(),L=S.mv.lim[m]||{},ks=Object.keys(L).filter(k=>L[k]>0);
  const sr=sm.in>0?Math.min(1,((sm.save+sm.inv)/sm.in)/.2):0;
  const efr=ef.target>0?Math.min(1,ef.saved/ef.target):0;
  const er=ks.length?ks.filter(k=>(sm.cats[k]||0)<=L[k]).length/ks.length:0;
  const wk=mvWk(),hb=(S.mv.rv[wk]||S.mv.rv[mvWkShift(wk,-7)])?1:0,hn=Math.min(7,mvStreak())/7;
  const parts=[['الادخار',sr],['صندوق الطوارئ',efr],['التزام المظاريف',er],['العادات',(hb+hn)/2]];
  return {score:Math.round(parts.reduce((a,p)=>a+p[1]*25,0)),parts};
}

function vdClick(a,id,v){
  const V=ui.vd,f=V.fm;

    case 'vdadd':{
      const vid=vdParse(f.u||''),t=(f.t||'').trim(),d=parseInt(f.d,10)||0,ar=f.a||'study';
      if(!vid){toast('الرابط مش واضح. الصق رابط فيديو يوتيوب');break;}

      if(S.ls.mine.length>=60){toast('وصلت الحد الأقصى للفيديوهات');break;}
      S.ls.mine.push({id:uid(),v:vid,t:t.slice(0,80),a:ar,d:Math.min(300,d)});V.form=false;V.fm={};save();render();toast('اتضاف للمكتبة');break;}

<script>
/* Standalone-only features: shared study room, guilds with a weekly raid, and player profiles.

(function(){

/* ---------- guilds ---------- */
function members(gid){const m=F.gm[gid];return m&&typeof m==='object'?Object.keys(m):[];}
function myGuild(){const me=uid();if(!me)return null;const g=Object.keys(F.gm).find(k=>F.gd[k]&&F.gm[k]&&F.gm[k][me]);return g||null;}
function guildOf(u){return Object.keys(F.gm).find(k=>F.gd[k]&&F.gm[k]&&F.gm[k][u])||null;}
function guildTag(u){const g=guildOf(u);return g?'<span class="gtag">'+esc(String(F.gd[g].tag||'').slice(0,4))+'</span>':'';}
function wOf(u){const x=live.league[u];return x?nz(x.W,1e6):(u===uid()?weekXp().W:0);}
function nameOf(u,g){const x=live.league[u];if(x&&x.n)return nm(x.n);if(u===uid())return S.name;const m=g&&F.gm[g]&&F.gm[g][u];return nm(m&&m.n);}
function raid(g){const ms=members(g),hp=RAID_HP*Math.max(3,ms.length),dmg=ms.reduce((a,u)=>a+wOf(u),0);return {hp,dmg,ms,down:dmg>=hp};}
async function foundGuild(){
  const name=ui.gName.trim().slice(0,24),tag=ui.gTag.trim().toUpperCase().slice(0,4);
  if(myGuild()){toast('انت في نقابة بالفعل');return;}
  if(name.length<3){toast('اسم النقابة لازم 3 حروف على الأقل');return;}
  if(!/^[A-Z0-9؀-ۿ]{2,4}$/.test(tag)){toast('الشعار من 2 لـ 4 حروف أو أرقام');return;}
  if(totals().gold<GUILD_COST){toast('محتاج '+GUILD_COST+' ذهب');return;}
  const gid=H.db.key('gd'),me=uid();
  try{
    await H.db.set('gd/'+gid,{name,tag,owner:me,created:now()});
    await H.db.set('gm/'+gid+'/'+me,{n:String(S.name).slice(0,20),t:now()});
  }catch(e){toast('ما قدرتش أأسس النقابة. جرّب تاني');return;}
  const before=snap();
  S.entries.push({id:'g'+gid,day:dayKey(),ts:now(),kind:'spend',xp:0,gold:-GUILD_COST,label:'تأسيس نقابة '+name});
  ui.gName='';ui.gTag='';save();
  queue.push({k:'[ إشعار النظام ]',t:'تم تأسيس النقابة',b:tag,s:name});render();celebrate(before);
}
async function joinGuild(gid){
  if(myGuild()){toast('اخرج من نقابتك الأول');return;}
  if(members(gid).length>=GUILD_MAX){toast('النقابة مليانة');return;}
  try{await H.db.set('gm/'+gid+'/'+uid(),{n:String(S.name).slice(0,20),t:now()});toast('انضميت للنقابة');}catch(e){toast('ما قدرتش أنضم');}
}
async function leaveGuild(){
  const g=myGuild();if(!g)return;
  if(F.leaveG!==g){F.leaveG=g;render();setTimeout(()=>{if(F.leaveG===g){F.leaveG=null;rr();}},4000);return;}
  F.leaveG=null;
  try{
    if(F.gd[g].owner===uid()){const o={};members(g).forEach(u=>o['gm/'+g+'/'+u]=null);o['gd/'+g]=null;await H.db.update(o);toast('النقابة اتحلّت');}
    else{await H.db.set('gm/'+g+'/'+uid(),null);toast('خرجت من النقابة');}
  }catch(e){toast('حصلت مشكلة. جرّب تاني');}
}
async function kick(u){
  const g=myGuild();if(!g||F.gd[g].owner!==uid()||u===uid())return;
  if(F.kick!==u){F.kick=u;render();setTimeout(()=>{if(F.kick===u){F.kick=null;rr();}},4000);return;}
  F.kick=null;try{await H.db.set('gm/'+g+'/'+u,null);toast('اتشال من النقابة');}catch(e){toast('ما قدرتش أشيله');}
}
function claimRaid(){
  const g=myGuild();if(!g)return;const r=raid(g);
  if(!r.down){toast('الزعيم لسه عايش');return;}
  if(now()-(S.raidT||0)<6*864e5){toast('أخدت مكافأة الغارة الأسبوع ده');return;}
  S.raidT=now();S.entries.push({id:'raid'+now(),day:dayKey(),ts:now(),kind:'raid',xp:0,gold:RAID_GOLD,label:'مكافأة غارة النقابة'});
  save();render();toast('<span class="g">+'+RAID_GOLD+' ذهب</span>');
}
window.vGuild=function(){
  if(!isMember())return '<section class="panel"><div class="ptitle">النقابات</div><p class="hint" style="margin:0">ادخل الشبكة الأول بكود الدخول، من قسم الشبكة.</p></section>';
  const g=myGuild(),me=uid();let h='';
  if(g){
    const gd=F.gd[g],r=raid(g),owner=gd.owner===me,claimable=r.down&&now()-(S.raidT||0)>=6*864e5;
    h+='<section class="panel"><div class="ptitle">'+esc(String(gd.name||''))+'<span class="gtag">'+esc(String(gd.tag||''))+'</span><span class="sp"></span><span class="side">'+N(r.ms.length+'/'+GUILD_MAX)+' عضو</span></div>'
      +'<div class="tgt" style="margin:0"><span>المؤسس</span><b>'+esc(nameOf(gd.owner,g))+'</b></div></section>';
    h+='<section class="panel'+(r.down?'':' inc')+'"><div class="ptitle">غارة الأسبوع</div><div class="mon">'+monSvg({h:0,boss:true},'')+'<div><div class="mn boss">زعيم النقابة</div><div class="ed">صحته '+N(r.hp)+' · بتزيد مع عدد الأعضاء</div><div class="ed">كل خبرة بيكسبها أي عضو في آخر 7 أيام بتضربه</div></div></div>'
      +'<div class="barcap" style="margin:12px 0 5px"><span>الضرر</span><span>'+N(Math.min(r.dmg,r.hp)+' / '+r.hp)+'</span></div>'+bar(Math.min(r.dmg,r.hp),r.hp,'var(--bad)')
      +(r.down?'<p class="vlab ok" style="margin-top:12px">الزعيم اتهزم</p>':'<p class="hint" style="margin-top:12px">فاضل '+N(r.hp-r.dmg)+' خبرة علشان تهزموه.</p>')
      +'<button class="btn '+(claimable?'fill ':'')+'block" data-act="graid"'+(claimable?'':' disabled')+'>'+(claimable?'استلم '+RAID_GOLD+' ذهب':r.down?'استلمت مكافأة الأسبوع':'المكافأة '+RAID_GOLD+' ذهب لكل عضو')+'</button></section>';
    const ms=r.ms.slice().sort((a,b)=>wOf(b)-wOf(a));
    h+='<section class="panel"><div class="ptitle">الأعضاء</div>';
    ms.forEach((u,i)=>{const w=wOf(u),pct=r.dmg?Math.round(w/r.dmg*100):0;
      h+='<div class="lb'+(u===me?' me':'')+'"><span class="pos'+(i===0?' g':'')+'">'+(i+1)+'</span><div data-act="prof" data-id="'+esc(u)+'" style="cursor:pointer"><div class="nmx">'+esc(nameOf(u,g))+(u===gd.owner?' · المؤسس':'')+(u===me?' (انت)':'')+'</div><div class="w">ساهم بـ '+pct+'% من الضرر</div></div><span class="num" style="font-weight:700;color:var(--glow)">'+w+'</span>'
        +(owner&&u!==me?'<div class="acts"><button class="btn sm'+(F.kick===u?' bad':'')+'" data-act="gkick" data-id="'+esc(u)+'">'+(F.kick===u?'تأكيد الطرد':'طرد')+'</button></div>':'')+'</div>';});
    h+='</section>';
    h+='<button class="btn bad block" data-act="gleave" style="margin-bottom:14px">'+(F.leaveG===g?(owner?'تأكيد حل النقابة نهائيًا':'تأكيد الخروج'):(owner?'حل النقابة':'اخرج من النقابة'))+'</button>';
  }else{
    const gold=totals().gold,ok=gold>=GUILD_COST;
    h+='<section class="panel"><div class="ptitle">أسس نقابة</div><div class="tgt" style="margin:0 0 6px"><span>تكلفة التأسيس</span><b class="num" style="color:var(--gold)">'+GUILD_COST+'</b></div><div class="tgt" style="margin:0 0 12px"><span>ذهبك</span><b class="num">'+gold+'</b></div>'
      +(ok?'':'<p class="hint">محتاج '+N(GUILD_COST-gold)+' ذهب كمان. الذهب بييجي من المهام والبوابات والأسئلة.</p>')
      +'<label class="lbl" for="gn" style="margin-top:0">اسم النقابة</label><input class="in" id="gn" maxlength="24" value="'+esc(ui.gName||'')+'">'
      +'<label class="lbl" for="gt">الشعار (2 لـ 4 حروف، زي TNT)</label><input class="in lt" id="gt" maxlength="4" value="'+esc(ui.gTag||'')+'">'
      +'<button class="btn fill block" data-act="gfound" style="margin-top:14px"'+(ok?'':' disabled')+'>أسس النقابة</button></section>';
  }
  const gs=Object.keys(F.gd).filter(k=>F.gd[k]&&typeof F.gd[k]==='object').map(k=>{const r=raid(k);return {k,d:F.gd[k],n:r.ms.length,W:r.ms.reduce((a,u)=>a+wOf(u),0)};}).filter(x=>x.n>0).sort((a,b)=>b.W-a.W);
  h+='<section class="panel"><div class="ptitle">ترتيب النقابات<span class="sp"></span><span class="side">بخبرة الأعضاء في آخر 7 أيام</span></div>';
  if(!gs.length)h+='<p class="hint" style="margin:0">لسه مفيش نقابات. كن أول مؤسس.</p>';
  gs.forEach((x,i)=>{h+='<div class="lb'+(x.k===g?' me':'')+'"><span class="pos'+(i===0?' g':'')+'">'+(i+1)+'</span><div><div class="nmx">'+esc(String(x.d.name||''))+'<span class="gtag">'+esc(String(x.d.tag||''))+'</span></div><div class="w">'+N(x.n+'/'+GUILD_MAX)+' عضو · المؤسس '+esc(nameOf(x.d.owner,x.k))+'</div></div><span class="num" style="font-weight:700;color:var(--glow)">'+x.W+'</span>'
    +(!g&&x.n<GUILD_MAX?'<div class="acts"><button class="btn sm fill" data-act="gjoin" data-id="'+esc(x.k)+'">انضم</button></div>':'')+'</div>';});
  h+='</section>';
  return h;
};

/* ---------- player profile ---------- */
function openProfile(lid,pid){
  const me=uid();let x=null,c=null;
  if(lid&&live.league[lid])x=live.league[lid];
  if(lid===me||(!lid&&!pid)){x=leagueDoc();}
  if(pid){const n=network()[pid];if(n){c=n.card;if(!lid&&n.lid){lid=n.lid;x=live.league[lid]||x;}}}
  const src=x||c;if(!src){toast('مفيش بيانات للاعب ده');return;}
  const name=nm(src.n),W=nz(src.W,1e6),s=Array.isArray(src.s)?src.s:[1,1,1,1,1],w=Array.isArray(src.w)?src.w:[0,0,0,0,0];
  const bs=x&&Array.isArray(x.bs)?x.bs.filter(k=>EXAMS0.find(e=>e.id===k)):[];
  const ev=x&&Array.isArray(x.ev)?x.ev:[],g=lid?guildOf(lid):null,dv=divOf(W),isMe=lid===me;
  const rc=pid&&!isMe?record(pid):null;
  let h='<div class="qzw"><div class="qzt"><div><div class="ptitle" style="margin-bottom:4px">بروفايل الصياد</div><div class="et" style="font-size:22px">'+esc(name)+(g?'<span class="gtag">'+esc(String(F.gd[g].tag||''))+'</span>':'')+'</div><div class="ed">الرتبة '+esc(String(src.R||'E'))+' · المستوى '+N(nz(src.L,999)||1)+' · <span style="color:'+dv[2]+'">'+dv[1]+'</span>'+(g?' · '+esc(String(F.gd[g].name||'')):'')+'</div></div><button class="btn sm" data-act="pfclose">إغلاق</button></div>';
  h+='<div class="tiles"><div class="tile"><div class="v num">'+nz(src.P,1e7)+'</div><div class="k">القوة</div></div><div class="tile"><div class="v num">'+(nz(src.elo,4000)||1000)+'</div><div class="k">تصنيف المبارزات</div></div><div class="tile"><div class="v num">'+nz(src.k,9999)+'</div><div class="k">أيام متتالية</div></div></div>';
  h+='<div class="tiles"><div class="tile"><div class="v num">'+W+'</div><div class="k">خبرة الأسبوع</div></div><div class="tile"><div class="v num">'+nz(src.a,999)+'</div><div class="k">جيش الظلال</div></div><div class="tile"><div class="v num">'+nz(src.f,9999)+'</div><div class="k">أعلى طابق</div></div></div>';
  const mx=Math.max(1,...s.map(v=>nz(v,999)));
  h+='<section class="panel"><div class="ptitle">القدرات</div>'+STATS.map((st,i)=>'<div class="statrow"><span class="n">'+st.name+'</span>'+bar(nz(s[i],999),Math.max(5,mx+1),st.c)+'<span class="lv num" style="color:'+st.c+'">'+nz(s[i],999)+'</span></div><div class="w" style="font-size:12px;color:var(--mute);margin:2px 0 0;padding-inline-start:80px">خبرة الأسبوع: '+nz(w[i],1e5)+'</div>').join('')+'</section>';
  if(bs.length)h+='<section class="panel"><div class="ptitle">زعماء اتهزموا</div><ul class="log">'+bs.map(k=>{const e=EXAMS0.find(z=>z.id===k);return '<li><span>'+esc(e.title)+' · '+esc(e.sub.split(':')[0])+'</span></li>';}).join('')+'</ul></section>';
  if(ev.length)h+='<section class="panel"><div class="ptitle">آخر الإنجازات</div><ul class="log">'+ev.slice(0,8).map(e=>'<li><span>'+esc(String(e.l||'').slice(0,60))+'</span><span class="w">'+agoText(nz(e.ts,4e12))+'</span></li>').join('')+'</ul></section>';
  if(rc&&(rc.w||rc.l))h+='<p class="hint">مبارزاتك ضده: '+N(rc.w)+' فوز، '+N(rc.l)+' خسارة</p>';
  if(pid&&!isMe&&network()[pid])h+='<button class="btn fill block" data-act="pfduel" data-id="'+esc(pid)+'">بارزه بالكارت</button>';
  if(!x)h+='<p class="hint">ده كارت متضاف بالكود، فبيانات الإنجازات مش ظاهرة.</p>';
  h+='</div>';
  pf.innerHTML=h;pf.classList.add('on');document.body.style.overflow='hidden';pf.scrollTop=0;
}
function closeProfile(){pf.classList.remove('on');pf.innerHTML='';document.body.style.overflow='';}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'srenter':enterRoom();break;
    case 'srleave':leaveRoom();break;
    case 'gfound':foundGuild();break;
    case 'gjoin':joinGuild(id);break;
    case 'gleave':leaveGuild();break;
    case 'gkick':kick(id);break;
    case 'graid':claimRaid();break;
    case 'prof':openProfile(id||'',b.dataset.v||'');break;
    case 'pfclose':closeProfile();break;
    case 'pfduel':closeProfile();ui.tab='army';ui.armySub='net';startDuel(id);break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='gn')ui.gName=t.value;else if(t.id==='gt'){t.value=t.value.replace(/\s/g,'').toUpperCase();ui.gTag=t.value;}});
render();
})();
</script>
</body>
</html>
