hair, skin, sebaceous glands, nervous tissues b) Mesodermal: muscle, bone, cartilage, teeth (appear on X-ray) c) Endodermal: intestinal, thyroid epithelium, bronchi\nImmature teratoma: contain mainly neural glial tissues.\nMonodermal& highly specialized teratoma\n-Struma ovarii: Uncommon; mostly benign - has thyroid tissue → hyperthyroidism in 25-35%\n-Carcinoid $ (rare): Secrete serotonin → flushing, hypotension, diarrhea occur without hepatic mets (drainage to systemic blood)\nB- Extraembryonic\nEndodermal sinus tumor (EST): extremely malignant, Schiller\nDuval bodies (cells around vascular core),Produce alpha fetoprotei\nNon-gestational choriocarcinoma: secrete hCG →precocious pseudo-puberty. Chemo resistant→poor prognosis","g1",13,""],[144,"Fibroma, thecoma and Sertoli-Leydig cell tumors","(transfer through lymphatics)]\nThecoma: Rare, benign, solid& unilateral &secretes estrogen\n2-Sertoli-Leydig cell tumors\n(Androblastomas)\nThey are functioning tumors→ secrete androgen\n-Defeminization: amenorrhea, breast atrophy, changed body contour\n-Followed by masculinization , hirsutism, cliteromegaly, deep voice\n3- Gynandroblastoma: rare tumor with both estrogenic + androgenic effect","g1",13,""],[145,"Secondary tumors of the ovary and Krukenberg tumor","Secondaries of the ovary 5% Gonadoblastoma\nMay be from: 1. Genital→ tube, endometrium, cervix, vagina, vulva, the other ovary\n2. Extragenital → breast, GIT, thyroid, lymphomas, carcinoid tumor\nMay be: 1. Typical: similar to original tumor\n2. Atypical: Krukenbera tumor: -Solid, moderate size, bilateral, mobile\n-Microscopic: mucin-filled signet-ring cells -1ry is stomach (75%), colon, GB, breast\n-1ry tumor may be silent&asymptomatic (endoscopy needed)\n•Benign (50% turn malignant), a combination of germ cell & sex cord / stroma\n•From a dysgenetic gonads with Y-cell line\n(ovarian dysgenesis or testicular feminization\n$). Thus prophylactic gonadectomy is done","g1",13,""],[144,"Clinical picture and investigations of benign ovarian neoplasms","•C/P: Symptoms:\n-Asymptomatic: discovered incidentally by examination or by U/S\n-Abdominal swelling\n- Lower abdominal pain (if complicated)\n-Pressure manifestations: dyspepsia (commonest symptom), frequency of micturition.\n-Menstrual disorders: if functioning (theca cell tumor & Brenner)\nSigns:\n-Bimanual examination: mobile, cystic, separate from uterus (movement of cervix not transmitted to mass)\n-Abdominal:1-Inspection: symmetrical abdominal enlargement.\n2- Palpation: central, mobile + well defined upper & lateral borders.\n•Inv: -US ( gold standard): confirm diagnosis, differentiate benign from malignant/Uni or bilateral / cystic or solid / uni or multilocular\n-Tumor markers: to exclude malignancy\n-Laparoscopy: if U/S inconclusive &differentiate it from PID or myoma","g1",14,""],[144,"Complications of ovarian swellings (list)","•Complications ovarian swellings\n1. Torsion (commonest complication)\n2. Hemorrhage 3. Rupture\n4. Infection 5. Incarceration\n6. Malignancy: histopathology is definitive","g1",14,"P"],[145,"Malignant ovarian neoplasms: clinical picture, spread and investigations","•C/P: Symptoms(majority are asymptomatic): symptoms are vague\nAcute presentation Subacute presentation\n- Complicated mass (torsion, rupture or hemorrhage)\n-Bowel obstruction (nausea & vomiting → accidental discovery on imaging\n-Pelvic & abdominal symptoms\n(dyspepsia; urgency)\n-Adnexal mass (discovered accidentally)\n-Postmenopausal bleeding\nSigns:\n-General: Cachexia, Wirchow LN, secondaries, Pleural effusion (Meig's $) & Hormone effects (E, testosterone, thyroxin, serotonin)\n-Abdominal:a)Pelviabdominal mass:Mobile or fixed/Cystic or solid b)Ascites, liver mets & umbilical nodule (Sister Mary Josef nodule)\n- Local: mass in adnexa (movement of uterus is not transmitted to mass) or DP or uterovesical pouch, 2ries in vulva or vagina\n•Spread\n1. Transcoelomic spread: most common & earliest mode of spread.\n2. Lymphatic spread: pelvic & para-aortic LN +/- Wirchow LN\n3. Hematogenous: uncommon, Spread to organ parenchyma e.g. (lungs/liver) occurs in only 2-3%\n•Inv: 1-US (best)\n2-Other imaging: Plain chest film, CT, MRI, Barium swallow, meal - esp if suspected\nKrukenberg, Mammography , IVP\n3-Tumor Markers: a)Antigens\n-CA-125: epithelial serous tumors (normal < 35 u/ml)\n-CA19.9 ↑ in mucinous malignant tumors\n-CEA: Brenner, endometrioid, serous tumors b) Enzymes: ALK-P, LDH, transferases (esp in dysgerminomas) c)Hormones: -β-HCG & a-Fetoprotein (germ CT)\n-Estrogen & Androgens (functioning tumors)\n-Thyroxin & 5-HT (monodermal germ CT)","g1",14,""],[144,"Treatment of benign ovarian neoplasms","•ttt: 1-Ovarian cystectomy (better laparoscopy):\n-Enucleation of cyst leaving healthy ovarian tissue in young uncomplicated, well demarcated cyst (Dermoid)\n-Oophorectomy if larger cysts, because of Difficult enucleation or no adequate healthy residual ovarian tissue or fear of malignancy\n2-Ovariectomy (Ovariotomy): laparoscopic or by laparotomy\n-Indications: young, complicated, or if ovarian tissue is destroyed\n-3 clamps on infundibulopelvic ligament, ovarian ligament & mesovarium to remove whole ovary\n-Before removal of one ovary; inspect other ovary (healthy or not)\n-All tissues should be sent for histopathology\n- Ovariotomy is removal of a pathogenic ovary (more correct name) while oophrectomy is removal of healthy ovary\n-Tapping under US carries risk of dissemination of contents (spread of malignancy or infection)\n3- Pan-hysterectomy: In older patient who have completed their family","g1",15,""],[145,"Screening, prophylactic oophorectomy and treatment of ovarian cancer","•ttt\n1-Screening:\n-Periodic bimanual examination. A palpable post- menopausal ovary→ investigate.\n-Tumor markers -combination of menopausal status, CA125 & US features is used to assess \"risk of malignancy index [RMI]\"\n-Genetic screening; testing for BRCA1 or BRCA2 mutations\n2-Prophylactic oophorectomy in\n-Any ovarian swelling > 6-8 cm or persistent > 3 months\n-Post-menopausal Dysgenetic gonad particularly with Y chromosome\n-Patients who are BRCA 1 or BRCA2 mutation carriers\n3-Surgical a) Early (I-Ila): Exploratory laparotomy +/- chemotherapy\n-Midline infra-umbilical incision (can be extended up if needed)\n-Peritoneal washing for cytology (or peritoneal fluid if ascites )\n-Systematic exploration intraabdominal surfaces/viscera/diaphragm\n- (ТАН &BSO) + tumor should be removed intact\n-Bilateral pelvic & para-aortic LN dissection\n-Infracolic omentectomy & appendectomy (esp in mucinous)\n-Any suspicious areas or adhesions should be biopsied.\n- Conservative surgery: unilateral oophrectomy if Young, germ cell, stage la, Wedge biopsy of other ovary→ no malignancy & Strict follow up b)Advanced/late\n-Initial debulking: Remove all cancer (leaving only residual small tumor deposit < 1 cm) = optimum cytoreduction\n-Interval debulking: Neo-adjuvant chemotherapy before debulking surgery to tumor bulk (esp with massive ascites & upper abdominal metastasis)\n-2nd look surgery: To asses residual tumor, Replaced now by spiral CT & MRI, together with CA125\n-Postop chemotherapy (platinum based)","g1",15,""],[144,"Complications of ovarian swellings: torsion, hemorrhage, rupture, infection, incarceration","Torsion (commonest complication) Hemorrhage Rupture Infection Incarceration\n•twist or axial rotation of pedunculated tumor\n•Predisposing factors\n-Moderate sized / Long pedicle / Mobile\n-Pregnancy/Puerperium (due to displacement of tumor)\n•Precipitating factors\n-Sudden movement of patient\n-External abdominal trauma or PV\n•C/p: -Sudden severe abdominal pain\n(acute abdomen)\n-Shock (neurogenic / hemorrhagic) & vomiting (peritonism)\n•ttt (laparotomy): -Adnexectomy if gangrenous (avoid untwisting of pedicle)\n-Ovarian cystectomy if healthy ovarian tissue are still present\n•Etiology:\n-external trauma\n-torsion\n-spontaneously in malignancy\n(erosion of vessels) or in pregnancy\n•C/p: tumor is tender & tense, shock, acute abdomen.\n•ttt: resuscitation + laparotomy\n(ovariotomy)\n•Etiology: hemorrhage, torsion or trauma (PV or labor)\n•Effects: rupture →\n1-Papillary cyst→ dissemination of papillae & ascites\n2-Mucinous cyst→ myxoma peritoneii\n3-Dermoid cyst→ chemical\n(aseptic) peritonitis\n4-Hemorrhagic cyst→ intraperitoneal hge\n5-Infected →septic peritonitis\n6-Malignant cyst→ dissemination of malignancy\n•ttt: resuscitation + laparotomy\n(ovariotomy)\n•Etiology:\n-In puerperium\n(following abortion or labour),\n-From a nearby infected organ (as appendicitis or salpingitis)\n- Following torsion\n(due to adhesions)\n•C/p:fever, tachycardia, tachypnea, tumor becomes tender\n•ttt: antibiotic coverage & laparotomy for drainage\n•Etiology: entrapment within pelvis due to adhesions or pregnancy\n•C/p: exaggerated pressure effects on rectum & bladder\n•ttt: laparotomy, adhesiolysis & disimpaction","g1",16,"P"],[145,"FIGO staging of ovarian cancer","•Stages of ovarian cancer (Surgical FIGO staging, 2014) give short note on stage 1\nI- Ovary (85% 5ysr): tumor confined to ovary or fallopian tube: -A: 1 ovary -B: 2 ovaries\n-C: Ia or Ib+ Any of (C1:surgical spill,C2: ruptured capsule or tumor on surface, C3:malignant cells in ascites/peritoneal wash)\nII.Pelvic (75% 5ysr): tumor involve ovary +pelvic extension: -A: tube or uterus -B: any other pelvic organ\nIII. abdominal (35% 5ysr): spread outside pelvis: -A:A1:+ve retroperitoneal LN, A1i: mets up to 10mm,A1ii: >10mm\nA2: microscopic implants\n-B: Macroscopic implants < 2 cm -C: implants > 2cm ± liver &spleen capsule without parenchymal involvement\nIV.Distant (15% 5ysr): excluding peritoneal metastasis : -IVa: lung (pleural effusion with +ve cytology)\n-IVb: extra-abdominal organs including inguinal & extral abdominal LN + parenchyma mets","g1",16,"PI"],[145,"Sonographic features suggestive of ovarian malignancy","•Consistency (solid or partially cystic/solid) / large > 8 cm\n•Bilaterality/Multilocularity/ irregular contour/multiple septae\n•Presence of ascites / Evidence of metastases\n•Doppler (high ovarian blood flow, pulsatility & resistance indices)","g1",17,"I"],[145,"Features suggesting malignancy in ovarian tumor","1. History & symptoms 2. Examination 3. Investigations 4.Intra-operativ(as exam+\n•Extremes of age\n•Cachexia& Anorexia\n•+ve family history\n•Progressive abdominal enlargement\n•LL edema\n•Tumor is bilateral, fixed, solid\n•mets, enlarged LN\n•Nodules in Douglas\nPouch (DP)\n•Presence of ascites\n•↑ESR\n•Tumor markers +ve\n•U/S criteria (+ Doppler)\n•Biopsy (pathology) is definitive: Laparoscopy\n/Laparotomy\n•Nodules in omentum, peritoneum\n•Papilla on outer surface\n•Areas of hge& necrosis\n•Large blood vessels on surface\nNb Exploratory laparotomy is for diagnosis, surgical staging & 1ry surgical treatment","g1",17,"I"],[145,"Prognostic factors in ovarian cancer","1. Pathologic Factors: -Histological type: clear cell carcinomas have the worst prognosis.\n-Grade of the lesion (I, II,III)\n2. Clinical Factors: Age,Stage, Extent of residual disease after surgery (most significant factor)\n5-year survival: Poor: due to -Late symptoms / Late diagnosis -Rapid growth\n-Rapid spread by peritoneum & lymphatics (I→85%, II→75%, III→35%, IV→15%)","g1",17,""],[145,"Risk of malignancy index (RMI)","•Risk of malignancy index: is a clinical tool used for risk stratification of ovarian lesions, to guide further ttt\n•menopausal status (M), ultrasound features of the lesion (U), and CA-125 level.\n•RMI = U x M x CA-125 (U/ml): -Uscore: 0 = no features of malignancy on US, 1= 1 feature, 3 = >=2 features\n-M score: 1 = premenopausal, 3 = postmenopausal\n•RMI score > 200: high risk, with referral to specialist gynecological cancer service& staging CT advised\n•RMI 25-200: intermediate risk, with MRI recommended\n•RMI <25: low risk, with repeat clinical assessment advised, with MRI if US features are borderline\n•Cancer cervix is radiosensitive while cancer ovary is chemosesnitive\nTrophoblastic neoplasia","g1",17,""],[146,"Define gestational trophoblastic neoplasm","Abnormal proliferation of trophoblasts, follows molar or non-molar pregnancy","g1",17,""],[146,"Risk factors of GTN","•Asian, American Indian & African ancestry •Advanced maternal age (>40 years).\n•Prior molar pregnancy if: large uterus, hCG >100,000 mIU/mL & bilateral theca lutein cysts","g1",17,""],[146,"Classification of GTN and choriocarcinoma","1-Invasive mole: -15-20% molar pregnancy→ invading myometrium\n-They are locally invasive tumors & only 5% are metastatic\n2-Choriocarcinoma: Extremely malignant with avillous pattern, more common after complete than partial mole & metastatic: lung (80%), Vagina (30%), CNS (10%) & Hepatic (10%)\n3-Placental site trophoblastic tumor (PSST): From intermediate trophoblast; locally malignant produces HPL & hCG & chemoresistant.","g1",18,""],[146,"Clinical picture of GTN","1-History of recent termination of Vesicular Mole or pregnancy\n2-Symptoms: •Bleeding (rarely amenorrhea due to a very high hCG) Weeks/months from TOP\n(rarely occurs up to 2 years)\n•Pelvic swelling, Acute abdominal pain if perforation of uterus or complicated ovarian cyst\n•Metastasis: lung (dyspnea), Vaginal (bleeding) ,CNS (↑ICP) & Hepatic (Jaundice)\n3-Signs: •General : cachexia, metastasis, hyperthyroidism (chorionic thyrotropin)\n•Abdominal: pelviabdominal mass\n•Local: Uterus (enlarged), Ovaries (theca lutein cysts), Vagina (sub urethral nodules) → Avoid biopsy (hemorrhagic)","g1",18,""],[146,"Investigations of GTN","•↑HCG: Diagnostic & for follow up after chemotherapy, Also CBC, thyroid, liver function tests\n•Imaging: Pelvic US, Chest X ray & Doppler (highly vascular)\n•Uterine curettage: limited role, reserved for cases with PPH & ↑HCG","g1",18,""],[146,"FIGO staging of GTN","•Stage I→ ↑hCG: tumor confined to the uterine corpus\n•Stage II→Tumor outside uterus,but localized to pelvis •Stage III→Pulmonary metastase\n•Stage IV→ Metastatic disease outside of lungs & pelvis","g1",18,""],[146,"WHO prognostic risk assessment of GTN","0 1 2 4\nAge (years) <40 >40\nAntecedent Pregnancy Mole Abortion Term\nInterval from pregnancy(months)\n<4 4-7 7-13 >13\nPre-Treatment hcg <1,000 <10,000 <100,000 >100,000\nLargest Tumor Size 3-<5 cm >5 cm\nSite of Metastases Lung Spleen/Kidney GI Liver/Brain No. of Metastases 1-4 5-8 >8\nPrevious Failed Chemotherapy Single Drug Two ar More","g1",18,""],[146,"Incidence and types of choriocarcinoma","Rare (1/20,000-1/40,000. It may occur: -Gestational after VM (50%); abortion / EP (25%); term (25%)\n-Non-gestational: ovarian germ cell choriocarcinoma (rare)","g1",18,""],[146,"Treatment of GTN","Low-risk (good prognosis, survival rate 100%)\nHigh-risk GTN (poor prognosis, survival 70%)\n•Compromise FIGO stage I, stage II or III (WHO score <7)\n•Usually cured by single-agent chemotherapy\n1-Methotrexate 50 mg/m2 IM +\nLeucovorin (folinic) rescue: given 24h after each MTX dose\n2-Actinomycin D\n•Hysterectomy: needed in PSTT as they are chemo-resistant\n•Compromise FIGO stage IV, stage II or III (WHO score ≥ 7)\n•Respond only to multi-agent chemotherapy\n1-EMA(Etoposide, Methotrexate, Actinomycin-D) or 2-EMA- CO (Cyclophosphamide, Oncovin)\n•Further management: -Surgery: resect foci of chemotherapy- resistant disease or to control complications as bleeding or infection\n-Brain metastasis: intrathecal chemotherapy +/-radiotherapy\n•Future fertility: -COC for one year, Barriers are less effective, IUCD cause irregular bleeding together with the risk of perforation.\n-Allow pregnancy after 12 months of normal hCG levels.\n-Pregnancy is monitored in 1st trimester to detect recurrence\n-After delivery, check hCG at 6-wks postpartum to ensure complete remission& absence of occult GTN","g1",19,""],[145,"Tumor markers secreted by germ cell tumors","HCG alpha-FP\nEmbryoma, embryonal carcinoma + +\nChoriocarcinoma, dysgerminoma + - Endodermal sinus tumor (EST) - +\nVulvar & vaginal disorders","g1",19,""],[147,"Classification of vulvar disorders","•non-neoplastic epithelial disorder:1-Squamous cell hyperplasia (formerly hyperplastic-leukoplakia\n2. Lichen sclerosus (formerly strophic type) 3-Other dermatosis:psoriasis, lichen planus scabies\n•Vulvar intraepithelial neoplasia:1-Squamous(VIN I,II,III) 2-Non-squamous:Paget/ Melanoma\n•Invasive vulvar tumors •Mixed Non-neoplastic & neoplastic epithelial disorders","g1",19,""],[147,"Benign vulvar lesions","1-prutitis vulvae 2- non neoplastic epithelial disorders of vulva 3-vulvular ulcers\n4-non neoplastic swellings (cong, traumatic, inflammatory, retention)\n5-neoplastic swellings: benign (cystic, solid tumors), malignant tumors","g1",19,"P"],[147,"Causes of vulvar ulcers","•traumatic •syphilitic (painless)\n•TB (painful) •herpetic (multiple, very painful)\n•chancroid, lymphagranuloma venerum, granuloma inguinal\n•behcet (multiple, recurrent, vulvular& oral ulcers)\n•carcinoma ulcer (raised everted edge, indurated base, floor with necrotic tissue)","g1",19,"P"],[147,"Vulvar dystrophy","•Def: chronic disorder of vulval epithelial growth (dystrophy = poor nutrition) that involves also perineal & peri-anal skin\n•Etiology: Chronic irritation (candidiasis), Autoimmune or metabolic disturbance (DM), Local (↑elastase), Nutritional deficiency\n(pernicious anemia, folic acid & vit B-def) & Environmental & familial factors\n•Cp:-Age: postmenopausal, but may occur in pubertal females\n-Symptoms: asymptomatic, itching , Anal discomfort , Dyspareunia\n-Signs: White or red patches, ulceration, shrinkage of vulva (Kraurosis vulvae)\n•inv: -To exclude malignancy: colposcopic directed biopsy\n-To search for a cause: vaginal swabs for candidiasis, GTT\n•ttt:\n1. General: ttt of cause & sedatives\n2. 1st line therapy: steroids\n3. Surgical: Wide local excision or simple vulvectomy if associating atypia","g1",20,""],[147,"Vulvar intraepithelial neoplasia (VIN)","A) Squamous type (VIN)\n•Cp:-Age\n1-Postmenopausal (HPV-ve) → unifocal lesion\n2-Premenopausal (HPV +ve) → multifocal lesions\n-Symptoms: Asymptomatic, pruritus & dyspareunia\n-Signs\n1-Change in color →white / pigmented ± fissuring\n2-Change in contour → flat/raised plaques\n•Classification (VIN 1,2, 3)\n•Inv: Colposcopic biopsy.\n•ttt: excision OR simple vulvectomy (skinning)\nB) Non-Squamous type:\nPaget disease\n(Adenocarcinoma in situ)","g1",20,""],[147,"Invasive vulvar carcinoma: risk factors, pathology and treatment","•Prevalence & risk factors\n-4th most common gynecologic cancer, 5% of female genital tract malignancies, mean age is 65 years\n•Predisposing factors:-\n1. Vulvar dystrophies - VIN (HPV-related esp 16 & 33)\n2. Immunodeficiency/ smoking\n/Associating CIN in 20% of cases\n•Pathology\n-Macroscopic: Cauliflower or papillary ( verrucous) mass\n-Microscopic: 1. Squamous Cell Carcinoma\n(usually well differentiated)\n2. Malignant melanoma (5-10% of cases) - pigmented-\n3.Basal cell carcinoma (2%)-rodent ulcer\n4. Adenocarcinoma of Bartholin gland - very rare\n•ttt:\n-Surgery: Radical vulvectomy\n-Adjuvant chemoradiation","g1",20,""],[147,"Vaginal neoplasm","•Age: 60-70 years,\n1% (5th genital tract tumor)\n•Pathology:\nSquamous cell carcinoma\n(commonest) - adenocarcinoma\n•ttt:\n-If early: Radical hysterectomy & removal of affected part of vagina\n-If advanced: radiotherapy","g1",20,""],[147,"Diagnosis, mode of spread and treatment of vulvar carcinoma","Diagnosis: a) symptoms:long standing pruritic followed by vascular lump+/- vulvular pain, bleeding, discharge b)signs: 1-inspection: raised, ulcerated pigmented warty lesions 2-colposcopic exam to exclude CIN, VIN 3-groin LNs to exclude lymph spread c) inv: definitive diagnosis via biopsy under local anesthesia\nSpread: 1)direct: to adjacent structures (vagina, urethra, anus) 2)lymphatic permeation to regional LNs (common) 3-hematogenous\nTtt: 1-radical vulvectomy + bilateral enbolic groin dissection +/-pelvic lymphadenectomy , can be replaced by postop pelvic& groin radiation","g1",20,""],[121,"Enumerate risk factors of sexually transmitted diseases (STDs)","•Young < 25 y •Multiple partners •Low socioeconomic •History or infection of 1 STD","g2",2,"I"],[121,"Mention causative organisms of STDs and enumerate 4 viral STDs","A. Bacteria: N. Gonorrhea, bacterial vaginosis, chancroid, granuloma inguinale\nB. Viral: Human immune deficiency virus (HIV), human papilloma virus (HPV), Herpes\nSimplex virus (HSV), Molluscum contagiosum & hepatitis B virus (HBV)\nC. Chlamydia trachomatis, Lymphogranuloma venereum D. Spirochetes: Syphilis\nE. Protozoans: Trichomonas vaginalis F. Ecto-parasites: pediculosis pubis& scabies","g2",2,"P"],[121,"Mention principles for diagnosis of STDs","•Investigation both partners\n•Search for other STD (Chlamydia, gonorrhea, syphilis, hepatitis B, HIV & hepatitis C(","g2",2,""],[121,"Mention principles for management of STDs","•Abstinence from coitus till treatment is completed\n•Proper management of acute cases before becoming chronic\n•Sexual partners are traced •Search for risk factors in recurrence","g2",2,""],[124,"Gonorrhea","•Bacteriology\n-N. gonorrhea, bacterium infecting columnar & transitional epithelium\n-Transmission is mainly through sexual intercourse\n•Pathology\n-1ry sites (Sanger ∆)\n: 1-Skene's glands & urethra\n2-Bartholin gland\n3-Endocervix (main reservoir)\n-Other sites:\nRectum, Oro-pharynx, ophthalmia neonatorum\n•Spread\n-Local: Vulvovaginitis\n(prepubertal or postmenopausal), PID, pelvic or generalized peritonitis & Fitz-Hugh-Curtis $\n-Dissemination (<3%): arthritis, meningitis, endocarditis, septicemia\n•C/P: -IP: 2-7 days\n-asymptomatic\n-Acute cervicitis: angry red cervix +\nmucopurulent discharge\n-PID: lower abdominal pain, fever or chronic → infertility, pain&EP\n-Dysuria, Bartholinitis, pharyngitis & proctitis\n•inv: 1. Smear from endocervix, rectum, pharynx: gram -ve diplococcic\n2. Culture on Thayer- Martin) or New York\nCity medium\n3. Nucleic acid amplification test\n(NAAT) for antigen detection\n4. Serology:\nComplement fixation test, Hem-agglutinin inhibition test (HAI)\n•ttt:\n1-Uncomplicated\n(acute gonorrhea) →\nCDC recommendation\n-Cephalosporin:1 dose ceftriaxone 250mg IM or cefixime 400mg oral\n-Quinolone: single dose ciprofloxacin 500 mg or ofloxacin 400 mg orally\n-Azithromycin: 2 g orally (single dose) +\nDoxycycline: 100 mg /\n12 hrs orally for 7 days if co-infection with Chlamydia\n-Previously Procaine penicillin 4.8 million units IM once ±\nProbenicid , Spectinomycin 2g IM\n2-Complicated (chronic gonorrhea) →\nDrainage of Bartholin abscess\nNB: gonorrhea doesn’t affect stratified squamous epithelium","g2",3,""],[124,"Chlamydia","•Bacteriology\n-Commonest STD, affects 5% of female, asymptomatic in 75%, IP = 1-2 w\n-Like viruses: obligatory intracellular affecting columnar epithelium with inclusion bodies\n-It acts like bacteria→ have DNA & RNA dividing by binary fission\n•Serotypes (15)\n-A, B, C→Trachoma\n-D-K→Sexually transmitted a) On females: cervicitis, Bartholinitis, PID (minimal symptoms than gonorrhea with more tubal damage)& perihepatitis (Fitz- Hugh Curtis $) b)On pregnancy →\nPROM, intrauterine infection, pre-term labor c)On newborn→ ophthalmia neonatorum, pneumonia\nd)On male→ urethritis\n(sterile pyuria), epididymitis, conjunctivitis\n-L1, L2, L3→\nLymphogranuloma venereum→ Affection of vulva, vagina & cervix +\nLymphadenopathy\n(bubo)→ single or multiple papules, vesicles or pustules→ ulceration, fibrosis, sinuses & elephantiasis\n•inv:\n1. Microscopic examination: intracellular inclusion bodies + >20 pus cells/oil immersion field\n2. Culture on MacCoy: most reliable (but takes long time)\n3. Antigen detection:\nELISA (most rapid) or\nPCR-NAAT-\n(expensive)\n•ttt:\n1-Screening: sexually active, < 25 y, multiple partners, history of other\nSTD\n2-CDC recommendation\n-Azithromycin: 1 g orally once (suitable during pregnancy)\n-Doxycycline: 100 mg/12 h orally for 7 days (not in pregnancy)\n-Quinolones: ofloxacin\n300 mg/12 h orally for 7 days. Not in pregnancy\n-Abstinence from sexual intercourse till complete therapy\n-Clindamycin/\nErythromycin/\nTetracycline for chlamydia & gonorrhea","g2",3,""],[124,"Genital herpes (herpes simplex virus)","•Virology:double strand DNA virus of 2 types:\n1. HSV I: Transmitted by non-venereal routes (contact with infected saliva)\nCauses facial gingivo- stomatitis & common cold sore (fever blister). May cause genital herpes in 20% of cases\n2-HSV II: Transmitted by venereal route to sexual partner (genital herpes: vulva, perineum, vagina, cervix, urethra) or\nMaternal to new born during vaginal delivery\n(neonatal infections)\n•C/P:1-1ry (1st ) infection is usually severe:\n-FAHM + Painful vesicles appear locally that rapidly turns to shallow grey painful ulcers with inguinal lymphadenopathy\n- Fate: heals spontaneously but remains dormant in sacral ganglia\n2-2ry (reactivation)\n-General symptoms : shorter & less severe\n- Locally-mild symptoms With no inguinal lymphadenopathy\n•Complications\n-2ry bacterial infection & linked previously to cancer cervix\n-Urinary retention (if involved sacral nerve roots)\n-on pregnancy:\nAbortion, PROM, pre- term labor, Congenital herpes\n(encephalomyelitis) → do CS only if there is active HSV (if ROM >\n4 h, baby is considered infected)\n•Inv:\n1.Smear→eosinophilic inclusion bodies in multinucleated giant cells\n2. Culture on chorioallantoic membrane\n3. Anti-HSV antibody assay\n•ttt:\n1-Symptomatic & supportive: analgesics/ antibiotics for 2ry infection\n2-Antivirals (don't eradicate virus but\nconvalescence / recurrence):\n-Acyclovir, Idoxuridine (1x5x5)→ most used\n-New oral drugs\n(famcyclovir, valacyclovir): 1x2x25","g2",3,"P"],[124,"Genital warts (HPV)","•Virology: -Double stranded DNA virus infecting deepest layer of skin\n-Papova virus\n(genital warts) :\nCommonest viral\nSTD & > 100 sero- types (6,11..16,18..\n31,33,35,39.41,43,\n44..51,52,56)\n•C/P of genital warts (esp 6,11):\n1-Types:\n-Condyloma accuminata on vulva, anus, perineum\n(multiple cauliflower), diagnosed by inspection; inv not required, only to exclude intra- epithelial malignancy.\n-Flat condyloma esp on cervix\n-Inverted condylom\n2-Asymptomatic cases are frequently encountered\n3-Recurrence (60%) in → pregnancy,\nCOC, DM, immunosuppression\n•Complications\n1. Related to malignant conditions of cervix, vagina, vulva (16, 18)\n2. Neonate\n(transplacental, intrapartum, postnatal)→ laryngeal papilloma\n•inv: 1. Smear →Koilocytes\n(vacuolated cells multinucleated cells)\n2. Biopsy: acanthosis, papillomatosis, hyperkeratosis\n3. Colposcopy/Pap stain to exclude malignancy\n4. PCR Southern blot → specific type\n•ttt:\n1-Local destruction\n-Chemical cautery\nTrichloroacetic acid\n75% topical, Podophyllin resin\n(toxic; not used during pregnancy),\nImiquimod 5% (self- applied by patient)\n-CO2 Laser, cryocautery\n2-Surgical excision of larger warts\n3-Antiviral agent as\n5% 5-flüorouracil\n4-Vaccination\n(Gardasil or\nCervarix) for non- infected girls","g2",3,""],[124,"HIV / AIDS","•Virology → RNA virus (-retrovirus-) → reversal of CD4 helper T-cell to CD8 suppressor T-cell→ immune suppression\n•Mode of infection\n: coitus /blood products / infected syringes/vertical transmission (30 % of pregnancies):\nAntepartum (trans placental), Intrapartum, Lactatio\n•C/P:\n-Asymptomatic\n80%: up to 10 years\n-Initial HIV exposure: fever, myalgia, generalized lymphadenopathy\n-Months/years later: weight loss, infections (H. zoster, oral candidiasis)\n-AIDS: Opportunistic infection → pneumonia cystitis carnii & Malignancy→\nKaposi sarcoma\n•Diagnosis\n-Screening (ELISA): homosexuals / IV drug users/ Infection with other STD\n/Neonates born to infected women\n-Confirmation:\nWestern blot test , PCR for HIV RNA\n(viral load)\n•ttt:\n1-Prophylaxis: Avoid sexual contact with infected persons , screening for blood products , Vaccination against opportunistic infections\n2-Active: Only drugs available are to suppress viral replication (no curative drug)\n1.Retroviral inhibitors: nucleoside analogue\n(Zidovudine)\n2. Protease inhibitor: Indinavir\n3. Fusion inhibitor:\nFuzeon\n-HAART (Highly\nActive AntiRetroviral\nTherapy is combination of 2 nucleoside analogues + a protease inhibitor)\n-Vaccine development is under trial (very difficult)\n•Pregnancy & HIV:\nHIV screening for all at risk cases. Risk of fetal transfer is 15-\n25% (without ttt).\nLactation adds another 10-15% risk while maternal therapy, CS, avoidance of lactation\nthat risk.","g2",3,""],[124,"Syphilis","•Bacteriology:\nTreponema pallidum\n(spirochete)\n•Types\n1-Congenital: abortion, IUFD, malformations (early or late)\n2-Acquired: a)1ry: hard chancre\n(after 9-90 days) → healing within 2-6 w\n-Appears in external genitalia, anorectal region, rarely in lips\n-Painless, single (or multiple) firm papule→ punched out ulcer\n-Painless hard non- suppurated LN b)2ry:muco- cutaneous stage (6w-\n6 m)→heal in 2-6 w\n-FAHM, generalized\nLN, Rash, mucous patches on palms & soles\n-Condyloma latum\n(moist warty growth on vulva & perineum)\nc)3ry : Gumma →\nEarly latent (in 4 y) & Late latent (> 4y):\nNeurosyphilis or cardiovascular syphilis\n•inv:\n1-Dark ground illumination in 1ry &\n2ry→ detect spirochetes\n2-Non-specific tests → Wassermann, Khan, RPR, VDRL\n-+ve after 2 w from chancre\n-May be false +ve in some immune diseases as SLE\n3-Confirm by\n-Fluorescent\nTreponema Antibody\nAbsorption (FTA- ABS)\n-Treponema pallidum\nParticle Agglutination\n(TP-PA)\n•ttt:\nA. Early disease:\n-Benzathine penicillin G: 2.4 million units IM\n(single dose)\n- Doxycycline 100 mg orally 1x2x14 if penicillin allergy\nB. Late disease:\n-Benzathine penicillin G: 2.4 million units IM / week for 3 w\n-Doxycycline 100 mg orally twice daily for a month if penicillin allergy\nC. Neurosyphilis:\nAqueous crystalline penicillin G 18-24 million U/ day IV infusion for 10-14 days\nD. Congenital syphilis: Aqueous crystalline penicillin G 100.0000 unit/kg/day/IV/12 hours for 7-10 days","g2",3,"I"],[122,"Define leucorrhea and causes of excess vaginal discharge","abnormal discharge from vagina except blood, true leucorrhea is ↑of normal secretion as:causes of excess vaginal discharge Puberty, Premenstrual & mid- cyclic, Pregnancy&Puerperium (lochia alba),Pelvic congestion (constipation,sexual dissatisfaction)","g2",6,"P"],[122,"Mention sources of normal vaginal discharge","PH Source\nVulva Alkaline Bartholin gland +/- Skene's glands\nVagina acidic (3.8-4.2) Transudate + Bartholin + cervical mucus\nCervix Alkaline (8.5) Endocervical glands (watery by estrogen)\nUterus Alkaline Endometrial glands (esp secretory phase)\nTubes Alkaline Goblet glands","g2",6,""],[122,"Mention normal bacterial flora in the vagina","•Anaerobes (predominant): aerobes = 10:1.\n•Include; group B streptococcus, E. coli, Lactobacillus acidophilus (dominant bacterium)\nAerobes Anaerobes\nGram +ve\n•Lactobacillus • Diphteroids\n• Staph aureus\n•Group B strept\n• Enterococcus\nGram -ve\n•E.coli • Klebsiella spp\n•Proteus spp\n•Enterobacter\n• Pseudomonas\nGram +ve\n•Peptostreptococci\n• Clostridium\n•Lactobacillus spp\n•Gardnerella vaginalis\nGram -ve\n•Bacteroids\n•Bacteroids fragilis\n•Fusobacterium spp\nYeast: Candida albicans, Candida tropicalis, Torulopsis glabrata","g2",6,""],[122,"Normal defensive mechanisms of the lower genital organs against infection","1.Vagina: •closed mechanically by 2 labia (opposed) •Acidic media\n• Lined by thick stratified squamous epithelium\n2. Cervix: closed mechanically by a mucous plug\n3. Uterus: monthly shedding of superficial layer of endometrium\n4. Tubes: movement of cilia towards uterine cavity\nMechanism interfered at\n1.Prepubertal &postmenopaus: Less acidic Ph, Thin vaginal lining, No endometrial shedding\n2. Menstruation: Less acidic pH (neutralized by alkaline menses), Loss of cervical plug\n3. After labor & abortion: Less acidic pH (neutralized by alkaline lochia), Loss of cervical plug (& cervix is opened), Presence of raw placental bed (± lacerations), maternal resistance\n(due to exhaustion), No endometrial shedding\n4. Sexual Intercourse:alkaline pH of semen & infection 5.STDs affect microbiology of vagina\n6. Foreign bodies; as pessaries, tampons, IUD threads\n7. Suppression of immune system: HIV infections, DM, autoimmune, corticosteroid therapy","g2",6,"P"],[122,"Mention assessment of a case of vaginal discharge","1-History: 2-Examination: 3-Investigations:\n• Age: Children (prepubertal vulvovaginitis) , Adult (moniliasis, trichomonas) , Postmenopausal\n(senile vulvo-vaginitis)\n•Marital status: STD , Postpartum infection\n•Menstrual history: Premenstrual\n(candidiasis), Postmenstrual (TV)\n•Obstetric:suggestive of cervicitis\n•Present history:duration, amount, character, odor, color\n•Inspection of vulva → White plaques in candidiasis, Strawberry vagina in trichomonas & Grey frothy discharge in bacterial vaginosis\n•Speculum examination for collection of discharge for investigations\n•Milking urethra for gonorrhea\n• Bimanual examination for swellings\n•Smear: Fresh wet drop\n(trichomonas,Gardnerella, candid\n•Culture&Sensitivity for discharge\n• Vaginal cytology\n•Immune tests:CFT for gonorrhea\n•Immuno-fluorescent for chlamydia\n•Others: Biopsy from any lesions\n- Stool - X-ray for FB\nA.Colored offensive discharge→ Bacterial vaginosis & Trichomonas\nB.White curdy itchy→candidiasis C.Muco-purulent discharge→chronic cervicitis, Bartholinitis\nD. Purulent discharge→Septic abortion, puerperal sepsis, FB, Pyometra, cancers.\nE. Blood stained (sanguineous)→ Atrophic vaginitis, ulcers, cancers\nF. Watery discharge→intermittent hydrosalpinx, urinary fistula","g2",7,""],[122,"Enumerate types of vulvo-vaginitis","1ry 2ry (To)\n•Bacteria: Bacterial vaginosis, gonorrhea\n(if prepubertal)\n•Fungal (Candidiasis) • Parasites (TV)\n•Chlamydia •Viruses (HSV CMV, HPV)\n•Cervical & vaginal discharge\n•Urinary (incontinence, fistula, glucosuria, pyuria)\n•Rectal (Rectovaginal fistula, complete perineal tear)\n•Chemical(douches),Physical(irradiation),Traumatic (FB)","g2",7,""],[122,"Mention clinical picture of vulvo-vaginitis","•Symptoms: soreness, Pruritus vulvae, Dysuria, Dyspareunia & Discharge (white in candida; yellowish frothy in TV/Gardnerella)\n•Signs: red, hot, swollen, tender ± inguinal lymphadenitis ± scratch ulcer","g2",7,""],[122,"Mention investigations of vulvo-vaginitis","1.Wet smear examination ± culture to determine specific organism\n2. Recurrent/persistent infections →search for a cause as DM\n3. Skin biopsy: in post-menopause → suspicion of dystrophy","g2",7,""],[122,"Mention treatment of vulvo-vaginitis","1-Specific therapy: Bacterial vaginosis, candidiasis, TV\n2-Local hygiene: keep vulva dry,cotton underwears ,antihistaminics\n3-General (↓ irritation): Sedatives , Antihistaminics","g2",7,""],[122,"Bacterial vaginosis","•Non-specific vaginitis(Gardnerella vaginalis)\n•Bacteriology (not STD)\n-Incidence: 10-25% of population (60% of vulvo-vaginitis). It is commonest cause of malodorous discharge in female\n-Cause: unexplained replacement of normal flora (Doderlein bacilli) by Gardnerella vaginalis, mycoplasma, ureaplasma urealyticum (organisms )\n-Predisposing factors: Frequent coitus & alkaline vaginal douches\n•Clinical picture: -Asymptomatic (50%)\n-Vaginal discharge (profuse, thin, malodorous) yellow gray or white, Fishy odor is due to formation of amines from amino acids by anaerobic bacteria (apparent after intercourse or menstruation)\n•inv:(need 3 of 4 AMSEL criteria)\nList 3 criteria for diagnosis\n1)Characteristic vaginal discharge\n2) Vaginal pH > 4.5\n3) Clue cell (granular vaginal epithelial cells with adherent bacteria).\n-Gram stain: gram-ve coccobacilli\n(Haemophilus vaginalis)\n- Wet smear: drop of saline + drop of vaginal discharge\n4)Whiff test (adding 10% KOH to discharge →amine arousal (fishy) odor\n-Presence of G.vaginalis alone is not enough\n(found in 50% of normal)\n-Trichomonas vaginalis has a close picture; thus must be excluded\n•Complications (no general agreement on its prophylaxis)\n-Chronic PID, recurrent UTI\n-During pregnancy→ chorioamnionitis, PROM, pre-term labor\n-Wound infection after surgery: vaginal cuff after hysterectomy\n•ttt: CDC recommendation.\n-Flagyl=Metronidazole (500 mg 1x2x7) or 2 g single dose\n-Clindamycin (300 mg 1x2x7) or vaginally\n(once /day for 5 days)\n-Broad spectrum as erythromycin, tetracycline 500 mg 1x4x7","g2",8,""],[122,"Candidiasis (vaginal candida infection)","• causative organism\n1. Candida albicans (2nd cause of vaginitis after Gardnerella -30%-)\n2. Candida tropicalis, Candida krusei\n(resistant to usual antifungals)\n•Predisposing factors\n-↑ Vaginal acidity & moisture (as in pregnancy & COC).\n-Resistance (DM, steroids, malignancy, immunosuppressive)\n-Alteration of normal vaginal flora\n(prolonged use of antibiotics)\n•Mode of infection\n-Normally present in vagina (20-40%)\n-May be contaminated from hands, towels, instruments, coitus\n•C/P: + describe discharge\nSymptoms: Itching (main symptom), dyspareunia, discharge [whitish, odorless, curdy-cheesy, ↑premenstrual\n(↑glycogen)] & infection of male\nSigns: Vulvo-vaginitis (red & swollen), adherent white patches.\n•Inv:\n1.PH:slight acidic<4.5 2.Smear:Gram +ve\n3. Fresh drop of discharge + KOH → hyphae (long filaments) & spores\n4. Culture on Sabouraud's agar or\nNickerson medium\n•ttt:\nCDC recommendations\n1. Intravaginal antifungal preparations\n-Butaconazole 2% cream: 5 g for 3 days or\n5g sustained release once\n-Clotrimazole 1% cream: 5 g for 7 days or\n100 mg vaginal tabs for 7 d\n-Miconazole 2% cream: 5g for 7 d or\n100mg vaginal suppository for 7 d\n2. Oral: not in pregnancy (intravaginal is safe from 1st trimester)\n-Fluconazol 150mg once\n- Itraconazole (Sporanox) 1g once\n3. In case of recurrence, systemic infections\n-Search for a cause (DM); treat husband, culture for non-albicans\n-Extend oral therapy for 3-6 w, avoid excessive vaginal douches","g2",8,"P"],[122,"Trichomonas vaginalis infection","•Bacteriology\n-3rd cause for vaginitis (25% of vulvovaginitis). Ovoid protozoa larger than\nWBCS. Motile with 4 flagella, undulating membrane, a long axostyle\n•Predisposing factors: alkaline douches , systemic antibiotics\n•Mode of infection (WC vulvovaginitis, water pools vulvovaginitis)\n-Normally present in vagina (50%)\n-It can be recovered from male partners, hence it is considered a \"STD\"\n-Contamination also may occur from hands, towels, instruments\n•C/P (asymptomatic in 25-25%)\n-Symptoms usually start postmenstrual\n(alkaline menses)\n-Discharge is greenish yellow, frothy, profuse, malodorous\n-Vulvitis/Vaginitis/ Cervix: red& edematous\n-Speculum: punctate hemorrhages\n(strawberry) on vagina & cervix\n•inv:\n1. Vaginal PH: usually weak acidic (5-6);\nSmear → Gram-ve\n2. Fresh drop examination :motile organism\n3. Culture on Diamond medium, Feinberg medium (not routinely needed)\n4. Colposcopy →T-shaped blood vessels\n•ttt: CDC recommendations\n1-Oral regimen\n-Metronidazole (drug of choice); 500 mg\n1x2x7 or single 1g\nMale is treated also to avoid recurrence\nIt could be used in 2nd\n/3rd trimester safely\n-Tinidazole (2 gm once) 4 tablets\n-Ornidazole (1.5 g once) 3 tablets\n2-Intravaginal: Metronidazole vaginal suppository (500 mg) 1x1x10 Used if nauseated, pregnant in 1st trimester, lactating\nVaginal therapy alone is not effective, because of multiple sites of infection; hence oral therapy is preferred.\n3-In recurrent / resistant cases: search for a cause, ttt of husband, avoid coitus during therapy","g2",8,""],[122,"Differential features: normal vagina, bacterial vaginosis, candidiasis and trichomoniasis","Symptom presentation\nOdor, discharge, itch Itch, discomfort, dysuria, thick discharge\nItch, discharge, 50% asymptomatic\nVaginal discharge Clear to white Homogenous adherent, thin, milky white; malodorous \"foul fishy\nThick, clumpy, white\n\"cottage cheese\nFrothy, gray or yellow green; malodorous\nClinical findings Inflammation & erythema Cervical petechiae \"strawberry cervix\"\nVaginal PH 3.8-4.2 >4.5 Usually <=4.5 >4.5\nKOH whiff test -ve +ve -ve Often +ve\nNaCl wet mount Lacto-bacili Clue cells(>=20%), no/few WBCs Few WBCS Motle flagellated protozoa,many WBCS\nKOH wet mount 26 Pseudohyphae or spores if non-albicans species","g2",9,""],[122,"Bartholinitis","•Pathology: acute inflammation of Bartholin gland (mostly due to E.coli)\n•C/P:\n-Symptoms: pain→ throbbing (if pus forms)\n-Signs: Red skin & induration +/- Pus & Gland is palpable & tender\n-Fate: resolution or chronic or an abscess\n•ttt:\n-Bartholinitis→ antibiotics & hot fomentation\n-Bartholin abscess→ incise & drainage under anesthesia","g2",10,""],[122,"Bartholin cyst","•Pathology: commonest vulval swelling. Due to duct obstruction by infection, mucous, trauma (as episiotomy)\n•Types\n1-Cyst of duct is more common (lined by transitional epithelium)\n2-Cyst of gland is rare (lined by columnar epithelium)\n•C/P:\n-painless cystic swelling in lower(post)1/3 of labia majora\n-It may interfere with normal walking or sexual activity\n-It may be secondarily infected → Bartholin abscess\n•ttt: 1. Marsupialization: Elliptical incision of cyst & suturing edges to surrounding, Advantages: preservation of lubricant function, less bleeding\n2. Excision (in postmenopausal due to possible adenocarcinoma)","g2",10,""],[122,"Toxic shock syndrome","•Pathology: Multiplication of Staph\nAureus in menstrual blood after tampon use (if retained) with production of exotoxins.\n•C/P:\n-Fever, anorexia, malaise, rigors\n(usually at 2nd day of menses)\n-Septicemia→ hypotension, diarrhea, skin edema\n-Systemic affection→ liver, kidney, heart, DIC\n•ttt:\n-Resuscitation in ICU / Remove tampon\n-Antibiotics acc to culture from vagina & tampon","g2",10,""],[122,"Prepubertal (childhood) vulvo-vaginitis","•Predisposing: Thinned-out vaginal mucosa (estrogen & acidity)\n•Mode of infection: 1-1ry: -FB in vagina (non-specific as staph or E.coli)\n-Transmission from an infected adult (TV, monilia, gonococci)\n2-2ry: irritation by soaps or poor hygiene (wiping from anus to vagina)\n•C/P: -Purulent foul odor vaginal discharge, itching, pain & dysuria\n-Lacerations (trauma), peri-anal erythema (parasites)\n•ttt: 1. General: antihistaminics, antipruritics, local hygiene\n2. Systemic antibiotics , ttt of Entrobius & oxyuris\n3. If persistent/serosanginous discharge→ inspect for FB by: X-ray, US , vaginoscope (or cystoscope)\n•Predisposing factors: ","g2",10,""],[122,"Senile (atrophic) vulvo-vaginitis","Estrogen levels & acidity\n•C/P:\n-Leucorrhoea, pruritus, vaginal burning, tenderness& dyspareunia\n-Speculum: atrophic vaginitis +/- offensive discharge\n•ttt: 1.General: antihistamines, antipruritics, local hygiene\n2.Systemic antibiotic ± local E (premarin) for few weeks\n3. If persistent/serosanginous discharge → D&C to exclude any pathology","g2",10,""],[122,"Define pruritus vulvae","itching due to vulval irritation for which no lesion is defined.","g2",11,"P"],[122,"Mention etiology of pruritus vulvae","A. Pruritus with vaginal discharge (80%): Candida & TV\nB. Pruritus without vaginal discharge (20%):\n-General disease: liver or renal, endocrine (DM, thyroid), Blood (leukemia) & Autoimmune\n-Skin disease: Eczema, pediculosis, oxyuris, vit deficiency (A , B2, B12, folic acid)\n-Vulval irritation: Allergy (soaps), dystrophies / neoplasia & Rectal Urinary incontinence\n-Psychogenic (idiopathic pruritus) -Postmenopausal (senile pruritus)","g2",11,"P"],[122,"Mention diagnosis of pruritus vulvae","•History/examination systemically to search for a possible etiology\n•Inv: CBC, urine & stool analysis , Serum iron, folate, vit B12, Fasting & 1 hour PP sugar level , Liver, renal, thyroid function test, C&S for vaginal discharge , Colposcopy +/- biopsy","g2",11,""],[122,"Mention treatment of pruritus vulvae","•Of the cause if found •General Sedatives: antihistaminics +/- sedative\n•Local: Cotton underwears + local cleanliness, antihistaminic\n•Resistant cases: Estrogen for postmenopausal & Intradermal triamcinolone","g2",11,"P"],[122,"Predisposing factors for vaginal infections, types and diagnosis of vaginitis","Predisposing factors for vaginal infections, types& diagnosis of vaginitis in reproductive age female\nPredisposing factors: •alteration in normal vaginal pH •resistance of vaginal epithelium\n•imbalance between vaginal bacterial flora & candida species •suppression of immune system\nTypes :1-bacterial vaginosis 2-candida vaginitis 3-trichomonas vaginalis\n4-in childhood: vulvovaginitis of childhood 5-in menopause: senile or atrophic vaginitis\nDiagnosis : 1-wet mount microscopic examination 2-vaginal Ph 3-vaginal swab& culture\n4-pap smear 5-KOH test","g2",11,"P"],[122,"Acute cervicitis","•Inflammation of endocervical glands by:\n1. STD: N. gonorrhoea, chlamydia, TV.\n2. Non-specific: streptococci, staphylococci , E.coli (after IUCD insertion, D&C, post-abortive, post- partum sepsis)\n•C/P: Symptoms:\n-General: FAHM\n- Local: mucopurulent discharge, dyspareunia, back pain Signs:\n- Red, swollen cervix, marked tender on mobility\n- Exuding mucopurulent or purulent discharge\n•ttt: antibiotics systemically + antiseptic pessaries\n•Complications\n-Chronicity by racemose glands & no monthly shedding of epithelium\n-Spread to upper genital tract (PID)","g2",12,""],[122,"Chronic cervicitis","•Etiology:1-Persistence of acute cervicitis\n2-Chronic from start: postop, postabortive, postpartum laceration\n3-Chronic granulomatous diseases as TB (rare)\n•Pathological forms\n1.Chronic endocervicitis: normal cx exuding mucopurulent\n2. Mucous polyps: hyperplasia of endocervical epithelium →multiple small reddish pedunculated polyps\n3. Nabothian follicles: obstruction of gland ducts → multiple small retention cysts: bluish (full of mucus) or yellowish (pus).\n4.Chronic hypertrophic cervicitis: barrel-shaped\n5.Chronic atrophic cervicitis: called wooden type (cx stenosis)\n6.Cervical ulcers: bright red erosions (true ulcers)\n7.Ectropion:eversion of cervical lips (due to bilateral cx tears)\n•C/P:Symptoms: -asymptomatic -mucopurulent Discharge\n-Backache - Deep dyspareunia/Dysmenorrhea -Contact bleeding\nSigns:-Tenderness on moving cervix\n-Pathological forms(Nabothian cysts,ulcers,hypertrophy, polypi)\n•Comp :-Pregnancy: abortion, PROM, chorioamnionitis\n-Spread: to vulva (2ry vulvo-vaginitis), UTI (spread by lymph)\n-Infertility: due to hostile cervical mucus or marked cx stenosis\n•inv:-Culture swab from endocervix for gonorrhea or chlamydia\n-Colposcopy& smear excludes malignancy -Post coital test\n•ttt:1. Prophylaxis: Aseptic techniques , ttt of acute cases.\n2. Medical: Warm douches , antiseptics as albothyl , Antibiotics not so effective (due to deep seated infection)\n3. Cauterization: cryo / Laser/LEEP 4. Hysterectomy\n•DD:1. Causes of leucorrhea & vaginal discharge\n2. Causes of contact bleeding 3. Causes of barrel shaped cervix\n4. Causes of cervical Ectopy","g2",12,""],[122,"Cervical ectopy","•Def:-bright red area around ext os due to replacement of stratifi squamous epithelium of ectocervix with columnar epithelium.\n- Erosion is not an accurate name\n(ectopy is not an ulcer)\n•Etiology: 1. Chronic cervicitis\n2. Congenital (transplacental E)\n3 .↑estrogen: pregnancy, lactation, COC\n•C/P:Symptoms: -asymptomatic\n- mucoid discharge\n-contact bleeding\n- symptoms of chronic cervicitis\nSigns :\n-Simple→bright red flat area at ectocervix\n-Papillary→ velvety appearance with raised folds\n-Follicular→ red area with glandular distension\n•Inv: Pap smear & colposcopy to exclude CIN\n•ttt: If hormonal (follow up only)\n-Chronic cervicitis →vaginal antiseptic\nOr cauterization if condition persists","g2",12,""],[123,"Define pelvic inflammatory disease (PID)","-Infection of upper genital tract; it affects 2-3% of females\n-Fallopian tube is most common. However, affection of ovaries, pelvic peritoneum (± uterus) may occur.\nAcute PID (acute salpingitis) Chronic PID","g2",13,"P"],[123,"Acute PID (acute salpingitis)","•Pred factors: -Multiple partners -IUD users -Instrumentation (D&C/HSG)\nNB: Barriers, COC reduce risk for PID\n•Routes:1-Ascending through lumen (chlamydia & gonococci) → endosalpingitis\n2-Ascending through lymphatics (puerperal & postabortive)→ interstitial salpingitis\n3-Direct or lymphatic from nearby organ as appendicitis → perisalpingitis\n4-Hematogenous spread as TB\n•Organisms: gonococci (40%), chlamydia, Aerobes (E. coli, Streptococcus, proteus & Klebsiella), Anaerobes (Bacteroids & pepto-streptococcus).\n•Pathology: a) Acute Endo-salpingitis: Infection only of mucous membrane. It may be catarrhal (high resistance) or suppurative (high virulence) b) Acute Interstitial salpingitis / perisalpingitis→ tubal obstruction c) Oophoritis - Pelvic peritonitis extension from tubes, or by lymph\n•C/P: 1. History (IUCD, recent abortion, young sexually active)\n2. Symptoms: FAHM, Acute lower abdominal pain (most common) ,discharge, bleeding &GIT symptoms (nausea & vomiting).\nNeisseria gonorrhea Chlamydia trachomatis\nOnset More acute , Usually after menses May remain dormant for months in tube\nC/P Acute pain +/-peritonitis Milder (silent PID)\nComp. Diffuse exudate blocking tubes More damage but later on\n3-Signs (criteria for diagnosing acute PID)\nMinimum criteria + One additional\n-Lower abdominal pain & tenderness\n-Adenexal tenderness\n-Cx motion tenderness\n-Temp> 38°c. ↑ESR. ,TLC > 10.500/mm3\n-Inflammatory mass (by P/V or seen by U/S)\n-+ve endocervical tests for gonorrhea /chlamydia\n-Laparoscopic evidence of PID (peritubal adhesions, peritonitis, pelvic abscess, tubo ovarian complex)\n•Remote sequalae/comp of acute PID: scheme (I FACE PID)\n-Infertility -Fitz-Hugh-Curtis $ -Abscess -Chronic pelvic pain\n-Ectopic Pregnancy -Peritonitis -Intestinal Obstruction\n-Disseminated infection (Sepsis, Endocarditis, arthritis, meningitis)\n•DD:other causes of acute abdomen:1. Disturbed ectopic pregnancy, acute appendicitis\n2. Ruptured ovarian cyst, complicated fibroid 3. IBD , appendicitis, diverticulitis\n•Inv: -Lab: ESR, TLC, CRP (non-specific) -Culture: swab from endocervix, rectum, pharynx\n-US: may be normal or may find an adnexal swelling\n-Laparoscopy (gold standard)confirm diagnosis or if poor response to antibiotic after 48-72 h→ hyperemia, edema& purulent exudates from fallopian ostia\n•ttt: 1-Prophylaxis: Avoid promiscuity, Aseptsis & early TTT of infections\n2-Active: -General: bed rest in Fowler (semi-sitting) position, Antipyretics, Analgesics, hot fomentation + TTT of male\n-Antibiotic therapy CDC recommendations\nA. Mild & moderate cases (oral & IM)\n1. Quinolones (Ofloxacin) 400 mg once daily orally for 14 days, ± Metronidazole 500 mg\n1x2x14 (to cover anaerobics)\n2.Ceftriaxone 250 mg single IM +Doxycycline 100 mg 1x2x14 ± Metronidazole 500 mg 1x2x14\nB. Severe cases (parenteral):1. Cefoxitin 2 g IV / 6 hours + Doxycycline 100 mg IV/12 h\nMetronidazole/Clindamycin are added if abscess is suspected\n2. Ofloxacin 400 mg IV/12 h + Metronidazole 500 mg IV/ 12 hours\n3. Ampicillin-sulbactam 3g IV/6h + Doxycycline 100 mg IV/12 h\nParenteral regimens are continued for 24 h after improvement then oral 10-14 days\n-Indications for hospitalization: Nulliparity , Bad general condition , tubo-ovarian complex, Complicated mass (ruptured tubo-ovarian mass)\n-Surgical intervention if: Severe disease refractory to medical therapy or Ruptured, huge tubo-ovarian abscess or Generalized peritonitis a) Via Laparotomy or Laparoscopy: Drainage ± unilateral adenexectomy (to preserve fertility), Pelvic clearance = TAH + BSO (old age) b)Via Posterior colpotomy in selected case to drain a pelvic abscess","g2",13,"P"],[123,"Chronic PID","•Etiology:-STDs (persistence of acute\nPID or chronic from start)\n-Mixed organisms (staph, strept, E.coli), TB & bilharziasis\n•Pathology\n1)Hydrosalpinx: Sequelae of catarrhal salpingitis, HSG (retort shaped), If communicates with ovarian cyst→ tubo- ovarian cyst\n2) Pyosalpinx: Sequelae of suppurative salpingitis , HSG (blocked tubes), If communicates with ovary → tubo- ovarian abscess\n3) Chronic perisalpingitis & adhesions\n4) Fitz-Hugh-Curtis $: Perihepatitis\n(chlamydia, gonorrhea)→ upper rt abdominal pain (as in cholecystitis), Laparoscop: characteristic violin strings bands of adhesions\n5) Chronic interstitial salpingitis\n(Salpingitis isthmica nodosa)\n- Multiple bilateral diverticula due to fibrosis (in isthmus)\n-Due to gonococci, TB, bilharziasis, endometriosis\n•C/P:1-History of previous recurrent attacks of acute PID\nDiagnosis of PID\nMicrobiology of PID\n2-Symptoms: pain (lower abdominal/backache), congestion\n(discharge, menorrhagia, dysmenorrhea), infertility & EP\n3-Signs: General ill health, Tenderness\n(lower abdominal, cervical motion), bilateral adnexal swellings & fixed RVF\n•DD: Endometriosis, Cancer Ovary & Pelvic TB\n•inv: -Culture: endocervical swab\n(chlamydia, gonorrhea) or T.B.\n(tuberculin, chest X-ray)\n-US: detect & follow up tubo-ovarian abscess size\n-Laparoscopy: confirm nature of adenexal swelling\n-Infertility: Hysterosalpingography, laparoscopy (± tubal biopsy)\n•ttt: 1-Medical: Antibiotics→ good response continue\n2-Surgical : If no response or mass\n(abscess) from start\n-Unilateral adnexectomy (conservative therapy is preferred in young)\n-hysterectomy & bilateral salpingo- ophrectomy (if > 40)\n-If infertility: bilateral salpingectomy or tubal clamping via laparoscopy then\nIVF/ICSI (as pus kills transferred embryos)\nPelvic Abscess Endometritis","g2",13,"I"],[123,"Pelvic abscess","•Etiology:\n-1ry: not preceded by pregnancy / trauma / surgery → better prognosis\n-2ry: postabortive, postpartum, post-operative, infected hematocoele\nOr extension from nearby focus (appendicitis, diverticulitis)\n•Organisms: usually mixed (1st aerobes then anaerobes)\n•C/P:\n-Symptoms: FAHM, lower pelvic heaviness (pain more severe) ± urinary & rectal pressure symptoms\n-Signs: Tender cervix&adnexae, Tender soft swelling in DP felt by PR\n•ttt: as in chronic PID","g2",15,""],[123,"Endometritis","Acute endometritis:\n1. Postpartum & postabortive\n(commonest cause)\n2. Gonorrhea & chlamydia\n3. Postoperative endometritis: after D&C, HSG.\nChronic endometritis:\n1. Specific (TB, Chlamydia, Herpes, CMV)\n2. Non-specific (rare due to cyclic shedding) : senile endometritis","g2",15,""],[123,"Pyometra","•Def: retention of pus in uterine cavity\n•Etiology: Infections + obstruction by\n1. Malignancy (cervix, endometrium) 2. Polyps (cervical; TB)\n3. Stenosis (senile; post cauterization; post irradiation)\n•C/P: Symptoms: -Fever, malaise, rigors\n-Lower abdominal pain & pelvic heaviness\n-Intermittent purulent discharge\nSigns: -Enlarged tender uterus -Sounding reveals pus from cervix\n•ttt: -Drainage by dilatation then antibiotics acc to culture\n-Curettage after 2 w for diagnosis of possible tumors","g2",15,""],[123,"Parametritis","•Def: inflammation of connective tissue within leaflets of broad ligament\n•Etiology: direct or lymphatic spread from\n-Cervicitis/endometritis after abortion or labor / salpingoophritis\n-Genital tract malignancy (due to infection or radiotherapy)\n•Pathology: -Inflammatory collection in broad ligament\n-Fate→ resolution, spread, chronicity, abscess formation\n•C/P:\nSymptoms: FAHM + lower abdominal pain + sympt of pelvic congestion\nSigns: tender swelling pushing uterus to opposite side\n•ttt: as in chronic PID","g2",15,""],[125,"Genital tract tuberculosis","•Etiology: -Usually Mycobacterium tuberculosis (human bacillus) more common nowadays & responsible for 5% of infertility\n•Route of infection: 1. Blood borne (from 1ry pulmonary focus) :most common route\n2. Peritoneal spread (TB peritonitis) - Lymphatic\n3. Ascending with infected semen (TB epididymitis) - rare -\n•Pathology (follicles ,caseation, fibrosis , calcifications)\n1. Tubes (affected in 100%); perisalpinigitis, pyosalpinx or salpingitis isthmica nodosum\n2. Uterus (only affected in 50% of cases) → Asherman syndrome\n3. Ovaries (25% of cases) 4. Cervix, vagina, vulva (5%)\n•C/P: -History (family or exposure or endemic area)\n-Symptoms: asymptomatic, toxemia +/- chest symptoms, infertility (due to tubal block, anovulation, endometrial TB), Chronic pelvic pain, bleeding &2ry amenorrhea (Asherman or ovarian destruction)\n-Signs (may be normal): Tender, fixed, adnexal swelling. Ulcers on vulva/cervix, scarring or sinus\n•inv: 1-Chest X-ray, TLC, ESR, PCR: Tuberculin test is good -ve test.\n2. Tubes: -HSG: Sausage shaped, lead pipe, hydrosalpinx, calcification, Peritubal & Intrauterine adhesions, micropouches.\n-Laparoscopy ± biopsy: sausage shaped tubes + tubercles + adhesions\n3. Endometrium (D&C or menstrual shedding by cervical cap) → culture\n4. Vulva, vagina, cervix→ biopsy from lesions\n•ttt: 1-Medical (anti-TB drugs):\n-2 mon→ Isoniazid + Rifampicin + Ethambutol or Streptomycin -7 mon→ Rifampicin + Isoniazid\n2-Surgical : -No tubal microsurgery (ICSI has better results)\n-TAH & BSO are only done if large masses are present + fistula\nSide effects of TB drugs: red urine, peripheral neuritis, ↑uric acid, visual problems , ototoxic","g2",16,""],[125,"Genital tract bilharziasis","•Etiology\n-1/3 of female in rural areas in Egypt & usually S. hematobium→ affecting lower genital tract > upper\n-Ova may reach female genitalia through venous communication with bladder & rectum\n1. Stage of infiltration\n2. Stage of Ulceration: Sloughing of papilloma → ulceration\n3. Stage of Cicatrisation\n•inv:\n1. Urine & stool analysis for ova\n2. Cystoscopy, sigmoidoscopy, colposcopy & biopsy\n3. Laparoscopy /\nHysterosalpingography: thick tortious tube (biopsy is a must)\n4. Vulval & vaginal biopsy\n•ttt: 1-Medications: antibilharzial as Biltricide (Praziquantel)\n2-Surgical excision of residual lesions ,","g2",16,""],[136,"Define endometriosis and its incidence","Presence of functioning endometrium (glands& stroma) outside its normal site (lining of uterine cavity). This endometrium is E responding→ cyclic changes & shedding→ pain & infertility, incidence: affect 10% women in Child bearing period,\n20% women with chronic pelvic pain & 30% of women with infertility","g3",2,"P"],[136,"Mention etiology / theories of endometriosis","1. Retrograde menstruation: Regurgitation of menstrual flow through tubes into abdomen. occurs in 70-90%, Evidences: Menstrual fluid is seen during laparoscopy, also implants are found in dependant areas (ovary, Douglas pouch, uterosacral ligaments) & ↑ disease in outflow obstruction\n2.Celomic (serosal)metaplasia:Transformation of peritoneal epithelium into endometrial tissue\n3. Induction theory: Undefined factor induces peritoneal cells to develop into endometriim.\n4.Lymphatic or vascular spread(Halban theory):Explain extrapelvic sites as umbilicus,nose,lung\n5. Implantation theory: -On abdominal scar after CS or myomectomy\n-On vaginal or perineal scar after episiotomy or D&C or HSG","g3",2,""],[136,"Mention predisposing factors of endometriosis","•Immunological alteration:activation of peritoneal macrophages, cytokines (IL-1,6,8)& TNF\n•Genetic: Relative risk of 7.2, Found in mothers & Sisters, in homozygotic twins if 1 affected, other will be affected in 75%\n•Patient characters \"unopposed hyperestrogenemia\": -Age: child bearing period\n-more in Caucasian -more in higher class -low parity or nulligravida","g3",2,""],[136,"Mention sites of endometriosis","Pelvic sites Extrapelvic (rare)\nGenital organs: •Ovaries (commonest)\n•Douglas pouch •Uterosacral ligament\n•Rectovaginal septum •Vulva & vagina\nExtragenital (1%)\n•Rectum •Sigmoid\n•Bladder •Ureters\n•Scar of laparotomy\n•Umbilicus\nOther: gall bladder, appendix, lung, nose","g3",2,"P"],[136,"Mention clinical picture (C/P) of endometriosis","•Symptoms (may be asymptomatic): -Pain (doesn't correlate with severity of disease)\n-Infertility (endometriosis is discovered at laparoscopy in 30-40% of infertile)\n-Menstrual/endocrinological problems (Heavy menstrual / irregular bleeding (congestion & anovulation), Premenstrual spotting (due to luteal phase defect))\n-Extrapelvic endometriosis: 1-Intestinal tract: cyclic rectal bleeding.\n2-Ureter & bladder: cyclic dysuria &hematuria (Yousef $) 3-Pulmonary:cyclic hemoptysis\n4-Umbilical: mass with cyclic pain & bleeding\n•Pelvic examination (normal in minimal)\n-Uterus is tender, enlarged in a fixed RVF position\n- Endometrioma (chocolate cyst): tender, fixed adnexal mass\n-Uterosacral ligaments: tenderness & nodularity by PR with tender nodules in DP\n- Vagina (nodular rectovaginal septum), Vulva (bluish tender nodules)","g3",2,"PI"],[136,"Mention mechanism and types of pain in endometriosis","•Mechanism: Distension of nodules by blood, release of PG or cytokines & involvement of nerves by adhesions\n•Types of pain\n-Dysmenorrhea: starts few days before menses (congestion) then ↑ during menses\n(crescendo). Then after menses due to absorption of blood\n-Deep dysparuenia by fixed RVF uterus or nodules in DP or recto-vaginal septum\n-Chronic pelvic pain(>6m) -Backache:uterosacral ligaments affection -Dysuria&dyschazia","g3",3,"I"],[136,"Enumerate causes of infertility in endometriosis","1. Luteal phase defect (by ↑ PGs) 2. ↑phagocytic macrophage activity on sperms\n3. Impaired ovum pick-up by peritubal or periovarian adhesions\n4. Associated anovulation and / or dyspareunia","g3",3,"P"],[136,"Mention differential diagnosis of endometriosis","•Chronic pelvic pain: irritable bowel syndrome, chronic appendicitis, renal stones , UTI\n•Pelvic adhesions: PID, pelvic malignancy, TB , previous pelvic surgery\n•Adnexal masses: ovarian cysts, ovarian tumors, tub-ovarian complex (PID)","g3",3,""],[136,"Mention investigations of endometriosis","1-Laparoscopy (gold standard in diagnosis + therapeutic)\n•Lesions: A. Pelvic: typical (dark red or brown petichea→ burned match-head spots) or subtle (red or yellow spots) & fixed RVF uterus.\nB. Ovarian: -Superficial: dark red or brown implants (powder burn) + adhesion\n-Deep(endometrioma):cyst(lined by endometrium)&filled with dark altered blood (chocolate cyst)\n•Systematic review for abdomen: pressure of blood inside cysts may destroy endometrial lining, so presence of hemosiderin laden cells (even in absence of endometrial glands) is enough to diagnose endometriosis\n•Classified by \"American Fertility Society \"into 4 classes acc to peritoneal & adnexal implants &adhesions: 1-Minimal (1-5) 2-Mild (6-15) 3-Moderate (16-40) 4-Severe (>40)\n2-US: can’t visualize superficial peritoneal implants or adhesions\n3-MRI may be used for accurate diagnosis of deep infiltrating lesions\n4-CA125 (normal < 35 U/ml): For follow up (detection of recurrence), Not specific (↑in ovarian cancer, fibroid, PID, colitis, TB, OHSS, cancer cx, endometrial cancer, GIT& breast cancer)\n5-If infertile: assess ovulation (as LH/FSH) & tubal occlusion (HSG)\n6-Other: Endoscopy for bladder, rectum, Biopsy & histo for umbilical or implantation nodules","g3",3,"P"],[136,"Mention treatment of endometriosis","1-Prophylaxis: early pregnancy\n2-Medical therapy: in minimal disease→ relief of dysmenorrhea by NSAIDs\n3-Hormonal therapy: •Combined oral contraceptive pilis: continuously (4-6 mon) → pseudo-pregnancy with amenorrhea, decidualization & atrophy\n•Progestogens: continuously (6-9 mon), same outcome as COC:\n-Medroxy-Progesterone Acetate (MPA): 10-30 mg tablets daily\n-Depot MPA IM injections 150 mg given every 3 months\n-Deinogest (Visanne) equal to GnRH but superior in pain relief.\n•GnRH analogues→ pseudo-menopausal status (reversible) Given as IM or SC injection every month ( Decapeptyl: Zoladex)\n•Danazol (of minimal use): A weak androgen→ gonadotrophins, Its androgenic side effects\n(hirsutism, breast size) limits its use.\n4-Surgical: •Conservative surgery:-Indications:pain,exclude malignancy,remove endometrioma before IVF (Cystectomy →AMH so better not remove asymptomatic endometrioma\n-Surgery laparoscopic (laparotomy for extensive):a-Excision, fulguration, or laser ablation b- Peritubal adhesiolysis & excision of deep lesions\n-For chocolate cysts (endometriomas): a)Small (<4 cm) → aspirated + vaporization of int wall b)Large cysts (> 4 cm) → remove cyst wall to prevent recurrence\n-Preop GnRH improves prognosis & Postop COC recurrence\n•Extirpative surgery (fertility is not desired): Oophorectomy + HRT in relatively young but carries a small risk of growth of residual lesions","g3",4,"PI"],[136,"Advantages and disadvantages of medical treatment for pain in endometriosis","Advantages Disadvantages\n-Avoid surgery & damaging pelvic organs\n-Treats implants not visualized during surgery\n-Avoids risk of postoperative adhesion\n- Many side effects -High recurrence\n-No effect on adhesions Or endometriomas\n- No effect on infertility\nPrognosis: progressive in 30-60% of cases & recurrence in 1/3 cases","g3",4,""],[136,"Mention treatment of endometriosis causing infertility","•GnRh agonists for suppression of endometriosis does NOT improve fertility\n•If tubes not distorted by adhesions→ induction of ovulation ± IUI\n•If adhesions are found on HSG →laparoscopic adhesiolysis may be tried\n•Most patients don’t need to remove endometrioma before IVF except if large or painful\n•If all failed→ ART (IVF-ET or ICSI)","g3",5,""],[137,"Define adenomyosis","Presence of endometrial glands & stroma within myometrium","g3",5,""],[137,"Mention etiology of adenomyosis","Denovo or Cullen's diverticular theory [diverticulation of basal parts of glands (poorly respond to hormones)]","g3",5,""],[137,"Mention types / pathology of adenomyosis","1. Localized (uncommon): a small swelling (usually posterior)resembling myoma (no capsule)\n2. Diffuse: symmetrically enlarged firm uterus (< 14 w). Cut section shows brown spots\n(glands + altered blood → reticular appearance)","g3",5,""],[137,"Mention clinical picture of adenomyosis","•affects multipara, at 35 -45 years\n•Pain (main symptom): congestive dysmenorrhea, dull Lower abdominal pain & heaviness , frequency of micturition\n•Menorrhagia: enlarged uterus, congestion & associated endometrial hyperplasia or fibroid\n•PV →enlarged uterus (< 14 w), tender, mobile, firm","g3",5,""],[137,"Differential diagnosis: adenomyosis versus fibroid","Adenomyosis Fibroid\nAge Late 30's; early 40's Child-bearing period\nEtiology Deeply penetrated glands Hyper-estrogenemia\nSize <12 weeks, symetrical Large knobby uterus\nCapsule Diffuse (no capsule) Well circumscribed\nCut section Reticular Whorly","g3",5,""],[137,"Mention investigations of adenomyosis","•U/S (difficult), MRI (more accurate) •Hysteroscopy: wide gland openings are seen\n•The only way for diagnosis → histopathological after hysterectomy","g3",5,""],[137,"Mention treatment of adenomyosis","1. Medical: analgesics & antiprostaglandins for dysmenorrhea\n2. Hormonal (progestins, GnRH, danazol): usually fails.\n3. Surgical (hysterectomy): only definitive treatment.","g3",5,"P"],[134,"Define uterine leiomyoma (fibroid)","Benign tumor of myometrium (smooth ms &fibrous tissue),Incidence(15-20%)(commonest pelvic swelling in female),Mostly asymptomatic","g3",6,"P"],[134,"Mention etiology / risk factors of fibroids","•Unopposed hyperestrogenemia: doesn't develop before puberty or after menopause, associates endometrial hyperplasia/endometriosis &↑size during pregnancy &after menopause\n•Nulliparous or low parity •dark races •obese •+ve family history","g3",6,"P"],[134,"Discuss pathology of fibroids","•Number: multiple or solitary •Size: microscopic to huge\n•Site: 1-Corporeal (95%): interstitial (60%),subserous (20%),submucous (15% & may form polyps)\n2-Cervical fibroid (4%): central (barrel-shaped cervix) or polyp\n3-Extrauterine (1%): in broad ligament, round ligament, ovarian ligament\n•Shape: rounded then irregular (compressed by surrounding organs)\n•Blood supply:from surrounding tissue(center is least vascular) or through pedicle (tip least vascular)\n•Pseudo-capsule of compressed surrounding myometrium\n•Firm: -Hard→if calcification (womb stone) -Soft→ in pregnancy,degeneration, sarcomatous change\n•Cut section: whorled & paler than surrounding muscle\n•Microscopic: smooth muscle & fibrous tissue + mitotic figures <10/10 HPF","g3",6,""],[134,"Enumerate secondary / pathological changes in leiomyoma","1-Degenerations: •Hyaline (myxomatous): commonest, center (poor vascular) replaced by homogenous waxy structureless material with loss of whorly appearance. It is associated with dull aching pain\n•Pseudocystic degeneration: liquefaction following hyaline degeneration →soft or cystic fibroid\n•Fatty change: fat deposition at periphery→yellow, greasy, soft fibroid.\n•Calcification: follow fatty change→hard fibroid (womb-stone), X-ray →eggshell (onion-skin),post-menopausal\n•Red degeneration (necrobiosis): give note incomplete necrosis ,tumor capable of recovery. Local thrombosis & ischemia→release of lipoid toxin→hemolysis→red, enlarged & tender tumor + fever, occurs in\n2nd trimester (↑ vascularity & hypercoagulability),Management: analgesics (anti-PG), antipyretics, fluids & rest\n• Atrophy occurs after delivery or postmenopausal (hypoestrogenemia)\n2-Inflammation\n•Submucous fibroid due to trauma & infection (after abortion or labor)\n•Fibroid polyp: ulceration of tip\n•Subserous fibroid: spread from nearby inflamed organ as appendix\n3-Torsion (axial rotation)\n•Predisposed fibroids: pedunculated , moderate-sized, subserous\n•ppt factors: trauma, sudden change in posture, pregnancy\n•Untwisting is prevented by lashing effect of blood vessel pulsations\n•Types:1-Acute: tumor becomes gangrenous with acute abdomen & tender\n2-Chronic: tumor adheres to neighboring organ (parasitic fibroid)\n4-Malignant chang (Leiomyosarcom:<0.5%\n•Association of endometrial cancer is commoner than leiomyosarcoma","g3",6,"P"],[134,"Mention clinical and intraoperative criteria of suspected malignancy in leiomyoma","malignancy in leiomyoma\n1. Rapid growth & Rapid recurrence\n2.Postmenopausal growth&bleeding\n3. Tumor becomes painful, fixed\n•Macroscopic: yellowish, soft, very vascular with capsular invasion\n•Microscopic: >10 mitotic figures / 10 HPF with cellular atypia","g3",6,"P"],[134,"Mention classification of fibroids","S-Submucosal 0: Pedunculated intracavitary\n1: <50% intramural\n2: >=50% intramural\nO-Other 3: Contacts endometrium, 100% intramural\n4: Intramural\n5: Subserosal >=50% intramural\n6: subserosal <50% intramural\n7: Subserosal pedunculated\n8: Other (specify eg cervical, parasitic)\nHybrid leiomyoma (impact both endometrium and serosa)","g3",7,"I"],[134,"Mention clinical picture of fibroids","Symptoms •Asymptomatic (majority) the nearer to uterine cavity, the more symptoms regardless size.\n•Bleeding: commonest presentation(30%):-Heavy menstrual bleeding,Polymenorrhagia due to ↑vascularity, size, surface area of endometrium, endometrial hyperplasi& hormonal disturbance\n-Intermenstrual bleeding: Ulcerated polyps, associated endometrial carcinoma or sarcoma\n•Pain: -Dysmenorrhea: congestive or spasmodic (with submucous)\n-Dull: hyaline degeneration , infection or sarcoma -Acute abdomen:torsion -red degeneration\n•Pressure symptoms: frequency of micturition, retention ,LL edema, backache\n•Infertility(5-10%):causes of infertility in fibroid: Interference with implantation, Tubal obstruction or obstruction of cervical canal, Associated anovulation & endometriosis\n•Vaginal discharge: Leucorrhea (congestion), mucopurulent (infection)\n•Swelling (abdominal or pelvic)\nExamination: •General: anemia (pallor), polycythemia (erythropoietin production)\n•Abdominal: pelviabdominal mass→ Firm, Mobile & Not tender (unless complicated)→ symmetrical (single) or asymmetrical (multiple) swelling.\n•Vaginally: -Bimanual examination: enlarged uterus, uterus is not separable from fibroid & fibroid moves with mobility of cervix, uterus fixed if myomata are large or adhesions\n-Speculum→ fibroid polyp protruding from cervix","g3",7,"P"],[134,"Mention differential diagnosis of fibroid","•Pelvic or pelviabdominal mass, acute abdomen or chronic anemia\n•Mass in Douglas Pouch or broad ligamentary mass •Mass protruding from cervix\n•Causes of heavy menstrual bleeding & Perimenopausal bleeding","g3",7,""],[134,"Enumerate complications of fibroid","•Pathological changes (degenerations, torsion, infection, sarcoma)\n•pregnancy complications\nPregnancy Labor Puerperium\nEarly Late\n-Abortion\n-Incarcerated\nRVF uterus\n-MalPresentation\n-Non-engagement\n-Preterm labor -Red degeneration\n-Dysfunctional labor\n-Obstructed labor\n-Retained placenta\n-Subinvolution\n-Infection of polyp -PPH\n-Inversion of uterus\n•pressure effects • prolapse •Anemia • infertility •Polycythemia •peudo Meig's","g3",8,"PI"],[134,"Mention investigations of fibroid","•US (gold standard): -Saline son-hysterography: enhances detection of small polyps\n•MRI: differentiates between adenomyosis & myoma & if U/S is inconclusive)\n•Endoscopy: -Submucous fibroid→ Hysteroscopy (diagnostic & therapeutic)\n-Subserous fibroid→ Laparoscopy\n•Preoperative: -Hb, IVP (in cervical or broad ligamentary fibroid)\n-D&C to exclude coexisting malignancy (in postmenopausal bleeding)","g3",8,"P"],[134,"Mention treatment of fibroid","1-Expectant(conservativ):Follow up by US:small,asymptomatic&near menopause or in pregnancy\n2-Medical therapy: a) Young with mild symptoms & small sized uteri (<12 weeks):\n•Iron & tonics , NSAIDS\n•GnRH agonists: (leuprolide acetate 3.75 mg IM /month):\n-Short term (2-3 m) preoperatively: size 50% & bleeding,\n-Long term (6-9 m):rarely utilized,in perimenopaus,Add back by low dose E/P (↓ osteoporosis)\n•Progestins: ineffective & may↑ leiomyoma size •Recent trials for Anti-growth factors b) In pregnancy with red degeneration: Rest, analgesics, antipyretics ± steroids.\n3-Surgical management: •Myomectomy\n•Abdominal hysterectomy (definitive ttt):Easier& less bleeding than myomectomy, done by laparoscop\n4-Alternative lines: •Uterine Artery Embolization (UAE): Injection of gel foam under radiological screen (through femoral artery) → tumor 40% & bleeding 90%\n•Laparoscopic Myolysis: Via thermal coagulation, cryo-ablation or Laser\n•MRI-guided focused US: Improvement in symptoms occurs in 60% of cases","g3",8,"PI"],[134,"Enumerate indications of myomectomy","Young patients with large myomas (> 14 w), severe bleeding. Infertility or RPL","g3",9,"I"],[134,"Mention preoperative steps to reduce blood loss in myomectomy","done postmenstrual, ↑Hb & prepare blood, short term GnRH analogues for 3-6 m","g3",9,""],[134,"Enumerate complications of myomectomy","•Excess intraoperative blood loss •Recurrence of fibroids.\n•Persistence of symptoms (heavy menstrual bleeding)\n•Pelvic & peritubal adhesions→ infertility (do HSG preop)\n•Rupture uterine scar during labour, or rarely during pregnancy.","g3",9,"I"],[134,"Mention methods of management of fibroid by myomectomy","•Management of posterior myomas: -Direct approach (+ ventrosuspension)\n-Transcavitary (rarely done) -Bonney-hood operation (reach myoma through fundal incision)\n•Polypectomy & D&C: for submucous polyp→ catch polyp by ring forceps or volsellum then twist. D&C for hyperplastic endometrium\n•Hysteroscopic myomectomy:For submucous myoma (<5cm &protrude>50% in uterine cavity\n•Laparoscopic myomectomy: For subserous myomas (< 5 cm in size & <4 in number)","g3",9,""],[134,"Mention indications of abdominal hysterectomy in fibroids","Peri/post- menopause, completed her family, malignancy, multiple fibroids, recurrence or uncontrollable bleeding in myomectomy","g3",9,"I"],[134,"Mention indication and disadvantage of uterine artery embolization","•Indication: intramural fibroids < 7 cm especially in obsess\n•Disadvantage: postoperative pain, limitation related to size / no. of myomas, need for highly skilled radiological team","g3",9,""],[134,"Mention disadvantage of laparoscopic myolysis","adhesions, rupture uterus in next pregnancy","g3",9,""],[134,"On what does the management of fibroid depend?","Management depends on: 1. Age of patient & parity (state of fertility) 2. Presence of symptoms/complications\n3. Myoma size, number, type, and location 4. Presence of associating pregnancy","g3",9,""],[134,"Operative steps of myomectomy","1. Transverse suprapubic or midline incision, temp tourniquet of uterine vessels (or Bonney myomectomy clamp) or by injection of diluted vasopressin intramyometrial\n2. Uterine incision: Anterior, midline (least vascular), least possible incisions\n3. The false capsule of each myoma is incised, then enucleate the myoma (helped by Bonney screw), Close the bed of the tumor\n4. Endometrial cavity is opened to remove submucus fibroids","g3",9,""],[134,"Mention management of fibroid with pregnancy","During pregnancy During labor\n•No Myomectomy is the rule (pregnancy→↑blood loss)\n•Rarely if torsion or hemorrhage occurred from a subserous fibroid\n•Rarely done in red degeneration (if conservative measures fail)\n•No obstruction: Vaginal delivery\n•Obstruction:CS +no myomectomy except if\n-Subserous with a long well defined pedicle\n-Sometimes in old patient + multiple fibroids, Cesarean hysterectomy is done\nDuring puerperium: Myomectomy done after 3-6 months (after resolution of pelvic congestion)","g3",10,"I"],[135,"Mention classification of uterine polyps","Cervical Corporal\n-Mucous polyp - Fibroid polyp\n- Inflammatory poly - Malignant polyp\n-Hyperplastic (adenomatous) - Fibroid\n- Placental - Malignant","g3",10,"I"],[135,"Mention clinical picture of uterine polyps","•Bleeding: Heavy menstrual bleeding / Intermenstrual / Contact bleeding (if hanging in vagina)\n•Discharge: Leucorrhea, Offensive •Pain: colicky lower abdominal pain\n•O/E: felt or seen by speculum","g3",10,""],[135,"Mention complications of uterine polyps","•Infection •Squamous metaplasia of epithelium","g3",10,""],[135,"Mention investigations of uterine polyps","(To differentiate between cervical & corporal polypi):\n1. Sound & pass around polyp: If it passes→ corporal & If not → cervical\n2. Hysteroscopy , HSG ,saline sono-hysterography 3.Smear &colposcopy (exc malignancy)","g3",10,""],[135,"Mention treatment of uterine polyps","D&C Polypectomy → Send for histopathology","g3",10,""],[135,"Cervical polyps","1) Mucous polyp: •commonest cervical swelling due to chronic cervicitis causes hyperplasia of endocervical mucous membrane\n•Macroscopic: small red\n•Mic: -Glands within loose CT stroma\n- Columnar epithelium in multiple hyperplastic layers\n2) Fibroid polyps (more commonly corporeal)\n3) Inflammatory polyp: Bilharzial or TB polyp\n4) Malignant polyps: Carcinoma , Sarcoma , carcinosarcoma","g3",10,""],[135,"Corporal (uterine) polyps","1) Adenomatous:\n•May be result of adenomatous hyperplasia\n•Types: Solitary (localized) = adenoma malignum\nOR Generalized (multiple)\n2) Fibroid polyp: hanging from uterus by a long pedicle\n3) Placental polyp: Retained piece of placenta after delivery\n4) Malignant polyp: Carcinoma , Sarcoma 0.5% , carcinosarcoma\nPelvic organ prolapse & RVF","g3",10,""],[126,"Define pelvic organ prolapse","Herniation of pelvic organs to or beyond vaginal walls + extragenital organs as (bladder, rectum &intestine), 5-10% Prevalence, Cystocele is most common type, enterocele is least common","g3",11,""],[126,"Mention predisposing factors of pelvic organ prolapse","1. Parity: •1st stage: Excessive bearing down before full dilatation\n•2nd\nStage:-Delivery in squat position, fundal pressure -Prolonged/obstructed/instrumental delivery\n•3rd\nStage: -Crede's method to deliver placenta - Bad repair of vaginal tears (esp hidden tears)\n•Puerperium: - Early ambulation - Subinvolution\n2. Advancing age: E→ degeneration of pelvic support\n3. Hysterectomy: ↑risk of apical prolapse. 4. Race: less common i
