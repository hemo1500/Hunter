            Management\n                     Amnioreduction (decompression amniocentesis):\n              not > 5 liters at one time & not faster than 1000 mL over 20 min.\n< 32 weeks        Prophylactic maternal steroids before amnioreduction.\n                           Followed by indomethacin for 3 days.\n                           Amnioreduction without indomethacin\n32-34 weeks\n                   (risk of premature closure of the ductus arteriosus).\n> 34 weeks                    Deliver if maturity is confirmed.","fet",32],[1,"Termination of pregnancy in polyhydramnios indications","• Gestational age:\n  o Mild to moderate with normal NST & BPP: 39 to 40 weeks.\n  o Severe cases: 37 weeks.\n• Maternal condition: development of an obstetric or medical\n  complication indicating delivery.\n• Fetal condition: non-reassuring FHR evaluation, non-\n  reassuring biophysical scores, IUFD or malformation\n  incompatible with life.\n• Other: e.g. the patient is in labour.","fet",32],[1,"Mode of termination & postpartum management in polyhydramnios","                           Reasonable if the mother is stable &\n                           the fetal heart tracing is reassuring.\n Vaginal     PGs (cervical ripening) & oxytocin (induction) used with caution →\n Delivery               ↑ risk of PPH & amniotic fluid embolism.\n              Controlled ROM (avoid cord prolapse & sudden ↓ of high IUP).\n                               Continuous fetal monitoring.\n                                     Mother is unstable.\n                Fetal heart tracing is non-reassuring & vaginal delivery is not\nCesarean                                  imminent.\nDelivery      Vaginal delivery is contraindicated (e.g. malpresentations, prior\n                                        classical CS).\n                   Vaginal delivery is unsuccessful (failure to progress).\n                  Measures to avoid PPH & proper management of PPH.\n                         Proper management of any complications.\nPostpartum         Anti-D Ig to all non-sensitised RhD-negative women.\n             Neonatal care: fetal anomalies (especially GIT) may need surgery\n                                     in the early hours.","fet",33],[2,"Definition of oligohydramnios","• It is a condition in which there is a decrease in the amount of\n  amniotic fluid below 500 ml.\n• The sonographic detention that the amniotic fluid index\n  below 5 cm.","fet",36],[2,"Mention etiology of oligohydramnios","• Premature rupture of membrane (PROM): the most\n  common cause.\n• Prerenal causes:\n     1. Placental insufficiency.\n     2. Low-output cardiac failure.\n• Renal causes:\n     1. Renal dysgenesis.\n     2. Potter’s syndrome.\n     3. Polycystic disease.\n• Postrenal causes:\n     1. Urinary tract obstruction.\n     2. Posterior urethral valves.\n• Nonrenal causes:\n     1. Intrauterine growth retardation.\n     2. Post term pregnancy.\n     3. Intrauterine fetal death.\n• Iatrogenic.","fet",36],[2,"Enumerate clinical picture of oligohydramnios","• Symptoms:↓ fetal kicks, slow abdominal enlargement.\n• Clinically: uterus is smaller than expected, and mobility of\n  fetus is restricted.\n• P/V: small bag of forewaters, malpresentations.\n• Ultrasonic examination will confirm the diagnosis.","fet",37],[2,"Mention complications of oligohydramnios","• Fetal:\n    1. Anomalies: like club foot, congenital hip dislocation\n       and chest compression.\n    2. Injury: due to ↑ operative interference.\n• Maternal:↑ incidence of CS d.t.:\n    1. Prolonged labor.\n    2. Decrease the uteroplacental blood flow.\n    3. Perinatal asphyxia.\n    4. Prolonged oligohydramnios (pulmonary hypoplasia +\n       mechanical effects).\n  Breech is more common.","fet",37],[2,"Mention management of oligohydramnios","• Maternal hydration.\n• Treatment of the cause: Malformed (TOP), PROM\n  (sealants) → otherwise\n• Hospitalize→ follow up AF, observe for fetal distress, good\n  hydration.\n• ± Amnioinfusion:\n     1. It facilitates: US visualization of the fetus, cephalic\n        version\n     2. treatment of chorioamnionitis (antibiotics) & MAS\n        (dilution)\n     3. It may lead to: Infection, AF embolism, PTL (irritation),\n        PROM.","fet",38],[5,"Definition of post-term pregnancy","• Pregnancy ≥ 42 weeks or ≥ 294 days from the first day of the\n  last menstrual period (LMP).\n• Accurate pregnancy dating is critical to the diagnosis.","fet",39],[5,"Etiology & risk factors of post-term pregnancy","• Majority have no known etiology.\n• Miscalculation: commonest cause.\n• Maternal Risk Factors:\n  o Primigravidity, black race, positive family history & older\n     maternal age.\n  o Previous postdate pregnancy: risk 2-3 fold after 1\n     episode & 4 fold after 2 episodes.\n• Fetal Risk Factors:\n  o Altered estrogen/progesterone ratio, e.g. anencephaly &\n     adrenal hypoplasia.\n  o Male fetal gender.","fet",39],[5,"Fetal & neonatal complications of post-term pregnancy","• Macrosomia (most post term infants) → obstructed labor,\n  CS, shoulder dystocia & brachial plexus injuries.\n• Fetal dysmaturity (postmaturity) syndrome (up to 20%) =\n  chronic intrauterine malnutrition. Risks:\n  o Oligohydramnios → umbilical cord compression.\n  o Nonreassuring antepartum or intrapartum FHR patterns\n    (placental insufficiency or cord compression).\n  o Meconium passage (physiological gut maturation or fetal hypoxia).\n• Perinatal mortality increases: intrauterine infection,\n  placental insufficiency & cord compression → fetal hypoxia,\n  asphyxia & meconium aspiration.","fet",40],[5,"Features of the dysmature (post-term) neonate","• Small for gestational age.\n• Skin: dry, peeling, loose, meconium stained, prominent\n  creases; vernix caseosa decreased or absent.\n• Long thin body & long nails.\n• Hair: lanugo sparse or absent; scalp hair increased.","fet",40],[5,"Maternal complications of post-term pregnancy","• ↑ frequency of labor abnormalities & sequelae of labor\n  induction and fetal macrosomia:\n  o Failed induction.\n  o Birth trauma: 3rd & 4th degree perineal lacerations.\n  o Postpartum hemorrhage (PPH).","fet",40],[5,"Management of post-term pregnancy","• At first, exclude miscalculation.\n• Assessment of fetal well-being: CTG between 41-42 wks.\n• Expectant management with fetal monitoring (some\n  women choose it).\n• Induction of labour (supported by several lines of evidence):\n  o Lower perinatal mortality & morbidity.\n  o No ↑ in (or a ↓ in) CS delivery.\n  o Patient satisfaction.\n• CS is indicated if:\n  o Mother is unstable.\n  o Fetal heart tracing is non-reassuring & vaginal delivery is\n     not imminent.\n  o Vaginal delivery is contraindicated (e.g. prior classical CS).\n  o Vaginal delivery is unsuccessful (failure to progress).\n• This management applies to a singleton, cephalic fetus in an\n  otherwise uncomplicated pregnancy that reaches 41 wks.\n• Multiple gestations, non-cephalic presentations &\n  complicated pregnancies are generally delivered before 41\n  weeks.","fet",41],[12,"Discuss the etiology of fetal anomalies","• Unknown (60%): most common.\n• Multifactorial (20%): genetic predisposition + non genetic\n  IU factors.\n• Exogenous: gestational age is very important\n• Endogenous: chromosomal abnormalities and gene mutations.","fet",43],[12,"Mention exogenous factors that cause fetal anomalies Intrinsic Insult                          Extrinsic Insult","• Maternal disease: DM                      • Drugs: Thalidomide → phocomelia.\n• Maternal infection: STORCH - Parvo        • Irradiation: genetic mutations or\n  virus B 19.                                 chromosomal aberrations\n• Virilizing lesions of ovary or adrenal.   • Environmental agents: contamination\n                                              & pollution - occupational.","fet",43],[12,"Mention endogenous factors causing fetal anomalies a) Chromosomal Abnormalities (6%)","        Numerical Abnormalities             Structural Abnormalities\n• Autosomal: trisomy 21, 81 & 13     Deletion, inversion & translocation\n• Sex chromosomal: Turner (45 XO),\n  kleinfiltert (47 XXY)\n                             b) Gene Mutations (7.5%)\n▪ AD as marfan syndrome, neurofibromatosis.\n▪ AR disorders as thalassemia, sickle cell anemia.\n▪ X linked diseases such as hemophilia & muscle dystrophy\n                       4) Mention types of fetal anomalies\n                                       1. Neural tube defects as anencephaly, spina bifida\nCongenital Anomalies\n\n                                       2. Abdominal wall defects (exomphalos) and congenital\n                          Structural\n                                       diaphragmatic hernia.\n                          Anomalies\n                                       3. Cardiac anomalies: ASD & VSD\n                                       4. Renal anomalies as renal agenesis\n\n                         Biochemical   are due to enzyme deficiencies as: Phenylketonuria,\n                          Anomalies    cystinuria, galactosemia and others.\n\n                  Chromosomal          include: Down syndrome (trisomy 21), Edward syndrome\n                   Anomalies           (trisomy 18) & Pateau syndrome (trisomy 13)\n\n                       5) Mention value of prenatal diagnosis of fetal anomalies\n                          • Counseling the parents about termination of pregnancy\n                          • In utero fetal therapy in selected cases.\n                          • Preparation for postnatal treatment of the newborn shortly\n                            after delivery.\n\n                       6) Mention indications of prenatal diagnosis of fetal anomalies\n                           Before Pregnancy                     After Pregnancy\n  1. Age >35 years, ≥ 2 abortions                         1. Administration of teratogenic drugs\n  2. Previously affected fetus Parents                    2. Exposure to teratogenic or certain\n     have chromosomal anomaly                                infections during early pregnancy\n\n                       7) Mention methods used to diagnose fetal anomalies\n                          • Maternal serum screening: AFP, hCG\n                          • Ultrasound screening\n                          • MRI: save and more efficient than us but expensive\n                          • Invasive procedures: amniocentesis and CVS\n 8) Enumerate Maternal Serum Screening methods\n    • Alfa fetoprotein: MSAFP is abnormally increased (>2.5\n      MOMS) in open neural tube defects (NTDS), and turner\n      syndrome abnormally decreased (<0.5 MOMS) trisomy 21\n      (Down syndrome).\n    • Human chorionic gonadotropin(hCG): ↑ in down syndrome\n    • PAPP-A: decrease in down syndrome\n    • Unconjugated estriol (uE3): decrease in down syndrome.\n\n 9) Mention clinical use of U.S in prenatal diagnosis of fetal\n anomalies\n    • Nuchal translucency (NT) by TVS (11-13w): NT> 3.0mm →\n      exclude down syndrome (DMT, TMT, CVS &\n      amniocentesis).\n    • Anencephaly: can be excluded by the end of 1st trimester\n    • 2nd trimester fetal anatomy survey (20-24W) as ONTDs\n\n10) Enumerate invasive procedures to detect fetal anomalies\n    • Amniocentesis: aspirate 10-20 ml of liquor by\n      transabdominal 22-gauge needle under local anesthesia\n      and US guidance\n    • Chorionic villous sampling (CVS): transvaginal (7-12W) &\n      transabdominal (12W)\n    • Cordocentesis (18W): aspirate 1 ml of cord blood → fetal\n      bradycardia & alloimmunization\n   11) Mention clinical use of amniocentesis\n                 Diagnostic                                  Therapeutic\n1- Lung maturity L/S ratio - Phosphatidyl glycerol      1- Amnioreduction.\n2- Instillation of indigo carmine in case of PROM.      2- Amnioinfusion.\n3- Diagnosis of intrauterine infection by culture       3- Induction of abortion\n4- Chromosomal analysis for Karyotyping, fetal sexing   4- IU transfusion.\n5- DNA analysis & Enzyme assay\n\n   12) Discuss screening of trisomy 21 (down syndrome):\n      ➢ First trimester screening (11–13 w):\n        • Double marker (↑ hCG, ↓ PAPP-A) & US (NT & nasal\n          bone hypoplasia)\n      ➢ Second trimester screening:\n         • Triple marker test (15–16 w): high hCG with low MSAFP\n           & uE3.\n         • US fetal anatomy survey at 12 and 16 weeks gestation.\n      ➢ Final diagnostic tools in high-risk cases: by CVS and\n         amniocentesis","fet",43],[11,"Definition of postnatal asphyxia","• Failure of the fetus to start normal respiration after\n  delivery.","fet",48],[11,"Causes of postnatal asphyxia","• Prematurity.\n• Persistence of a state of severe intrauterine asphyxia after\n  birth.\n• Obstruction of respiratory passages by mucus, amniotic\n  fluid, blood or meconium.\n• Paralysis of cardiorespiratory center due to cerebral\n  hemorrhage.\n• Depression of respiratory center by drugs (morphine or\n  pethidine) or narcotics & anesthetics given during labor.\n• Congenital malformations, congenital atelectasis of the\n  lungs or congenital abnormality in the respiratory or\n  circulatory system.","fet",48],[11,"Diagnosis of postnatal asphyxia (mild vs severe)","   • Clinical examination to determine APGAR score at 1 & 5\n     minutes after delivery.\n   • Neonatal respiratory distress may be mild or severe.\n                         Mild                           Severe\n                                               Respiratory & vasomotor\nFailure of         Respiratory center\n                                                       centers\n  Color      All cyanosed (asphyxia lividia)   All pale (asphyxia pallidia)\n Shock                    −ve                              +ve\n Pupils                 Reactive                      Dilated fixed\nPrognosis                Good                             Poor","fet",49],[11,"Management of postnatal asphyxia by APGAR score","• Score 4-6: mucus suction + oxygen mask.\n• Score 1-3: ABC of life in neonatal intensive care unit (NICU):\n  o A (Airway): patent by suction under vision & endotracheal\n    tube – atropine – adrenaline.\n  o B (Breathing): ambo bag or ventilator – bicarbonate to\n    correct acidosis.\n  o C (Cardiac): cardiac massage – catheterization of\n    umbilical vein – Ca gluconate 10%.","fet",49],[11,"Drugs used in postnatal asphyxia","• Volume expanders: saline – ringer – albumin.\n• Oxygen: may cause retrolental fibroplasia &\n  bronchopulmonary dysplasia (BPD).\n• Naloxone (Narcan): if narcotics were given in the last 4 hours.\n• Surfactant: in hyaline membrane disease.","fet",50],[14,"Causes of fetal birth trauma","   • Marked compression or rapid compression – decompression.\n   • Passage: CP – soft tissue obstruction.\n   • Passenger: macrosomia – malpresentation.\n   • Power: precipitated labor.\n   • Practice: instrumental vaginal delivery (forceps – ventouse)\n     & intrauterine manipulation (internal podalic version – breech\n     extraction).\n\n❖Head injuries","fet",51],[14,"Etiology of neonatal intracranial hemorrhage (ICH)","• Causes of trauma (see Q6).\n• Hypoxia: rupture of blood capillaries.\n• Prematurity: ↓ prothrombin, fragile blood vessels & soft bones.\n• Blood diseases: hemophilia or thrombocytopenia.","fet",51],[14,"Clinical picture & investigation of neonatal ICH","• C/P: neonatal distress, convulsion, coma & may end by death.\n• Bulging of the anterior fontanelle is characteristic.\n• Investigation: CT – cranial US – X-ray (fractures).","fet",51],[14,"Management of neonatal ICH","• Prophylaxis: avoid traumatic delivery.\n• Active: vitamin K – oxygen ± antibiotics ± anticonvulsants ±\n  lumbar puncture.","fet",52],[14,"Fractures of the skull (linear vs depressed)","       Linear Fracture                    Depressed Fracture\n        More common.                           Occasional.\n   Heals without complication              Treated by elevation\n      (within 8-10 days).                  (manual, ventouse).\n\n❖Peripheral Nerve Injuries","fet",52],[14,"Brachial plexus palsy","     • Mainly with shoulder dystocia.\n                             Root                      Sign\n    Erb's Palsy              C5-6.             Waiter's tip posture.\nKlumpke's Paralysis         C8 to T1.               Wrist drop.\nCombined Paralysis      More common.           + Horner's syndrome.\n\n     • TTT: most infants recover within 2-3 weeks ± passive exercises.","fet",52],[14,"Facial palsy","   • Mainly with forceps delivery.\n   • Treatment: most infants recover within 3-4 days:\n     o Sucking should be observed to ensure there is no dribbling.\n     o Eyes protected with methylcellulose drops.\n     o Re-examine to differentiate neurapraxia (edema of the\n       nerve) from neurotmesis (true nerve injury).\n\n❖Musculoskeletal Injuries","fet",53],[14,"Fracture clavicle in the newborn","• Most common fracture in newborn.\n• Fragments not dislocated: no treatment.\n• Fragments dislocated: figure-of-8 bandage.","fet",53],[14,"Fracture of long bones in the newborn","• Most common: humerus & femur.\n• Management: immobilization by classic bandage for 2-3 wks.","fet",53],[14,"Injury to the sternomastoid muscle","  • Infant holds the head to one side (torticollis).\n  • Complete recovery in 2-3 months.\n❖Soft Tissue Injuries","fet",53],[14,"Lacerations in the newborn","• Head Lacerations due to:\n   o Scalpel blade during cesarean section (CS).\n   o Scissors during episiotomy.\n   o Scalp blood sampling for pH monitoring.\n• Vulval Lacerations: in frank breech presentations.","fet",54],[14,"Scalp abscesses","   • Treatment: drainage + antibiotics.\n\n❖Abdominal organs","fet",54],[14,"Injury to abdominal organs in the newborn","• Etiology: breech (esp. liver, spleen, kidneys).\n• Management: anti-shock + laparotomy + aspiration blood.","fet",54],[15,"Complications of rubella infection in pregnancy","• Abortion, stillbirth, low birth weight.\n• Congenital anomalies:\n    1. Cataract.\n    2. Deafness.\n    3. Cardiac anomalies.\n    4. Hepatosplenomegaly, Lymphadenopathy.","fet",56],[15,"Complications of toxoplasmosis infection in pregnancy","• Abortion.\n• Convulsions.\n• Intracranial calcification\n• Chorioretinitis\n• Hydrocephalus or microcephaly\n• Hepatosplenomegaly\n• Jaundice and anemia","fet",56],[16,"Definitions & normals","Term             Lie           Attitude         Presentation             Position\n           The relation      The relation     The first            The relation\n           between the       of fetal parts   (lowermost) part     between the\n           long axis of      to each          of the fetus which   denominator\nDefinition\n           fetus & long      other.           meets the pelvic     and the 4\n           axis of mother.                    brim. First part     quadrants of the\n                                              felt by PV.          maternal pelvis.\n                             Generalized\n           Longitudinal\nNormal                       flexion of all   Cephalic (96%)       Occiput\n           (99.5%)\n                             joints","nl",2],[16,"Other conditions","Term                 Lie               Attitude        Presentation        Position\n              ▪ Longitudinal       ▪ Generalized      ▪ Cephalic           ▪ LA / RP\n                (Cephalic /          flexion of all     (Vertex / Face     ▪ DA / DP\n                Breech).             joints.            / Brow).           ▪ RA / LP\nPossibilities ▪ Transverse.        ▪ Complete         ▪ Breech             ▪ RT / LT\n              ▪ Oblique              extension of       (3.5%).\n                (Shoulder).          head (Face).     ▪ Shoulder\n                                                        (0.5%).","nl",2],[16,"Define denominator & enumerate them","➢ The certain bone on the fetal presenting part could be felt by\n  PV.\n➢ Vertex → Occiput.                ➢ Breech → sacrum.\n➢ Face → mentum.                   ➢ Shoulder → scapula.\n➢ Brow → frontal bone.\n     Fetal Diameters (Passenger)","nl",2],[16,"Mention regions of the fetal head","• Base: from foramen magnum to the chin.\n• Face: from the chin to root of the nose &\n  supra orbital margins.\n• Vault: consists of brow, vertex and occiput.\n• Vertex: area of the vault bounded by Bregma + coronal\n  suture anteriorly & Lambda + lambdoid suture posteriorly &\n  lines of 2 parietal eminences laterally.","nl",3],[16,"Mention transverse diameters of fetal head & skull","• Biparietal (9.5 cm): engagement in synclitic head.\n• Supra-parietal sub-parietal (9 cm): engagement in\n  asynclitism.\n• Bitemporal (8 cm): between lower part of coronal suture.\n• Bimastoid (7.5 cm): between mastoid processes (Not\n  reducible)","nl",3],[16,"Mention longitudinal diameters of fetal head & skull","• Suboccipito-bregmatic (9.5 cm).\n• Submento-bregmatic (9.5 cm).\n• Occipito-frontal (11.5 cm).\n• Submento-vertical (11.5 cm).\n• Suboccipito-frontal (10 cm).\n• Mento-vertical (13.75 cm).","nl",3],[16,"Enumerate fontanelles of fetus","• Anterior (Bregma), diamond shape & closes at 1.5 years.\n• Posterior (Lambda), Triangular & Closes at full term at birth.\n• 2 anterior temporal fontanelles.\n• 2 posterior temporal fontanelles.","nl",4],[16,"Define moulding","• Overlapping of fetal skull bones at the sutures during\n  passage through the pelvis.","nl",4],[16,"Compare between Caput Succedaneum vs Cephalhematoma","              Caput succedaneum      Cephalhematoma\nDefinition       Edema of the scalp          Subperiosteal blood collection\nCause            Pressure on fetal head      Forceps, ventouse, prolonged\n                 dt prolonged labor /        labor, rupture of periosteal vessels\n                 ventouse\nCrosses suture   Yes                         No (limited by suture)\nAppearance       At birth                    Hours–days after birth (12–24 h),\n                                             enlarges\nConsistency      Soft, pitting edema, ill-   Firm, tense, well-defined edge,\n                 defined edge                non-pitting\nResolution       24–48 h (up to 72 h)        Weeks to 2–3 months, may\n                                             calcify\nAssociated       Mask fontanelles and        Skull fracture (~5–20%),\n                 sutures                     jaundice\nTreatment        None                        None; do not aspirate (infection);\n                                             monitor bilirubin","nl",4],[16,"Define synclitism","• Both parietal bones enter the pelvis at the same time & at\n  the same level.","nl",5],[16,"Compare between synclitism and asynclitism","                          Synclitism                   Asynclitism\nSagittal        Midway between symphysis      Closer to symphysis\nsutures         pubis and sacral promontory   pubis and sacral promontory\nParietal                                      One at a lower level due to\n                Both are the same level\nbones                                         lateral flexion of head\nEngaging                                      Subparietal – supraparietal\n                Biparietal diameter\ndiameters                                     diameter\nIncidence       25% of labor                  75% of labor","nl",5],[16,"Compare between anterior & posterior asynclitism","                     Anterior asynclitism         Posterior asynclitism\n                         (Naegele's)                  (Litzmann's)\nSagittal        Towards the sacral            Towards the symphysis pubis\nsuture lies     promontory (posteriorly)      (anteriorly)\nPresenting      Anterior parietal bone        Posterior parietal bone\nparietal bone\nIn              Multipara / Pendulous         Primigravida / Strong\n                abdomen.                      abdominal muscles\nPrognosis       Good                          Poor","nl",5],[16,"Why APBP has better prognosis than PPBP?","• The head lies in the direction of the axis of the pelvic inlet.\n• During correction of asynclitism, the head meets only the\n  resistance of the sacral promontory, while in PPBP the head\n  meets the resistance of the whole back of the SP.\n• Lower uterine becomes markedly stretched in PPBP Uterine\n  rupture is more likely.","nl",6],[16,"Compare between false and true pelvis","               False pelvis                       True pelvis\nLies above the pelvic brim             Lies below the pelvic brim\n- no obstetric importance but:         - it is important obstetrically\n 1) Gives idea about the true pelvis   - it has inlet, cavity & outlet\n 2) Diameters\n 3) Diagnose rachitic pelvis (ISD>ICD)\n 4) Site of renal transplant","nl",7],[16,"Mention importance of plane of the inlet","• Engagement: the biparietal diameter of the fetal head\n   passes through this plane.\n• Angle of inclination: It is the angle between the plane\n       of inlet and the horizon in the standing position = 55°","nl",7],[16,"Discuss diameters of pelvic inlet","      1. Anteroposterior diameters:\n                Anatomical                 Obstetric              Diagonal\nStart                           Middle of the sacral promontory\nEnd        Middle of the upper      Most bulging point on Middle of the lower\n           border of SP             the back of SP         border of SP\nLength     11 cm                    10.5 cm                12.5 cm\nimport     According to its         Actual diameter        Measured clinically by\n           contraction the          utilized by head       PV\n           pelvis is classified     during labor           → subtract 1.5cm\n                                                           → true conjugate\n\n        2. Transverse diameters:\n                          Anatomical TD                    Obstetric TD\nIt lies          Diameter between the 2          Diameter which bisects the\n                 widest points on the pelvic     anatomical anteroposterior\n                 brim (iliopectineal lines)      diameter of the inlet\nImportance       No obstetric importance         Utilized by the head during\n                                                 labor\nLength          In normal female pelvis both diameters coincide =13 cm\n                But in android pelvis the anatomical is wider & behind the\n                obstetric diameter\n      3. Oblique diameters:\n                 Rt oblique           Lt oblique            Sacro-cotyloid\nStart        Rt sacroiliac joint  Lt sacroiliac joint Middle of sacral\n                                                      promontory\nEnd        Lt IP eminence         Rt IP eminence IP eminence of one side\nLength     12.5 cm                12 cm               9.5 cm\nImportance Right > left                               Diameter of engagement in\n           left is partially occupied by sigmoid .c occipito posterior position\n           Rt leg used > Lt leg                       → Delayed decent of the\n                                                      head and deflexion.","nl",8],[16,"Mention boundaries of the pelvic cavity","• Superiorly: plan of the rim\n• Anteriorly: back of the SP\n• Inferiorly: plane of obstetric outlet\n• Posteriorly: ventral aspect of the sacrum","nl",9],[16,"Discuss planes of the pelvic cavity = plane of greatest pelvic dimension","• Pass from:\n      1) The middle of the back of the SP\n      2) Across the center of the acetabulum\n      3) Upper border of greater sciatic notch\n      4) To the junction of S2 &S3\n• Importance: internal rotation occurs when BPD occupies\n   this plan\n• Diameter: it is rounded → all the diameters= 12.5 cm","nl",10],[16,"Discuss boundaries of pelvic outlet","1) The obstetric outlet → lower segment of the pelvis\n   ▪ Roof: plane of the least pelvic dimensions.\n   ▪ Floor: plane of anatomical outlet.\n   ▪ Anterior wall: defective→ roof & floor meet at SP angel.\n   ▪ Posterior wall: coccyx.\n   ▪ Lateral wall: ischium between ischial tuberosity & ischial\n      spine.\n\n 2) Anatomical outlet → diamond shaped bounded by\n    ▪ Anteriorly: pubic arch.\n    ▪ Posterolateral: sacrotuberous ligament.\n    ▪ Lateral: ischial tuberosities.","nl",11],[16,"Mention the importance of obstetric outlet","• Floor of the cavity & roof of the obstetric outlet\n• The external os of the cervix & the vaginal vault.\n• Origin to levator ani muscle.\n• Injection of anesthetic agent for pudendal nerve block.\n• Pelvic axis change their direction forwards.\n• Ureters change their direction forwards.\n• The head is considered engaged if the vault is felt at or\n  below this level.\n• Forceps should not be applied when the fetal head is\n  above this level.","nl",11],[16,"Enumerate the diameters of pelvic outlet","          1. Anteroposterior diameters:\n           Obstetric APD                         Anatomical ABD\n13 cm                               11 cm\nBetween the lower border of SP      Between the lower border of SP and the\nand the tip of the sacrum           tip of the coccyx\n\n         2. Transverse diameters:\nObstetric TD (Bispinous diameter) Anatomical TD (Bituberous diameter)\n\n10.5 cm                                11cm\nBetween tips of ischial spines         Between inner surface of ischial\n                                       tuberosities","nl",12],[16,"Discuss axis of the pelvis","          Anatomical axis                           Obstetric axis\n• No obstetric value                       • It’s the direction taken by the\n• It is an imaginary c shaped line           fetal head during delivery\n  passing by the central points of the     • L or J shaped because the head\n  planes of the inlet, cavity and outlet     descends downwards &\n                                             backwards until level of the\n                                             ischial spines, where it meets the\n                                             pelvic floor, and then it\n                                           • passes downwards &\n                                           • forwards.","nl",12],[16,"Enumerate the main positions of fetal head in relation to maternal pelvis","• Left anterior: left iliopectineal eminence\n• Direct posterior: Sacral promontory\n• Left posterior: left sacroiliac joint\n• Left lateral: Mid iliopectineal line\n• Right posterior: Right sacroiliac joint\n• Direct anterior: symphysis pubis\n• Right anterior: Right iliopectineal eminence\n• Right lateral: Mid iliopectineal line","nl",13],[17,"Mention characters of uterine contractions","• Involuntary: independent of extra uterine nervous control\n  → paraplegia patients and patients using epidural\n  anesthesia have normal, painless uterine contractions.\n• Polarity & Fundal Dominance.\n• Propagating & Coordinated.\n• Progressive & Intermittent: ↑ in frequency, amplitude\n  and duration. Late in labor every 1–2 minutes, 40–60\n  mmHg, lasting 30–90 seconds.\n• Painful: Colicky pain radiating to the back\n• Productive (Retraction Property)","nl",14],[17,"Why does uterine contraction pain radiate to the back?","• Compression of myometrial blood vessels → ischemia.\n• Compression of nerve ending.\n• Stretch of the peritoneum on the LUS.\n• Stretch of cervix during its dilatation.","nl",14],[17,"What does the retraction property of contractions lead to?","▪ Cervical dilatation and effacement\n▪ Tense bulging bag of forewater\n▪ Expel the fetus\n▪ Separation & delivery of the placenta.\n▪ Control bleeding from the placental site.\n▪ Involution of the uterus after labor","nl",14],[17,"Discuss secondary forces (Auxiliary) .","• Maternal bearing down in the 2nd stage of labor:\n  o Voluntary bearing down: increased intra-abdominal\n    pressure → increased intrauterine pressure.\n  o Involuntary bearing down (Reflex): due to stretch of the\n    pelvic floor by the presenting part in the second stage →\n    reflex bearing down.\n• Unfolding of the fetus (final step).\n• Effect of gravity.","nl",15],[17,"Define labor or parturition","• It is a process by which the uterus expels the fetus &\n  placenta at or beyond 28 weeks.","nl",15],[17,"Define delivery","• Actual birth of fetus at the end of the 2nd stage of labor.","nl",15],[17,"Mention characters of normal labor","1. Spontaneous onset (expulsion)\n2. Of a Single\n3. Mature (37 - 42 completed weeks) fetus\n4. In reasonable time (3-18 hours)\n5. Through natural passages (birth canal)\n6. Living\n7. Presented by Vertex\n8. No Fetal complications\n9. No Maternal Complications\n10. No interference (except episiotomy)","nl",15],[17,"Mention causes of onset of labor","   The cause is unknown but proposed theories include:\nProgesterone withdrawal        Estrogen-oxytocin effect\nProstaglandin release          ↓ placental oxytocinase\nFetal cortisol theory          Uterine distention theory","nl",16],[17,"How to diagnose labor?","              • Lightening: relief of dyspnea, dyspepsia & heart burn.\nPrelabor      • Shelving: uterine funds fall forwards (like a shelf).\nprodromal     • Pelvic pressure symptoms: frequency, heaviness, &\nstage           difficult walking.\n              • False labor pain.\n              • Onset of true labor pain.\nSymptoms      • Passage of show: blood stained mucoid discharge just\n                before labor.\n              • Progressive cervical dilation & effacement.\n              • Formation of the bag of fore water: when membrane bulge\nSigns\n                through the partially dilated cervix and become tense during\n                uterine contractions → sure sign","nl",16],[17,"Differentiate between true and false labor pain","                                 True LP                          False LP\nSite        Suprapubic radiates to back & lower limbs         Irregular\nCharacter   Spasmodic colicky pain                            Irregular\nRhythm      Regular → ↑ frequency, amplitude & duration       Irregular\nEffect      Associated with cervical dilation & effacement    Not effective\n            and bulging of bag of fore water\nSedation    Doesn’t decrease                                  Decrease","nl",16],[17,"Enumerate the stages of labor","   1) 1st stage (cervical dilatation)\n   2) 2nd stage (delivery of the fetus)\n   3) 3rd stage (delivery of placenta)\n   4) 4th stage (one hour after delivery)\n\n❖ 1st stage (cervical dilatation):","nl",17],[17,"Discuss mechanism of 1st stage of labor","o Factors affecting cervical dilatation & effacement:\n   Cervical ripening: In late pregnancy, cervix becomes softer\n   and thinner\no Forces Causing Cervical Effacement & Dilatation:\n  Uterine contractions and retractions.\n  Pressure by the bag of fore water & the presenting part.\no Patterns of cervical effacement:\n    ❖ In primigravida: Effacement occurs first followed by\n       dilatation\n    ❖ In multipara: Effacement and dilatation of the cervix\n       occur simultaneously.","nl",17],[17,"Discuss duration of 1st stage (Friedman curve)","                              Begins with onset of labor → cervix dilates slowly to be\nLatent phase                  about 2-3 cm.\n\n               Acceleration   Gradual increase of cervical dilatation from 2 cm to 4\n               phase          cm in about 2 hours\nActive phase\n\n               Phase of       Rate of cervical dilatation is maximal, about 4 cm in 2\n               maximum slop   hours.\n\n               Deceleration   Dilatation appears to slow\n               phase          again 2 cm in 2 hours reaching full cervical dilatation\n   ❖ 2nd stage (expulsion of fetus):","nl",18],[17,"Discuss mechanism of normal labor (occipito anterior)","                              Delivery of the head\n\n1) Descent: a continuous movement through labor\n2) Engagement: passage of the widest transverse diameter of the presenting\n   part below the plane of pelvic inlet.\n3) Increased flexion\n4) Internal rotation: When the occiput meets pelvic floor→ it undergoes internal\n   rotation 1/8 of circle anteriorly →so that occiput becomes opposite the\n   symphysis pubis DOA.\n5) Extension: After complete rotation of the head, the head is in contact with\n   both levator ani which contracts at the same time pushing the head forward\n   →Distension of vulva by suboccipito frontal (10 cm).\n6) Restitution: The occiput rotates 1/8 of a circle in an opposite direction to\n   internal rotation, to undo the twist of the neck caused by internal rotation.\n7) External rotation: Rotation of the occiput 1/8 of a circle in same direction as\n   restitution.\n\n                      Delivery of the shoulders and body\n\n▪ The biacromial diameter descends in the opposite oblique diameter of the\n  inlet.\n▪ The anterior shoulder meets the pelvic floor 1st rotates anteriorly 1/8 of a\n  circle.\n▪ The anterior shoulder hinges below the SP.\n▪ The posterior shoulder is delivered first by lateral flexion of the spine.\n▪ The anterior shoulder then follows, then the rest of the body","nl",19],[17,"Mention causes of non-engagement of head in PG in last month","         Passage                     Passenger                     Power\nContracted pelvis            ▪ Malposition → OP              Atony of the\nPlacenta previa                (commonest cause)             abdominal muscles\nSoft tissue obstruction:     ▪ Malpresentations as\n▪ Full bladder / Rectum        face and brow\n▪ Pelvic tumors              ▪ Polyhydramnios\n                             ▪ Hydrocephalus\n                             ▪ Placenta previa\n                             ▪ multiple pregnancy\n                             ▪ large head\n                             ▪ short cord","nl",20],[17,"Mention factors responsible for head descent","• The retraction of the upper uterine segment.\n• The increase in the intrauterine pressure.\n• The fetal axis pressure.\n• The bearing down efforts of the mother.","nl",20],[17,"Explain the mechanism of internal rotation and its result.","    The sloping character of pelvic floor          The rifling action of bony pelvis\nAfter flexion, the occiput meets pelvic floor   The pelvic inlet is a transverse oval,\nfirstly, it moves with direction of the slope   while the outlet is a longitudinal oval\nof the pelvic floor (downward, forward and      screw\ninward). This is the main factor.               action rotating the occiput anteriorly.\n\n       ▪ Resulting in: Bringing the longitudinal diameter of the head\n         into the longest diameter of pelvic outlet (antero-posterior\n         diameter 13 cm).","nl",20],[17,"Explain mechanism of increased flexion in labor","            Armed lever theory                      Accommodation theory\nHead is represented by 2 armed levers of     for the head to accommodate itself\nunequal lengths:                             in cylindrical birth canal, its\n- A short arm: extends from the occiput      longest longitudinal diameter\nto the atlanto-occipital joint.              (Mentovertical) should lie along the\n- A long arm: extends from the sinciput to   longitudinal diameter of the cylinder.\nthe atlanto-occipital joint.\nWhen the head meets resistance during\nits descent, the force applied on the\nsinciput is greater than that on the\nocciput, leading to increased\nflexion.","nl",21],[17,"What does the increased flexion result in?","      • The head enters the pelvis with suboccipitobregmatic\n        (SOB) diameter → (9.5 cm).\n      • The occiput meets the pelvic floor first → facilitate internal\n        rotation.\n      • The part of the head occupying the plane of the greatest\n        dimensions is like a circle, as the BPD and SOB diameter\n        are both equal (9.5 cm) →facilitate internal rotation.\n❖ 3rd stage (expulsion of placenta & membranes):","nl",21],[17,"Discuss mechanism of delivery of the placenta","                A. First phase → phase of placental separation\n\nUterine retraction → shrinkage of the placental site but the placenta can’t\nshrink → peel from the uterine wall at the weakest layer (stratum spongiosum)\n\n               B. second phase → phase of placental expulsion\n\nPlacenta descends by 2 mechanisms :\n1) Schultze mechanism (80%)\n2) Duncan mechanism (20%)","nl",22],[17,"The placenta descends by 2 mechanisms. compare between them","        Schultze mechanism                       Duncan mechanism\n                                        Placental separation starts at the\nPlacenta separation starts at the\n                                        lower edge\ncenter.\n\nThe placenta is delivered as an\n                                         The placenta is delivered sideways.\ninverted umbrella with its fetal surface\nfirst.\n\nLess blood loss and less retained       More blood loss and more retained\nfragments & air embolism.               parts & air embolism.","nl",22],[17,"Mention signs of placental separation","            ▪ Fundal level rises.\nAbdominally ▪ Uterus becomes globular, hard, smaller (earliest sign).\n            ▪ Suprapubic bulge.\n\n              ▪ Gush of blood vaginally at time of placental separation.\nVaginally     ▪ Elongation of the cord.\n              ▪ Placenta is felt separated in LUS or vagina.\n\n              ▪ Strassmann sign a gentle impact on the fundus is\n                transmitted as a wave to the umbilical cord if the placenta is\n                still attached.\nTo confirm\n              ▪ Gentle taction upon the cord →elongation of the cord outside\n                the vulva stops traction cord get elevated if the placenta is\n                not separated","nl",23],[18,"Mention the steps of management of the 1st stage of labor"," a) Antiseptic\n     • Trimming of vulvar hair: by scissors.\n     • Swabbing by antiseptic solution from forward backward.\n\nb) Bladder & rectum evacuation\n     • Urinary bladder: by frequent micturition or by a catheter.\n     • Rectum by encouraging patient to defecate.\n\nc) Position\n    • If the membranes are ruptured: rest in bed in the left\n      lateral position (to avoid supine hypotensive syndrome).\n    • If the membranes are intact: Walking is allowed in\n      between uterine contractions.\n    • Straining (bearing down) should be avoided in the 1st\n      stage as it exhausts the patient and predisposes to\n      genital prolapse.\n\nd) Coping with pain\n    • Ensure access to: Entonox & Opioids.\n    • Epidural analgesia is an alternative.\n\ne) Diet & Nutrition\n    • Low risk patients are allowed to have clear liquids.\n    • IV line should be placed for all women in labor.\nf) Use a Portogram once labor is established.","nl",24],[18,"Enumerate aims of abdominal examination during labor.","• Uterus: Uterine contraction, frequency, intensity and\n  duration.\n• Fetus: lie, presentation, position, and engagement of the\n  presenting part and FHS.","nl",25],[18,"Mention aims of vaginal examination during labor.","• Capacity of the pelvis.\n• Confirm fetal presentation, position, station & degree of\n  flexion.\n• Cervical scoring systems: Bishop's core.\n• Condition of the membranes and if ruptured; presence or\n  absence of meconium.\n• Cord prolapse to be excluded.","nl",25],[18,"Describe components of Bishop’s score","               0           1              2          3\nDilatation     0           1-2            3-4        5-6\nEffacement     >4          3-4            1-2        <1\nStation        -3          -2/-1          0          +1/+2\nConsistency    firm        Medium         Soft\nPosition       Posterior   Mid-position   Anterior","nl",25],[18,"Mention all steps of management of the 2nd stage of labor","• Antiseptic: same as in 1st stage + The abdomen, thighs,\n  and legs are covered by sterile towels.\n• Bladder & rectum Evacuation.\n• Place: Delivery is carried out in the delivery room.\n• Position: patient is in the Lithotomy position.\n• Ask the patient to bear down with uterine contractions.\n• Coping with pain (as in 1st stage + Infiltration local\n  anesthesia may be used)\n• Check FHR every five minutes.","nl",26],[18,"Describe delivery of the fetal head","• Until Crowning → Perineal support to prevent extension\n  of the head before crowning.\n• Crowning is when the biparietal diameter distends the\n  vulval ring and the head does not recede in between\n  contractions.\n• Episiotomy: made in the perineum at maximum distension\n  of the vulva by the fetal head.\n• After crowning → Ritgen maneuver → Slow controlled\n  extension of the head in between contractions, without\n  bearing down by sliding the perineum over the face.","nl",26],[18,"Describe delivery of the shoulders and body","• Gentle downward traction on the head: till the anterior\n  shoulder appears under the symphysis pubis.\n• The head is then lifted upward to deliver the posterior\n  shoulder first then the anterior shoulder.\n• Trunk slips from the vagina spontaneously.","nl",27],[18,"Mention care of the baby during the 2nd stage.","• Clearance of fetal air passages: by suction or aspiration\n• Dealing with loops of cord around the fetal neck if\n  present:\n       ✓ One loop is slipped\n       ✓ Several loops are doubly clamped\n• The umbilical cord cutting: the cord is divided between\n  two clamps and cut.","nl",27],[18,"Describe steps of Brandt-Andrew’s method.","• Uterine stimulants: Oxytocin 10 IU IM is given with\n  delivery of the anterior shoulder to produce strong uterine\n  contractions.\n• Controlled cord traction “Brandt-Andrew’s method”:\n  When the uterus is well contracted catch the lower\n  segment by the left hand and raise it upward while by the\n  right hand apply gentle traction on the cord.","nl",27],[18,"Enumerate steps performed after placental delivery","• The placenta is rolled by both hands: to avoid missing\n  part of the membranes.\n• The placenta is inspected: to avoid missing parts.\n• Repair of perineal tears: if more than 1 cm or if bleeding.\n• Wash vulva with antiseptic and cover it with sterile dressing.","nl",28],[18,"Enumerate side effects & Contraindications of oxytocin.","• Side effects:\n   ▪ Rupture uterus, cervical tear.\n   ▪ Fetal distress and asphyxia.\n   ▪ Constriction ring and hypertonic inertia.\n   ▪ Amniotic fluid embolism.\n   ▪ Water intoxication due to its antidiuretic effect and the\n     large amount of IV fluids when given as a drip.\n   ▪ Coronary spasm if the crude posterior pituitary extract\n     was used.\n\n• Contraindications:\n   ▪ Contracted pelvis.\n   ▪ Some malpresentations (shoulder & brow).\n   ▪ Fetal distress and placental insufficiency.\n   ▪ Placenta previa centralis.\n   ▪ Previous uterine scar (C.S / hysterotomy / open uterus\n     metroplasty).\n   ▪ Grand multipara.\n   ▪ Incoordinate uterine actions.","nl",28],[18,"Enumerate the methods of prevention of postpartum hemorrhage in the 4th stage","• Frequent Careful observation to detect postpartum\n  hemorrhage:\n       ✓ Uterine contractions and vaginal bleeding\n       ✓ Vital data (pulse, BP, Temp.).\n• Uterine massage: is done every 15 minutes.\n• IV oxytocin & ergometrine: are given if lax uterus or\n  excessive bleeding.","nl",29],[18,"Mention the steps of immediate newborn care. ABCDE","• Airway cleared by gentle suction\n• Breathing: Assist respiration if needed by rubbing back or\n  gentle slapping of back or artificial respiration in special\n  cases\n• Cord: Milk cord towards baby (except if Rh -ve mother) →\n  ligate the umbilical cord by 2 thick silk ligature about 5 cm\n  from the umbilicus → cut distal to the 2nd ligature.\n• Drugs: Prophylaxis against ophthalmia neonatorum by\n  penicillin eye drops.\n• Examine For malformations e.g. imperforate anus.\n• Weigh & mark the baby.","nl",29],[18,"Enumerate the components of Apgar score","                       0                1                2\nAppearance      Blue \\ pale   Body: pink          All pink\n                              Extremities: blue\nPulse           Absent        <100                >100\nGrimace         Absent        Grimace             Good cry\nActivity        Flaccid       Some flexions       Active\n                                                  movement\nRespiration     Absent        Slow & irregular    Regular &\n                                                  crying\n     • Interpretation:\n         ✓ 7-10 (Normal) → no need for further treatment.\n         ✓ 4-6 (Moderate depression) → assist ventilation.\n         ✓ < 4 (Severe depression) → cardio-respiratory support.","nl",30],[18,"How to apply skin to skin contact","• Don’t separate the mother and baby in 1st hour.\n• Initiate breastfeeding within 1st hour.","nl",30],[20,"Why ROP more common than LOP?","• Right oblique diameter (12.5 cm) is longer than left\n  oblique.\n• The sigmoid colon encroaches on the left oblique\n  diameter.\n• Dextroposition & dextrorotation of the uterus.","abl",2],[20,"Mention etiology of OP","• Special types of pelvis:\n    1. Android → narrow forepelvis.\n    2. Anthropoid pelvis→ narrow transverse diameters.\n• Lumbar kyphosis.\n• Anterior insertion of the placenta.\n• Lax abdomen, multiparity, and polyhydramnios.\n• Flat fetal sacrum: poorly flexed head.","abl",2],[20,"Mention causes of spontaneous anterior rotation of","occiput:\n   • Strong uterine contraction.\n   • Full flexion of the head.\n   • Adequate shape and size of the pelvic.\n   • Good tone of the pelvic floor.\n   • Membranes remain intact till the active labor.","abl",2],[20,"Mention causes that prevent long anterior rotation of","occipito posterior:\n   • Uterine inertia.               • Contracted pelvis.\n   • Deflexed head.                 • Rigid pelvic floor.\n   • PROMs.","abl",3],[20,"Describe C/P of OP in pregnancy","  ❖ Inspection:\n       1. Flat sub-umbilical region (no back anterior).\n       2. Groove may be seen sub-umbilically (groove of the neck).\n       3. Fetal movements may be seen (on both sides of midline).\n\n  ❖ Palpation:\n                   = period of amenorrhea.\nFundal level\n                   Last week is higher.\nFundal grip        Breech by its characters.\n                   Limb: felt easy on both sides.\nUmbilical grip\n                   Back: difficult or not felt.\n                   Not engaged head.\nPelvic grip\n                   Bitemporal diameter felt\n\n  ❖ Auscultation:\n      1. Fetal heart sound (FHS) heard near ASIS (flanks).\n      2. In direct occipito posterior (DOP) with marked flexion:\n         FHS heard in midline sub umbilically.\n\n  ❖ Ultrasound: confirmation of position & exclusion of\n    congenital fetal malformations (CFMF).","abl",3],[20,"Describe C/P of OP in labor","• Early: (due to imperfect application of head on cervix):\n    1. Slow dilatation of cervix.\n    2. Large bag of forewaters (protrude as finger like).\n    3. Liable to premature rupture of membrane (PROM)→\n       leads to cord prolapse, ascending infection.\n• Late:\n    1. Anterior fontanelle is felt easier than posterior.\n    2. Prolonged / obstructed labor → large caput → mask\n       fontanelles.\n    3. Position is known by ears (Helix :posterior, Tragus\n       :anterior).","abl",4],[20,"Mention maternal & fetal complications of OP","• Maternal:\n   o Prolonged labor with its consequences as maternal\n      exhaustion, infection and operative delivery.\n   o Obstructed labor as in case of deep transverse arrest\n      and persistent occipitoposterior.\n   o Perineal lacerations.\n   o Atonic postpartum hemorrhage.\n   o Morbidity and puerperal infection.\n• Fetal:\n   o PROMs.                            o Asphyxia neonatorum.\n   o Prolapse of cord.                 o Operative injures.\n   o Fetal distress.                   o Intracranial hemorrhage.","abl",4],[20,"Mention possibilities of abnormal labor in OP","• Deflexion is mild (1%):\n    1. Descent.\n    2. Occiput reaches pelvic floor.\n    3. Rotates1/8 of a circle anteriorly.\n    4. The head is arrested midway in rotation in transverse\n       diameter = deep transverse arrest (common in\n       platypelloid = flat pelvis).\n• Deflexion is moderate (3%):\n    1. Descent.\n    2. Both occiput & sinciput reach the pelvic floor at same\n       time.\n    3. No rotation & the head is arrested → persistent\n       occipito posterior (POP) common in android pelvis.\n• Deflexion is marked or severe (6%):\n    1. Descent.\n    2. Sinciput reaches pelvic floor first & rotates\n       forward1/8 of a circle.\n    3. So occiput rotates backwards 1/8 of a circle→ direct\n       occipito-posterior (DOP).\n    4. Common in anthropoid pelvis.\n    5. Here the face looks anteriorly : face to pubis delivery.","abl",5],[20,"Mention management of labor in OP in first stage","• Guard against:\n    1. Inertia: Evacuate bladder & rectum. Correct\n       dehydration. Avoid excess sedation.\n    2. PROM: Avoid excess PV. Patient should lie bed. Avoid\n       strong enema.\n    3. Sepsis: Prophylactic antibiotics. Avoid PROM. Avoid\n       excess PV.\n• Observation is done by the partogram:\n    1. Close observation of the mother and the fetus.\n    2. Exclude contracted pelvis and presentation or\n       prolapse of the cord.\n    3. Oxytocin drip if uterine contraction are inefficient.\n    4. Exclude obstetrics cause for CS (CPD, fetal distress).","abl",6],[20,"Enumerate indications for CS in OP","• Moderate and major pelvic contraction.\n• Manual or forceps rotation cannot be done.\n• Cephalo-pelvic disproportion.\n• Old primigravida.\n• Impending fetal distress in the first stage.\n• Prolapse of the cord.","abl",6],[20,"Mention management of labor in OP in second stage","❖ The head is given a chance to rotate forwards (may be helped\n  by oxytocin to correct uterine inertia)\n❖ This is allowed for:\n        1. 1-2 hour (PG).\n        2. 1\\2– 1 hour (MG).\n❖ Further management depends on degree of head rotation:\n   • Face to pubis (Direct occipito-posterior):\n        1. 50 % spontaneous delivery.\n        2. 50 % of cases : forceps or CS is needed.\n   • Persistent OP / direct transverse arrest:\n        ➢ If not engaged : CS.\n        ➢ If engaged :\n          1. Manual rotation and forceps application.","abl",7],[21,"Define face presentation","• Malpresentation in which the presenting part is face & head\n  extended.","abl",8],[21,"Mention position of face","• Left mento anterior (commonest).\n• Right mento posterior 1st position.\n• Left mento posterior 2nd position.\n• Right mento anterior","abl",8],[21,"MA position is more common than MP why","• Because face presentation is result of extension of deflexed\n  head in OP position.","abl",8],[21,"Mention types of face presentation","• Primary face presentation (10%): face presentation from\n  the start.\n• Secondary face presentation (90%): due to extension from\n  occupit posterior position.","abl",8],[21,"Mention etiology of face malpresentation","• Congenital fetal malformations:\n  1. Head: anencephaly, dolichocephaly, meningocele of\n     anterior fontanelle.\n  2. Neck: goiter, branchial cyst, cystic hygroma.\n  3. Thorax: hydrothorax.\n  4. Back: spasm of back muscles.\n• Contracted pelvis: inlet in primigravida.\n• Pendulous abdomen in MP\n• Placenta previa (prevent head flexion at inlet)\n• Other causes: prematurity, twins, polyhydramnios.","abl",9],[21,"Mention needs of long anterior rotation in face (30%)","• Fully extended head: chin meets pelvic floor 1st and rotates\n  anteriorly 3/8 of a circle, becomes direct mento anterior.\n• Roomy pelvis.\n• Strong uterine contractions.","abl",9],[21,"Mention causes of failed long anterior rotation (70%)","• Persistent Mento posterior (in oblique diameter): no movement.\n• Deep transverse arrest: rotation 1/8 of a circle anteriorly.\n• Direct Mentoposterior: rotation 1/8 of a circle posteriorly.","abl",9],[21,"Mention diagnosis of face malpresentation","         During Pregnancy                     During Labor\n                    History                 As pregnancy\n• Previous face presentation, congenital    Early in labor: cervix is not\n  fetal malformation.                        sufficiency dilated.\n• Fetal kicks near middle line in mento     Late in labor: cervix is sufficiency\n  anterior & away from middle line in one    dilated\n  flank in mentoposterior                   DD face, breech, shoulder (below)\n                 Examination\n• Inspection:\n  abdomen enlarged longitudinally.\n• Palpation:\n  o Fundal Grip: breech\n  o Umbilical Grip (below)\n  o Pelvic Grip: nonengagement, horseshoe\n     mentum is felt in MA\n• Auscultation:\n  FHS best heard below the umbilicus to\n  one side.\n• Investigation: US","abl",10],[21,"Describe umbilical grip examination of face","                     Mento anterior       Mento posterior\n         Back                Away Middle Line          Near Middle Line.\nFetal Small Parts            Near Middle Line.         Away Middle Line.","abl",11],[21,"DD face, breech, shoulder, brow by examination","Presentation     Cavity      3 bony marks        Character\n    Face              Mouth          Chin + 2 maxillae\n                                                             Sphincteric action\n                                     Coccyx + 2 ischial         +meconium\n   Breech              Anus\n                                       tuberosities.            + no alveolar\n                                                                   margin\n                                    Clavicle+ humorous        Feel the ribs in\n   Shoulder            Axilla\n                                        + acromion.            axillary cavity.\n          Brow: in brow chin and posterior fontanelle are not felt.","abl",11],[21,"Mention management of face malpresentation","Pregnancy\n                                            as occiputposterior.\n1st Stage\n                        • Spontaneous Vaginal Delivery.\n                        • If Prolonged (>90 min primigravida / >30 min multipara)\n               Mento-\n                          or fetal/maternal distress:\n              Anterior\n2nd Stage                 o C-Section (if head is high)\n                          o Low Forceps (if head is engaged)\n               Mento-\n                                             Cesarean Section\n              Posterior\n3rd Stage                                   as occiputposterior.","abl",11],[21,"Mention complications of face malpresentation","Maternal: Prolonged or obstructed labor leading to:\n• Exhaustion\n• Increase incidence of intrapartum and postpartum\n  infection.\n• Increase incidence of atonic postpartum hemorrhage.\n• Increase incidence of genital tract laceration:\n  a) Delivery of face to pubis.\n  b) Increase incidence of instrumental delivery.\nFetal:\n • Asphyxia: meconium aspiration-Cord prolapse\n • Neonatal infection.\n • Birth injuries and intracranial hemorrhage.\n • Oedema of the face (tumefaction).\n • Oedema of the glottis (temporary respiratory difficulty).\n • Ocular injury by PV.","abl",12],[21,"Mention cases head is delivered by flection","• Face to pubis (OP)\n• Face direct MA\n• After coming head of breech","abl",12],[22,"Define brow malpresentation","• Malpresentation in which the presenting part is brow &\n  head midway between flexion and extension.","abl",14],[22,"Mention etiology of brow malpresentation","• Congenital fetal malformations:\n  1. Head: anencephaly, dolichocephaly, meningocele of\n     anterior fontanelle.\n  2. Neck: goiter, branchial cyst, cystic hygroma.\n  3. Thorax: hydrothorax.\n  4. Back: spasm of back muscles.\n• Contracted pelvis: inlet in primigravida.\n• Pendulous abdomen in MP\n• Placenta previa (prevent head flexion at inlet)\n• Other causes: prematurity, twins, polyhydramnios.","abl",14],[22,"Mention types of brow malpresentation","• Persistent (primary) brow: head midway between flexion\n  and extension.\n• Transient (secondary) brow: during conversion of\n  occupitoposterior into face presentation.","abl",14],[22,"Mention diagnosis of brow malpresentation","• In pregnancy:\n     • Palpation: occiput & sinciput are same level.\n     • Auscultation: site is not significant.\n• In labor:\n       • Vaginal examination is necessary: cervix must be\n         sufficiently dilated to feel head which is not\n         engaged.\n       • PV touches frontal suture + anterior fontanelle at\n         one side + root of nose on other side.\n       • Most important: Neither the posterior fontanelle nor\n         the chin is felt.","abl",15],[22,"Mention management of brow malpresentation"," During pregnancy: As face.\n During labor:\n• Early in labor: brow Is considered \"transient brow\" in the\ntransformation of occiput posterior to face and may be left\nfor spontaneous correction.\n• Late in labor: especially in 2nd stage, it is considered\npersistent brow, so delivered by CS.","abl",15],[22,"Mention complication of brow malpresentation","Maternal: Prolonged or obstructed labor leading to:\n  • Exhaustion\n  • Increase incidence of intrapartum and postpartum\n    infection.\n  • Increase incidence of atonic postpartum hemorrhage.\n  • Increase incidence of genital tract laceration:\n      a) Delivery of face to pubis.\n      b) Increase incidence of instrumental delivery.\n\nFetal:\n  • Asphyxia: meconium aspiration-Cord prolapse\n  • Neonatal infection.\n  • Birth injuries and intracranial hemorrhage.\n  • Oedema of the face (tumefaction).\n  • Oedema of the glottis (temporary respiratory difficulty).\n  • Ocular injury by PV.","abl",16],[22,"Mention undeliverable cephalic presentations","• Occupito posterior:\n     ▪ Deep transverse arrest\n     ▪ Persistent occupitoposterior\n     ▪ 50% of face to pubis.\n Brow presentation.\n Face presentation\n   1. Direct mentoposterior\n   2. Persistent mentoposterior","abl",16],[23,"Enumerate types of breech presentation","• Complete breech : All joints of lower limbs are flexed;\n  buttocks and two feet are at the same level.\n• Incomplete breech:\n  o Frank breech (60-70%) : Hips flexed + knees extended\n  o Knee presentation : Hips extended + knees flexed.\n  o Footling presentation : Hips and knees extended; legs\n    below buttocks, single or double.","abl",18],[23,"Enumerate etiology of breech presentation","• Prematurity — most important; about 50% of breeches.\n• Multiple pregnancy.\n• Congenital fetal malformations:\n  o Hydrocephalus\n  o Anencephaly\n  o Other neural-tube defects\n• Congenitally malformed uterus → septate or unicornuate uterus.","abl",18],[23,"Enumerate mechanism of labor of buttock in breech","• Engaging diameter is Bitrochanteric diameter = 10.5 cm,\n  occupying the oblique diameter of the inlet.\n• Descent: Anterior buttock meets the pelvic floor.\n• Rotates anteriorly by 1/8 of a circle. (Bitrochanteric diameter\n  occupies the anteroposterior diameter of the outlet.)\n• Anterior buttock hinges below the symphysis pubis.\n• Posterior buttock is delivered first by lateral flexion,\n  followed by anterior buttock.\n• Spine straightens and trunk is delivered.","abl",19],[23,"Enumerate mechanism of labor of shoulders in breech","• Shoulders engage in the same oblique diameter as buttocks\n  by Biacromial diameter = 11.5 cm.\n• Internal rotation occurs.\n• Anterior shoulder hinges below the symphysis pubis.\n• Posterior shoulder is delivered followed by anterior\n  shoulder.","abl",19],[23,"Discuss mechanism of labor of after coming head in breech","   • Head is slightly deflexed.\n   • Engaging diameters: biparietal × occipitofrontal, with the\n      occipitofrontal diameter about 11.5 cm.\n   • Occiput meets the pelvic floor.\n   • Rotation:\n     o 1/8 circle in sacro-anterior.\n     o 3/8 circle in sacro-posterior.\n   • Occiput hinges below the symphysis pubis and the head is\n      delivered by flexion, usually with assistance.\nRarely, in sacro-posterior, the occiput rotates posteriorly by 1/8\ncircle, resulting in no mechanism of labour.","abl",20],[23,"Enumerate signs of breech during pregnancy","• Inspection\n  o Longitudinal enlargement.\n  o Fetal kicks near/away from midline.\n  o Transverse depression above umbilicus.\n• Palpation\n  o Fundal level corresponds to date of amenorrhea, except\n    frank breech because of early engagement.\n  o Fundal grip: head.\n  o Umbilical grip:\n    ▪ Back near middle line → small parts away from middle line.\n    ▪ Back away from middle line → small parts near middle line.\n  o First pelvic grip: soft irregular mass = breech.\n  o Second pelvic grip:\n    ▪ Complete breech: presenting part high/unengaged.\n    ▪ Frank breech: presenting part early engaged, small & firm.\n• Auscultation\n  o Fetal heart sounds usually above umbilicus.\n  o May be at/below umbilicus in frank breech.\n  o Near midline in sacro-anterior.\n  o Away from midline in sacro-posterior.","abl",21],[23,"Enumerate signs of breech during labor: (as during pregnancy + vaginal examination)","• Early in labor: (as OP: bulging membranes, PROM,\n  prolapsed cord, prolonged 1st stage , slow cervical\n  dilatation)+ early engagement in frank breech.\n• Late in labor:\n• Complete breech: buttocks with an opening and 3 bony\n  markings and 2 feet at same level.\n• Frank breech: same findings but no foot is felt.\n• Knee presentation: knee is felt; differential = elbow.\n• Footling: foot is felt; differential = hand","abl",22],[23,"Differentiate between knee,elbow","Knee              Bigger             Patella felt    Rounded\n\nElbow             Smaller            No patella      Pointed","abl",22],[23,"Differentiate between hand and feet","                                 Big toe difficult\nFeet      Heel     Tips straight                     Diagnostic\n                                     mobility\n                                                         If\n                                  Thumb mobility     prolapsed\nHand    No heel     Curved tips\n                                      easy","abl",22],[23,"Discuss management of breech during pregnancy","• Exclude congenital fetal malformation.\n• Exclude indications for elective cesarean section.\n• In preterm baby: wait for spontaneous correction.\n• External cephalic version (ECV)\n  o Increased use with ultrasound, electronic fetal monitoring\n    and effective tocolytics.\n  o Done at 35-37 weeks.\n  o Success rate stated as 65%.","abl",23],[23,"Enumerate complications of ECV","• Uterine/broad-ligament vessel rupture.\n• Preterm labour.\n• PPROM.\n• Placental separation.\n• Fetal shock/distress.\n• Cord knotting.\n• Fetomaternal hemorrhage.\n• Cord prolapse.","abl",23],[23,"Enumerate contraindications of ECV","• Antepartum hemorrhage.\n• Pregnancy-induced hypertension.\n• Previous uterine scar / Twins / Septate uterus.\n• Malformed fetus, (hydrocephalus).\n• Conditions requiring cesarean section.","abl",23],[23,"Enumerate criteria of vaginal delivery in breech","                         APCDEFG\n• No contraindication to vaginal birth. (Not Associated with\n  indication of CS as placenta previa)\n• Gestational age ≥36 weeks.(No Prematurity)\n• No cord Prolapse and not Primigravida.\n• Spontaneous labour.(No previous CS)\n• No Cephalopelvic disproportion(No CPD).\n• No fetal Distress.\n• No hyperExtension of fetal head .\n• Frank or complete breech. (No knee or Footling)\n• Estimated fetal weight 2000–2500 g up to 4000 g (No\n  Growth restriction)\n• Skilled staff experienced in breech delivery.","abl",24],[23,"Enumerate prerequisites of vaginal delivery","• Senior obstetrician.\n• Nurse.\n• Anesthesia.\n• Pediatrician.\n• Equipment for fetal resuscitation.\n• Warm towels.\n• Obstetric forceps.","abl",24],[23,"Discuss management of uncomplicated breech during labor","• Trial of vaginal delivery 1st stage as OP\n• 2nd stage:\n ✓ Delivery of Buttocks\n    o Mother bears down with uterine contractions. >>\n      Support perineum.\n    o Wait for vulval distension by buttocks.then Episiotomy\n      is performed.\n    o Buttocks delivered spontaneously up to umbilicus.\n      Loop of cord is delivered.pull a loop of cord and if short\n      divide between 2 Kochers.\n    o Body covered with warm towels to prevent premature\n      stimulation of respiration.\n ✓ Delivery of shoulders :\n    o When scapula appears below symphysis pubis, the arm\n      is delivered using the index finger to splint the arm,\n      followed by spontaneous shoulder delivery.\n ✓ Delivery of After-Coming Head\n    o Kristeller's method\n    o Jaw flexion–shoulder traction (Mauriceau–Smellie–Veit)\n    o Burn–Marshall technique\n    o Forceps extraction — Piper's forceps\n• Breech extraction under GA. (Better CS)","abl",25],[23,"Enumerate indications of breech extraction","• Delivery of retained second twin.\n• Urgent vaginal delivery, e.g. prolapsed pulsating cord.\n• Breech delivery during cesarean section.\n• Multiparous mother with wide pelvis and small fetus.","abl",26],[23,"Enumerate methods of delivery of after coming head in breech","• Kristeller's method : Routine suprapubic pressure to\n  maintain flexion of the head.\n• Jaw flexion–shoulder traction (Mauriceau–Smellie–Veit)\no Index and middle fingers applied over maxilla to promote\n  flexion.\no Two fingers of the other hand applied beside the neck\n  beyond the clavicles and traction applied to shoulders.\n• Burn–Marshall technique\n  o Fetus is allowed to hang from mother to promote flexion.\n  o Once suboccipital region appears below symphysis\n    pubis, fetus is caught by the feet and turned toward\n    maternal abdominal wall.\n• Forceps extraction — Piper's forceps.","abl",26],[23,"Enumerate advantages of forceps extraction","• Protects head from sudden decompression.\n• Promotes/maintains flexion.\n• Avoids traction on cervical spine.","abl",26],[23,"Discuss management of arrested shoulder in complicated breech","   • Extended arms\n   • Classical method/bringing down an arm:\n     Start with posterior arm because there is more space in the\n     sacral concavity.\n   • Lovset's method:\n     o Due to curvature of birth canal, posterior shoulder is at a\n       lower level.\n     o Anterior rotation brings posterior shoulder anteriorly and\n       below symphysis pubis.\n   • Arms in nuchal position\n     o Rotate trunk in direction of pointing fingers to bring arm\n       anteriorly, then bring it down.\n\nClassical\n                                                         Nuchal\n                                                      displacement\n\n                             Løvset","abl",27],[23,"Discuss management & causes of arrested after coming head","➢ Passage:\n   • CPD / contracted pelvis or large head: symphysiotomy.\n   • Inertia: jaw flexion + shoulder traction or forceps.\n   • Incompletely dilated cervix:\n     o Living fetus → cervical incision (Duhrssen incision).\n     o Dead fetus → wait for dilation.\n   • Rigid perineum: episiotomy with jaw flexion.\n   • Contraction ring: jaw flexion, shoulder traction or forceps\n     under GA/amyl nitrite.\n➢ Passenger:\n   • Hydrocephalus: perforation.\n   • Deflexed/extended head: jaw flexion, shoulder traction or\n     forceps.\n   • Posterior rotation of occiput:\n    o Jaw flexion in opposite direction.\n    o Prague's maneuver.\n    o Third stage as occiput posterior.\n\n                                     Prague maneuver","abl",28],[23,"Enumerate complications of breech presentation","• Maternal:\n  o Prolonged and obstructed labor\n  o PROM\n  o Sepsis,Injuries.\n• Fetal:\n  ➢ Mortality\n    o Intracranial hemorrhage.\n    o Fracture/dislocation of cervical spine.\n    o Asphyxia.\n    o Rupture of abdominal organs, e.g. liver/spleen.\n  ➢ Morbidity\n    o Fracture of femur — groin traction.\n    o Fracture of clavicle — jaw flexion.\n    o Fracture of jaw — jaw flexion.\n    o Fracture of humerus — bringing down an arm.\n    o Joint dislocation — bringing down an arm/Lovset's method.\n    o Injury to external genitalia.\n    o Sternomastoid rupture — jaw flexion.","abl",29],[23,"Enumerate causes of fetal asphyxia in breech","• Cord compression.\n• Premature stimulation of respiration.\n• Delayed delivery of head.","abl",29],[24,"Define shoulder malpresentation.","• Longitudinal axis of fetus is perpendicular to that of\n  mother.\n• Denominator is scapula.\n• Position: scapulo-anterior > scapulo-posterior.","abl",32],[24,"Mention types \"lie\" of shoulder malpresentation.","• Transverse lie: as above.\n• Oblique lie:\n    ✓ Longitudinal axis of fetus is oblique to that of mother.\n    ✓ Head in iliac fossa → may change to cephalic.\n    ✓ Head in hypochondrium → may change to breech.","abl",32],[24,"Mention causes of shoulder malpresentation.","• Contracted pelvis.\n• Malformed uterus (septate).\n• Pendulous abdomen (multipara).\n• Placenta previa.\n• Cervical myoma\n• Twins or prematurity.","abl",32],[24,"How to diagnose a case of shoulder malpresentation?","• History: previous shoulder presentation, history of cause,\n  abdomen enlarged transversely, kicks felt near midline.\n• Examination:\n     ✓ Fundal level < amenorrhea.\n     ✓ Empty fundal & pelvic grip.\n     ✓ Umbilical grip: empty at one side, buttocks at other\n        side / fetal back sacro-anterior, fetal limbs sacro-\n        posterior.\n     ✓ FHS heard below umbilics on head side.\n• Investigation: US most important.\n• In labor (PV) to determine presenting part:\n    ✓ Shoulder: cavity + 3 bones + ribs.\n    ✓ Elbow: pointed + gradually ↑↑ in diameter high up.\n    ✓ Hand: easy flexion & extension + tips of fingers form a\n       curve.","abl",33],[24,"Mention management of shoulder malpresentation.","   • During pregnancy:\n       ✓ ECV after 35-37 weeks.\n       ✓ Elective CS in late pregnancy.\n   • During labor:\n       ✓ CS: best.\n       ✓ Internal podalic version then breech extraction.\n► Impacted / Neglected shoulder:\n   • Impacted = cases of transverse lie, ROM & drained liquor,\n     uterus retracted over baby, obstructed labor, baby is living.\n   • Neglected = baby is dead.\n   • Maternal distress: tachycardia, dehydration, acidosis.\n   • Vulva & vagina are hot, dry, edematous, ballooned.\n   • Cervix is edematous & fully dilated.\n   • Prolapsed cyanosed arm and non-pulsating cord.\n   • Prophylaxis is the most important.\n   • Active TTT: correction of general condition & USCS.","abl",33],[26,"Define contracted pelvis.","• Anatomical definition: ≥ 1 pelvic diameter is below\n  average by ≥ 1 cm.\n• Obstetric definition: ≥ 1 pelvic diameter is small enough\n  to cause difficulty in vaginal delivery of average-sized\n  fetus.","abl",35],[26,"Define cephalopelvic disproportion.","• Disproportion between head & pelvis in cephalic\n  presentation.\n• Disproportion between fetus & pelvis in other\n  presentations.\n• Failure of 2 of the 3 Ps: passenger & passage.","abl",35],[26,"Enumerate degrees of contracted pelvis (classification). True conjugate   CPD         Relation              Fate","                                    head is flush with      normal\n  Minor      10-9 cm        none\n                                   inner surface of SP      delivery\n\n                                   head is flush with\nModerate      9-8 cm                                      trial of labor\n                             1st   outer surface of SP\n\n Severe       8-6 cm               head overrides outer\n                                                               CS\nExtreme       < 6 cm        2nd       surface of SP","abl",36],[26,"Mention etiology of contracted pelvis.","• Rickets & osteomalacia of pelvic bones.\n• Tumors & fractures of pelvic bones.\n• Lumbar kyphosis, scoliosis, spondylolisthesis.\n• Small gynecoid, android, anthropoid, platypelloid pelvis.\n• Congenital absence of one ala of sacrum (Naegele's).\n• Congenital absence of both alae of sacrum (Robert's).\n• High assimilation (6 sacral vertebrae) – Low assimilation (4\n  sacral vertebrae).\n• Poliomyelitis & TB of unilateral LL joints.","abl",36],[26,"How to diagnose contracted pelvis?","• History: bad obstetric history, history of the cause.\n• Examination: height < 150 cm, limping gait, pendulous\n  abdomen, jutting ischial spines in PV.\n• Pelvimetry.","abl",37],[26,"Mention types & interpretation of clinical pelvimetry.","• External outlet:\n     a. Bituberous diameter (transverse) = 11 cm.\n     b. Thom's rule = 15 cm.\n     c. Subpubic angle not less than 90 degrees.\n• Internal:\n     a. Diagonal conjugate = 12.5 cm (1.5 cm larger than true\n        conjugate).\n     b. Interspinous diameter & protrusion of ischial spines.","abl",37],[26,"Mention methods of radiological pelvimetry.","• Plain X-Ray: not done nowadays.\n• CT scan: preferred over X-Ray.\n• MRI: accurate & without ionizing radiation.\n• US fetal assessment: biparietal diameter, AC.","abl",37],[26,"Mention types of CPD clinical tests.","• Pinard's method: external.\n• Muller's test: internal.\n• Kerr's modification of Muller's: internal & external & more\n  accurate.","abl",37],[26,"Enumerate complications of contracted pelvis.","• Maternal:\n    a. Malpresentations & non-engagements.\n    b. Recurrent UTIs and pyelonephritis (back pressure).\n    c. RVF uterus and incarceration.\n    d. PROM and cord prolapse.\n    e. Prolonged & obstructed labor → uterine rupture.\n    f. PP Hge & puerperal sepsis.\n• Fetal:\n    a. Fetal asphyxia & death.\n    b. Birth injuries (ICH), fractures, Erb's palsy.\n    c. Fetal infections.","abl",38],[26,"Discuss management options of contracted pelvis.","• Minor: vaginal delivery.\n• Moderate: trial of labor or CS.\n• Severe: CS if living / craniotomy if dead.\n• Extreme: CS.","abl",38],[26,"Enumerate prerequisites of trial of labor (TOL) in contracted pelvis.","• Young healthy primigravida.\n• Cephalic presentation & 1st degree CPD.\n• No fetal distress or placental insufficiency.","abl",38],[26,"Enumerate contraindications of trial of labor in contracted pelvis = indications of CS.","• Elderly primigravida.\n• 2nd degree CPD (conjugate < 9 cm).\n• Posterior position & malpresentations.\n• Pelvis outlet contraction.\n• Previous CS scar & bad obstetric history.\n• Failure of previous TOL.","abl",39],[28,"Define abnormal uterine action.","• Abnormal contractile pattern of uterine musculature\n  prevents normal progress of labor.","abl",40],[28,"Mention classification of abnormal uterine action.","   • Hyperfunction: precipitate, obstructed.\n   • Uterine inertia: hypotonic, hypertonic.\n   • Incoordinate: contraction ring, cervical dystocia.\n\n► Precipitate labor:","abl",40],[28,"Define precipitate labor.","• Labor which started and completed in less than 4 hrs.","abl",40],[28,"Enumerate causes (risk factors) of precipitate labor.","• Small-sized baby: IUGR, PTL.\n• Soft lax birth canal & roomy pelvis (multipara).\n• Strong coordinated uterine contractions.\n• Cervical incompetence.\n• History of precipitate labor.","abl",40],[28,"Mention complications of precipitate labor.","• Maternal:\n    a. Lacerations of birth canal → traumatic pp hge.\n    b. Uterine exhaustion → atonic pp hge.\n    c. Retained placenta.\n    d. Acute inversion of uterus.\n    e. Puerperal sepsis.\n• Fetal:\n    a. Asphyxia & distress (avulsion of cord).\n    b. Intracranial hge.\n    c. Fetal injury (trauma).","abl",41],[28,"Mention TTT of precipitate labor.","   • If previous history: admission with rest.\n   • 1st stage: sedation & epidural analgesia.\n   • 2nd stage: no bearing down, perineal support, episiotomy.\n   • 3rd stage: ecbolics, genital tract exploration.\n   • PP: antibiotics, fetal examination.\n\n►Obstructed labor:","abl",41],[29,"Define obstructed labor.","• Failure of spontaneous delivery despite good uterine\n  contractions, because of mechanical obstruction.","abl",41],[29,"Mention etiology of obstructed labor.","• Maternal:\n    a.
