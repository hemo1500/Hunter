<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060d">
<title>نظام الصياد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one-column command panels with corner brackets, fixed bottom tab bar, a "System" window over deep navy. */
  --void:#04060d;
  --panel:#0a1226;
  --line:#21407a;
  --glow:#5ec2ff;
  --ink:#e3eeff;
  --mute:#8aa0c8;
  --gold:#f5c451;
  --ok:#4be3a8;
  --bad:#ff6b82;
  --display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --num:'Chakra Petch','IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 55% at 50% -8%,#0f2d63 0%,rgba(15,45,99,0) 62%),
  repeating-linear-gradient(0deg,rgba(94,194,255,.035) 0 1px,transparent 1px 38px),
  repeating-linear-gradient(90deg,rgba(94,194,255,.035) 0 1px,transparent 1px 38px),
  var(--void)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-family:var(--num);direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--glow);text-shadow:0 0 14px rgba(94,194,255,.45)}
.date{font-size:13px;color:var(--mute)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sync[data-s="ok"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync[data-s="err"] i{background:var(--bad)}

.panel{position:relative;background:linear-gradient(180deg,rgba(16,30,62,.82),rgba(9,17,36,.88));border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:14px}
.panel::before,.panel::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--glow);pointer-events:none;filter:drop-shadow(0 0 4px rgba(94,194,255,.7))}
.panel::before{top:-2px;inset-inline-start:-2px;border-inline-end:0;border-bottom:0}
.panel::after{bottom:-2px;inset-inline-end:-2px;border-inline-start:0;border-top:0}
.ptitle{font-family:var(--display);font-weight:500;font-size:15px;color:var(--glow);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.ptitle::before{content:"";width:7px;height:7px;background:var(--glow);transform:rotate(45deg);box-shadow:0 0 8px var(--glow)}
.ptitle .sp{flex:1}
.ptitle .side{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:400}

.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rank{width:84px;height:84px;border:2px solid var(--glow);display:grid;place-items:center;position:relative;background:rgba(94,194,255,.07);box-shadow:inset 0 0 22px rgba(94,194,255,.18),0 0 18px rgba(94,194,255,.2);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.rank span{font-family:var(--num);font-weight:700;font-size:46px;line-height:1;color:#fff;text-shadow:0 0 16px var(--glow)}
.rank small{position:absolute;bottom:3px;font-size:10px;color:var(--mute)}
.who{min-width:0}
.nm{background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);text-align:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nm-in{width:100%;background:rgba(94,194,255,.08);border:1px solid var(--glow);border-radius:3px;padding:6px 10px;font-size:18px;outline:none}
.ttl{font-size:13px;color:var(--mute);margin-bottom:6px}
.lvrow{display:flex;align-items:baseline;gap:8px}
.lvrow .big{font-size:34px;font-weight:700;line-height:1;color:#fff;text-shadow:0 0 14px rgba(94,194,255,.6)}
.lvrow span.l{font-size:14px;color:var(--mute)}
.bar{height:9px;background:rgba(94,194,255,.1);border:1px solid rgba(94,194,255,.25);border-radius:2px;overflow:hidden;position:relative}
.bar>b{display:block;height:100%;background:linear-gradient(90deg,#2b7bd6,var(--c,var(--glow)));box-shadow:0 0 10px var(--c,var(--glow));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.barcap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:5px}
.herobar{grid-column:1/-1}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);background:rgba(10,18,38,.8);border-radius:3px;padding:10px 8px;text-align:center}
.tile .v{font-size:24px;font-weight:700;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:5px}
.tile .k{font-size:12px;color:var(--mute);margin-top:4px}
.coin{width:16px;height:16px;flex:none}

.statrow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin-top:12px}
.statrow .n{font-size:14px}
.statrow .lv{font-size:14px;font-weight:700;min-width:40px;text-align:end}
.radar{display:block;width:100%;height:auto;max-height:290px}
.radar text{fill:var(--ink);font-family:var(--body);font-size:13px}
.radar text.nn{font-family:var(--num);font-size:12px;fill:var(--glow)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:112px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.wk .b{width:100%;max-width:26px;background:rgba(94,194,255,.28);border:1px solid rgba(94,194,255,.45);border-radius:2px 2px 0 0}
.wk.today .b{background:var(--glow);box-shadow:0 0 12px var(--glow)}
.wk .v{font-size:11px;color:var(--mute)}
.wk .d{font-size:11px;color:var(--mute)}
.wk.today .d{color:var(--glow)}

.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed rgba(94,194,255,.18);padding-bottom:8px}
.log li:last-child{border-bottom:0;padding-bottom:0}
.log .w{color:var(--mute);font-size:12px}
.log .g{color:var(--gold)}

.intro{border-color:var(--glow)}
.intro p{margin:0 0 12px;color:var(--ink)}

.btn{min-height:46px;padding:10px 16px;border:1px solid var(--glow);background:rgba(94,194,255,.08);color:var(--glow);border-radius:3px;font-weight:600;font-size:15px}
.btn:active{background:rgba(94,194,255,.22)}
.btn.fill{background:var(--glow);color:#03101f;box-shadow:0 0 18px rgba(94,194,255,.35)}
.btn.fill:active{background:#9ad8ff}
.btn.bad{border-color:var(--bad);color:var(--bad);background:rgba(255,107,130,.08)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:3px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--glow);color:var(--ink);background:rgba(94,194,255,.14);box-shadow:inset 0 0 12px rgba(94,194,255,.15)}
.lbl{display:block;font-size:13px;color:var(--mute);margin:14px 0 8px}
.in{width:100%;min-height:46px;background:rgba(94,194,255,.06);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--glow);box-shadow:0 0 0 2px rgba(94,194,255,.2)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.qhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.qhead h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700}
.qhead .cnt{font-size:28px;font-weight:700;color:var(--glow);text-shadow:0 0 12px rgba(94,194,255,.5)}
.bonus{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin:10px 0 0}
.bonus.got{color:var(--gold)}
.qs{display:grid;gap:10px;margin-bottom:14px}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;min-height:64px;padding:10px 14px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px}
.q:active{background:rgba(94,194,255,.1)}
.chk{width:28px;height:28px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);background:rgba(94,194,255,.05)}
.q[aria-pressed="true"]{border-color:var(--glow);background:rgba(94,194,255,.1);box-shadow:0 0 16px rgba(94,194,255,.15)}
.q[aria-pressed="true"] .chk{background:var(--glow);border-color:var(--glow);color:#03101f}
.q[aria-pressed="true"] .qt b{color:var(--mute)}
.qt{min-width:0;display:flex;flex-direction:column;gap:2px}
.qt b{font-weight:500;font-size:16px}
.qt i{font-style:normal;font-size:12px;color:var(--c,var(--mute))}
.xp{font-weight:700;color:var(--glow);font-size:17px}
.q.edit{cursor:default}
.hint{font-size:13px;color:var(--mute);margin:0 0 14px}

.ringwrap{display:grid;place-items:center;margin:6px 0 4px;position:relative}
.ring{width:240px;height:240px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:rgba(94,194,255,.14)}
.ring .ar{stroke:var(--glow);stroke-linecap:round;filter:drop-shadow(0 0 7px var(--glow));transition:stroke-dashoffset .5s linear}
.ringin{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ringin .t{font-family:var(--num);font-size:50px;font-weight:700;line-height:1;direction:ltr;text-shadow:0 0 18px rgba(94,194,255,.55)}
.ringin .s{font-size:13px;color:var(--mute)}
.est{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute);margin:16px 0 14px}
.est b{color:var(--ink);font-weight:500}

.gold-big{display:flex;align-items:center;gap:10px;font-size:40px;font-weight:700;color:var(--gold);text-shadow:0 0 16px rgba(245,196,81,.4)}
.gold-big .coin{width:30px;height:30px}
.rw{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.rw:last-child{border-bottom:0}
.rw .t{font-size:16px}
.rw .c{display:flex;align-items:center;gap:5px;color:var(--gold);font-weight:700;font-size:14px;margin-top:2px}

.ex{padding:0}
.exh{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:16px}
.et{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.35}
.ed{font-size:13px;color:var(--mute);margin-top:3px}
.cd{text-align:center;min-width:70px}
.cd .d{font-size:38px;font-weight:700;line-height:1;color:var(--c,var(--glow));text-shadow:0 0 14px var(--c,var(--glow))}
.cd .d.w{font-family:var(--display);font-size:22px}
.cd .u{font-size:12px;color:var(--mute);margin-top:2px}
.exb{padding:0 16px 16px}
.ex.past{opacity:.55}
.tgt{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:12px 0}
.tgt b{color:var(--glow);font-weight:600}
.grp{font-family:var(--display);font-size:14px;color:var(--glow);margin:16px 0 8px;direction:ltr;text-align:start}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt i{font-style:normal;font-size:12px;color:var(--mute)}
.un .xp{font-size:15px}
.un{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:start;min-height:48px;padding:8px 12px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;margin-bottom:8px}
.un .chk{width:22px;height:22px}
.un[aria-pressed="true"]{border-color:var(--glow);background:rgba(94,194,255,.1)}
.un[aria-pressed="true"] .chk{background:var(--glow);border-color:var(--glow);color:#03101f}
.un[aria-pressed="true"] .t{color:var(--mute)}
.un.edit{grid-template-columns:1fr auto}
textarea.in{min-height:130px;resize:vertical;line-height:1.7}
.nextbn{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:0;color:inherit}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.segb{min-height:44px;background:none;border:0;color:var(--mute);font-size:15px}
.segb+.segb{border-inline-start:1px solid var(--line)}
.segb[aria-pressed="true"]{background:rgba(94,194,255,.16);color:var(--ink);box-shadow:inset 0 -2px 0 var(--glow)}
.tree{display:grid;gap:12px;margin-bottom:14px}
.nd{display:grid;grid-template-columns:26px 1fr;gap:10px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:-12px;width:2px;background:var(--line)}
.nd:last-child .rail::before{bottom:50%}
.dot{position:relative;margin-top:18px;width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--line);background:var(--void)}
.nd.open .dot{border-color:var(--glow);box-shadow:0 0 10px var(--glow)}
.nd.done .dot{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px var(--glow)}
.nd.locked{opacity:.6}
.ndc{border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;min-width:0}
.nd.open .ndc{border-color:rgba(94,194,255,.55)}
.nd.done .ndc{border-color:var(--glow);background:rgba(94,194,255,.08)}
.ndh{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:start;background:none;border:0;padding:12px 14px}
.ndt{font-weight:600;font-size:16px}
.nds{grid-column:1/-1;font-size:12px;color:var(--mute)}
.ndb{padding:0 14px 14px}
.ndb p{margin:0 0 12px;font-size:15px}
.proof{border:1px dashed var(--gold);border-radius:3px;padding:10px 12px;margin:12px 0;font-size:14px}
.proof b{color:var(--gold);font-weight:600;display:block;margin-bottom:3px;font-size:13px}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mt .v{font-size:19px;justify-content:center}
.cat{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.tx:last-child{border-bottom:0}
.tx .a{font-weight:700;font-size:16px}
.tx .w{font-size:12px;color:var(--mute)}
.a.in{color:var(--ok)}.a.out{color:var(--bad)}.a.save,.a.inv{color:var(--glow)}
.big2{font-size:30px;font-weight:700;line-height:1.1}
.pwbig{font-size:46px;font-weight:700;line-height:1;color:#fff;text-shadow:0 0 18px var(--glow)}
.brk{display:grid;gap:6px;margin-top:12px;font-size:14px}
.brk div{display:flex;justify-content:space-between;gap:10px;color:var(--mute)}
.brk b{color:var(--ink);font-weight:500}
.mon{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.mon svg{width:96px;height:96px;display:block}
.flo{font-size:12px;color:var(--mute)}
.mn{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.3}
.mn.boss{color:var(--bad)}
.vd{margin:12px 0;padding:10px 12px;border-radius:3px;font-size:14px;border:1px solid var(--line)}
.vd.ok{border-color:var(--ok);color:var(--ok)}
.vd.no{border-color:var(--bad);color:var(--bad)}
.arena{display:grid;gap:12px}
.ftr{display:grid;gap:5px}
.ftr .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.amon{display:grid;place-items:center}
.amon svg{width:130px;height:130px}
.hit{animation:hit .35s}
@keyframes hit{0%{transform:none}25%{transform:translateX(-7px) rotate(-3deg)}55%{transform:translateX(6px) rotate(2deg)}100%{transform:none}}
.blog{min-height:44px;text-align:center;font-size:15px;color:var(--ink)}
.res{text-align:center;padding:6px 0}
.res .t{font-family:var(--display);font-weight:700;font-size:26px}
.res.win .t{color:var(--ok);text-shadow:0 0 14px rgba(75,227,168,.5)}
.res.lose .t{color:var(--bad)}
.shd{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.shd:last-child{border-bottom:0}
.rb{width:40px;height:40px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;border:1.5px solid var(--glow);color:var(--glow);background:rgba(94,194,255,.08);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.rb[data-r="A"],.rb[data-r="S"]{border-color:var(--gold);color:var(--gold);background:rgba(245,196,81,.1)}
.rb[data-r="E"],.rb[data-r="D"]{border-color:var(--line);color:var(--mute)}
.shd .w{font-size:12px;color:var(--mute)}
#qz{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,6,14,.97);overflow-y:auto;-webkit-overflow-scrolling:touch}
#qz.on{display:block}
.qzw{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(30px + env(safe-area-inset-bottom))}
.qzt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.qzu{font-family:var(--num);font-size:18px;font-weight:700;direction:ltr;text-align:left;line-height:1.35}
.qq{direction:ltr;text-align:left;font-size:17px;font-weight:600;line-height:1.5;margin:6px 0 14px}
.ans{direction:ltr;text-align:left;white-space:pre;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:rgba(94,194,255,.05);border:1px solid var(--line);border-radius:3px;padding:12px;margin:0 0 10px;color:var(--ink)}
.ans.wrap{white-space:pre-wrap;word-break:break-word}
.src{font-size:12px;color:var(--mute);margin-bottom:12px}
.src .e{direction:ltr;text-align:left}
.opt{display:block;width:100%;direction:ltr;text-align:left;min-height:50px;padding:10px 14px;margin-bottom:8px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;font-size:15px;line-height:1.4}
.opt.ok{border-color:var(--ok);background:rgba(75,227,168,.12);color:var(--ok)}
.opt.no{border-color:var(--bad);background:rgba(255,107,130,.1);color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.exp{direction:ltr;text-align:left;font-size:14px;color:var(--ink);border-inline-start:3px solid var(--glow);padding:6px 10px;margin:4px 0 14px;background:rgba(94,194,255,.06)}
.vlab{font-size:15px;font-weight:600;margin:4px 0}
.vlab.ok{color:var(--ok)}.vlab.no{color:var(--bad)}
.met{border:1px solid var(--ok);border-radius:3px;padding:12px;margin-bottom:14px}
.met p{margin:0 0 10px;color:var(--ok)}
textarea.lt{direction:ltr;text-align:left}
.seg2{grid-template-columns:repeat(2,1fr)}
.code{direction:ltr;text-align:left;word-break:break-all;font:12px/1.5 ui-monospace,Menlo,monospace;background:rgba(94,194,255,.05);border:1px solid var(--line);border-radius:3px;padding:10px;max-height:110px;overflow:auto;user-select:all;-webkit-user-select:all}
.lb{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(94,194,255,.18)}
.lb:last-child{border-bottom:0}
.lb .pos{font-family:var(--num);font-weight:700;color:var(--mute);text-align:center}
.lb.me{background:rgba(94,194,255,.07)}
.lb.me .pos,.lb .pos.g{color:var(--gold)}
.lb .nmx{font-weight:600}
.lb .w{font-size:12px;color:var(--mute)}
.lb .acts{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.rnd{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(94,194,255,.18);font-size:14px}
.rnd .c{text-align:center;color:var(--mute);font-size:13px}
.rnd .v{font-family:var(--num);font-weight:700;font-size:18px}
.rnd .v.r{text-align:end}
.rnd .v.win{color:var(--ok);text-shadow:0 0 10px rgba(75,227,168,.5)}
.rnd .v.lose{color:var(--mute)}
.rnd.hid{opacity:.25}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin-bottom:10px}
.vs .n{font-weight:700;font-size:16px}
.vs .x{font-family:var(--display);color:var(--bad);font-size:20px}
.rival{border-color:var(--gold)}
.dot2{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mute);margin-inline-end:6px;vertical-align:middle}
.dot2.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dv{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid currentColor;border-radius:10px;margin-inline-start:6px;vertical-align:middle}
.inc{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(245,196,81,.35)}}
.bigcd{font-family:var(--num);font-size:54px;font-weight:700;text-align:center;color:#fff;text-shadow:0 0 18px var(--glow);direction:ltr}
.pl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:8px 0 14px}
.pl .n{font-weight:700}
.pl .s{font-size:12px;color:var(--mute)}
.pips{display:flex;gap:5px;justify-content:center;margin-top:6px}
.pip{width:12px;height:12px;border:1px solid var(--line);transform:rotate(45deg)}
.pip.c{background:var(--ok);border-color:var(--ok)}
.pip.w{background:var(--bad);border-color:var(--bad)}
.feed li{font-size:14px}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(5,9,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;position:relative;min-height:56px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-selected="true"]{color:var(--glow);text-shadow:0 0 10px rgba(94,194,255,.5)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-1px;inset-inline:26%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}

#toasts{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 16px}
.toast{background:rgba(8,16,36,.96);border:1px solid var(--glow);border-radius:3px;padding:9px 16px;font-size:15px;box-shadow:0 0 22px rgba(94,194,255,.3);animation:tin .25s ease-out;display:flex;gap:10px;align-items:center}
.toast .g{color:var(--gold)}
.toast.out{opacity:0;transition:opacity .35s}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

#ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;background:rgba(2,4,10,.82)}
#ov.on{display:grid}
.ovc{position:relative;width:min(100%,360px);text-align:center;border:1px solid var(--glow);background:linear-gradient(180deg,rgba(14,32,70,.96),rgba(6,12,28,.98));padding:26px 20px 20px;box-shadow:0 0 50px rgba(94,194,255,.35),inset 0 0 40px rgba(94,194,255,.08);animation:pop .4s cubic-bezier(.2,.9,.3,1.25);overflow:hidden}
.ovc::after{content:"";position:absolute;inset-inline:0;top:-30%;height:30%;background:linear-gradient(180deg,transparent,rgba(94,194,255,.28),transparent);animation:scan 1.1s ease-out 1}
.ovk{font-family:var(--display);color:var(--glow);font-size:14px;margin-bottom:10px}
.ovt{font-family:var(--display);font-weight:700;font-size:24px;margin-bottom:6px}
.ovb{font-family:var(--num);font-weight:700;font-size:72px;line-height:1.05;color:#fff;text-shadow:0 0 28px var(--glow);margin:8px 0;direction:ltr}
.ovs{color:var(--mute);font-size:15px;margin-bottom:20px}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@keyframes scan{from{top:-30%}to{top:110%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* Standalone adapter: gives the game the same small API it uses on claude.ai (db, user, room),
   backed by Firebase Anonymous Auth + Realtime Database. */
(function(){
  window.STANDALONE=true;
  var CFG=window.FIREBASE_CONFIG;
  var ready=null,ok=!!(CFG&&CFG.apiKey&&CFG.databaseURL&&window.firebase&&CFG.apiKey.indexOf('PASTE')<0);
  if(!ok){window.FIREBASE_MISSING=true;window.claude={use:function(){return Promise.resolve(null);}};return;}
  firebase.initializeApp(CFG);
  var auth=firebase.auth(),rtdb=firebase.database();
  function waitUser(){
    if(ready)return ready;
    ready=new Promise(function(res){
      var done=false;
      auth.onAuthStateChanged(function(u){
        if(u&&!done){done=true;res(u);}
        else if(!u)auth.signInAnonymously().catch(function(){if(!done){done=true;res(null);}});
      });
      setTimeout(function(){if(!done){done=true;res(null);}},12000);
    });
    return ready;
  }
  var safe=function(k){return String(k).replace(/[.#$\[\]\/]/g,'_');};
  /* ---- db: documents stored as JSON strings to keep arrays and keys intact ---- */
  function pathOf(p){
    var s=p.split('/');
    if(s[0]==='data'&&s[1]==='users')return 'users/'+safe(s[2]);
    if(s[0]==='league')return 'lg/'+safe(s[1]);
    return null;
  }
  function wrap(snap){var v=snap.val(),d=null;if(v&&typeof v.j==='string'){try{d=JSON.parse(v.j);}catch(e){}}return {exists:!!d,data:function(){return d;},metadata:{fromCache:false,hasPendingWrites:false}};}
  var dbApi={
    doc:function(p){
      var rp=pathOf(p);
      return {path:p,
        get:function(){if(!rp)return Promise.resolve({exists:false,data:function(){}});return rtdb.ref(rp).get().then(wrap);},
        set:function(d){if(!rp)return Promise.reject({code:'invalid_argument',message:'not available'});return rtdb.ref(rp).set({j:JSON.stringify(d),t:firebase.database.ServerValue.TIMESTAMP}).catch(function(e){throw {code:'invalid_argument',message:String(e&&e.message||e)};});},
        onSnapshot:function(next,err){if(!rp){setTimeout(function(){next({exists:false,data:function(){}});},0);return function(){};}
          var r=rtdb.ref(rp),cb=function(s){next(wrap(s));};r.on('value',cb,function(e){err&&err({code:'unavailable',message:String(e)});});return function(){r.off('value',cb);};}
      };
    },
    collection:function(p){
      return {onSnapshot:function(next,err){
        if(p!=='league'){setTimeout(function(){next({docs:[]});},0);return function(){};}
        var r=rtdb.ref('lg'),cb=function(s){var docs=[];s.forEach(function(c){var w=wrap(c);if(w.exists)docs.push({id:c.key,data:w.data});});next({docs:docs});};
        r.on('value',cb,function(e){err&&err({code:'unavailable',message:String(e)});});return function(){r.off('value',cb);};
      }};
    }
  };
  /* ---- room: presence nodes with onDisconnect cleanup ---- */
  function makeRoom(base,uid){
    var me={},peersCbs=[],last={},cache=[],ref=rtdb.ref(base),mine=rtdb.ref(base+'/'+uid),listening=false;
    function build(s){
      var out=[];
      s.forEach(function(c){var p={};try{p=JSON.parse(c.val().p)||{};}catch(e){}
        var key=c.key,raw=c.val().p;
        if(!last[key]||last[key].raw!==raw)last[key]={raw:raw,at:Date.now()};
        out.push({peer:key,by:key,isMe:key===uid,sameTab:key===uid,kind:'viewer',guest:false,presence:Object.freeze(p),updatedAt:last[key].at});});
      return out;
    }
    function listen(){if(listening)return;listening=true;
      ref.on('value',function(s){cache=build(s);peersCbs.forEach(function(cb){cb({peers:cache,joined:[],left:[],updated:[]});});});}
    mine.onDisconnect().remove();
    return {
      name:base,
      presence:function(patch){for(var k in patch){if(patch[k]===null)delete me[k];else me[k]=patch[k];}
        return mine.set({p:JSON.stringify(me),t:firebase.database.ServerValue.TIMESTAMP}).catch(function(){});},
      onPeers:function(cb){peersCbs.push(cb);listen();setTimeout(function(){cb({peers:cache,joined:[],left:[],updated:[]});},0);return function(){};},
      peers:function(){return cache;},
      onConnection:function(cb){var r=rtdb.ref('.info/connected');r.on('value',function(s){cb(!!s.val());});return function(){};},
      connected:function(){return true;},
      leave:function(){ref.off();peersCbs=[];mine.onDisconnect().cancel();return mine.remove().catch(function(){});}
    };
  }
  /* ---- join code: league, presence and duels need a members/<uid> record that matches secret/code ---- */
  window.HUNTER={state:'checking',listeners:[],
    _set:function(st){this.state=st;this.listeners.forEach(function(f){try{f(st);}catch(e){}});},
    onChange:function(f){this.listeners.push(f);},
    join:function(code){return waitUser().then(function(u){if(!u)throw 0;return rtdb.ref('members/'+u.uid).set(String(code).trim());});},
    setCode:function(code){return waitUser().then(function(u){if(!u)throw 0;return rtdb.ref('secret/code').set(String(code).trim());});}};
  window.HUNTER.db={
    on:function(p,cb){var r=rtdb.ref(p),f=function(s){cb(s.val());};r.on('value',f,function(){cb(null);});return function(){r.off('value',f);};},
    set:function(p,v){return rtdb.ref(p).set(v);},
    update:function(o){return rtdb.ref().update(o);},
    key:function(p){return rtdb.ref(p).push().key;},
    uid:function(){return auth.currentUser?auth.currentUser.uid:null;}
  };
  var memberReady=waitUser().then(function(u){
    if(!u){window.HUNTER._set('offline');return;}
    return rtdb.ref('members/'+u.uid).get().then(function(s){window.HUNTER._set(s.exists()?'member':'none');}).catch(function(){window.HUNTER._set('none');});
  });
  var lobby=null;
  window.claude={use:function(name){
    return waitUser().then(function(u){
      if(!u)return null;
      if(name==='db')return dbApi;
      if(name==='user')return {id:function(){return Promise.resolve(u.uid);},isOwner:function(){return Promise.resolve(false);},canEdit:function(){return Promise.resolve(false);},can:function(){return Promise.resolve(null);}};
      if(name==='room'){
        return memberReady.then(function(){
        if(window.HUNTER.state!=='member')return null;
        if(!lobby){lobby=makeRoom('pr',u.uid);
          lobby.join=function(n){if(!/^[a-z0-9][a-z0-9_-]{0,47}$/.test(n))return Promise.reject({code:'invalid_argument'});return Promise.resolve(makeRoom('dl/'+n,u.uid));};}
        return lobby;
        });
      }
      return null;
    });
  }};
  /* ---- account: link to Google so progress survives a new phone ---- */
  window.addEventListener('DOMContentLoaded',function(){
    var top=document.querySelector('.top');if(!top)return;
    var b=document.createElement('button');b.className='btn sm';b.id='gbtn';b.style.marginInlineStart='auto';b.style.marginInlineEnd='10px';
    function label(){var u=auth.currentUser;b.textContent=u&&!u.isAnonymous?'حسابك محفوظ':'احفظ تقدمك بجوجل';b.disabled=!!(u&&!u.isAnonymous);}
    auth.onAuthStateChanged(label);label();
    b.addEventListener('click',function(){
      var prov=new firebase.auth.GoogleAuthProvider(),u=auth.currentUser;
      if(!u)return;
      u.linkWithPopup(prov).then(function(){label();if(window.toast)toast('اتربط حسابك بجوجل');})
      .catch(function(e){
        if(e&&e.code==='auth/credential-already-in-use'&&e.credential){
          auth.signInWithCredential(e.credential).then(function(){try{localStorage.removeItem('hunter-system.v1');}catch(x){}location.reload();});
        }else if(window.toast)toast('ما قدرتش أربط الحساب. اتأكد إن دخول جوجل متفعّل في Firebase.');
      });
    });
    top.insertBefore(b,document.getElementById('sync'));
  });
})();
</script>

<script>const QB={"e":[[30,"Definition of bleeding in early pregnancy","• Bleeding from the genital tract before 20 weeks of\n  pregnancy.","bleed",2],[30,"Causes of bleeding in early pregnancy","   • Obstetric:\n     o Miscarriage / Ectopic Pregnancy / Gestational Trophoblastic\n       Disease.\n     o Hartman sign: spotting due to implantation (erosion of blood\n       vessels).\n     o Decidual shedding: small pieces of decidua shed before\n       fusion of decidua capsularis & vera (diagnosed by exclusion).\n   • Non-obstetric:\n     o Local cause: Trauma, severe vaginitis, cervical erosion, polyps,\n       carcinoma.\n     o General cause: Liver failure, hypertension.\n❖ Spontaneous Abortion","bleed",2],[31,"Definitions and terminology of spontaneous abortion?","• Abortion (WHO):\n  pregnancy terminated before 20 weeks, or fetus < 500 gm.\n• Spontaneous abortion:\n  occurs accidentally, either once or twice.\n• Pregnancy of unknown location:\n  +ve urine/serum test, no intrauterine or ectopic pregnancy on\n  TVS.\n• Intrauterine pregnancy of uncertain viability:\n  TVS shows gestational sac, no embryonic heartbeat (no\n  findings of definite pregnancy failure).","bleed",3],[31,"Risk factors of spontaneous abortion?","• Advancing maternal age = most important in healthy\n  women.\n• Extremes of maternal weight, smoking, low plasma folate\n  levels.\n• Previous spontaneous abortion → future miscarriage risk:\n  1 - 20% / 2 consecutive - 28% / ≥ 3 consecutive - 43%","bleed",3],[31,"Fetal causes of spontaneous abortion?","                       1] Chromosomal Abnormalities\n      (Single most common cause of early pregnancy losses; ~50% of miscarriages)\n\n                      most common; ↑ with maternal age (gametogenesis errors).\nAneuploidy\n           Autosomal Trisomies → most common anomalies → trisomy 16 = most common.\n  (85%)\n                  45X Monosomy → Turner syndrome, usually ends in abortion.\n\n                          Triploidy (10%) / Tetraploidy (4.2%)\n\n                           2] Congenital Malformations\n\n Chromosomal / Genetic Abnormalities, Extrinsic Factors (Amniotic Bands), or Teratogens.\n\n               Maternal Disorders (DM with poor glycemic control), Drugs (isotretinoin),\nTeratogens\n                           Physical Stress (fever), Chemicals (mercury).","bleed",4],[31,"Drugs/toxins as causes of spontaneous abortion?","• Chemotherapy (methotrexate), prostaglandins\n  (misoprostol), antiprogesterone (mifepristone).\n• NSAIDs around conception (but not acetaminophen).\n• Rare: large doses of alcohol, caffeine, anesthetic/toxic gases.","bleed",4],[31,"Pathology of spontaneous abortion","• 1st trimester: separation of decidua basalis → rupture and\n  expulsion of ovum/embryo through dilated cervix.\n• 2nd trimester: uterine contractions (spontaneous or after\n  membrane rupture) → cervical dilatation → fetus expelled,\n  then placenta.\n• Missed abortion: reorganization of hematoma, viable placenta.\n• Chromosomal anomalies: hydropic villous degeneration\n  (not VM).","bleed",4],[31,"Maternal causes of spontaneous abortion","                             1] Uterine & Endometrial Causes\n• Congenital Uterine Anomalies: septate, bicornuate uterus.\n• Fibroid: especially submucus myomas.\n• Endometrial Polypi.\n• Intrauterine Synaechiae (Asherman syndrome).\n• Cervical Insufficiency.\n                                      2] Endocrinopathies\n• Uncontrolled DM: 1st trimester abortion + specific lethal fetal congenital anomalies later\n  in pregnancy.\n• Progesterone Deficiency in early pregnancy: luteal phase defect (LPD) → early 1st\n  trimester abortion .\n                             3] Immunologic & Thrombophilia\n• Hypercoagulable State\n• Allogeneic Factors\n                                    4] Maternal Infections\nuncommon cause of 1st trimester abortion   Chorioamnionitis = important cause of late 2nd trimester loss\n• Organism crosses placenta and affects fetus.\n• Fever → release of prostaglandins + uterine contraction.\n• Malaria → obstructs placental blood vessels.\n\n                                           5] Diseases\n\n• Chronic Hypertension, Cardiac or Respiratory Diseases.","bleed",5],[31,"Complications of spontaneous abortion","  • Bleeding:\n    o Continuous/prolonged bleeding → may be associated with\n      incomplete evacuation.\n    o Severe hemorrhage → may be associated with late 1st & 2nd\n      trimesteric abortion.\n    o Postabortive bleeding: retained products of conception,\n      choriocarcinoma, injury (uterine perforation, cervical trauma),\n      infection, other general/local gynecological causes.\n    o Hemorrhagic shock: severe hemorrhage in short duration →\n      life threatening if intervention delayed.\n  • Infection:\n    o Immediate:\n      ✓ Septic Shock + Multi-Organ Failure (renal failure, ARDS),\n      ✓ DIC,\n      ✓ Pelvic Abscess, Pelvic Thrombosis & Septic Emboli.\n    o Late sequelae: Asherman’s syndrome, peritoneal & tubal\n      adhesions →\n      infertility & chronic pelvic pain.\n  • Traumatic complications of surgical evacuation (SE)\n  • Rh Iso-Immunization: if Rh −ve and did not receive anti D.\n  • Maternal Mortality: hemorrhage, infection (sepsis),\n    thromboembolism.\n  • Psychological Trauma\n❖ Threatened Abortion","bleed",6],[31,"Definition of threatened abortion?","• Attempt of the uterus to expel products of conception.\n• Partial separation of ovum from uterine wall, slight\n  hemorrhage into choriodecidual space.\n• Pregnancy continues in 70-80%.","bleed",7],[31,"Diagnosis of threatened abortion?","• Symptoms:\n  o Vaginal Bleeding: minimal or mild, no blood clots.\n  o Pain: mild suprapubic dull aching + pelvic heaviness.\n• Signs:\n  o Uterine Size: corresponds to GA by LMP.\n  o Cervix: closed.\n• Investigations:\n  o Quantitative β-hCG (correlates with pregnancy duration).\n  o US:\n    ✓ Intact pregnancy with cardiac pulsations (≥ 7 wks).\n    ✓ Mild choriodecidual separation + intrauterine bleeding in\n      some.","bleed",7],[31,"Treatment of threatened abortion?","   • Expectant: until symptoms resolve, nonviable pregnancy\n     diagnosed, or progression to inevitable / incomplete / complete.\n   • Active:\n     o Progesterone (IM, oral, vaginal): commonly used.\n     o Bed rest + abstinence from coitus.\n   • Anti D (Rh -ve): 50 µg before 12 wks, 300 µg after.\n❖ Missed Abortion","bleed",8],[31,"Cause of missed abortion","• Retention of non viable products due to viable placenta or\n  exogenous progesterone.","bleed",9],[31,"Diagnosis of missed abortion?","• Symptoms:\n  o Early Pregnancy Symptoms: less pronounced\n  o Brownish Vaginal Discharge (may be early)\n  o Recurrent Vaginal Bleeding: dark, minimal\n  o Breast Milk Discharge\n  o Pain usually absent.\n• Signs:\n  o Uterine Size: soft, smaller than GA.\n  o Cervix: closed.\n• Investigations:\n  o US:\n    ✓ Gestational sac ≥ 25 mm with no yolk sac or embryo.\n    ✓ Embryo CRL ≥ 7 mm with no cardiac activity.\n  o Coagulation Profile: to exclude DIC.","bleed",9],[31,"Treatment of missed abortion?","   • Expectant (EM): alternative if early failure < 13 wks, stable\n     vitals, no infection; most expulsions in first 2 wks.\n     o Expulsion occurs → US to ensure complete evacuation.\n     o No expulsion → medical or surgical.\n   • Medical Evacuation (ME):\n     o Misoprostol-only regimens\n     o Mifepristone/misoprostol protocol (max GA 70 days).\n   • Surgical Evacuation (SE): D&C under anesthesia, from start\n     or if incomplete after ME/EM.\n   • After Evacuation:\n     o Doxycycline on day of evacuation (↓ postabortal sepsis)\n     o Anti D (Rh −ve; 50 µg before 12 wks, 300 µg after).\n❖ Inevitable Abortion","bleed",10],[31,"Definition of inevitable abortion?","• Abortion that can’t be prevented.\n• Complete separation of fertilized ovum or placenta.\n• Progressive cervical dilatation and fetal expulsion.","bleed",11],[31,"Diagnosis of inevitable abortion?","• Symptoms:\n  o Vaginal Bleeding: severe with blood clots; may → hypovolemic\n    shock.\n  o Pain: severe suprapubic colicky (uterine cramping) → radiates to\n    back.\n  o Rupture of membranes: in 2nd trimester → sign of inevitable\n    abortion.\n• Signs:\n  o Uterine Size: period of amenorrhea or slightly smaller ±\n    contractions..\n  o Cervix: open.\n• Investigations:\n  o US: usually not needed, intrauterine bleeding & choriodecidual\n    separation evident\n  o Blood grouping & Rh: to prepare blood.","bleed",11],[31,"Treatment of inevitable abortion?","   • Stabilize in severe bleeding: hospitalization, IV saline +\n     lactated Ringer’s; blood transfusion if severely anemic.\n   • Active:\n     o Surgical:\n       ✓ Conventional treatment of 1st/early 2nd trimester failed\n         pregnancy\n       ✓ Suction curettage preferable to sharp curettage (greater\n         morbidity).\n     o ME (misoprostol):\n       ✓ Induction oral/vaginal misoprostol → IV oxytocin and/or\n         ergometrine\n       ✓ For stable women, specially 2nd trimester > 13 wks.\n     o Hysterotomy:\n       ✓ Failure of other methods, bad general condition, uterine\n         scars, abdominal cerclage.\n   • After Evacuation: Antibiotics + anti D (as missed abortion)\n❖ Incomplete Abortion","bleed",12],[31,"Definition of incomplete abortion?","• Part of products of conception expelled.","bleed",13],[31,"Diagnosis of incomplete abortion?","• Symptoms: recent spontaneous abortion, followed by:\n  o Vaginal Bleeding: persistent painful profuse bleeding,\n    intermittent passage of some products.\n  o Pain: severe suprapubic colicky (uterine cramping).\n• Signs:\n  o Uterus: subinvoluted, soft consistency.\n  o Cervix: open.\n• Investigations:\n  o US: significant remnants of conception within uterine cavity.\n  o Blood grouping & Rh: to prepare blood.","bleed",13],[31,"Treatment of incomplete abortion?","   • Stabilize in severe bleeding: (as inevitable).\n   • Active:\n     o Surgical:\n       ✓ Suction curettage preferable\n       ✓ 2nd trimester with retained placenta → manual or ring forceps\n         removal\n     o Medical:\n       ✓ Misoprostol (600 mcg orally single dose or 400 mcg sublingual)\n       ✓ For stable women and 2nd trimester with retained\n         placenta.\n   • After Evacuation: Antibiotics + anti D (as missed abortion)\n❖ Complete Abortion","bleed",13],[31,"Definition of complete abortion?","• All products of conception expelled.","bleed",14],[31,"Diagnosis of complete abortion?","• Symptoms: History of a recent abortion, then:\n  o Vaginal Bleeding: diminishes and gradually stops with\n    diminishing uterine cramps.\n• Signs:\n  o Uterus: contracted, returns to normal size.\n  o Cervix: closed.\n• Investigations:\n  o US: empty uterine cavity, no retained products.","bleed",14],[31,"Treatment of complete abortion?","• Anti D (Rh −ve) ± antibiotics.","bleed",14],[31,"Enumerate predisposing factors of septic abortion.","• Prior cervical gonococcal or chlamydial infection\n• Retained remnants for long time\n• Pregnancies occurring on top of IUD\n• Criminal induction of abortion","bleed",17],[31,"Describe CP of septic abortion.","• FAHM.\n• Offensive discharge & Lower abdominal pain, tenderness\n  & rigidity.","bleed",17],[31,"Enumerate complications of septic abortion.","• Endometritis.                 • Septic shock & ARDS.\n• Pelvic abscess /              • DIC.\n  Systemic pyemia.              • Renal failure.\n• Generalized peritonitis.","bleed",17],[31,"Mention treatment of septic abortion"," • Stabilize the general condition (BP – Pulse – Temperature).\n • IV antibiotics:\n      Ampicillin 2g / 4h .\n      +Gentamicin 5mg / kg / day .\n      +Metronidazole 500 mg / 8h .\n      Followed by oral antibiotics to complete 10-14 days.\n• Evacuation → (Suction evacuation / Hysterotomy - Hysterectomy).\n• Antibiotics and AntiD after evacuation.","bleed",17],[31,"Define recurrent pregnancy loss (RPL)","• ≥ 3 consecutive losses of recognized Pregnancies before\n  20th week (not including ectopic, molar or biochemical\n  Pregnancies).\n• Most of RPL occur in 1st trimester","bleed",18],[31,"Mention etiology of RPL","• Uterine causes :\n     o Congenital uterine anomalies (10-15%).\n     o Fibroid / endometrial polypi / Asherman syndrome /\n       Cervical insufficiency.\n• Endocrine: DM / Thyroid dysfunction / PCOS /\n  hyperprolactinemia / Luteal phase defect.\n• Immunologic disorders & thrombophilia: hypercoagulable\n  state / Antiphospholipid $.\n• Systemic illness: chronic HTN, cardiac or respiratory diseases.\n• Chromosomal abnormalities (3-5%): balanced translocation\n  / recurrent aneuploidy.\n• Unexplained 30%","bleed",18],[31,"Mention investigations for RPL","               Diagnostic tests                        Additional tests\n• Karyotyping.                                         • Screening for\n• Uterine assessment: 3D US, Sono                        DM\n  hysterography or HSG / Hysteroscopy,                 • Inherited\n  laparoscopy or MRI (2nd line).                         thrombophilia\n• Thyroid function (TSH, Thyroid peroxidase            • Medical\n  Antibodies).                                           workup\n• Anti phospholipid syndrome ACA, LAC, Anti\n  B2 microglobulin1 (twice 6-8 weeks apart).","bleed",19],[31,"Discuss how to manage RPL","Management of      • Genetic counseling\nspecific cause     • Surgical management of uterine abnormalities\n                         • Control of endocrinal and chronic diseases\n                         • Low dose aspirin & heparin in APS\nManagement of            • Lifestyle modification: ↓ smoking, alcohol,\nunexplained RPL            caffeine, control BMI\n                         • Hormonal support (progesterone, HCG)\n                         • Aspirin, heparin\n                         • IVF and preimplantation genetic diagnosis\nFuture Pregnancy         • Control of medical conditions (DM / APS).\n hage)","bleed",32],[32,"Additional diagnostic tests","➢ Laparoscopy: diagnostic in suspicious cases &\n   therapeutic\n➢ Progesterone:<5ng/ml confirm diagnosis in ♀ with\n   abdominal pain, bleeding & low hCG.\n ➢ Curettage: exclude an IUP and avoid medical therapy\n   of nonviable IUP.","bleed",32],[32,"Other complementary tests","         ➢ Pretreatment laboratory tests: CBC, renal and liver\n           function.\n         ➢ Evaluate the patient’s hemodynamic status: CBC,\n           hemoglobin, platelets & Rh typing.\n\n11) Mention main lines of TTT in ectopic pregnancy","bleed",32],[32,"Stabilizing the patient’s general condition","hospitalization, IV fluids and blood transfusion.","bleed",32],[32,"Anti D for Rh-ve patients: 50μg IM.","12) Mention D.D of EP:\n   • Abortion: Bleeding precedes pain and is more prominent &\n     hCG levels are declining.\n   • Appendicitis: pain in right iliac fossa with tenderness,\n     rebound tenderness (CBC shows high TLC & -ve\n     pregnancy test).\n   • Pelvic inflammatory disease (PID): pelvic pain, tender\n     cervix & adnexa, no amenorrhoea. Pregnancy test is -ve,\n     and CBC may show high TLC.\n   • Hemorrhagic corpus luteum: short delay in a cycle +\n     unilateral pain and adnexal mass on US, but pregnancy\n     test is negative\n   • Adnexal torsion: unilateral lower abdominal pain in\n     association of an adnexal mass on US\n   • Pelvic hematocele: may be associated with hemorrhage\n     and rupture in corpus luteum cyst, -ve Pregnancy test and\n     tenderness in moving the cervix. CBC →show anemia due\n     to blood loss + normal TLC.\n   • Other causes of bleeding or pain early in pregnancy;\n     includes Physiologic bleeding, GTD, cervical, vaginal, or\n     uterine pathology, subchorionic hematoma\n13) Discuss the surgical management of ectopic pregnancy:\n                               Indications","bleed",32],[32,"Failed medical therapy","Approach","bleed",34],[32,"Laparoscopy: standard approach advant              Triploid (paternal &\n                 Diploid (paternal)\nZygote                                               maternal)\n                    = 46 XX, XY\n                                                = 69 XXX, XXY, XYY","bleed",39],[33,"Mention risk factors of VM","• Age: > 35 years or < 15 years.\n• Nutritional: low intake of vitamin A and animal fat.\n• Recurrence.","bleed",39],[33,"Mention macroscopic pathology of VM","• Complete Mole (Uterus): bunch of grapes; symmetrically\n  enlarged and soft; no amniotic sac nor fetal tissue; filled\n  with watery vesicles (few mm to few cm).\n• Partial Mole (Uterus): hydatidiform changes only focal;\n  fetus and amniotic sac can be identified; fetus usually\n  non-viable, with stigmata of triploidy (multiple congenital\n  malformations, growth restriction).\n• Ovary: Theca Lutein Cysts in 25-60%; usually bilateral;\n  few mm up to 10 cm; regress within 2-4 months of\n  evacuation; large cysts may undergo torsion, infarction,\n  hemorrhage.","bleed",40],[33,"Mention microscopic pathology of VM","• Hydropic degeneration of villi: marked oedema and\n  enlargement of villous stroma; disappearance of villous\n  fetal blood vessels.\n• Trophoblastic hyperplasia.\n• Complete mole: both changes diffuse, no fetal tissues.\n• Partial mole: both changes focal, with umbilical cord,\n  amniotic membrane and fetal tissues.","bleed",40],[33,"Mention complications of VM","• Early onset preeclampsia\n• Hyperemesis gravidarum\n• Hyperthyroidism\n• Severe bleeding\n• Infection","bleed",41],[33,"Mention clinical picture of VM","• Symptoms:\n  o History of amenorrhea +ve positive pregnancy.\n  o Recurrent mild vaginal bleeding (most common symptom 97%).\n  o Vaginal discharge Dark prune juice ,Passage of vesicles\n    (Diagnostic).\n  o Pain\n• Signs:\n  o General examination: Pallor, hypertension, RDS, DIC.\n  o Abdominal examination: in cases reaching the 2nd\n    trimester.\n  o Fundal level: above the date of amenorrhea\n  o Uterus: soft with doughy sensation.\n  o Fetus: Fetal parts and fetal pulsations are absent.\n  o Pelvic Examination:\n  o Cervix: soft in consistency , passage of vesicles (diagnostic).\n  o Uterus: same data of abdominal examination.\n  o Adnexa: Bilateral cystic ovaries in the pouch of Douglas.","bleed",41],[33,"Mention investigation of VM","• US (gold standard in diagnosis):\n  o Complete Mole:\n    ✓ Characteristic snow storm appearance (vesicles\n       surrounded by blood).\n    ✓ Absent fetal echoes.\n  o Partial Mole:\n    ✓ Present embryonic or fetal echoes, amniotic sac.\n• Pregnancy Test: > 100,000 IU/L\n• Imaging Studies: searching for metastasis (metastatic types)\n• Laboratory Tests: CBC, coagulation studies, renal and liver\n  function tests.\n• Thyroid Function Tests in hyperthyroidism.","bleed",42],[33,"Mention TTT of VM","• Stabilizing the general condition: Hospitalization, IV fluids\n  & blood transfusion.\n• Termination of pregnancy:\n  o Suction evacuation guided by US (gold standard).\n• Hysterectomy in toto:\n      ▪ Old multiparous.\n      ▪ Severe or uncontrollable uterine bleeding.\n      ▪ Invasive mole.\n• Anti D\n• Follow up\n• Chemotherapy","bleed",42],[0,"What controls the regulation of fetal heart rate (FHR)?","• FHR is controlled by the autonomic nervous system.\n• Sympathetic nervous system acts as the accelerator.\n• Parasympathetic nervous system acts as the decelerator.\n• Fetal maturity → progressive vagal dominance","fet",2],[0,"Enumerate the fetal heart rate patterns.","• Baseline rate.\n• Variability.\n• Accelerations.\n• Decelerations.\n• Unusual FHR patterns.","fet",2],[0,"Baseline tachycardia vs bradycardia?","       • Normal FHR = 110-160 bpm\n            Tachycardia                             Bradycardia\n    > 160 bpm maintained > 2 min           < 110 bpm maintained > 2 min\n• Maternal Fever; Acute Maternal Hge\n• Hyperthyroidism                      • Hypothyroidism\n• Drugs (atropine, β2 mimetics)        • β blockers\n• Early Hypoxia (↑ sympathetic)        • “Aminious” sign of fetal distress\n• Prematurity (↓ vagal tone)           • Past-date fetus\n• Fetal Tachyarrhythmia                • Congenital heart block","fet",2],[0,"Define FHR variability and mention its types.","• Variability is the interaction between the sympathetic and\n  parasympathetic nervous systems to maintain normal FHR.\n• Most clinically significant indicator of fetal distress\n• Represents healthy non-hypoxic brain","fet",3],[0,"Define fetal heart rate accelerations and mention their causes and significance.","• Definition: Increase in FHR more than 15 bpm above\n  baseline, lasting more than 15 seconds.\n• Causes: fetal movements, uterine contractions and partial\n  umbilical cord compression.\n• Significance: A reliable sign of fetal well-being.","fet",3],[0,"Define fetal heart rate decelerations and types.","       • Abrupt or gradual decrease in FHR more than 15 bpm\n         below the baseline, lasting more than 15 seconds.\n             Type I (Early)         Type II (Late)       Type III (Variable)\nOnset &\n                  Slow                   Slow                   Abrupt\nReturn\n\n                                                             Variable timing,\nRelation   Start & end with UC → Start & end after UC;\n                                                          duration & intensity;\n to UC             no lag            lag > 15 sec\n                                                         often coincide with UC\n\n           Head compression         Fetal Hypoxia &\nCause                                                     Cord Compression\n              (no distress)            Acidosis","fet",3],[0,"Enumerate the categories of fetal heart rate tracings according to the FHR interpretation system.","                Meaning                       Features\n                                                       ALL of:\n                                    • Baseline 110-160 bpm;\nCategory    Minimal likelihood of\n                                    • No late or variable decels;\n    I            acidemia\n                                    • Moderate variability (6-25 bpm)\n                                    • early decels & accels present or absent\nCategory       FHR patterns\n   II         indeterminate\n                                    Absent baseline variability + ANY of:\n                                  • Recurrent Late Decelerations\nCategory    More likely abnormal\n                                  • Recurrent Variable Decelerations\n   III     fetal acid-base status\n                                  • Bradycardia\n                                  • Sinusoidal Pattern","fet",4],[0,"Causes of Category II & III tracings?","      • Fetal hypoxemia and acidosis.\n      • Fetal arrhythmias.\n      • Medication effects: opioids & magnesium sulfate.\n❖Antepartum Assessment of Fetal Well-Being","fet",4],[0,"History & examination in antepartum assessment of fetal well-being?","• History: cause of placental insufficiency, e.g. PE, post-\n  maturity\n• Exam: signs of small for gestational age (SGA) fetus or\n  oligohydramnios\n  o Poor maternal weight gain (normal 0.5 kg/week after 20 wks)\n  o Small abdominal girth, undersized uterus (fundal level < GA)","fet",5],[0,"Enumerate the methods of antepartum fetal surveillance.","• Daily fetal movement count.\n• Non-stress test (NST).\n• Oxytocin challenge test (OCT).\n• Biophysical profile score (BPPS).\n• Ultrasound color Doppler.","fet",5],[0,"Daily fetal movement count (DFMC)?","• Recorded 2 days each week, after 30 wks\n• > 10-12 gross movements within 10-12 hrs = good\n• ↓ DFMC → further evaluation (NST & US)\n• Disadvantage: subjective, affected by many conditions","fet",5],[0,"Non-stress test (NST)?","• Idea: fetal movements ↔ FHR acceleration = CVS–CNS\n  interaction → healthy CNS, no hypoxia\n• Fetal distress → link lost & spontaneous decelerations\n  appear\n• Method: external cardiotocography (CTG); most widely\n  used 1ry screening test\n• FHR recorded 20 min (duplex US probe); if not reactive →\n  another 20 min or more\n• Fetal movement recorded by mother (special probe)","fet",6],[0,"What are the criteria and management for NST?","                   Reactive (−ve test)      Non-reactive (+ve test)\n                   ≥ 2 fetal movements +\n  Criteria            ≥ 2 accelerations            < 2 accelerations in 40 min\n               (≥ 15 bpm, ≥ 15 sec) in 20 min\n\n             Repeat every week, or more often in       Further evaluation:\nManagement\n                          high-risk                   colour Doppler, BPP","fet",6],[0,"Biophysical profile score (BPPS) of Manning?","      • Simple test, clear US parameters → picks fetuses at risk of\n        hypoxia\n      • Starts 28-32 wks; repeat freely when needed\n      • = NST + 4 US parameters\n  Variable             Normal (score 2)                 Abnormal (score 0)\nFetal Breathing\n                   ≥ 30 sec sustained / 30 min             < 30 sec / 30 min\n Movements\n   Fetal          ≥ 3 simultaneous limb & trunk /\n                                                             ≤ 2 / 30 min\n Movements                    30 min\n                     1 episode limb flexion →       Semi/full extension, no or slow\n  Fetal Tone\n                     extension & rapid return                    return\nAmniotic Fluid         Pocket ≥ 2 cm in 2\n                                                        Largest pocket < 2 cm\n  Volume              perpendicular planes\n     NST                     Reactive                        Non-reactive","fet",7],[0,"Interpretation of BPPS?","    8-10                    6                                    ≤4\nNo fetal asphyxia Suspected chronic asphyxia\n\n                         > 36 wks: deliver                > 36 wks: deliver\n\n Repeat weekly                                      < 36 wks: repeat in 4-6 hrs for\n                            < 36 wks:\n                                                     120 min → if persistently ≤ 4\n                         repeat in 4-6 hrs\n                                                       deliver regardless of GA\n      • Modified BPP: if CTG unavailable → score of 8 by US alone","fet",7],[0,"Enumerate the methods of analysis of blood flow by color Doppler.","• Blood flow velocity.\n• Blood flow volume (ml/min) = Velocity × Cross-sectional\n  area of the blood vessel.\n• Indirect indices of blood flow.","fet",8],[0,"Enumerate the indirect Doppler indices of blood flow and their formulas.","    • Systolic/Diastolic ratio (S/D ratio) = Systolic flow ÷ Diastolic\n      flow.\n    • Resistance Index (RI) = (Systolic velocity − Diastolic\n      velocity) ÷ Systolic velocity.\n    • Pulsatility Index (PI) = (Systolic velocity − Diastolic velocity)\n      ÷ Mean velocity.\n\n❖ Intrapartum Assessment of Fetal Well-Being","fet",8],[0,"History & examination in intrapartum fetal assessment?","• History: cause of placental insufficiency (PE, post-maturity)\n• Examination: abnormal FHR by sonicaid or Pinard (severe\n  brady- or tachycardia)\n• Meconium after ROM (cephalic presentation, not breech)\n• Asphyxia → anal sphincter relaxation + ↑ intestinal peristalsis\n  → meconium escapes → yellowish/greenish liquor","fet",8],[0,"What are the methods of intrapartum fetal surveillance?","• Electronic fetal heart rate monitoring by CTG:\n  ➢ External monitoring.\n  ➢ Internal monitoring.\n• Fetal scalp blood sampling (scalp pH).\n• Fetal pulse oximetry.","fet",9],[0,"Electronic FHR monitoring (CTG) in labour?","      • Continuous FHR monitoring in relation to uterine activity\n                        External                             Internal\n                                                  Spiral electrode on presenting\n           External Doppler US transducer +\nDevice                                           part + plastic catheter in amniotic\n              strain gauge over abdomen\n                                                                 sac\n            FHR; onset, duration, intensity of   Direct fetal ECG; pressure of each\nRecords\n                     contractions                            contraction","fet",9],[0,"Fetal scalp blood sampling (scalp pH)?","• Abnormal CTG sometimes misleading → ↑ unnecessary CS\n• Most accurate method detecting fetal hypoxia when CTG\n  abnormal\n• Few drops fetal blood via small needle probe on scalp after ROM\n        pH                           Meaning\n    > 7.25-7.35                        Normal\n\n    > 7.25-7.2          Pre-acidosis → repeat immediately\n\n       < 7.2            Acidosis → immediate interference","fet",9],[0,"What is the management of intrapartum fetal distress?","    • High-risk → continuous CTG throughout labour.\n    • If CTG is abnormal:\n      o Stop oxytocin (↓ contractions & IUP → ↑ fetal placental\n         perfusion between contractions) .\n      o IV fluids (avoid maternal dehydration) .\n      o left lateral position (↑ blood supply).\n      o O2 mask (avoid maternal hypoxia).\n    • If FHR returns to normal:\n      o Labour continues under strict observation, if vaginal\n         delivery rapidly anticipated.\n    • If abnormal FHR persists:\n      o Immediate delivery: CS (best & safest), or operative\n         vaginal delivery if cervix fully dilated.\n\n❖Ultrasonography in obstetrics","fet",10],[0,"Trans-abdominal (TAS) vs transvaginal (TVS) US?","                TAS                           TVS\nBladder             Full                           Empty\n\n Use      1ry method in obstetrics   Many advantages in early pregnancy","fet",10],[0,"Assessment of fetus by US?","• Fetal number → multiples\n• Biometry: CRL, BPD, HC, AC, TAD, TTD, FL → GA, fetal weight &\n  growth, IUGR\n• IUFD diagnosis\n• Lung maturity: amniotic fluid turbidity & placental grading\n• Congenital fetal malformation (CFMF)\n• Fetal lie, position & presentation","fet",11],[0,"Other clinical applications of US in obstetrics?","     Area                                Use\n Amniotic Fluid      • Poly- & oligohydramnios\n                     • Localization\n    Placenta\n                     • Anomalies (chorioangioma)\n                     • Cervical incompetence\n                     • Missed IUCD\n     Uterus\n                     • Ovarian cyst & fibroid\n                     • CS scar thickness\nEarly Pregnancy      • IU vs ectopic pregnancy at very early stage\n                     • Early: abortion, ectopic, vesicular mole\n Bleeding (DD)       • APH: accidental hemorrhage, placenta previa\n                     • PPH: retained placental remnants\n                     • Amniocentesis,\n                     • CVS,\n  With other         • Cordocentesis,\n  procedures         • Intrauterine blood transfusion,\n                     • BPP,\n                     • Colour Doppler","fet",11],[6,"Definition of small for gestational age (SGA) infant","• Weight < 10th percentile for gestational age.","fet",13],[6,"Etiology of SGA infant","• Constitutionally small fetus.\n• Fetal growth restriction (FGR) = intrauterine growth\n  restriction (IUGR): placental, maternal or fetal factors.","fet",13],[6,"Constitutionally small fetus as a cause of SGA","    • Constitutionally small, but otherwise healthy fetus.\n    • Small women typically have smaller babies.\n    • Woman begins pregnancy < 42 kg → risk of SGA infant at\n      least doubled.\n\n❖ Fetal Growth Restriction (FGR)","fet",13],[6,"Define IUGR.","• Fetus that has not reached its growth potential due to\n  fetal, placental or maternal factors.\n• Significant overlap among these entities.","fet",13],[6,"Enumerate causes of IUGR.","• Placental:\n  a. Chronic abruptio placenta.\n  b. Single umbilical artery.\n  c. Velamentous cord insertion.\n  d. Placental hemangioma.\n• Maternal:\n  a. Chronic hypoxemia: pulmonary disease, cyanotic heart\n     disease, heavy smoking.\n  b. Antiphospholipid syndrome.\n  c. HTN, DM, renal diseases, SLE.\n  d. Extremes of age, poor nutrition, short interpregnancy\n     period, previous SGA baby.\n• Fetal:\n  a. Karyotypic abnormalities: trisomies, autosomal\n     deletions, ring chromosomes.\n  b. Genetic syndromes: Bloom syndrome, dwarfism.\n  c. Major congenital anomalies: especially congenital\n     heart disease (VSD, ASD).\n  d. Multiple gestation: in direct relationship to number of fetuses.\n  e. Infections developing early in pregnancy have the\n     greatest effect\n     o Viruses: CMV is the most frequent viral etiology.\n     o Parasites: toxoplasmosis, malaria.\n     o Bacterial: less evidence.","fet",14],[6,"Mention types of IUGR.","     • Symmetrical (20%): intrinsic fetal factors, early in\n       development.\n     • Asymmetrical (80%): maternal disease, placental\n       insufficiency, later in pregnancy.\n               Symmetrical (Fetal)           Asymmetrical (Maternal)\n Onset                  Early                  Late in 2nd & 3rd trimesters\n             Reduction in growth of both      Reduced weight & relatively\n Organs\n                    body & head              normal length and head growth\n  Brain\n                       Absent                            Occurs\n sparing\n            - Chromosomal abnormalities - reduction in fetal nutrition dt\n Causes\n            - congenital infections     maternal factors\n                                                  Good & rapid growth\nPrognosis   Bad & slow growth after birth\n                                                (catch-up phenomenon)","fet",15],[6,"Enumerate complications of IUGR.","• Preterm delivery: with all complications of prematurity.\n• Hypothermia.\n• Hypoglycemia.\n• Polycythemia and hyperviscosity.\n• Impaired immune function.\n• Perinatal asphyxia and fetal distress.\n• ↑ Fetal, neonatal and perinatal mortality.","fet",15],[6,"Enumerate investigations of IUGR.","• US:\n   Delay in US measurements > 2-3 weeks.\n   Fetal weight < 10 percentile for GA.\n                      th\n\n   Increased HC/AC ratio.\n   Accelerated placental aging with calcifications.\n   Associated oligohydramnios.\n\n• Umbilical & cerebral arteries Doppler:\n   ↓ umbilical / preserved or ↑ cerebral flow.\n\n• Fetal wellbeing: DFMC, NST, BPP, CTG.\n• Tests for congenital anomalies & karyotyping.\n• TORCHES screening.","fet",16],[6,"Investigations indicated in severe SGA fetuses?","• Detailed fetal anatomical survey if severe SGA identified\n  at the 18-20 wk scan.\n• Karyotyping, especially with structural anomalies detected\n  before 23 wks, and/or if uterine artery Doppler is normal.\n• Screening CMV and toxoplasmosis.\n• Syphilis and malaria testing in high risk populations.","fet",16],[6,"Discuss management of IUGR.","• Cessation of smoking & improving nutrition.\n• Low dose aspirin.\n• Regular fetal surveillance.\n• Antenatal corticosteroids.\n• Induction of labor after completed 37 wks.\n• TOP whenever:\n   Fetus reaches maturity.\n   Increased fetal hypoxia & risk of IUFD.\n   Complications as severe oligohydramnios","fet",17],[10,"Definitions in perinatal mortality","       Term                                      Definition\n                             Delivery of a dead fetus after 20 (or 28) weeks of\n    Stillbirth (SB)\n                                                 pregnancy.\n  Antepartum IUFD                    Fetal death before onset of labor.\n  Intrapartum IUFD                        Fetal death during labor.\n        SB rate                      Number of SB / 1000 total births.\nNeonatal death (NND)                Death within the 1st 4 weeks of life.\nNeonatal mortality rate       Number of neonatal deaths / 1000 live births.\nPerinatal mortality rate    Stillbirths + deaths in the first week of life per 1000\n       (PNMR)                                     total births.\n\n ❖Antepartum intrauterine fetal death (IUFD)","fet",18],[10,"Definition & incidence of antepartum IUFD","• Fetal death in utero after the age of viability.\n• Incidence: antepartum 8/1000, representing 86% of fetal death.","fet",18],[10,"Causes of antepartum IUFD","  Group                                Causes\n                           Pregnancy induced hypertension.\n               Maternal disease: diabetes mellitus – hypertension – renal\n Maternal                   disease – obstetric cholestasis.\n                  Maternal hypoxia due to cardiopulmonary disease.\n               Autoimmune disease: SLE – antiphospholipid syndrome.\n                 Placental separation in placenta previa or abruption.\n                                     Vasa previa.\n Placental                    Prolapsed pulsating cord.\n                                 True knot of the cord.\n                 Premature rupture of membrane & chorioamnionitis.\n                            Congenital fetal malformation.\n                                 Congenital infections.\n   Fetal                 Twin-to-twin transfusion syndrome.\n                                Post term pregnancy.\n                                 Rh isoimmunization.\nUnexplained                              30%.","fet",19],[10,"Diagnosis of antepartum IUFD","     • As missed abortion.\n           Symptoms                                   Signs\n Mother notices cessation of fetal\n                                       Fundal level < period of amenorrhea\n           movement\n       History of the cause.               Fetal parts aren’t easily felt.\n Failure of abdominal enlargement.               FHS is inaudible.\n   Gradual disappearance of peg\n                                         Malpresentation are common.\n             symptoms\nDark brown vaginal discharge, breast\n                                         PV: may reveal collapsed skull.\n      milk secretion may start.","fet",20],[10,"Management of antepartum IUFD","     • Prevention: good antenatal care, especially with ↓ fetal kick,\n       ↓ weight gain & intrauterine growth restriction (IUGR).\n     • If DIC: IV infusion of heparin + fresh frozen plasma.\n     • Termination of Pregnancy:\n       o Expectant: wait for spontaneous onset within 2-3 weeks.\n       o Induction of labour, and rarely cesarean section.\n     • After Termination:\n       o Anti-D for Rh −ve.\n       o Search for the cause.\n       o Suppression of lactation.\n       o Next pregnancy = high risk.\n❖Intrapartum IUFD","fet",20],[10,"Causes of intrapartum IUFD","• Same causes as antepartum fetal death +\n• Placenta: ruptured uterus – antepartum hemorrhage.\n• Cord: cord prolapse – cord around the neck – true knot of cord.\n• Membrane: prolonged rupture of membrane – vasa previa.\n• Birth trauma: especially intracranial hemorrhage.","fet",21],[7,"Define macrosomia.","• Excessive intrauterine growth → newborn with birth weight\n  > 4000- 4500 gm, regardless of gestational age.","fet",22],[7,"Define large for gestational age fetus.","• Fetus with birth weight > 90th percentile or 2SD above mean\n  of its gestational age.","fet",22],[7,"Mention causes of macrosomia.","• Generalized:\n   I. Maternal: DM, obesity, excessive weight gain, multipara.\n   II. Fetal: genetic syndromes, post-term, hydrops, prior\n       macrosomic infant.\n• Localized:\n   a. Hydrocephalus, hydrothorax.\n   b. Meningocele, encephalocele.\n   c. Fetal tumors as Wilms tumor, teratoma.","fet",22],[7,"How to diagnose a macrosomic baby?","• History: DM, prior macrosomic baby.\n• Clinical: excessive weight gain, fundal level (unreliable).\n• US: more accurate fetal weight estimation (standard).","fet",22],[7,"Enumerate complications of macrosomia.","• Fetal:\n     a. Birth injuries: shoulder dystocia & brachial plexus\n        injury (most common).\n     b. Perinatal hypoxia and asphyxia (RDS).\n     c. Hypoglycemia, polycythemia, jaundice.\n     d. IUFD.\n• Maternal:\n  a. Prolonged & obstructed labor.\n  b. Higher incidence of instrumental delivery & CS.\n  c. PP Hge: atonic & traumatic.\n  d. Puerperal sepsis.","fet",23],[7,"Enumerate DD of large for gestational age / macrosomia.","• Post-term.\n• Miscalculation.\n• Polyhydramnios.\n• Multifetal pregnancy.\n• Concealed accidental hemorrhage.\n• Fibroid with pregnancy.\n• Hydrocephalus, cystic hygroma.\n• Meningocele, meningoencephalocele.","fet",23],[7,"Discuss management of macrosomic baby.","• Prevention: early diagnosis & meticulous control of DM,\n  weight control.\n• Active:\n  a. Regular ANC & repeated investigations.\n  b. Elective CS: if > 4500 gm.\n  c. Induction of labor > 37 weeks: if < 4500 gm.\n  d. Vaginal delivery without instruments.\n  e. Neonatal management of infant of diabetic mother.","fet",24],[7,"Define shoulder dystocia.","• Vaginal cephalic delivery that requires additional obstetric\n  maneuvers to deliver the fetus after the head has delivered\n  and gentle traction has failed.","fet",24],[7,"Enumerate risk factors \"etiology\" of shoulder dystocia.","• Large-sized baby.\n• Unrotated shoulders.\n• Contracted pelvis & CPD.\n• Contraction ring.\n• Congenital anomalies: ascites & hydrothorax.\n• Induction & augmentation of labor by oxytocin.\n• Operative delivery & prolonged 1st & 2nd stages.","fet",24],[7,"Enumerate complications of shoulder dystocia.","• Fetal: asphyxia, brachial plexus injury, fractures.\n• Maternal: obstructed labor & PP Hge.","fet",24],[7,"Mention management of shoulder dystocia.","• Prophylaxis: better CS if > 4.5 kg.\n• 1st line: McRoberts maneuver & suprapubic pressure.\n• 2nd line: generous episiotomy, rotation of posterior\n  shoulder, internal rotation maneuver.\n• 3rd line: All-Fours position, repeated above maneuvers.\n• Last line: pushing head backward & CS (Zavanelli).\n• Cleidotomy or symphysiotomy.","fet",25],[1,"Definition of polyhydramnios","• Excessive volume of amniotic fluid (see US diagnosis).","fet",27],[1,"Etiology of polyhydramnios","                   Cause                                    Details\nIdiopathic        Idiopathic factors               Accounts for 40% of cases.\n                                          Primary GI obstruction (duodenal, esophageal\n                  Fetal anomalies\n                                          or intestinal atresia); secondary GI obstruction\n                (one-third of cases):\n                                              (massive unilateral dysplastic kidneys);\n                   ↓ swallowing\n                                             neuromuscular disorders (anencephaly).\n             Fetal anomalies: excessive     Open NTD (spina bifida & anencephaly);\n                    accumulation          omphalocele (excessive transudation of fluid).\n  Fetal      Chromosomal abnormalities                  Trisomy 18 & 21.\n                                             ↑ urine production: fetal anemia & fetal\n              High fetal cardiac output\n                                                            hydrops.\n                   Genetic errors         Bartter syndrome (renal tubular dysfunction).\n                                           Rubella, cytomegalovirus, toxoplasmosis &\n                   Fetal infection\n                                                           syphilis.\n                 Maternal diabetes                    One-quarter of cases.\nMaternal         Severe generalized\n                                                   Cardiac, renal or nutritional.\n                  maternal edema\n                Twin-twin transfusion\n                                              In monochorionic multiple gestation.\n                     syndrome\nPlacental\n                  Chorioangioma &\n                                                        Placental causes.\n                   large placenta\n   • Most common cause of severe polyhydramnios: fetal\n     anomalies (often associated with an underlying genetic\n     diagnosis).\n   • Milder cases: maternal diabetes, multiple gestation &\n     idiopathic factors.","fet",27],[1,"Complications of polyhydramnios","• Pressure Complications (uterine over-distension from\n  excessive amniotic fluid volume):\n  o Maternal respiratory compromise.\n  o Renal insult (pyelonephritis or pregnancy-induced\n    hypertension).\n• Premature Rupture of Membranes (PROM), associated with:\n  o Umbilical cord prolapse.\n  o Placental abruption (sudden ↓ of high intrauterine\n    pressure, IUP).\n  o Splanchnic shock (sudden ↓ of high IUP).\n  o Chorioamnionitis.\n• Preterm Labour: spontaneous or due to iatrogenic intervention.\n• Prolonged Labour: malpresentation & uterine inertia.\n• Postpartum Uterine Atony.\n• Perinatal Mortality: increased 2-5 fold.","fet",28],[1,"Clinical picture of polyhydramnios","      • Symptoms:\n        o History of the cause, e.g. DM or previous fetal malformation.\n        o Progressive abdominal enlargement; abdominal pain in\n          severe cases.\n        o Respiratory embarrassment (pressure on diaphragm &\n          lung restriction).\n        o Abdominal discomfort & lower limb edema.\n      • Signs:\n                               Signs of the cause (e.g. DM).\n General\n            Signs of complications: excessive weight gain, lower limb edema &\n                                      varicose veins.\n                      Fundal level above the date of amenorrhea.\n\n                    Difficulty palpating fetal parts & malpresentation.\n\n                 Abdominal skin glistening, stretched with dilated veins.\nAbdominal\n                                    May be +ve thrill.\n\n                    Pelvic grips: malpresentation & non-engagement.\n\n                       Auscultation: may be difficult or not heard.\n\n Pelvic        Cervix partially opened & bag of forewater bulging & tense.","fet",29],[1,"US diagnosis & severity of polyhydramnios","     • Diagnosis is based on sonographic visualization of increased\n       amniotic fluid.\n     • Thresholds: single deepest pocket (SDP) ≥ 8 cm;\n       amniotic fluid index (AFI) ≥ 25 cm.\n              Mild                Moderate                 Severe\nSDP       8 to 11.9 cm.          12 to 15.9 cm.            ≥ 16 cm.\nAFI        25 to 30 cm.          30.1 to 35 cm.            > 35 cm.\n      • AFI measurement:\n        o Uterus divided into 4 imaginary quadrants.\n        o Transducer kept parallel to the patient's longitudinal axis &\n          perpendicular to the floor.\n        o Deepest, unobstructed, vertical pocket measured in each\n          quadrant (cm).\n        o The 4 measurements are added = AFI.","fet",30],[1,"Post-diagnostic evaluation of polyhydramnios","• Comprehensive US: look for fetal anomalies, fetal hydrops,\n  twin-twin transfusion syndrome or chorioangioma.\n• Fetal chromosomal analysis: offered in all severe cases,\n  especially when congenital anomalies are detected.\n• Genetic testing: severe polyhydramnios with a normal\n  karyotype & US anomalies.\n• Screening for diabetes if not previously performed.\n• If fetal hydrops (immune or nonimmune evaluation):\n  o Fetal anemia: middle cerebral artery (MCA) Doppler.\n  o Work-up also includes fetomaternal hemorrhage, acute\n      parvovirus infection & hemoglobinopathy.\n• Screening for congenital infection if maternal signs &\n  symptoms or fetal findings suggest infection.","fet",31],[1,"Antepartum fetal monitoring in polyhydramnios","                                    Monitoring\n                  NST & BPP upon diagnosis, then every 1-2 weeks until 37\nMild - Moderate\n                       weeks, then weekly from 37 weeks to delivery.\n    Severe                  NST & BPP every week until delivery.","fet",31],[1,"Antenatal management of polyhydramnios","      • Management of the cause if possible, e.g. DM or\n        alloimmunization.\n      • Mild to moderate cases: expectant management with\n        conservative follow-up.\n      • Severe symptomatic polyhydramnios:\n    GA
