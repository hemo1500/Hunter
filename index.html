r:\n   • Impacted = cases of transverse lie, ROM & drained liquor,\n     uterus retracted over baby, obstructed labor, baby is living.\n   • Neglected = baby is dead.\n   • Maternal distress: tachycardia, dehydration, acidosis.\n   • Vulva & vagina are hot, dry, edematous, ballooned.\n   • Cervix is edematous & fully dilated.\n   • Prolapsed cyanosed arm and non-pulsating cord.\n   • Prophylaxis is the most important.\n   • Active TTT: correction of general condition & USCS.","abl",33],[26,"Define contracted pelvis.","• Anatomical definition: ≥ 1 pelvic diameter is below\n  average by ≥ 1 cm.\n• Obstetric definition: ≥ 1 pelvic diameter is small enough\n  to cause difficulty in vaginal delivery of average-sized\n  fetus.","abl",35],[26,"Define cephalopelvic disproportion.","• Disproportion between head & pelvis in cephalic\n  presentation.\n• Disproportion between fetus & pelvis in other\n  presentations.\n• Failure of 2 of the 3 Ps: passenger & passage.","abl",35],[26,"Enumerate degrees of contracted pelvis (classification). True conjugate   CPD         Relation              Fate","                                    head is flush with      normal\n  Minor      10-9 cm        none\n                                   inner surface of SP      delivery\n\n                                   head is flush with\nModerate      9-8 cm                                      trial of labor\n                             1st   outer surface of SP\n\n Severe       8-6 cm               head overrides outer\n                                                               CS\nExtreme       < 6 cm        2nd       surface of SP","abl",36],[26,"Mention etiology of contracted pelvis.","• Rickets & osteomalacia of pelvic bones.\n• Tumors & fractures of pelvic bones.\n• Lumbar kyphosis, scoliosis, spondylolisthesis.\n• Small gynecoid, android, anthropoid, platypelloid pelvis.\n• Congenital absence of one ala of sacrum (Naegele's).\n• Congenital absence of both alae of sacrum (Robert's).\n• High assimilation (6 sacral vertebrae) – Low assimilation (4\n  sacral vertebrae).\n• Poliomyelitis & TB of unilateral LL joints.","abl",36],[26,"How to diagnose contracted pelvis?","• History: bad obstetric history, history of the cause.\n• Examination: height < 150 cm, limping gait, pendulous\n  abdomen, jutting ischial spines in PV.\n• Pelvimetry.","abl",37],[26,"Mention types & interpretation of clinical pelvimetry.","• External outlet:\n     a. Bituberous diameter (transverse) = 11 cm.\n     b. Thom's rule = 15 cm.\n     c. Subpubic angle not less than 90 degrees.\n• Internal:\n     a. Diagonal conjugate = 12.5 cm (1.5 cm larger than true\n        conjugate).\n     b. Interspinous diameter & protrusion of ischial spines.","abl",37],[26,"Mention methods of radiological pelvimetry.","• Plain X-Ray: not done nowadays.\n• CT scan: preferred over X-Ray.\n• MRI: accurate & without ionizing radiation.\n• US fetal assessment: biparietal diameter, AC.","abl",37],[26,"Mention types of CPD clinical tests.","• Pinard's method: external.\n• Muller's test: internal.\n• Kerr's modification of Muller's: internal & external & more\n  accurate.","abl",37],[26,"Enumerate complications of contracted pelvis.","• Maternal:\n    a. Malpresentations & non-engagements.\n    b. Recurrent UTIs and pyelonephritis (back pressure).\n    c. RVF uterus and incarceration.\n    d. PROM and cord prolapse.\n    e. Prolonged & obstructed labor → uterine rupture.\n    f. PP Hge & puerperal sepsis.\n• Fetal:\n    a. Fetal asphyxia & death.\n    b. Birth injuries (ICH), fractures, Erb's palsy.\n    c. Fetal infections.","abl",38],[26,"Discuss management options of contracted pelvis.","• Minor: vaginal delivery.\n• Moderate: trial of labor or CS.\n• Severe: CS if living / craniotomy if dead.\n• Extreme: CS.","abl",38],[26,"Enumerate prerequisites of trial of labor (TOL) in contracted pelvis.","• Young healthy primigravida.\n• Cephalic presentation & 1st degree CPD.\n• No fetal distress or placental insufficiency.","abl",38],[26,"Enumerate contraindications of trial of labor in contracted pelvis = indications of CS.","• Elderly primigravida.\n• 2nd degree CPD (conjugate < 9 cm).\n• Posterior position & malpresentations.\n• Pelvis outlet contraction.\n• Previous CS scar & bad obstetric history.\n• Failure of previous TOL.","abl",39],[28,"Define abnormal uterine action.","• Abnormal contractile pattern of uterine musculature\n  prevents normal progress of labor.","abl",40],[28,"Mention classification of abnormal uterine action.","   • Hyperfunction: precipitate, obstructed.\n   • Uterine inertia: hypotonic, hypertonic.\n   • Incoordinate: contraction ring, cervical dystocia.\n\n► Precipitate labor:","abl",40],[28,"Define precipitate labor.","• Labor which started and completed in less than 4 hrs.","abl",40],[28,"Enumerate causes (risk factors) of precipitate labor.","• Small-sized baby: IUGR, PTL.\n• Soft lax birth canal & roomy pelvis (multipara).\n• Strong coordinated uterine contractions.\n• Cervical incompetence.\n• History of precipitate labor.","abl",40],[28,"Mention complications of precipitate labor.","• Maternal:\n    a. Lacerations of birth canal → traumatic pp hge.\n    b. Uterine exhaustion → atonic pp hge.\n    c. Retained placenta.\n    d. Acute inversion of uterus.\n    e. Puerperal sepsis.\n• Fetal:\n    a. Asphyxia & distress (avulsion of cord).\n    b. Intracranial hge.\n    c. Fetal injury (trauma).","abl",41],[28,"Mention TTT of precipitate labor.","   • If previous history: admission with rest.\n   • 1st stage: sedation & epidural analgesia.\n   • 2nd stage: no bearing down, perineal support, episiotomy.\n   • 3rd stage: ecbolics, genital tract exploration.\n   • PP: antibiotics, fetal examination.\n\n►Obstructed labor:","abl",41],[29,"Define obstructed labor.","• Failure of spontaneous delivery despite good uterine\n  contractions, because of mechanical obstruction.","abl",41],[29,"Mention etiology of obstructed labor.","• Maternal:\n    a. Contracted pelvis (50% most common).\n    b. Fibroids & ovarian & other soft tissue tumors.\n    c. Placenta previa centralis.\n    d. Contraction ring opposite fetal neck.\n• Fetal:\n    a. Macrosomia.\n    b. Malpresentations.\n    c. Multiple pregnancies.\n    d. Shoulder dystocia & neglected breech.","abl",42],[29,"Discuss CP of obstructed labor.","• History of prolonged labor.\n• Strong painful uterine contractions & persistent pain\n   between contractions.\n• ROM from long time & drained liquor.\n• Excessive maternal distress: tachycardia, tachypnea,\n   fever, dehydration, ketoacidosis.\n• Abdominal: hard tender uterus, molded over fetus /\n   Pathological Bandl's band is felt.\n• Fetal heart sounds & movements may not be felt.\n• Vaginal: hot dry edematous, high impacted presenting part.","abl",42],[29,"Enumerate complications of obstructed labor.","• Maternal:\n    a. PP Hge (ruptured uterus - atonic).\n    b. Puerperal sepsis.\n    c. PROM & Prolonged labor.\n    d. Necrotic vesicovaginal fistula.\n• Fetal:\n    a. Distress & asphyxia.\n    b. Trauma & Death.\n    c. Infections & ICH.","abl",43],[29,"Mention DD of obstructed labor.","• Contraction ring.\n• Full bladder.\n• Fundal fibroid.","abl",43],[29,"Discuss management of obstructed labor.","   • Prophylaxis (most important): proper ANC, partogram,\n     ecbolics, fluids, analgesia, antibiotics.\n   • Active:\n        a. Resuscitation.\n        b. CS: best.\n        c. Exploration of birth canal is mandatory.\n        d. Proper neonatal resuscitation.\n►Hypotonic uterine inertia:","abl",43],[28,"Define & mention types of hypotonic uterine inertia.","• Weak infrequent ineffective uterine contractions & of\n  short duration, leading to prolonged labor.\n• Primary: weak from start.\n• Secondary: dt uterine exhaustion after prolonged,\n  obstructed labor.","abl",44],[28,"Enumerate causes of hypotonic uterine inertia.","• Previous PP Hge – AP Hge.\n• Multipara (grand).\n• Malnutrition & anemia.\n• Multiple fibroids.\n• Malformed uterus.\n• Malpositions & Malpresentations.\n• Uterine overdistension.\n• Excessive anxiety & sedation.\n• Full bladder & rectum.","abl",44],[28,"Enumerate complications of hypotonic uterine inertia.","• Maternal:\n    a. Prolonged labor & exhaustion.\n    b. Traumatic injuries & lacerations.\n    c. PP Hge (atonic – retained placenta).\n    d. Puerperal sepsis.\n• Fetal: asphyxia, death, injuries, infections.","abl",44],[28,"Mention TTT of hypotonic uterine inertia.","   • Prophylaxis: reassurance, empty bladder & rectum, IV\n     glucose, antibiotics.\n   • Amniotomy if membranes are intact.\n   • Oxytocin: 10 units in 500 ml 5% glucose (dripping).\n   • CS: distress or failed dilation over 24 hrs.\n\n►Hypertonic uterine inertia:","abl",45],[28,"Enumerate types of hypertonic uterine inertia.","• Primary: both UUS & LUS ↑ tone.\n• Hypertonic LUS: reversed polarity, with OP position.\n• Uterine fibrillation (colicky).\n• Uterine tetany: generalized tonic retractions.","abl",45],[28,"Mention clinical features of hypertonic uterine inertia.","• Prolonged labor.\n• Irregular more painful uterine contractions.\n• High resting intrauterine pressure by tocography.\n• PROM & slow cervical dilatation.\n• Fetal & maternal distress.","abl",45],[28,"Mention TTT of hypertonic uterine inertia.","  • Avoid abuse of oxytocin.\n  • Sedatives & epidural anesthesia.\n  • Exclude malpositions.\n  • CS if distressed.\n► Constriction ring:","abl",45],[28,"Define constriction ring of Schroeder.","• Persistent, localized spasm of circular uterine muscles.\n• Around groove in body of fetus (neck).\n• Usually between upper & lower uterine segments.","abl",46],[28,"Mention predisposing factors of constriction ring.","• Malpositions & Malpresentations.\n• Misuse of ecbolics & repeated uterine manipulations.\n• Prolonged & obstructed labor.","abl",46],[28,"Compare constriction ring VS retraction ring.","               Constriction (Schroeder)        Pathological (Bandl's)\n                                            - During 2nd stage & always\n            - At any stage of labor & at\n                                            at junction between UUS &\nTime & Site any level of uterus\n                                            LUS\n            - Doesn't change its position\n                                            - Rising up\n\nExamination        Felt only vaginally        Felt & seen abdominally\n\n                                           - Hard & tender & tonically\n              - Relaxed & non-tender above\n                                           contracted above\n              - Neither thin nor distended\n  Uterus                                   - Thin & overdistended\n              below\n                                           below\n              - No risk of rupture\n                                           - Impending rupture\n                   Antispasmodics &\n   TTT                                           Only delivery\n                      anesthetics","abl",46],[28,"Mention TTT of constriction ring.","   • Sedatives, antispasmodics, anesthesia.\n   • 2nd stage (deep general anesthesia):\n         Relaxed ring → forceps delivery.\n         Not relaxed, failed forceps → CS vertical incision.\n\n  • 3rd stage: manual removal of placenta.\n\n►Cervical dystocia:","abl",47],[28,"Define cervical dystocia.","• Difficulty of labor dt failure of effective cervical dilation,\n  despite strong uterine contractions.","abl",47],[28,"Enumerate causes of cervical dystocia.","• Functional primary: affects external os only.\n• Secondary organic: scars, cerclage, fibroids, stenosis.","abl",47],[28,"Enumerate complications of cervical dystocia.","• Prolonged obstructed labor.\n• Distress mother & fetus.\n• Annular detachment of cervix.","abl",47],[28,"Mention TTT of cervical dystocia.","• Conservative: epidural analgesia.\n• CS:\n     Cervical stenosis dt fibrosis.\n     Organic obstruction of myoma.\n     Fetal distress.","abl",47],[34,"Definition of antepartum hemorrhage","• Bleeding from or in the genital tract, occurring from 24\n  weeks (Age of fetal viability) of pregnancy and prior to\n  delivery of the fetus.","aph",2],[34,"Mention causes of Antepartum hemorrhage","          Obstetric Causes                    Non-Obstetric Causes\n• Placental Hemorrhage: placenta     • Local causes in the genital\n  previa, placental abruption          tract: trauma, vaginitis,\n• Extra Placental Hemorrhage: genital cervical erosion, polyps or\n  trauma especially Uterine rupture    carcinoma.\n• Fetal Causes: vasa previa          • General causes of bleeding:\n• Unexplained APH                      liver failure, hypertension\n\n  ❖ Placenta Previa","aph",2],[36,"Definition of placenta previa","• Placenta that encroaches partially or totally on the lower\n  uterine segment (LUS).","aph",2],[36,"Mention Etiology of placenta previa","   Personal Character                  Obstetric Complications\n• Advanced maternal age • Recurrence\n• Multiparity              • Multifetal pregnancy: doubles in twins,\n• Cesarean section           triples in higher order.\n                           • Large placenta: bipartite or multipartite.","aph",3],[36,"What are the 2 most common risk factors of placenta previa","• Previous Cesarian section.\n• Multiparity.","aph",3],[36,"Mention pathogenesis of placenta previa","• Bleeding is by shearing forces on formation of LUS with\n  inelastic placenta → detachment .\n• Vaginal examination can cause bleeding .\n• Bleeding is maternal.","aph",3],[36,"Mention classification of placenta previa","         Minor Placenta Previa                Major Placenta Previa\n (within LUS, not covering internal os) (covering internal cervical os)\n• Low lying placenta: lower placental • Partially placenta previa:\n  edge encroaches on LUS but not           Placenta partially covers\n  reaching internal os, vaginal delivery internal os.\n  is allowed.                            • Total placenta previa:\n• Marginal placenta previa:                Placenta completely covers\n  Lower edge reaches but doesn’t           internal os.\n  cover margin of internal os.","aph",3],[36,"Mention classification of placenta previa according to AIUM","• Normal: placental edge >20 mm from internal os .\n• Low lying placenta: placental edge <20 mm from internal\n  os.\n• Placenta previa: placental edge cover internal os.","aph",4],[36,"Enumerate complications of placenta previa","            Maternal                             Fetal\n• Anemia, shock                     • Vasa previa\n• Recurrence                        • Velamentous insertion of\n• Amniotic fluid embolism             umbilical cord\n• Placenta accreta especially if on • Preterm labor\n  CS                                • IUGR, IUFD\n• Malpresentation and non           • Neonatal anemia and asphyxia.\n  engagement\n• PROMs\n• Post partum hemorrhage\n  (Atony, retained placenta)\n• Puerperal sepsis","aph",4],[36,"Mention 6 cardinal manifestation to placenta previa","• Painless, Causeless and Recurrent vaginal bleeding.\n• Symptoms of complications → anemia , shock.\n• Funda level = date of LMP except IUGR fundal level\n  becomes below LMP.\n• Fundal, umbilical grip: uterus is soft , not tender , fetal\n  parts are easily felt .\n• Pelvic grip: malpresentation and non engagement.\n• Fetal heart sounds: normal, distressed , absent according\n  to severity.\n• PV is contraindicated.","aph",5],[36,"Mention investigation of placenta previa","                   • TAS : initial placental localization\n                   • TVS: confirm diagnosis improve accuracy of\n  Ultrasound\n                     placental localization\n(Gold standard)\n                   • US can detect fetal weight ,IUGR .\n                   • Follow up for placental migration.\n                   • CBC, blood Grouping ,Rh, urine analysis,\n  Laboratory\n                     screening of DM\n                     • NST\n Tests of fetal\n                     • BPP\n  wellbeing\n                     • Doppler US","aph",5],[36,"Mention management of placenta previa","                  Conservative Management\n                 • Premature fetus, no fetal distress, no labor stable\n  Perquisites\n                   condition\n                 • Major previa admitted at 34 weeks .\n     Place\n                 • Minor previa: outpatient care.\n                • Maternal: bleeding, vital data ,labs\n   Follow Up\n                • Fetus: fetal wellbeing, fetal kicks\n                • Rest in left lateral position\n                • Hydration and nutrition\n Instructions , • Correction of anemia\n Interventions • Single course of antenatal corticosteroids between\n                  24 to 34 weeks\n                • Anti-D Ige if bleeding continues.\n                        Pregnancy Termination\n                              Mode of                Postpartum\n      Indications\n                            Termination              Management\n• Uncomplicated at 40\n  w ,accreta at 37 w.\n                        • Vaginal delivery in      Avoid PPH, Treat\n• Severe APH\n                          low lying placenta    anemia, Antibiotics, Anti\n• Fetal distress\n                        • CS                             D Ig\n• Severe PE, patient in\n  labor.","aph",6],[36,"Mention precautions before and during CS","• Cross-matched blood and blood products readily\n  available.\n• Consent for hysterectomy and possibility of bladder\n  injury.\n• Cell salvage where available.\n• Interventional radiology can be lifesaving.\n• Open the uterus at a site distant from the placenta (going\n  through the placenta → more bleeding, high chance of\n  hysterectomy).","aph",7],[36,"What's meant by placental migration and its explanation","• Definition: in early placenta previa, the placenta lies in the\n  LUS at the internal os; as the uterus grows, the LUS\n  stretches and the placenta moves away from the\n  internal os.\n• Explanation: during uterine growth the LUS stretches\n  from 0.5 cm to 10 cm.\n• Outcome: about 90% of early placenta previa cases\n  resolve by the third trimester.\n• Follow-up with US:\n  o Minor placenta previa → can be left until 36 wks.\n  o Major placenta previa → follow-up US at 32 wks.","aph",7],[36,"Mention Etiology of placenta accreta","   • Defective decidualization.\n                   • Placenta previa especially after CS (most\n Anatomical          common)\n factors           • Abnormal site of implementation (Uterine\n                     septum).\n                   • CS.\n Previous Uterine • Myomectomy.\n surgery           • D & C.\n                   • Asherman syndrome.\n                    • Maternal age > 35 years.\nOthers\n                    • IVF.","aph",9],[36,"Mention classification of placenta accreta","• Placenta accreta: villi are invading < 50 % of myometrium\n• Placenta increta: villi are invading > 50 % of myometrium\n• Placenta percreta: villi are perforating the Uterine wall.","aph",9],[36,"Describe clinical picture of placenta accreta","• During pregnancy: Asymptomatic (US funding).\n• Profuse Life threatening bleeding during manual placental\n  separation.\n• Placenta percreta with bladder invasion cause hematuria.","aph",9],[36,"Mention investigations for placenta accreta","• US and Doppler: no retroplacental hypoechoic zone,\n  prominent vessels or lakes in the placenta or myometrium.\n• MRI.","aph",10],[36,"Management of placenta accreta","• The same precautions before CS as placenta previa.\n• Then proceed for CS hysterectomy or\n  Conservative in the form of placenta is left Insitu +\n  antibiotics , supracervical incision with placental resection\n  followef by cervico- isthmic suturing and Uterine\n  devascularization.","aph",10],[35,"Define placental abruption","• Bleeding after 24 wks due to premature separation of a\n  normally situated placenta.","aph",11],[35,"Mention risk factors of placental abruption.","                  • age > 2.5 times > 40 years),\n    Personal\n                  • multiparity,\n   Character\n                  • smoking ( 2-folds) & cocaine\n                • PE (commonest conditions)\n    Medical\n                • Thrombophilias & folic acid deficiency\n   Disorders\n                • Preactamsia\n                • Preterm ROM & preterm labor\n                • Recurrence: recurrence rate is 5-17%)\n  Obstetric\n                  altar one episode, 25% after 2 episodes\nComplications\n                • Weak Implantation: Uterine anomaly or\n                  fibroid\n                • External trauma (hit)\n                • Obstetric (External cephalic version),\n   Trauma       • Rapid uterine decompression (ROM in\n                  polyhydramnios) & cord traction (short\n                  cord or precipitate labor)\n • The primary cause is idiopathic","aph",11],[35,"Mention pathogenesis of placental abruption","• Rupture of maternal vessels in decidua basalis\n• Bleeding which may be:\n  a) Small and self-limited\n  b) continue to dissect placental-decidual interface placental\n    separation.\n• The accumulating blood splits the decidua, separating a\n  thin layer of decidua with its placental attachment from the\n  uterus.","aph",12],[35,"Classification of placental abruption based on severity?","• Class 0: asymptomatic; diagnosed retrospectively by an\n  organized blood clot or depressed area on the delivered\n  placenta.","aph",12],[35,"Classification of placental abruption based on clinical types of bleeding","• Revealed: all bleeding appears vaginally from the start.\n• Concealed: all bleeding retained inside uterus →\n  retroplacental hematoma, no external bleeding. Due to\n  a) Blood accumulates behind placenta while its margins\n     remain adherent.\n  b) Adhesion between fetal membranes and uterus.\n  c) Deeply engaged presenting part (usually head).\n  d) High rupture of membranes with bleeding inside amniotic\n     sac.\n• Mixed: partially concealed and partially revealed (most\n  common).","aph",13],[35,"Mention investigation for abruptio placenta","• Imaging (US):\n  o Placental site to exclude previa (most important).\n  o Diagnosis of a retro-placental haematoma (Hypoechoic\n    area between the placenta & uterus) is not easy except if\n    haematoma is large (only in 20%)\n  o Other values of US: fetal weight - IUGR.\n• Laboratory:\n  o CBC, blood grouping, Rh type, coagulation profile (PT,\n    PTT, Fibrinogen & OPs), Kidney and liver functions, Urine\n    analysis & routine (screening of DM).\n• Tests of fetal wellbeing: NST, BPP, Doppler US.","aph",13],[35,"Mention complications of placental abruption","         • Anemia or shock\n         • Amniotic fluid embolism\n         • PPPH: Aloni (ischemic, Couvelaire & FDPS), DIC, rupture\n           uterus\n         • Couvelaire uterus (Uteroplacental Apoplexy)\n         • Extravasation of blood into uterine musculature and\n           beneath the uterine serosa may lead to pathological\n           ruptured uterus\nMaternal\n         • DIC release of thromboplastin, consumption of clotaing\n(↑ MMR)\n           factors in this hematoma, PE.\n         • Recurrence\n         • Renal fallure (acute cortical or tubular necrosis) due to\n           renal perfusion, emboli (from DiC), underlying disease\n           (PE) & renal glomerular injury by myoglobin released from\n           myometrium (Couvelaire utserus)\n         • Shock due to renal fallure, ARDS & multiorgan fallure\n         • Sheehan syndrome\n         • Preterm labor,\n Fetal & • IUGR (with chronic abruption),\nNeonatal • IUFD(when placental separation > 50%) and Neonate\n           (anemia & asphyxia)","aph",14],[37,"Mention Etiology of vasa previa","• Velamentous insertion of cord.\n• Bipartite or multipartite placenta.\n• Placenta succenturiate.\n• Low lying placenta.","aph",17],[37,"Discuss diagnosis of vasa previa","• Triad of mild vaginal bleeding associated with membrane\n  rupture and severe fetal distress (bradycardia – sinusoid\n  rhythm on CTG).\n• Antenatial: can be suspected if the abnormalities of the\n  placenta or the cord is diagnosed by US and the vessels\n  are seen by color Doppler US.","aph",17],[37,"Mention management of vasa previa","• Emergency CS If diagnosed before ROM → admission for\n  observation & Steroids then delivery by CS once mature.","aph",17],[38,"Define postpartum hemorrhage.","• Bleeding from genital tract after delivery till end of\n  puerperium that affecting maternal general condition\n  (>500 ml).","pph",2],[38,"Mention types of PP Hge.","• Primary: within 24 hrs of delivery\n    a. Tone: atony (90%).\n    b. Thrombosis (DIC).\n    c. Tissue (retained placenta).\n    d. Traumatic (lacerations).\n    e. Acute inversion of uterus.\n\n• Secondary: after 1st day till end of puerperium\n    a. Choriocarcinoma (most serious).\n    b. Retained fragments + infections.\n    c. Sepsis.\n    d. Subinvolution of uterus.","pph",2],[39,"Define atonic PP Hge.","• PP Hge because of weak contractility and retractility.\n• The most common cause of PP Hge.","pph",3],[39,"Enumerate causes of atonic PP Hge.","• During pregnancy:\n   o Anemia & previous AP Hge.\n   o Hypertension & PE.\n\n• Local causes of Uterus:\n  o Uterine overdistension.\n  o Grand multipara.\n  o Multiple fibroids.\n\n• Labor:\n  o Prolonged 1st & 2nd stages of\n  o Precipitate labor & retained placenta.\n  o Use of tocolytics.\n  o Excessive use of sedatives & deep anesthesia.","pph",3],[39,"Enumerate complications of atonic PP Hge","• Hemorrhagic shock.\n• Maternal mortality.\n• Sheehan's syndrome.\n• Acute renal failure.\n• Puerperal sepsis & DIC.","pph",3],[39,"Discuss treatment of atonic PP Hge."," • Prophylaxis: Proper ANC & control of predisposing factors.\n • Proper management of labor (3rd stage management is the\n    most important preventive measure).\n • Resuscitation:\n      a. ABC, oxygen, and IV lines.\n      b. Fluids & blood transfusion.\n      c. Vitals & CBC & other baseline labs.\n• 1st line: massage with ecbolics\n     a. Slow firm rotatory movements with abdominal compression.\n     b. 20 units oxytocin by dripping.\n     c. Ergometrine or PGs.\n• 2nd line: exploration of birth canal under GA\n     a. Remove any                           b. Repair of any tears.\n        fragments.\n• 3rd line: bimanual compression of uterus\n     a. Right fist in ant. fornix & left hand abdominally.\n     b. Continued for 15 min & repeated.\n• 4th line: balloon tamponade\n     a. Bakry balloon or Foley catheter filled with 200-500 ml\n        saline & inflated.\n• 5th line: laparotomy\n     a. Supravaginal hysterectomy.\n     b. Bilateral uterine / internal iliac artery ligation.\n     c. B-Lynch sutures.","pph",4],[40,"Mention causes of perineal lacerations.","• Overstretch of perineum: macrosomia, malpresentation,\n  extension before crowning.\n• Rapid stretch of perineum: breech, precipitate labor.\n• Rigid perineum in elderly primigravida.\n• Instrumental injury.","pph",5],[40,"Enumerate degrees of perineal lacerations.","• First: vaginal wall & perineal skin.\n• Second: + perineal muscle ± levator ani.\n• Third: + external anal sphincter.\n• Fourth: + rectal mucosa or anal canal.","pph",5],[40,"Enumerate complications of perineal lacerations.","• PP Hge & puerperal sepsis.\n• Prolapse & stress incontinence.\n• Fecal incontinence.\n• Improper healing & residual rectovaginal fistula.\n• Tender scar & dyspareunia.\n• Recurrent genital infections & leucorrhea.","pph",5],[40,"Discuss TTT of perineal lacerations.","   • First degree: suture repair if severe bleeding.\n   • Second: necessary suture repair.\n   • Third & Fourth: mandatory layered suture repair.\n   • Prophylactic antibiotics & use antiseptic washings.\n\n             • Rectal wall: 2 layers interrupted sutures.\n             • External anal sphincter: figure of 8 suture.\n             • Levator ani: interrupted sutures.\n             • Vagina: from above downward, interrupted or\n               continuous.\n             • Superficial muscles & Skin: interrupted\n               sutures.\n►Vaginal lacerations:","pph",6],[40,"Mention complications of vaginal lacerations.","• Severe bleeding & colporrhexis.\n• Vesicovaginal fistula or incontinence.\n• Rectovaginal fistula or incontinence.\n• Broad ligament hematoma & prolapse.\n• Vaginal stenosis & dyspareunia.\n• Repeated infections & abscess formation.","pph",6],[40,"Mention TTT of vaginal lacerations.","   • Immediate repair from above downward.\n   • Vaginal packs & catheter & antibiotics.\n   • If failed: bilateral internal iliac ligation.\n► Cervical lacerations:","pph",6],[40,"Enumerate causes of cervical lacerations.","• Macrosomia.\n• Precipitate labor.\n• Cervical fibrosis & rigidity.\n• Instrumental delivery.","pph",7],[40,"Enumerate types of cervical lacerations.","• Minor unnoticed (common).\n• Unilateral more in left.\n• Bilateral.\n• Stellate.\n• Annular detachment in obstructed labor.","pph",7],[40,"Mention complications of cervical lacerations.","   • Extension up: rupture uterus.\n   • Extension anterior: bladder involvement.\n   • Extension lateral: uterine vessels, ureters.\n   • Cervical incompetence → recurrent abortion.\n   • Ectropion & chronic cervicitis.\n►Rupture Uterus:","pph",7],[40,"Mention types of uterine rupture.","• Scar dehiscence.\n• Complete: all layers + peritoneum (80%).\n• Incomplete: doesn't involve visceral peritoneum (20%).","pph",8],[40,"Enumerate causes of uterine rupture.","• During pregnancy:\n   a. Rupture of previous CS scar (commonest).\n   b. Other scars as myomectomy and hysterotomy.\n   c. Severe concealed accidental hge.\n   d. Placenta increta & percreta.\n   e. Sacculation of uterus.\n   f. Perforating vesicular mole.\n\n• During labor:\n   a. Obstructed labor (commonest).\n   b. Ruptured scar.\n   c. Vigorous manipulation & instruments.\n   d. Manual removal of placenta.\n   e. Improper use of oxytocin and PGs.","pph",8],[40,"Mention factors affecting integrity of uterine scar.","• Site: LUS scar is safer.\n• Type: myomectomy multiple scars more prone to rupture.\n• Improper closure of edges & single layer sutures.\n• Postoperative infections (endometritis).","pph",8],[40,"Mention factors causing weakness of uterine scar.","• Imperfect sutures & hemostasis, infection.\n• Erosion of scar dt placenta implanted over it.\n• Repeated scar ≥ 2.\n• Uterine overdistension ↑ intrauterine pressure.","pph",9],[40,"Discuss clinical picture of uterine rupture.","• Impending rupture of scar during pregnancy:\n     a. Lower abdominal pain & tender scar & vaginal\n        spotting.\n     b. Gapping of scar edges by US.\n\n• Actual rupture during pregnancy:\n    a. Sudden severe abdominal pain & collapse.\n    b. Vaginal bleeding & intraperitoneal hge.\n    c. Fetal parts are easily felt separated from uterus.\n    d. Fetal distress or death.\n\n• Rupture during obstructed labor:\n    a. Cessation of labor pain & fetal movements.\n    b. Sudden severe abdominal pain & collapse.\n    c. Vaginal bleeding & edema.\n\n• Traumatic rupture during labor: after instruments used or\n  obstetric operation.","pph",9],[40,"Enumerate complications of uterine rupture.","• Hge & all its complications.\n• Hysterectomy.\n• Sepsis, DIC & amniotic fluid embolism.\n• Broad ligament & retroperitoneal hematoma.\n• Bladder, ureteric, intestinal injuries.\n• 10-40% maternal mortality rate.\n• 50-60% perinatal mortality rate with incomplete, 100%\n  with complete rupture.","pph",10],[40,"Mention management of uterine rupture.","• Resuscitation.\n• Midline laparotomy & Supravaginal hysterectomy.\n• Bilateral internal iliac arteries ligation.\n• Exploration & repair of associated injuries.\n• Conservative uterus repair may be done in limited cases.","pph",10],[41,"Define retained placenta","• Placenta fails to be expelled within 30 minutes after fetal\n  delivery.","pph",12],[41,"Mention causes of retained placenta","  Separated but retained            Adherent placenta\n• Uterine Atony.             • Uterine atony.\n• Contraction ring.          • Placenta accreta / increta /\n• Complete rupture uterus.     percreta.\n                             • Placenta previa.\n                             • Previous CS.","pph",12],[41,"Discuss C/P of retained placenta","• No placental expulsion for 30 min.\n• Vaginal bleeding:\n      o Not separated → no bleeding.\n      o Completely separated → minimal bleeding.\n      o Partially separated → massive bleeding.\n• General: Shock.\n• Picture of the cause:\n     a. Atony: lax uterus.\n     b. Contraction ring: Good uterine tone + Hour- glass\n        contraction.\n     c. Rupture uterus: feel the tear.\n     d. Absence of plane of cleavage: placenta accreta.","pph",12],[41,"Mention complications of retained placenta","• Shock: hemorrhagic or idiopathic obstetric shock\n   (neurogenic).\n• Postpartum hemorrhage.\n• Puerperal sepsis.\n• Subinvolution of the uterus.\n• Placental polyp and choriocarcinoma.\n• Complications of the management: anesthesia.","pph",13],[41,"Discuss the management of retained placenta case","• 3rd stage:\n     o Modified Brandt's Andrews method under GA +\n        Uterine massage + Ecbolics.\n\n• If failed → Manual removal of placenta under GA:\n      o Separate the placenta by a sawing movement while\n         the fundus is steadied by the left hand on the\n         abdomen, Inspect placenta for any missing fragment.\n\n• If failed → management of the cause:\n      o Uterine atony - ruptured uterus- Placenta accrete -\n         constriction ring.","pph",13],[41,"Mention complications of manual removal of placenta","• Uterine atony: give ergometrin and massage the uterus.\n• Puerperal sepsis: Strict asepsis and prophylactic\n   antibiotics\n• Perforation of the uterus.","pph",13],[42,"Definition of DIC","• Paradoxical situation: thrombotic + fibrinolytic mechanisms\n  activated simultaneously → intravascular coagulation +\n  hemorrhage at the same time.","pph",14],[42,"Discuss etiology of DIC","• Common Causes:\n  o Placental abruption (hematoma → Consumption of fibrin).\n  o Massive blood loss with inadequate replacement\n  o Severe pre-eclampsia, eclampsia or HELLP syndrome\n\n• Rare Causes: Sepsis, retained dead fetus (>3-4 weeks),\n  Amniotic fluid embolism, Acute fatty liver of pregnancy, Adult\n  Respiratory Distress syndrome, Acute hemolytic transfusion\n  reactions & Autoimmune disease","pph",15],[42,"Mention C/P of DIC","• Postpartum or antepartum hemorrhage.\n• Persistent bleeding from venipuncture sites or after catheter\n  insertion.\n• Spontaneous bleeding from gums and nose.\n• Generalized oozing in surgical fields.\n• Purpuric areas (thrombocytopenia & incoagulable blood).","pph",15],[42,"Investigations of DIC","                                         Normal clot: 3-8 min\n       Weiner Test\n                                Clot forms later + dissolves within 1 hr →\n   (Clot Observation)\n                                         hypofibrinogenaemia\n5-10 cc of blood in a tube at\n           37 °C                      No clot → afibrinogenemia\n\n    Plasma Fibrinogen                          < 150 mg%\n\n           FDPs                      > 40 µg% → suggestive of DIC\n\n         D-Dimer                               > 0.5 mg%\n\n                                Increased\n      Bleeding Time                           (N = 2-4 min)\n       Clotting Time                         (N = 6-12 min)\n             PT                               (N = 12 sec)\n\n            PTT                             (N = 35-45 sec)\n\n                                Decreased\n      Platelet Count                   (N = 150,000-400,000/µL)","pph",16],[42,"Treatment of DIC","• Correction of the cause is the most important issue.\n• Correction of coagulation profile:\n  1. Transfuse fresh frozen plasma: If Prothrombin time is > 1.5\n     times the control. The goal is to keep PT within 2-3\n     seconds of the control.\n  2. Cryoprecipitate OR Fibrinogen: If fibrinogen level is < 100\n     mg/dl.\n  3. Platelets: if <20000/cmm or bleeding with a platelets\n     between 20000 - 50000/cmm.\n  4. Antifibrinolytics: as Epsilon Amino Caproic Acid OR\n     trasylol 2-4 ampoules IV (5 ml ampoule contains 25000\n     U), is not given unless all measures fail to control bleeding.\n  5. Heparin infusion is condemned when the vascular system\n     integrity is compromised.","pph",17],[43,"Discuss etiology of Acute inversion of uterus","     Spontaneous                   Induced (Commonest)\n• Precipitate labor.      • Crede's method.\n• Very short cord.        • Traction on cord (if placenta is\n• Vigorous straining /      adherent).\n  coughing.               • 3. During manual removal of placenta\n                            (can also occur during CS).","pph",18],[43,"Discuss degrees of uterine inversion","1) 1st degree: the fundus uteri is depressed but does not pass\n   through the cervix\n2) 2nd degree: the fundus protrudes through the cervix\n3) 3rd degree: total uterine inversion, protruding outside the\n   vulva.","pph",18],[43,"Discuss C/P of uterine inversion","❖ Symptoms: Pain - bleeding (usually massive) - shock -\n   Mass protruding from the vulva in 3rd degree\n❖ Signs:\n     1. Generally: shock (hemorrhagic or neurogenic)\n     2. Abdominally:\n        - Cupping of the fundus (in 1st and 2nd degree)\n        - Absent uterus (in 3rd degree)\n     3. Vaginally: a soft purple mass is\n        - Felt in the vagina (in 2nd degree)\n        - Seen at the vulva (in 3rd degree)","pph",18],[43,"Mention management of uterine inversion","• Prophylaxis.\n• Resuscitation.\n• Active:\n    ▪ Manual reposition with the palm of the hand or by\n       hydrostatic pressure under GA (preferably halothane\n       to relax the uterus).\n    ▪ Tocolytics as ritodrine is given to help reposition\n       then ecbolics after reposition.\n    ▪ If the placenta is still attached, it is removed to\n       facilitate reposition of the uterus.\n    ▪ In a minority of patients, the above procedures fail→\n       Laparotomy for surgical correction is needed.","pph",19],[45,"Mention types and causes of shock in Obs","     Type                           Causes\n                 • Anemia & malnutrition.\n                 • Bleeding in early pregnancy / antepartum He /\nHypovolemic        PPhge.\n                 • Prolonged labor with dehydration and acidosis.\n                 • Hypertensive state with pregnancy.\n                 • Ectopic pregnancy\n                 • Concealed accidental He\n                 • Acute inversion of uterus.\nNeurogenic\n                 • Rupture of uterus.\n                 • Retained placenta.\n                 • Violent and using Crede’s method.\n                 • Rapid evacuation of uterine content as in\nSplanchnic\n                   polyhydramnios & precipitate labor.\n                 • Pressure overload / volume overload / heat\nCardiogenic\n                   disease.\n                 • Septic abortion.\n                 • Chorioamnionitis.\nSeptic\n                 • Puerperal sepsis.\n                 • Pyelonephritis.\nTrue obstetric   • Acute adrenocortical failure\nshock            • AFE","pph",20],[45,"Mention clinical features of shock","• Hypotension (BP 50-60mmHg or < 100mmHg).\n• Tachypnea & tachycardia.\n• Oliguria.\n• Subnormal temperature.\n• Pallor & cyanosis.\n• Dimness of vision and maternal confusion.","pph",21],[45,"Mention complications of shock","• Fetal asphyxia.\n• Complications of blood transfusion.\n• DIC.\n• Maternal mortality.\n• Acute renal failure.","pph",21],[45,"Difference between neurogenic & hemorrhagic shock Neurogenic shock                    Hemorrhagic shock","                                      Patient is restless and anxious\n   Patient quiet and apathetic\n                                               with air hunger\nNo external or internal bleeding       External or internal bleeding\nSuperficial veins are full of blood   Superficial veins are collapsed\n      Hemoconcentration                       Hemodilution\n           Slow pulse                     Weak and rapid pulse\n Slow and shallow respiration         Rapid and shallow respiration","pph",21],[45,"Mention prevention and treatment of shock","❖ Prevention: proper ANC, intranatal care & postpartum care.\n\n❖ 1st aid measurement & resuscitation:\n     • Establishment of IV lines: Insert 2 large wide pore\n        cannulas & CVP catheter.\n     • Patent airway with good oxygenation.\n     • Elevation of legs: ↑ VR from limbs to central\n        circulation.\n     • Warming of patient.\n\n❖ Antishock measures:\n  ➢ Relief of pain & fear: By pethidine or morphine.\n  ➢ Restoration of blood volume:\n    • Cross matched fresh blood transfusion.\n    • IV fluids (crystalloid solutions as lactated Ringer &\n       saline).\n    • Drugs: Corticosteroids & isotropic drugs.\n    • Blood components commonly transfused in obstetrics\n       (whole blood, packed RBCs, FFP, cryoprecipitate,\n       platelets).\n    • Insertion of urinary catheter & monitoring of urine\n       output.\n    • Lab investigations: CBC, coagulation profile, blood\n       gases & serum creatinine.\n    • Detect & treat the cause.","pph",22],[46,"Mention types of obstetric trauma","  • Maternal:\n Genital tract       • Tissue lacerations: Perineal – vaginal\n trauma                – cervical – uterine.\n                     • Hematoma: Vulval – vaginal – broad\n                       ligament.\n                     • Tissue necrosis.\n                     • Bucket handle tear of cervicx, necrotic\n                       fistula.\n Non genital tract • Injuries of pelvic joints & bones.\n (due to forceps)    • Rupture Symphysis pubis, coccyx,\n                       sacro-iliac ligament.\n                     • Hematoma of rectus abdominus\n                       muscle\n  • Fetal:\nHead injury         Intracranial Hge, fractures of the skull.\nPeripheral nerve    Brachial plexus, facial, phrenic nerve palsy.\nMusculo-skeletal    Fracture clavicle.\n                    Sternomastoid, head, abdominal organs\nSoft tissue\n                    lacerations.","pph",23],[46,"Give short note about hematoma of rectus abdominus muscle","• Etiology: rupture of deep epigastric vessels.\n• More common in multi-Para.\n• May occur after cesarean section.\n• C/P → sudden severe pain with or without shock.","pph",24],[46,"Enumerate the long-term complications of obstetric trauma","• Vagina: dyspareunia, fistula.\n• Cervix: chronic infection, infertility.\n• Uterus: hysterectomy, rupture uterus, ureteric\n  compression.\n• Levator ani: prolapse, incontinence.","pph",24]],"m":[[0,"Normal baseline fetal heart rate at term is:",["90–110 bpm","110–160 bpm","160–180 bpm","180–200 bpm"],1,"Normal baseline FHR is 110–160 bpm. Below 110 is bradycardia, above 160 is tachycardia."],[0,"A reactive NST requires within 20 minutes:",["1 acceleration of 10 bpm for 10 s","2 accelerations of ≥15 bpm lasting ≥15 s","2 late decelerations","Absent variability"],1,"Reactive NST = at least 2 accelerations of ≥15 bpm for ≥15 seconds in 20 minutes (term fetus)."],[0,"Which is NOT a component of Manning's biophysical profile?",["Fetal breathing movements","Fetal tone","Amniotic fluid volume","Maternal blood pressure"],3,"BPP = NST, fetal breathing, fetal movements, fetal tone and amniotic fluid volume."],[1,"Polyhydramnios on US is diagnosed when the deepest vertical pocket is:",["≥ 2 cm","≥ 5 cm","≥ 8 cm","≥ 15 cm"],2,"DVP ≥ 8 cm (or AFI ≥ 24–25 cm) means polyhydramnios."],[1,"Which fetal anomaly is classically associated with polyhydramnios?",["Renal agenesis","Esophageal atresia","Posterior urethral valve","Potter syndrome"],1,"Fetal swallowing is impaired in esophageal atresia, so fluid accumulates. Renal anomalies cause oligohydramnios."],[1,"A sudden function totals(){

  for(const e of S.entries){if(e.stat&&s[e.stat]!==undefined)s[e.stat]+=e.xp;xp+=e.xp;gold+=e.gold;}

}
function lvl(xp,need){let l=1,r=xp;while(r>=need(l)){r-=need(l);l++;}return {l,cur:r,need:need(l)};}

function compact(){
  if(S.entries.length<=700)return;
  const cut=dayKey(daysAgo(45)),keep=[];
  S.entries.forEach(e=>{
    if(e.day<cut&&e.kind!=='unit'&&e.kind!=='boss'){

}

async function connect(){

    const db=await window.claude.use('db');
    const user=await window.claude.use('user');

    if(!db||!id){setSync('local','محفوظ على الجهاز');return;}
    ctx.db=db;ctx.uid=id;onlineInit();hubInit();

    const ref=db.doc('data/users/'+id+'/state');
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('t')),7000));
    const snapd=await Promise.race([ref.get(),timeout]);
    if(snapd.exists){
      const remote=snapd.data();
      if((remote.rev||0)>(S.rev||0)){
        S=remote;migrate();
        try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
        ctx.ref=ref;render();

function finishGate(){

function tick(){
  liveTick();
  if(ui.day!==dayKey()){ui.day=dayKey();render();return;}
  const t=S.timer;if(!t)return;
  const left=t.end-Date.now();
  if(left<=0){finishGate();return;}
  const ar=$('#ringArc'),tm=$('#ringTime');
  if(ar){const circ=2*Math.PI*104;ar.style.strokeDashoffset=(circ*(1-(1-left/(t.end-t.start)))).toFixed(1);}
  if(tm){const s=Math.ceil(left/1000);tm.textContent=z2(Math.floor(s/60))+':'+z2(s%60);}
}

function bar(cur,need,c){return '<div class="bar" style="--c:'+(c||'var(--glow)')+'"><b style="width:'+Math.max(2,Math.min(100,cur/need*100)).toFixed(1)+'%"></b></div>';}

function radar(T){
  const cx=150,cy=125,R=86;
  const lv=STATS.map(s=>lvl(T.s[s.id],needStat).l);
  const cap=Math.max(5,Math.max.apply(null,lv)+1);
  const ang=i=>-Math.PI/2+i*2*Math.PI/5;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  const poly=f=>STATS.map((s,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  let g='';
  [1/3,2/3,1].forEach(f=>{g+='<polygon points="'+poly(f)+'" fill="none" stroke="rgba(94,194,255,.22)" stroke-width="1"/>';});
  STATS.forEach((s,i)=>{const p=pt(i,R);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(94,194,255,.18)"/>';});
  const dp=STATS.map((s,i)=>pt(i,R*lv[i]/cap).map(v=>v.toFixed(1)).join(',')).join(' ');
  g+='<polygon points="'+dp+'" fill="rgba(94,194,255,.24)" stroke="#5ec2ff" stroke-width="2" filter="url(#gl)"/>';
  STATS.forEach((s,i)=>{const p=pt(i,R*lv[i]/cap);g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+s.c+'"/>';});
  STATS.forEach((s,i)=>{
    const p=pt(i,R+24);
    g+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:3)).toFixed(1)+'" text-anchor="middle">'+s.name+'</text>';
    g+='<text class="nn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:3)+15).toFixed(1)+'" text-anchor="middle">'+lv[i]+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 300 262" role="img" aria-label="مخطط القدرات"><defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+g+'</svg>';
}

const LT={out:'مصروف',in:'دخل',save:'توفير',inv:'استثمار'};
const LSUB={out:['أكل','مواصلات','سكن','دراسة','اشتراكات','ترفيه','المشروع','أخرى'],in:['راتب','شغل جانبي','أخرى'],save:['طوارئ','عام'],inv:['أسهم','ذهب','شهادات','أخرى']};
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const monthOf=k=>k.slice(0,7);
function ledgerSum(mk){
  const o={in:0,out:0,save:0,inv:0,nonSalary:0,cats:{}};
  S.ledger.forEach(t=>{
    if(monthOf(t.day)!==mk)return;
    o[t.type]+=t.amt;
    if(t.type==='in'&&t.sub!=='راتب')o.nonSalary+=t.amt;
    if(t.type==='out')o.cats[t.sub]=(o.cats[t.sub]||0)+t.amt;
  });
  return o;
}
function efInfo(){
  const saved=S.ledger.filter(t=>t.type==='save'&&t.sub==='طوارئ').reduce((a,t)=>a+t.amt,0);
  const mons={};
  S.ledger.forEach(t=>{if(t.type==='out'){const m=monthOf(t.day);mons[m]=(mons[m]||0)+t.amt;}});
  const keys=Object.keys(mons).sort().slice(-3);
  const avg=keys.length?keys.reduce((a,k)=>a+mons[k],0)/keys.length:0;
  return {saved,avg,target:avg*3};
}

   Power comes only from real progress: stat levels, overall level, and shadows.
   Shadows are derived from achievements; fighting gives no XP or gold. */
const ARCH={code:'ساحر الكود',create:'رامي العدسة',money:'حارس الخزنة',study:'فارس المعرفة'};
function shRank(p){return p>=220?'S':p>=160?'A':p>=110?'B':p>=70?'C':p>=40?'D':'E';}
function dDiff(a,b){const x=a.split('-'),y=b.split('-');return Math.round((new Date(+y[0],+y[1]-1,+y[2],12)-new Date(+x[0],+x[1]-1,+x[2],12))/864e5);}
function bestStreak(){
  const c=countsByDay(),ks=Object.keys(c).filter(k=>c[k]>=3).sort();
  let best=0,run=0,prev=null;
  ks.forEach(k=>{run=prev&&dDiff(prev,k)===1?run+1:1;best=Math.max(best,run);prev=k;});
  return Math.max(best,S.army.bestStreak||0);
}
function shadows(){
  const out=[],T=totals();
  EXAMS0.forEach(ex=>{
    if(bossBeaten(ex.id)){const w=examStats(ex).total;out.push({id:'bs_'+ex.id,name:'جنرال '+ex.title,p:Math.min(260,150+Math.round(w/4)),src:'هزمت زعيم امتحان '+ex.title+' ('+ex.sub.split(':')[0]+')'});}
  });
  STATS.forEach(st=>{
    const L=lvl(T.s[st.id],needStat).l;
    for(let m=5;m<=L;m+=5)out.push({id:'st_'+st.id+'_'+m,name:'جندي '+st.name,p:20+m*6,src:'وصلت مستوى '+m+' في '+st.name});
  });
  Object.keys(GX).forEach(x=>{const rk=gyRank(x,gyBest(x).v);for(let r=2;r<=rk;r++)out.push({id:'gy_'+x+'_'+r,name:'حارس '+GX[x].n,p:[0,0,40,70,110,170][r],src:'رتبة '+ERK[r]+' في '+GX[x].n});});
  {const lm=lnMast();for(let k=1;k<=Math.floor(lm/20);k++)out.push({id:'ln_'+k,name:'حارس الكلمات '+k,p:Math.min(120,15+k*10),src:(k*20)+' كلمة متثبتة في الإنجليزي'});}
  S.mv.goals.forEach(g=>{if(g.done)out.push({id:'mg_'+g.id,name:'ظل '+g.n,p:40,src:'حققت هدف ادخار'});});
  S.rd.bk.forEach(b=>{if(b.boss)out.push({id:'bk_'+b.id,name:'ظل '+b.t,p:50,src:'هزمت زعيم الكتاب'});});
  STORIES.forEach(st=>{if(rdFound(st)===rdEnds(st).length)out.push({id:'st_'+st.id,name:'ظل '+st.t,p:60,src:'فتحت كل نهايات القصة'});});
  const bs=bestStreak();
  [[7,60],[14,100],[30,180],[60,240]].forEach(x=>{if(bs>=x[0])out.push({id:'sr_'+x[0],name:'حارس السلسلة',p:x[1],src:x[0]+' يوم متتالي'});});
  out.forEach(x=>x.r=shRank(x.p));
  return out.sort((a,b)=>b.p-a.p);
}
function power(){
  const T=totals(),A=lvl(T.xp,needAll);let sl=0;
  STATS.forEach(x=>sl+=lvl(T.s[x.id],needStat).l);
  const sh=shadows(),sp=sh.reduce((a,x)=>a+x.p,0);
  return {stats:sl*12,lvl:A.l*15,sh:sp,n:sh.length,list:sh,total:sl*12+A.l*15+sp,T};
}

const TIERS=['','المتطور','المدرّع','الأسطوري','الملكي'];
function monster(f){
  const i=(f-1)%10,t=Math.floor((f-1)/10),b=MON[i],boss=i===9;
  let p=50*Math.pow(1.15,f-1);if(boss)p*=1.25;

function fight(){
  if(ui.battle&&!ui.battle.done)return;
  const m=monster(S.army.floor),pw=power(),e=effPower(m,pw),win=e.p>=m.p;
  const fP=win?Math.max(8,Math.round(100-85*m.p/e.p)):0,fM=win?0:Math.max(8,Math.round(100-85*e.p/m.p));
  S.army.log.push({f:m.f,win,d:dayKey(),p:e.p,mp:m.p});
  if(S.army.log.length>30)S.army.log=S.army.log.slice(-30);
  if(win){S.army.floor++;S.army.best=Math.max(S.army.best||0,m.f);}
  save();
  const names=pw.list.slice(0,6).map(x=>x.name);
  ui.battle={m,P:e.p,win,fP,fM,cP:100,cM:100,line:'بدأ القتال',done:false,names,need:m.p-e.p,adv:win?'':advice(m,pw,m.p-e.p)};
  render();
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const R=rm?1:5;let k=0;
  const stepf=()=>{
    const b=ui.battle;if(!b||b.done)return;
    k++;
    b.cM=Math.round(100-(100-b.fM)*k/R);b.cP=Math.round(100-(100-b.fP)*k/R);
    const who=b.names.length?b.names[(k-1)%b.names.length]:'أنت';
    b.line=k===R?(b.win?'الضربة القاضية من '+who:'الوحش أقوى منك المرة دي'):(k%2?'هجوم من '+who:'الوحش بيرد الهجوم');

    if(a)a.style.width=Math.max(0,b.cM)+'%';if(c)c.style.width=Math.max(0,b.cP)+'%';if(l)l.textContent=b.line;
    if(sv){sv.classList.remove('hit');void sv.getBoundingClientRect();sv.classList.add('hit');}
    if(k<R)setTimeout(stepf,rm?0:700);
    else setTimeout(()=>{b.done=true;if(ui.tab==='army')render();
      if(b.win&&b.m.boss)queue.push({k:'[ إشعار النظام ]',t:'سقط ملك الطابق',b:b.m.f,s:'وصلت لمنطقة جديدة في البرج'});

}

const QU=[[138,"Endometrial hyperplasia: definition, classification, clinical picture, investigations and treatment","•Def: Hyperplasia of endometrial glands & stroma due to unopposed estrogen.\n•classification:\n1.Simple hyperplasia (hypertrophy)→Dilated cystic glands + ↑stroma (Swiss cheese), 1% malignancy risk\n2.Complex hyperplasia→ Crowded & folded glands with no stroma in between (back to back), 3% malignancy risk\n3. Atypical hyperplasia→ large dark nuclei, thick nuclear membrane& little cytoplasm, malignancy risk of Atypical simple → 8%, Atypical complex → 30%\n•C/P\nSymptoms: perimenopausal bleeding\nSigns: symmetrically enlarged uterus\n•inv: U/S (endometrium ≥ 5mm), D&C or hysteroscopy\n•ttt\n1. Old age or atypia→ Hysterectomy is ideal\n2. Young: •Hormonal therapy for simple or complex hyperplasia without atypia in young →\nProgestin (norethisterone acetate 10-30 mg/day or MPA 10-20/day) + periodic US / biopsy\n•If needing fertility→ induction of ovulation","g1",2,"PI"],[141,"Cervical intraepithelial neoplasia (CIN): definition, etiology, fate, pathology and classification","•Def:Malignant change of cx epithelium in part/all of its thickness , no invasion of basement membrane,can progress to invasive cancer\n•Etiology: -Age: 20-40 years - low socio-economic\n-Race:black races, less in Moslems & Jewish (genetic factors)\n- multiparity -Smoking -drugs (COC) - familial\n-Sexual activity if: Early age of 1st coitus (<18) as SCJ is near to external os, With multiple partners (↑ STD's)\n-Infections (oncoviruses): HPV 16 (50%), 18 (20%) (6, 11 lead to condyloma accuminata), HIV ,HSV 2 is isolated in cx cancer cells\n•Fate of CIN: Spontaneous clearance of HPV within 9-15 months but minority of cases progress to CIN & cancer (in 5-15 years).\n•Pathology: -Sites: SCJ in 80-85% (usually multifocal) while endocervix 15%\n-Assessment of atypia: 1. Architectural atypia: loss of polarity\n2. Cellular atypia: ↑nuclear/cytoplasmic ratio, hyperchromatic nucleoli, irregular nuclear membrane, ↑mitotic figures a)Mild dysplasia (CIN I): abnormal cells in Deep 1/3 only, progress to cancer (0-25%) b) Moderate dysplasia (CIN II): Deep 2/3, progress (25-50%) c) Severe dysplasia (CIN III): whole thickness, progress (75-100%)\n-Bethesda system \"Squamous Intraepithelial Lesion (SIL)\"\n1. LSIL (low-grade SIL): CIN 1 & HPV cytopathic effect\n2. HSIL (high-grade SIL): CIN 2 & CIN 3\n3. ASC (atypical squamous cells) classified into: a)ASC-US: atypical squamous cells of undetermined significance. b)ASC-H: ASC in which high-grade lesions can't excluded\n4. AGC: atypical glandular cells\n-Lower Anogenital Squamous Terminology (LAST-2012) project\n: classified HPV lesions acc to p16 immunostaining (+ve or -ve)","g1",2,""],[138,"Evolution, classification and significance of endometrial hyperplasia","•evolution: 1-unopposed estrogen exposure\n2- ↑glandular proliferation\n3-↑gland to stroma ratio\n4-architectural changes\n5-cytologic atypia\n6-progrssion to endometroid adenocarcinoma\n•significance:\n1-premalignant lesion: precursor of endometrial carcinoma\n2-marker of estrogen excess\n3-major cause of abnormal uterine bleeding\n4-determine treatment","g1",3,""],[141,"Investigations of CIN","•Inv: 1) Cervical (Papanicolaou) smear (screening method)\nResults: -ve, CIN, VIN, VAIN, SCC (ectocx) or adenocarcinoma (endocx)\n-ASC-US is subjected for co-testing of HPV (Cobas test)\n-PAP test is a screening test; diagnosis requires confirmation by biopsy\n2)Colposcopy: -Magnifies cervix 10 - 25 times -Done if abnormal pap smear.\n3) Cervical biopsy to confirm diagnosis\n-Punch biopsy→only parts from suspected areas -Colposcopic directed biopsy\n-Cone biopsy if: a) Improper visualization of SCJ (unsatisfactory colposcopy) b) Suspicion of microinvasion by colposcopy\n-LEEP (Loop Electrosurgical Excision Procedure)=LLETZ(Large Loop Excision of TZ","g1",3,"P"],[141,"Treatment of CIN","•ttt: 1-CIN I (LSIL) or ASC-US: -HPV ttt, no ttt of lesions\n-Follow-up -Co-testing (Pap test + HPV testing) after 12 mon: a) if -ve→resume routine screening b) If +ve and/or abnormal Pap test→colposcopy\n-Diagnostic excisional procedure if: a)Colposcopic examination is inadequate b) +ve Endocervical sample c)patient was previously treated\n2-CIN (II&III) (HSIL):-Ablation therapy:cauterization by(electric, cryocautery, laser)\n-Excisional procedure (LEEP/LLETZ/Conization)\n-Hysterectomy: if repeating diagnostic procedure is not feasible - Follow up","g1",3,"P"],[141,"Colposcopic criteria suggestive of malignancy of CIN","A) Abnormal epithelium (raised edge, irregular contour) B) abnormal vascular pattern (punctate or mosaic)\nC) Paint with acetic acid (3%): abnormal areas→ white (CIN, HPV lesions)\nD) Paint with Schiller or Lugol's iodine: - Normal glycogen containing cells → brown.\n- Abnormal areas (erosions or CIN) → yellow (unstained)","g1",3,"I"],[141,"Complications of treatment of CIN","Mention complications of ttt of CIN bleeding, infection, later )cx insufficiency/stenosis) →abortion, PTL, PROM","g1",3,""],[141,"Treatment of CIN during pregnancy","•CIN I→ follow up + cotesting after 12m\n•CIN 2,3→ Pap + colposcopy/12 w, biopsy (only if invasion by cytology or worsening of lesions), unless invasive cancer is identified, TTT is unacceptable, reevaluate soon or 6w postpartum. endometrial carcinoma Invasive carcinoma of cervix","g1",3,""],[139,"Endometrial carcinoma: incidence, factors and etiology","•commonest female genital tract malignancy (75/100.000)\n• factors ↑ endometrial carcinoma:-↑ life span of females\n-↑ economic status with late marriage -↑use of estrogen therapies\n-Contracted family size (both pregnancy & lactation are protective)\n•etiology: scheme (endometrium)\n-Elderly (>60yrs), Early menarche\n-Nullipara -DM+ HTN +obesity (cancer corpus $)\n-Menses irregularity(PCO -E replacement therapy -Tamoxifen > 5y\n-Rich, Race (white) -Unopposed E (Brenner) -Menopause (late)\n-Family history: BRCA1 mutations & Lynch II (HNPCC)\nNB ne","g1",4,""],[142,"Diagnosis of cancer cervix","•C/P: Symptoms (asymptomatic early):\n1. Bleeding (most common)\n2.Discharge (serosanguinous/offensive)\n3-Pain (late) →low back pain\n4. Bowel or urinary: hematuria, bleeding per rectum,or fistula\nSigns: 1. General: Cachexia/anemia / Uremia in advanced cases\n2. Abdominal: -No pelviabdominal mass (except if pyometra)\n-Metastasis (palpate liver & kidney)\n3. Local: -P/V: pathologic forms of ectocervix or endocervix\n-P/R: only way to assess cervical size & parametrial infiltration","g1",4,""],[139,"Endometrial carcinoma: blood spread, clinical picture, complications and investigations","4-Blood: Brain (Through paraverterbral plexus),Lung ,Liver, Bone, Brain, Kidney ,Adrenal, Ovary (Through pampiniform plexus), Vagina\n(Through pudendal plexus)\n•C/P: symptom:-Bleeding:Postmenopausal (80%) or Premenopausal\n-Offensive vaginal discharge (5%)\n-Pain: Intermittent or constant (in pyometra)-somatic or visceral\nSigns:-General: Anemia, mets (Wirchow LN), obesity, DM, HTN\n-Abdominal: No pelviabdominal mass (except if there is fibroid or pyometra) , Metastasis (palpate liver & kidney)\n-Local: a)Bimanual: uterus is small (postmenopausal) or enlarged\n(associated myohypertrophy) b)PV & cusco: vaginal & cervical involvement c)PR: parametrial, rectal & uterosacral ligament infiltration\n•complications& cause of death\n-Peritonitis (due to perforation of the uterine wall) -Pyometra\n-Malignant fistula (with bladder, ureter, rectum)\n-Hemorrhage/infection\n•Inv: 1. TVS: Endometrium > 4 mm (cut off)→ endometrial sampling.\n2. For diagnosis : Endometrial biopsy methods &its diagnostic values\n•Fractional curettage (gold standard): Curette cervix 1st followed by cervical dilatation; then curette whole uterus (isthmus, ant / post walls, fundus, cornu). Fails to detect 10% of cases\n•Outpatient biopsy (Pipelle):Done without anesthesia, Less liability for perforation, Can miss malignancy if localized/focal type\n•Hysteroscopy for direct inspection & biopsy\n3. Preoperative: CBC, Liver & KFT, FBS & ECG/chest X-ray\n4. Staging: Abdominal US, CT & MRI (assess depth of invasion)","g1",5,""],[142,"Investigations of cancer cervix","•inv:1. Suspicious gross lesions: biopsy (Pap test is not done in symptomatic women with gross cervical lesion)\n2.No gross lesion: colposcopic directed biopsy+endocervical sample","g1",5,""],[142,"Causes of death in cancer cervix","•Causes of death\n-Uremia due to bilateral ureteric obstruction (most common)\n-Hemorrhage\n-Complications related to therapy (surgery or radiation)\n-Pulmonary embolism - Infection - cachexia","g1",5,"I"],[142,"FIGO clinical staging procedure of cervical cancer","•FIGO staging is a Clinical staging procedure\n1. Exam (under anesthesia): Speculum ,bimanual & rectovaginal\n2. Cervical biopsy: Direct, colposcopic ,endocervical curettage\n(if no lesion is colposcopically detected), conization\n3. Endoscopy: Hysteroscopy, cystoscopy (finger like projections & not bullous edema) & proctoscopy.\n4. Imaging: IVP, CT, MRI, Chest & skeleton radiograph.","g1",5,""],[142,"Differential diagnosis of cancer cervix","•DD: -Causes of contact bleeding\n-Ulcers, Polyps& masses of cervix -Barrel shaped cervix","g1",5,""],[142,"Prevention of cancer cervix","•Prevention:\n1ry prevention:1-HPV vaccine :95% effective, given from 9-26 y, in non-infected\n-Gardasil (quadrivalent against 6,11,16,18), Cervarix\n(bivalent/against 16,18)\n-Given serially at 0,1 & 6 months; can be given also to boys\n-Doesn't:change CIN screening protocols,clear HPV or treat CIN\n2-Avoid early sexual exposure\n3-Hysterectomy better total not subtotal\n2ry prevention:\n-Early detection of CIN by regular Pap smears &ttt\n-Strict follow up by colposcopy & smear for all treated cases","g1",5,"P"],[139,"Differential diagnosis and prevention of endometrial carcinoma","•DD:-Postmenopausal & Perimenopausal bleeding\n-Symmetrically enlarged uterus\n•Prevention: -TVS for high risk -Avoid unopposed E\n-D&C for postmenopausal bleeding","g1",6,""],[139,"Treatment of endometrial carcinoma","•Ttt:\n-Stage I (70% of cases)→ a)TAH+BSO± selective lymphadenectomy\n(ttt of choice) b) High risk : Radiotherapy if G2,3, infiltrates >1/2 myometrium, +ve LN, papillary type.\n-Stage II→ a)Wertheim radical hysterectomy (high morbidity) b) TAH + BSO + radiotherapy (preferred)\n-Stage III → External pelvic irradiation (for parametrium/LN) ±\nTAH + BSO\n-Stage IV→a)palliative hormonal therapy (if steroid receptor +ve) →progestin in recurrence or pulmonary spread b) chemotherapy (paclitaxel , carboplatinum) c)Radiotherapy ± TAH + BSO","g1",6,"PI"],[139,"Prognosis of endometrial carcinoma","•Prognosis depends on -Stage -Histology\n-grade of differentiation -lymphatic spread.\n-has Favorable prognosis as majority have endometrioid histology & present early with late LN involvement.\n-5 year survival: Stage I (90%), Stage II (70%), Stage III (20-60%), Stage IV (0-20%)","g1",6,""],[142,"Treatment and prognosis of invasive cervical cancer","•ttt:\n1)Stage Ia1→ Simple hysterectomy or Conization + follow up\n2)Ia2, Ib & IIa→ Radical hysterectomy, or RT (persistent disease after RT →radical surgery)\n3) IIb & IIIb→ RT (max dose)-surgery is not suitable or\nConcurrent chemotherapy (chemotherapy with RT)\n4)IIIa → RT or pelvic exentration (Wertheim + removal of bladder & / or rectum)\n5) Iva/b→ Palliative (surgery,radio& analgesic (intrathecal anesthe)\n•prognosis depends on:\nStage (5YSR) Tumor Others\nI: 85% II: 60% -LN spread\n-parametrial infiltration\n-general condition\n-ttt received\nIII: 30% IV: 5%\nNB: Postmenopausal bleeding is considered cancer endometrium till proved otherwise, Any case of contact bleeding is considered cancer cervix till proved otherwise","g1",6,"P"],[139,"FIGO surgical staging of endometrial carcinoma","FIGO Surgical Staging (Laparotomy)\nStage 1(limited to corpus) •A→limited to endometrium or Invasion < 50% of myometrium\n•B→ Invasion > 50% of myometrium\nStage II (Extend to cx) Tumor invades cervical stroma [Endocervical glandular (not stromal) involvement is considered stage I].\nStage III •A→Serosal/ adnexal involvement\n•B→Vaginal/parametrial involvement\n•C1→Pelvic LN involvement\n•C2→ Para-aortic LN involvement\nStage IV •A→ Bladder or rectum infiltration\n•B→ Distant organ metastasis","g1",7,"PI"],[142,"FIGO staging of invasive carcinoma of cervix","FIGO Stage LN spread\n•0: CIN (carcinoma in situ)\n•Ia: Microinvasive carcinoma: Invasive carcinoma diagnosed only by microscopy.\nVascular or lymphatic space involvement doesn't affect classification\n10%\nIa1: Stromal microinvasion ≤ 3 mm in depth and <=7mm in horizontal spread (width)\nIa2: Stromal microinvasion <= 5 mm in depth (but > 3) & <=7mm in horizontal spread\n•Ib: Clinically visible lesions confined to cervix 20%\nIb1: lesion < 2 cm\nIb2: lesion 2-4 cm\nIb3: lesion > 4 cm\n•II: Tumor not extended to pelvic sidewall or lower vaginal 1/3 40%\nIIa: infiltration of the upper 2/3 of the vagina (IIa1<4 cm, IIa2 > 4 cm)\nIIb: infiltration of the parametrium short of the pelvic wall\n•III: Tumor extended to pelvic sidewall or lower vaginal 1/3 60%\nIIIa: infiltration of the lower 1/3 of vagina\nIIIb: infiltration of parametrium till pelvic wall OR there is hydronephrosis or non- functioning kidney\nIIIC1: +ve pelvic LNs\nIIIC2: +ve paraaortic lymph nodes\nIV 75%\nIVa : spread to bladder or rectum\nIVb: Distal metastasis (peritoneal, mediastinal, para-aortic)","g1",7,"PI"],[142,"Radical hysterectomy","It involves removal of: -Uterus/cervix/parametrium / upper 1/3 to 1/2 of vagina\n-uterine artery is ligated at its origin from internal iliac artery\n-Uterosacral / cardinal ligaments are resected at origin of their attachments + whole pelvic LNs","g1",8,""],[142,"Indications of pelvic exenteration","if: -Spread into bladder / rectum with no lateral pelvic wall involvement\n-Recurrent disease after RT or chemotherapy\nNB: Radiotherapy: Combination of external radiation (teletherapy) & brachytherapy","g1",8,""],[142,"Contraindications of radiotherapy","-infections (flaring) -adhesions\n-Radio-resistant tumors as in adenocarcinoma","g1",8,""],[142,"Complications of radiotherapy","1. GIT: -Radiation sickness→nausea &vomiting -Radiation proctitis→diarrhea/bleeding per rectum\n-Radiation enteritis→ intestinal obstruction\n2. Urinary: Radiation cystitis , Ureteric fibrosis → fistula\n3. Vaginal stenosis / artificial menopause (esp in young)","g1",8,""],[142,"Recurrent cervical cancer, stump carcinoma and cancer cervix in pregnancy","Discuss\nRecurrent cervical cancer Stump Carcinoma Cancer cervix in pregnancy\n•Incidence: 35% (most within 1st\n2 years)\n•Either:\n-Recurrence after 1ry surgery→ palliative external beam irradiation\n-Recurrence after radiotherapy →palliative surgery (exentration)\n•Recurrence sites:\n-Central (good prognosis)\n-regional (poor prognosis)\n-Distal (worst→ paraortic\nLN, lungs, bone)\n•Def: carcinoma of cervical stump after subtotal hysterectomy\n•Prognosis: bad due to early spread, difficult surgery\n(distorted anatomy) & difficult radiotherapy (bladder & rectum are so near)\n•Management\n-Prophylaxis→ total hysterectomy is better done.\n-Radical vaginal trachelectomy; or External beam irradiation\n•Diagnosis: contact bleeding, PAP smear & colposcopy can be done but avoid cone biopsy → hemorrhage, abortion\n•Management\n-1st trimester→ Radical hysterectomy en toto or Irradiation (usually followed by spontaneous abortion)\n-2nd trimester→ Radical hysterectomy en toto or Hysterotomy followed by irradiation after 2 weeks\n-3rd trimester→ wait for maturity→\nCesarean Wertheim operation or CS followed by irradiation after 2 weeks","g1",8,""],[141,"Causes of false positive and false negative cervical smear","False positive False negative\n•Infection (chronic): HPV\n•Surgery on cervix (Bizzare cells)\n•Irradiation or trauma\nInfections (severe) •Poor technique or cytologist\n•High SCJ (not seen properly)","g1",9,""],[143,"Classification of ovarian swellings and non-neoplastic cysts","Non-neoplastic Neoplastic\n1- Follicular (commonest non neoplastic swelling)\n2- Luteal (2nd most common functional cyst of ovary)\n3. Inflammatory 4. Endometriotic\n5. Theca-Lutein 6- Para-ovarian\n1ry:\n•May be: Benign/Border-line /malignant\n•May be: Epithelial/Sex-cord/ Germ cell\n2ry:\n•Typical\n•Atypical","g1",9,"P"],[144,"Incidence of ovarian neoplasms","•2nd gynecological malignancy, 7th cancer in female, 5th cause of death in female\n•Highest fatality, > 2/3 of cases have advanced disease at diagnosis\nAge distribution Inc/100.000 Nature\n60%→ 40-60yrs 40 years → 15 80%→ benign\n20%→ <40yrs 60 years → 35 20%→ malignant\n20%→ >60yrs 80 years → 55 5%→ secondary","g1",9,""],[141,"Transformation zone and cervical epithelium","•Vagina & ectocervix are covered by stratified squamous epithelium non Keratinized; While endocervix is covered by columnar epithelium\n•Junction between them is Original Squamo-Columnar Junction (OSCJ)\n•At menarche, estrogen →acidic vaginal pH→ metaplasia of squamo-columnar reserve cells, which advances from original SCJ towards external os forming transformation zone (TZ) which extends from original SCJ to physiologically active SCJ. It is the most susceptible area for cancer cervix","g1",9,""],[141,"Cervical smear: technique and timing","•cervical smear: 1-technique: \"using Ayre's wooden or Rolon plastic spatula\"\n-Avoid douching, intercourse, PV for 24 hours -Use a non-lubricated speculum\n-Rotate spatula 360° at external os (SCJ) to sample cells, Use other side to obtain cells from posterior vaginal fornix, Use cytobrush to obtain cells from endocervix - Spread specimen on glass slide →fix by alcohol 95% -Stain by Papanicolaou stain (Pap smear)\n2-timing: -High risk (multiple partners, HPV, subtotal hysterectomy or conservative for CIN)→ annually\n-Low risk cases (> 30 years, with 3 annual consecutive -ve PAP smear results)→ screened every 3 years\n-Discontinuation if (65 years with 3-ve consecutive results)\n•Speculum is done to all female with abnormal uterine bleeding or vaginal discharge → Meticulous inspection of cervix & vaginal formices.","g1",9,""],[143,"Functional ovarian cysts and other non-neoplastic cysts","&etiology of each type\nFollicular cysts Luteal cysts Theca Lutein cysts Para-ovarian cysts Luteoma\n•Etiology : -Due to cystic distension of a follicle, or failure of a follicle to rupture\n- They produce E (functioning) → Metropathia hemorrhagica & associated with PCOS, fibroids & endometriosis.\n•Pathology:\n- Unilateral, single or multiple, small size (rarely exceeds 3-6cm)\n- Cyst wall is thin, unilocular, lined by granulosa cells, containing clear fluid\n•Diagnosis: -Asymptomatic\n- Menstrual disturbance\n- Pain if complicated\n•DD: causes of acute abdomen & other ovarian swellings\n•ttt: Conservative follow-up by U/S or COC to accelerate resolution\n•Etiology:\n- Usually associates pregnancy & produces progesterone\n•ttt\n-Exclusion of pregnancy by HCG +\nConservative follow-up\n-Ovarian cystectomy if cyst ruptures with acute abdomen & intraperitoneal hemorrhage\n(laparoscopy is better than laparotomy)\n•Etiology:\n- Due to gonadotrophin as in vesicular mole, twins & HMG / hCG injections for induction of ovulation\n•Pathology:\n-Multiple, bilateral, bluish, thin walled, containing clear fluid\n-They may reach a large size > 20 cm as a complication of OHSS\n•ttt:\n-Conservative expectant ttt after removal of cause\n-Spontaneous resolution is usual fate.\n-Laparotomy only if complicated(as rupture)\n•Etiology: Due to cystic dilatation of remnants of Wolffian system a. From main mesonephric duct→ Gartner's duct b. From any of accessory tubules → Hydatid cyst of Morgagni\n•Pathology: Found in broad ligament, may be large & lined by a single cuboidal or flat epithelium & contains clear fluid (don't turn malignant)\n•Symptoms:\n-Asymptomatic (discovered accidentally)\n-Complications as torsion (rare)\n•ttt: Surgical removal (if large). Avoid injury of ureter\n•Etiology\n-There is hypersensitivity to ẞ hCG → excess luteinization of theca cells\n-Occurs in perimenopausal or during pregnancy, usually large & unilateral\n•Fate: Regress spontaneously & may secrete androgen → maternal virilization & very rare female fetus virilization (as placenta transforms androgens to E\nInflammatory cysts (as tubo-ovarian cysts or abscess)\nEndometriotic cysts (chocolate cysts): Common finding in patients with chronic pelvic pain & infertility","g1",10,"P"],[145,"Predisposing factors for ovarian cancer","•Aging (strongest risk factor) •Familial (+ve family history in only 5%)\n•Genetic: - BRCA (breast cancer) I or II (chromosome 17 or 13)\n- Lynch II (hereditary non polyposis colorectal cancer-HNPCC-)\n•repeated induction of ovulation •Nulliparity, late marriage (high social class,white races)\n•Smoking or exposure to asbestos or talk powder or Mumps","g1",11,"I"],[145,"Protective factors against ovarian cancer","for ovarian cancer\n•Oral contraceptives (COC) •Multiparity •pregnancy •Breastfeeding\n•Salpingo-oophorectomy •Tubal ligation •Hysterectomy","g1",11,""],[144,"WHO classification of ovarian neoplasms","1. Epithelial tumors 2.Germ cell tumors 3.Sex cord&stromal tumors\n-Arise from celomic (germinal) epithelium of ovary\n- Thus it is capable to produce tumors similar to\n•Tube (serous) •Uterus (endometrioid)\n•Cervix (mucoid)\n•Urinary tract(Mesonephroi& Brenner\n- Arise from primordial cells of the ovary\n- Sex cords: granulosa\n(feminizing) or Sertoli\n(masculinizing)\n- Sex stroma: theca & fibroblasts (feminizing) or\nLeydig (masculinizing)\nCommon epithelial tumor (70-80%) Germ cell tumors (20-25%) Sex cord-stromal (5-8%)","g1",11,"P"],[144,"Epithelial ovarian tumors: pathology and serous tumors","•Pathology\n-Microscopic: 1. Benign\n2.Borderline→ same cellular features as malignancy, but no stromal invasion→ better prognosis\n3. Malignant→solid, stratification (> 3 layers), stromal invasion,atypia(mitotic figures & loss of polarity), papillae\n-Macroscopic: 1.Papillary cystadenoma/surface papilloma\n2. Adenoma or cystadenoma\n3. Adenofibroma or cystdenofibroma\n•Types: enumerate histopathological types of ovarian epithelial\n1-Serous tumors (commonest)\n-Bilateral in 50%&moderate siz(10-15cm\n-Type:a)Simple:commonest, unilocular, thin walled, filled with clear fluid b) Papillary: papillary growths internal\n(endophytic) or external (exophytic) + psammoma bodie(calcificati,multilocula ,high malignant potential (50%)\n2-Mucinous tumors (2nd common)\n-Bilateral in 20%, bluish or yellowish, multilocular containing thick gelatinous like mucin & reach a huge size\n-Pseudomyxoma peritoneii: cyst ruptures → mucin in peritoneum.\n(DD: rupture of mucocele of appendix","g1",12,""],[144,"Germ cell tumors: pathology and dysgerminoma","•Pathology\n-Derived from primordial germ cells of ovary\n-20-25% of ovarian neoplasms & 5% of ovarian malignancy\n-Arise at 10-30 years →70% of ovarian neoplasms at this age\n-They are mostly unilateral; they may be\n1. Benign→ teratoma, struma ovarii, gonadoblastoma\n2. Malignant→ dysgerminoma, EST, choriocarcinoma, malignant teratoma\n-Ttt is characterized by\n1. Sensitive to irradiation (but destroys ovarian function)\n2. Possibility of conservative surgery: unilateral salpingooophorectomy may be done in stage 1a (in young)\n•Types\n1-Undifferentiated (Dysgerminoma) give note\n-Commonest malignant GCT From dysgenetic gonad\n-Produces LDH (tumor marker) & HCG→ precocious puberty,\n-Any Solid adnexal mass should be surgically explored or Cystic adnexal masses > 2 cm in pre-menarcheal girl is surgically explored\n•Malignant(solid,rapid growth,unilateral)→spread by lymphatic\n•Mic:hexagonal cells arranged in nest with lymphocyti infiltration\n2-Differentiated\nA-Embryonic = Teratomas\nBenign mature teratoma (Dermoid cyst)diagnostic features of mature cystic ovarian teratoma\n-Most common benign tumor in pre-menopausal women\n-accounts for 1/3 of laparotomies for ovarian masses at age < 30 y\n-represent 50% of ovarian neoplasm <20 yr\n-commonest ovarian neoplasm encountered during pregnancy","g1",12,""],[144,"Granulosa-stromal cell tumors","1-Granulosa-Stroma cell tumors\nGranulosa cell tumors\nShort note\n-Low grade malignancy\n(5% of ovarian malignancies)\n-Unilateral, small, solid, yellowish & slowly growing ,good prognosis\n-Call Exner bodies (cells arround a cavity as rosette_\n-Secretes estrogen / inhibin→ Prepubertal\n(pseudo-precocious puberty), Child bearing period (bleeding) ,Postmenopause\n(bleeding, end hyperplasia\n(25%) carcinoma (5%)]\nFibroma\n-Rare derived from stroma at 50 y\n- benign, solid, unilateral\n- long pedicle\n-Meig's $ (1%) = fibroma + Ascites (irritation of peritoneum) & Hydrothorax [on rt side","g1",12,"P"],[144,"Mucinous, endometrioid, mesonephroid and Brenner tumors","or gall bladder) → Immediate laparotomy + intraperitoneal radioactive colloid with poor prognosis (5 YSR < 50% due to intestinal obstruction).\n3-Endometroid tumors\n-Low grade malignant& mimic endometrial cancer\n-In 30% of cases there is a coexistent second primary in endometrium\n-May appear similar to \"chocolate cyst\"\n(unilateral, posterior & adherent)\n4-Mesonephroid tumors (Clear cell tumors) mostly Malignant, Cells conatain glycogen, hobnail bodies.\n5-Brenner tumors short note\n- rare, Benign, solid, small (<2 cm)& usually discovered incidentally\n-Characterized by transitional cell nests with coffee bean nuclei\n-Sometimes functioning→secrete estrogen","g1",13,""],[144,"Mature teratoma (dermoid cyst) and other embryonic germ cell tumors","Pathology\n-Bilateral in 15%, moderate size (5-10 cm), malignant in < 1% →SCC, with long pedicle liable to complications (usual presentation)\n-Mac: it contains greasy material, hair, teeth, bones, cartilage & Rokitansky tubercle on inner surface representing center of activity\n-Mic:derived from toti-potent cells - a)Ectodremal:
